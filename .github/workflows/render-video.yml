name: Generate Instagram Reel

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Dependencies
        run: npm install

      - name: Render Reel & Synthesize Audio
        run: node render.js

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stamp-wear-reel-mp4
          path: stamp_wear_reel.mp4
          retention-days: 7
