<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POV: You have five minutes to make a poster — Kinetic Flowfield Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box;margin:0;padding:0}

#link{left:0;top:1508px;width:1080px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:50px;color:#121212;text-decoration:underline;text-decoration-color:#F0261C;text-decoration-thickness:5px;text-underline-offset:12px}

</style>

<body>
<div id="viewport"></div>
<div id="preview" hidden>Tap to replay</div>

<script>
(function(){
'use strict';

/* ---------- reel contract ---------- */
const FPS=30, DUR=10;
const REEL={width:1080,height:1920,fps:FPS,duration:DUR,poster:8.4};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const W=1080,H=1920;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- palette and fonts (from the Kinetic Flowfield tool) ---------- */
const BG='#f7f5f0', INK='#121212', MUTED='#736e65', RED='#F0261C';
const DISP='"Barlow Condensed", serif';
const MONO='"JetBrains Mono", monospace';

/* ---------- layout (phone frame, tool's 800×400 canvas kept at native size) ---------- */
const UX=140, UW=800;
const Y={logo:466, cv:520, txt:950, turbL:1056, turbR:1082, turbTrack:1094,
         strL:1132, strR:1158, strTrack:1170, sumRule:1212, sumT:1226,
         g1:1270, g1R:1312, g2:1356, g2B:1390, dl:1436};
const CELL=380, CX2=560;

/* ---------- Perlin noise: copied verbatim from the Kinetic Flowfield tool ---------- */
        // --- Perlin Noise Implementation ---
        const Perlin = {
            p: new Uint8Array(512),
            init: function() {
                const permutation = [151,160,137,91,90,15,
                131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
                190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,
                88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,
                77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,
                102,143,54,65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,
                135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,
                5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,
                223,183,170,213,119,248,152, 2,44,145,31,179,228,165,55,110,178,224,183,225,
                40,242,172,239,249,14,236,97,21,50,45,127,4,150,254,138,209,204,184,218,61,
                84,121,98,223,34,39,176,155,51,193,113,70,213,9,144,3,180,243,108,181,241,
                251,114,238,205,107,177,157,167,115,195,192,67,69,215,128,1,214,141,93,246,
                24,185,199,147,22,66,129,222,61,191,101,43,210,106,41,253,153,112,149,154,
                156,127,152,78,162,171,81,21,120,207,11,104,221,58,18,24,206,24,242,123];
                for (let i=0; i<256; i++) {
                    this.p[256+i] = this.p[i] = permutation[i % permutation.length];
                }
            },
            fade: function(t) { return t * t * t * (t * (t * 6 - 15) + 10); },
            lerp: function(t, a, b) { return a + t * (b - a); },
            grad: function(hash, x, y) {
                const h = hash & 7;
                const u = h < 4 ? x : y;
                const v = h < 4 ? y : x;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            },
            noise: function(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = this.fade(x);
                const v = this.fade(y);
                const A = this.p[X] + Y, B = this.p[X + 1] + Y;
                return this.lerp(v, this.lerp(u, this.grad(this.p[A], x, y),
                                                 this.grad(this.p[B], x - 1, y)),
                                    this.lerp(u, this.grad(this.p[A + 1], x, y - 1),
                                                 this.grad(this.p[B + 1], x - 1, y - 1)));
            }
        };
        Perlin.init();

/* ---------- the tool's real flowfield renderer (renderToCanvas, scale 1) ---------- */
const FX={ctx:null,key:''};
function drawEffect(text,turb,strength,fsize,color){
  const key=[text,turb,strength,fsize,color].join('|');
  if(key===FX.key)return;
  FX.key=key;
  const c=FX.ctx, W2=800, H2=400, S=1;
  c.clearRect(0,0,W2,H2);
  if(!text)return;
  const off=document.createElement('canvas'); off.width=W2; off.height=H2;
  const o=off.getContext('2d',{willReadFrequently:true});
  const lines=text.split('\n');
  const scaledStrength=strength*S;
  const padding=scaledStrength+40*S;
  const refSize=100*S;
  o.font=`900 ${refSize}px ${DISP}`;
  let maxRef=1; lines.forEach(l=>{const w=o.measureText(l).width; if(w>maxRef)maxRef=w;});
  const refTotal=lines.length*(refSize*1.1);
  const availW=Math.max(10*S,W2-padding), availH=Math.max(10*S,H2-padding);
  const calc=Math.min((availW*refSize)/maxRef,(availH*refSize)/refTotal);
  const sfs=Math.max(10*S,Math.min(fsize*S,calc));
  o.font=`900 ${sfs}px ${DISP}`; o.textAlign='center'; o.textBaseline='middle'; o.fillStyle=color;
  const lh=sfs*1.1, total=lines.length*lh, startY=H2/2-total/2+lh/2;
  lines.forEach((l,i)=>o.fillText(l,W2/2,startY+i*lh));
  const src=new Uint32Array(o.getImageData(0,0,W2,H2).data.buffer);
  const step=Math.max(2,Math.round(2*S)), nS=(0.002*(turb/20))/S, dr=Math.max(0.75,1.0*S);
  c.fillStyle=color; c.beginPath();
  for(let y=0;y<H2;y+=step){
    const ro=y*W2;
    for(let x=0;x<W2;x+=step){
      if(src[ro+x]!==0){
        let px=x, py=y; const steps=8, sd=scaledStrength/steps;
        for(let s=0;s<steps;s++){
          const a=Perlin.noise(px*nS,py*nS)*Math.PI*4;
          px+=Math.cos(a)*sd; py+=Math.sin(a)*sd;
        }
        c.moveTo(px+dr,py); c.arc(px,py,dr,0,Math.PI*2);
      }
    }
  }
  c.fill();
}

/* ---------- timeline: values, cursor path, clicks ---------- */
function ease(u){return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;}
// slider keys: [t, value]
const SL={
  turb:[[0,26],[3.0,26],[3.5,12]],
  str: [[0,26],[4.15,26],[4.6,8]],
  size:[[0,140],[5.25,140],[5.9,220]]
};
const SLR={turb:{min:1,max:26,x0:UX,w:UW}, str:{min:0,max:26,x0:UX,w:UW}, size:{min:30,max:250,x0:UX,w:CELL}};
function valueAt(id,t){
  const k=SL[id];
  if(t<=k[0][0])return k[0][1];
  for(let i=0;i<k.length-1;i++){
    const a=k[i], b=k[i+1];
    if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]); return lerp(a[1],b[1],ease(u));}
  }
  return k[k.length-1][1];
}
const IV=id=>Math.round(valueAt(id,0)); // unused helper kept for clarity
function ivAt(id,t){return Math.round(valueAt(id,t));}
function knobX(id,v){
  const r=SLR[id], frac=(v-r.min)/(r.max-r.min);
  return r.x0+11+frac*(r.w-22);
}
// cursor keys: {t,x,y} or {t,drag:id,y}  (drag segment follows that slider's knob)
const KEY=[
  {t:0.0,x:1000,y:1700},
  {t:0.3,x:1000,y:1700},
  {t:0.85,x:300,y:Y.txt+37},
  {t:2.2,x:300,y:Y.txt+37},
  {t:2.6,x:knobX('turb',26),y:Y.turbTrack+12},
  {t:2.95,x:knobX('turb',26),y:Y.turbTrack+12},
  {t:3.5,drag:'turb',y:Y.turbTrack+12},
  {t:3.7,x:knobX('turb',12),y:Y.turbTrack+12},
  {t:3.95,x:knobX('str',26),y:Y.strTrack+12},
  {t:4.15,x:knobX('str',26),y:Y.strTrack+12},
  {t:4.6,drag:'str',y:Y.strTrack+12},
  {t:4.75,x:knobX('str',8),y:Y.strTrack+12},
  {t:5.0,x:knobX('size',140),y:Y.g1R+13},
  {t:5.2,x:knobX('size',140),y:Y.g1R+13},
  {t:5.9,drag:'size',y:Y.g1R+13},
  {t:6.1,x:knobX('size',220),y:Y.g1R+13},
  {t:6.35,x:CX2+18,y:Y.g1+48},
  {t:6.6,x:CX2+18,y:Y.g1+48},
  {t:6.9,x:UX+190,y:Y.g2B+19},
  {t:7.2,x:UX+190,y:Y.g2B+19},
  {t:7.5,x:540,y:Y.dl+28},
  {t:10,x:540,y:Y.dl+28}
];
const CLICKS=[0.85,2.95,4.15,5.2,6.35,6.95,7.55];
const PRESS=0.1, RIP=0.45;
function cursorAt(t){
  if(t<=KEY[0].t)return {x:KEY[0].x,y:KEY[0].y};
  for(let i=0;i<KEY.length-1;i++){
    const a=KEY[i], b=KEY[i+1];
    if(t<=b.t){
      const u=(t-a.t)/(b.t-a.t), e=ease(u);
      if(b.drag){
        return {x:knobX(b.drag,ivAt(b.drag,t)), y:b.y};
      }
      let x=lerp(a.x,b.x,e), y=lerp(a.y,b.y,e);
      const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
      if(L>40){const bow=Math.sin(Math.PI*e)*L*0.14; x+=-dy/L*bow; y+=dx/L*bow;}
      return {x,y};
    }
  }
  const last=KEY[KEY.length-1];
  return {x:last.x,y:last.y};
}
function typedText(t){
  if(t<1.2)return 'FLOW';
  const n=Math.min(6,Math.floor((t-1.2)/0.15)+1);
  return 'POSTER'.slice(0,n);
}
function colorAt(t){return t>=6.4?RED:'#000000';}
function sizeText(id){return id;}

/* ---------- DOM: the tool's UI, placed on the phone frame ---------- */
const E={};
let mText=null;
function place(el,x,y,w,h){
  el.style.left=x+'px'; el.style.top=y+'px';
  if(w!=null)el.style.width=w+'px';
  if(h!=null)el.style.height=h+'px';
}
function mk(parent,tag='div',cls){const el=document.createElement(tag); if(cls)el.className=cls; parent.appendChild(el); return el;}
function label(parent,text,x,y,w){const el=mk(parent,'div','mono'); el.textContent=text; place(el,x,y,w,24); el.style.lineHeight='24px'; return el;}
function val(parent,x,y,w){const el=mk(parent,'div','val'); place(el,x,y,w,24); el.style.lineHeight='24px'; return el;}
function range(parent,id,min,max,x,y,w){
  const r=mk(parent,'input'); r.type='range'; r.min=min; r.max=max; r.step=1; place(r,x,y,w,26); r.dataset.id=id; return r;
}
function build(){
  const vp=$('viewport');

  const cap=mk(vp,'div'); cap.id='capTxt';
  cap.style.fontSize=E.capPx+'px';
  cap.innerHTML='POV: You have five minutes<br>to make a poster';

  const logo=mk(vp,'div','mono'); place(logo,UX,Y.logo,400,26); logo.style.lineHeight='26px'; logo.style.color=INK; logo.textContent='CALLISTRA.DESIGN';
  const timer=mk(vp,'div','val'); place(timer,UX+UW-240,Y.logo,240,26); timer.style.textAlign='right'; timer.style.lineHeight='26px'; timer.style.color=MUTED; E.timer=timer;

  const cvWrap=mk(vp,'div'); cvWrap.id='cvWrap'; place(cvWrap,UX,Y.cv,UW,400);
  const cv=mk(cvWrap,'canvas'); cv.id='fx'; cv.width=800; cv.height=400;
  FX.ctx=cv.getContext('2d');

  const txt=mk(vp,'div'); place(txt,UX,Y.txt,UW,74);
  const tt=mk(txt,'span'); tt.style.font=`900 64px ${DISP}`; tt.style.lineHeight='74px'; tt.style.color=INK; tt.style.whiteSpace='pre'; tt.style.padding='0 2px'; tt.style.display='inline-block'; E.tt=tt;
  const caret=mk(vp); place(caret,UX+2,Y.txt+12,3,50); caret.style.background=INK; caret.style.display='none'; E.caret=caret;
  const tline=mk(vp); place(tline,UX,Y.txt+76,UW,2); tline.style.background=INK;

  label(vp,'Turbulence',UX,Y.turbL,400); E.vTurb=val(vp,UX+UW-200,Y.turbL,200);
  mk(vp,'div','rule'); place(vp.lastChild,UX,Y.turbTrack,UW,2);
  E.rTurb=range(vp,'turb',1,26,UX,Y.turbR,UW);

  label(vp,'Current Strength',UX,Y.strL,400); E.vStr=val(vp,UX+UW-200,Y.strL,200);
  mk(vp,'div','rule'); place(vp.lastChild,UX,Y.strTrack,UW,2);
  E.rStr=range(vp,'str',0,26,UX,Y.strR,UW);

  const sr=mk(vp,'div','rule'); place(sr,UX,Y.sumRule,UW,2);
  label(vp,'Color and Size',UX,Y.sumT,400); const pm=val(vp,UX+UW-60,Y.sumT,60); pm.textContent='−';

  label(vp,'Size',UX,Y.g1,200); E.vSize=val(vp,UX+CELL-160,Y.g1,160);
  mk(vp,'div','rule'); place(vp.lastChild,UX,Y.g1R+12,CELL,2);
  E.rSize=range(vp,'size',30,250,UX,Y.g1R,CELL);

  label(vp,'Color',CX2,Y.g1,200);
  const sw=mk(vp); sw.id='swatch'; place(sw,CX2,Y.g1+36,36,36); E.sw=sw;
  const hex=mk(vp,'div','val'); place(hex,CX2+48,Y.g1+38,300,30); hex.style.textAlign='left'; hex.style.lineHeight='30px'; E.hex=hex;

  label(vp,'Export Size',UX,Y.g2,200);
  const exb=mk(vp,'div'); place(exb,UX,Y.g2B,CELL,38); exb.style.borderBottom='2px solid rgba(18,18,18,.18)';
  const exT=mk(exb,'div','val'); place(exT,0,6,CELL-20,26); exT.style.textAlign='left'; E.exT=exT;
  const exC=mk(exb,'div','val'); place(exC,CELL-20,6,20,26); exC.textContent='▾'; exC.style.textAlign='right';

  label(vp,'Custom Font',CX2,Y.g2,200);
  const fb=mk(vp,'div'); place(fb,CX2,Y.g2B,CELL,38); fb.style.borderBottom='2px solid rgba(18,18,18,.18)';
  const fT=mk(fb,'div','val'); place(fT,0,6,CELL,26); fT.style.textAlign='left'; fT.textContent='Upload Font';

  const dl=mk(vp,'div'); dl.id='btnDl'; place(dl,UX,Y.dl,UW,58); E.dl=dl;

  const cur=mk(vp); cur.id='cur';
  cur.innerHTML='<svg width="40" height="44" viewBox="0 0 40 44"><path d="M2 2 L2 34 L11 26 L17 39 L23 36 L17 24 L30 24 Z" fill="#121212" stroke="#f7f5f0" stroke-width="2.2" stroke-linejoin="round"/></svg>';
  E.cur=cur;
  const rip=mk(vp); rip.id='rip'; E.rip=rip;

  const link=mk(vp,'div'); link.id='link'; link.textContent='callistra.design';
}

/* ---------- per-frame state: a pure function of t ---------- */
function renderFrame(t){
  if(!E.tt)return;
  t=clamp(t,0,DUR);

  // typed text, selection and caret
  const txt=typedText(t);
  E.tt.textContent=txt;
  E.tt.style.background=(t>=0.95&&t<1.2)?'rgba(18,18,18,.2)':'transparent';
  if(t>=1.2&&t<2.3){
    E.caret.style.display='block';
    E.caret.style.left=(UX+2+ mText.measureText(txt).width)+'px';
  } else E.caret.style.display='none';

  // sliders and their values
  const turb=ivAt('turb',t), str=ivAt('str',t), size=ivAt('size',t);
  E.rTurb.value=turb; E.vTurb.textContent=turb+'%';
  E.rStr.value=str;   E.vStr.textContent=str+'px';
  E.rSize.value=size; E.vSize.textContent=size+'px';

  // colour, export size, download state
  const color=colorAt(t);
  E.sw.style.background=color;
  E.hex.textContent=color.toUpperCase();
  E.exT.textContent=t>=7.0?'8x':'4x';
  const busy=t>=7.6&&t<8.0;
  E.dl.className=busy?'busy':'';
  E.dl.textContent=busy?'RENDERING...':'DOWNLOAD PNG';

  // flowfield canvas (recomputed only when its inputs change)
  drawEffect(txt,turb,str,size,color);

  // cursor, press state and click ripple
  const p=cursorAt(t);
  let s=1;
  for(const c of CLICKS) if(t>=c&&t<c+PRESS) s=0.82;
  E.cur.style.transform=`translate(${p.x}px,${p.y}px) scale(${s})`;
  let rr=0, ro=0, rx=0, ry=0;
  for(const c of CLICKS){
    if(t>=c&&t-c<RIP){
      const u=(t-c)/RIP, q=cursorAt(c);
      rx=q.x; ry=q.y; rr=10+34*ease(u); ro=0.5*(1-u);
    }
  }
  E.rip.style.width=(2*rr)+'px'; E.rip.style.height=(2*rr)+'px';
  E.rip.style.transform=`translate(${rx-rr}px,${ry-rr}px)`;
  E.rip.style.opacity=ro;

  // timer: five minutes compressed into the reel
  const rem=Math.max(0,300-30*t);
  const mm=String(Math.floor(rem/60)).padStart(2,'0'), ss=String(Math.floor(rem%60)).padStart(2,'0');
  E.timer.textContent='TIME LEFT '+mm+':'+ss;
}
window.renderFrame=renderFrame;

/* ---------- sound: mouse clicks, keyboard typing, slider ticks, a soft thud; no music ---------- */
function biquad(x,type,f0,Q,SR){
  const w=2*Math.PI*f0/SR, cw=Math.cos(w), sw=Math.sin(w), al=sw/(2*Q);
  let b0,b1,b2;
  if(type==='bp'){b0=al;b1=0;b2=-al;}
  else if(type==='hp'){b0=(1+cw)/2;b1=-(1+cw);b2=(1+cw)/2;}
  else {b0=(1-cw)/2;b1=1-cw;b2=(1-cw)/2;}
  const a0=1+al, a1=-2*cw, a2=1-al;
  const y=new Float32Array(x.length);
  let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<x.length;i++){
    const xi=x[i];
    const yi=(b0*xi+b1*x1+b2*x2-a1*y1-a2*y2)/a0;
    y[i]=yi; x2=x1; x1=xi; y2=y1; y1=yi;
  }
  return y;
}
function keyClick(SR,r){
  const n=Math.round(0.035*SR), b=new Float32Array(n);
  for(let i=0;i<n;i++)b[i]=(r()*2-1)*Math.exp(-(i/SR)/0.004);
  const y=biquad(b,'bp',3200,1.6,SR);
  for(let i=0;i<n;i++)y[i]*=0.6*(0.85+0.3*r());
  return y;
}
function mouseClick(SR,r){
  const n=Math.round(0.03*SR);
  const a=new Float32Array(n), c=new Float32Array(n);
  for(let i=0;i<n;i++){
    const t=i/SR;
    a[i]=(r()*2-1)*Math.exp(-t/0.0015);
    c[i]=(r()*2-1)*Math.exp(-t/0.012)*0.5;
  }
  const hp=biquad(a,'hp',2200,0.7,SR), lp=biquad(c,'lp',900,0.7,SR);
  const out=new Float32Array(n);
  for(let i=0;i<n;i++)out[i]=(hp[i]*0.9+lp[i]*0.6)*0.5;
  return out;
}
function tick(SR,r){
  const n=Math.round(0.006*SR), b=new Float32Array(n);
  for(let i=0;i<n;i++)b[i]=(r()*2-1)*Math.exp(-(i/SR)/0.002);
  const y=biquad(b,'bp',4500,1.2,SR);
  for(let i=0;i<n;i++)y[i]*=0.3;
  return y;
}
function thud(SR,r){
  const n=Math.round(0.25*SR), b=new Float32Array(n);
  for(let i=0;i<n;i++)b[i]=(r()*2-1)*Math.exp(-(i/SR)/0.05);
  let y=biquad(b,'lp',180,0.7,SR); y=biquad(y,'lp',180,0.7,SR);
  for(let i=0;i<n;i++)y[i]*=1.2;
  return y;
}
function renderSamples(){
  const SR=44100, N=Math.round(DUR*SR), out=new Float32Array(N);
  const r=mulberry32(20261110);
  const add=(buf,t0)=>{
    const s0=Math.round(t0*SR);
    for(let i=0;i<buf.length;i++){const j=s0+i; if(j>=0&&j<N)out[j]+=buf[i];}
  };
  // keyboard typing: one key per typed letter
  for(let i=0;i<6;i++)add(keyClick(SR,r),1.2+i*0.15);
  // mouse clicks on every control
  CLICKS.forEach(t=>add(mouseClick(SR,r),t));
  // slider ticks on every integer change while dragging
  ['turb','str','size'].forEach(id=>{
    let prev=ivAt(id,0);
    for(let t=0;t<=DUR;t+=1/200){
      const v=ivAt(id,t);
      if(v!==prev){add(tick(SR,r),t); prev=v;}
    }
  });
  // download finished
  add(thud(SR,r),8.0);
  // fade out over the last 0.4 s
  for(let i=0;i<N;i++){const t=i/SR; if(t>DUR-0.4)out[i]*=Math.max(0,(DUR-t)/0.4);}
  let pk=0; for(let i=0;i<N;i++)pk=Math.max(pk,Math.abs(out[i]));
  if(pk>0){const g=0.75/pk; for(let i=0;i<N;i++)out[i]*=g;}
  return {samples:out,SR};
}
function toWavB64(samples,SR){
  const N=samples.length, buf=new ArrayBuffer(44+N*2), v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+N*2,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,N*2,true);
  for(let i=0;i<N;i++){const s=clamp(samples[i],-1,1); v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);}
  const bytes=new Uint8Array(buf); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
window.renderAudio=()=>Promise.resolve().then(()=>{const a=renderSamples();return toWavB64(a.samples,a.SR);});

/* ---------- boot ---------- */
async function boot(){
  try{
    await Promise.all([
      document.fonts.load('900 100px "Barlow Condensed"'),
      document.fonts.load('500 20px "JetBrains Mono"')
    ]);
    const m=document.createElement('canvas').getContext('2d');
    mText=m; m.font=`900 64px ${DISP}`;
    m.font=`900 100px ${DISP}`;
    const w1=m.measureText('POV: You have five minutes').width;
    E.capPx=Math.min(96, Math.floor(100*940/w1));
    m.font=`900 64px ${DISP}`;
    build();
    window.__reelReady=true;
  }catch(e){ window.__reelError=String((e&&e.message)||e); }
}

/* ---------- preview (normal browser only; never part of the video) ---------- */
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  $('viewport').style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;
}
if(!RENDER){
  fit(); addEventListener('resize',fit);
  let start=null;
  const loop=now=>{
    if(window.__reelReady){
      if(start===null)start=now;
      renderFrame(((now-start)/1000)%DUR);
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  $('viewport').addEventListener('click',()=>{start=null;});
}
boot();
})();
</script>
