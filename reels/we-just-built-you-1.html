<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>we just built you</title>
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #ece8df; overflow: hidden; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ===================================================================
   "we just built you"  —  segment of a larger video
   Render contract: window.REEL, window.__reelReady, window.renderFrame(t)
   (renderAudio is intentionally not defined: the voice-over lives in the
   main video, so render.py muxes a silent track.)
   =================================================================== */

// ---------- editable knobs ------------------------------------------
const OFFSET   = 1.60;   // absolute video time (s) that equals local t = 0
const DURATION = 1.80;   // local length of this segment (s)  -> ends at 3.40 abs
const FPS      = 30;
const LOGO_SRC = null;   // e.g. 'assets/callistra-logo.svg' — draws it inside the blue circle

// word-level timestamps (absolute seconds, from the transcript)
const WORDS = [
  { text: 'we',    s: 1.87, e: 1.94 },
  { text: 'just',  s: 1.94, e: 2.16 },
  { text: 'built', s: 2.18, e: 2.41 },
  { text: 'you',   s: 2.41, e: 2.50 },
];

const W = 1080, H = 1920, M = 70;
window.REEL = { width: W, height: H, fps: FPS, duration: DURATION, poster: 1.15 };

const C = {
  cream: '#ece8df', ink: '#161616', orange: '#f25a2a', blue: '#2f4bff',
  yellow: '#f4c542', teal: '#007b8a', paper: '#fffaf0'
};

const cv  = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

// ---------- helpers --------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- grain ----------------------------------------------------
let grainPattern = null;
function makeGrain() {
  const g = document.createElement('canvas'); g.width = g.height = 512;
  const gx = g.getContext('2d'); const img = gx.createImageData(512, 512);
  const rnd = mulberry32(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = rnd() < 0.5 ? 0 : 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = rnd() * 26;
  }
  gx.putImageData(img, 0, 0);
  grainPattern = ctx.createPattern(g, 'repeat');
}

// ---------- layout ---------------------------------------------------
let S, ICON, R, GAP, lines = [];
function layout() {
  const LS = -0.065;
  let probe = 300;
  ctx.font = `600 ${probe}px Inter`; ctx.letterSpacing = (LS * probe) + 'px';
  const ws = WORDS.map(w => ctx.measureText(w.text).width - LS * probe);
  const groups = ws.map(w => w + 0.1 * probe + 0.8 * probe);
  S = Math.min(340, probe * (W - 2 * M) / Math.max(...groups));
  ICON = 0.8 * S; R = ICON / 2; GAP = 0.1 * S;
  ctx.font = `600 ${S}px Inter`; ctx.letterSpacing = (LS * S) + 'px';
  const P = S * 1.12;
  const y0 = H / 2 - 1.5 * P - 44;
  lines = WORDS.map((w, i) => {
    const wd = ctx.measureText(w.text).width - LS * S;
    const gw = wd + GAP + ICON;
    const dir = i % 2 === 0 ? 1 : -1;
    return { i, dir, w: wd, gw, cy: y0 + i * P, restX: dir > 0 ? M : W - M - gw };
  });
}

// ---------- line motion ---------------------------------------------
const D1 = 0.14, D2 = 0.20, OV = 40;   // travel, bounce-back, wall overshoot (px)
function lineS(i, ta) {                // signed displacement along travel dir
  const L = lines[i], hit = WORDS[i].s, t0 = hit - D1;
  if (ta < t0) return null;
  const dist = L.dir > 0 ? L.restX + L.gw + 20 : W - L.restX + 20;
  if (ta < hit) { const p = (ta - t0) / D1; return -dist + (dist + OV) * Math.pow(p, 1.5); }
  const q = clamp((ta - hit) / D2);
  return OV * (1 - easeOutCubic(q));
}

// ---------- icons ----------------------------------------------------
let logoImg = null;
function drawIcon(i, cx, cy, ta) {
  const hit = WORDS[i].s;
  const since = ta - hit;
  const pulse = since >= 0 ? Math.sin(clamp(since / 0.3) * Math.PI) * 0.09 : 0;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1 + pulse, 1 + pulse);
  const col = [C.blue, C.yellow, C.orange, C.teal][i];
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();

  if (i === 0) {                                   // Callistra logo (placeholder ring unless LOGO_SRC)
    if (logoImg) {
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();
      const k = Math.min(R * 1.3 / logoImg.width, R * 1.3 / logoImg.height);
      ctx.drawImage(logoImg, -logoImg.width * k / 2, -logoImg.height * k / 2, logoImg.width * k, logoImg.height * k);
      ctx.restore();
    } else {
      ctx.strokeStyle = C.paper; ctx.lineWidth = R * 0.17; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.4, 0.65, Math.PI * 2 - 0.65); ctx.stroke();
      ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(R * 0.08, 0, R * 0.09, 0, Math.PI * 2); ctx.fill();
    }
  } else if (i === 1) {                            // lightning bolt
    const k = R * 0.62;
    const pts = [[0.22, -1], [-0.55, 0.12], [-0.08, 0.12], [-0.28, 1], [0.6, -0.2], [0.1, -0.2]];
    ctx.fillStyle = C.ink; ctx.beginPath();
    pts.forEach((p, n) => n ? ctx.lineTo(p[0] * k, p[1] * k) : ctx.moveTo(p[0] * k, p[1] * k));
    ctx.closePath(); ctx.lineJoin = 'round'; ctx.lineWidth = R * 0.06; ctx.strokeStyle = C.ink; ctx.fill(); ctx.stroke();
    if (since >= 0 && since < 0.09) { ctx.globalAlpha = 0.9 * (1 - since / 0.09); ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); }
  } else if (i === 2) {                            // construction hat
    const tilt = since >= 0 ? -0.28 * (1 - easeOutCubic(clamp(since / 0.35))) * Math.cos(clamp(since / 0.35) * 9) : 0;
    ctx.rotate(tilt);
    ctx.translate(0, -R * 0.06);
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(0, R * 0.16, R * 0.5, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-R * 0.7, R * 0.14, R * 1.4, R * 0.17, R * 0.08); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(-R * 0.05, -R * 0.4, R * 0.1, R * 0.5);          // centre ridge gap
    ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(-R * 0.26, -R * 0.02, R * 0.06, 0, Math.PI * 2); ctx.fill();
  } else {                                         // bauhaus eye
    const open = eyeOpen(ta);
    const look = -0.9 * (1 - easeOutCubic(clamp((ta - hit) / 0.5)));
    drawEye(open, look);
  }
  ctx.restore();
}

function eyeOpen(ta) {
  const h = WORDS[3].s;
  let o = 0;
  if (ta > h) o = Math.min(1.05, easeOutBack(clamp((ta - h) / 0.16)));
  const b = 2.95; let blink = 1;
  if (ta > b && ta < b + 0.07) blink = 1 - Math.pow((ta - b) / 0.07, 2);
  else if (ta >= b + 0.07 && ta < b + 0.19) blink = easeOutCubic((ta - b - 0.07) / 0.12);
  return o * blink;
}

function drawEye(open, look) {
  const hw = R * 0.76, hh = R * 0.5 * open;
  // lashes — bauhaus bars rising from the lid
  ctx.fillStyle = C.ink;
  const xs = [-0.6, -0.3, 0, 0.3, 0.6], lens = [0.17, 0.23, 0.26, 0.23, 0.17];
  xs.forEach((f, n) => {
    const x = f * hw, t = (x + hw) / (2 * hw), lidY = -4 * hh * t * (1 - t);
    const len = R * lens[n] * (0.25 + 0.75 * Math.min(1, open));
    ctx.fillRect(x - R * 0.045, lidY - R * 0.07 - len, R * 0.09, len + R * 0.02);
  });
  // lens
  ctx.beginPath(); ctx.moveTo(-hw, 0);
  ctx.quadraticCurveTo(0, -2 * hh, hw, 0); ctx.quadraticCurveTo(0, 2 * hh, -hw, 0); ctx.closePath();
  ctx.fillStyle = C.paper; ctx.fill();
  ctx.save(); ctx.clip();
  const px = look * R * 0.16;
  ctx.fillStyle = C.orange; ctx.beginPath(); ctx.arc(px, 0, R * 0.37, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.ink;    ctx.beginPath(); ctx.arc(px, 0, R * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = C.ink; ctx.lineWidth = R * 0.065; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-hw, 0);
  ctx.quadraticCurveTo(0, -2 * hh, hw, 0); ctx.quadraticCurveTo(0, 2 * hh, -hw, 0); ctx.closePath(); ctx.stroke();
}

// ---------- one line (word + icon) ----------------------------------
function drawLine(i, s, scx, ta, alpha) {
  const L = lines[i], x = L.restX + L.dir * s;
  ctx.save(); ctx.globalAlpha = alpha;
  const lead = L.dir > 0 ? x + L.gw : x;
  ctx.translate(lead, L.cy); ctx.scale(scx, 1 + (1 - scx) * 0.4); ctx.translate(-lead, -L.cy);
  const wordX = L.dir > 0 ? x : x + ICON + GAP;
  const iconCX = L.dir > 0 ? x + L.w + GAP + R : x + R;
  ctx.font = `600 ${S}px Inter`; ctx.letterSpacing = (-0.065 * S) + 'px';
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillStyle = C.ink;
  ctx.fillText(WORDS[i].text, wordX, L.cy + 0.365 * S);
  ctx.letterSpacing = '0px';
  drawIcon(i, iconCX, L.cy, ta);
  ctx.restore();
}

// ---------- background + web-ui decor -------------------------------
function drawBackground(frame, ta) {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  // grid
  ctx.strokeStyle = 'rgba(22,22,22,0.07)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = M; x <= W - M + 1; x += 135) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 135) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // grain (re-seeded each frame so it shimmers deterministically)
  const r = mulberry32(frame * 9301 + 11), ox = Math.floor(r() * 512), oy = Math.floor(r() * 512);
  ctx.save(); ctx.translate(ox, oy); ctx.fillStyle = grainPattern; ctx.fillRect(-ox, -oy, W, H); ctx.restore();
}

function pop(ta, t0, dur = 0.22) { const p = clamp((ta - t0) / dur); return p <= 0 ? 0 : easeOutBack(p); }

function drawChrome(ta) {
  ctx.strokeStyle = C.ink; ctx.lineCap = 'round'; ctx.lineWidth = 3;
  // top nav
  ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.moveTo(M, 140); ctx.lineTo(W - M, 140); ctx.stroke();
  ctx.globalAlpha = 1;
  for (let n = 0; n < 3; n++) { ctx.beginPath(); ctx.arc(M + 12 + n * 34, 92, 9, 0, Math.PI * 2); ctx.stroke(); }
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(M + 12 + 34, 92, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - M - 118, 90, 15, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - M - 107, 101); ctx.lineTo(W - M - 96, 112); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - M - 52, 82); ctx.lineTo(W - M, 82); ctx.moveTo(W - M - 52, 100); ctx.lineTo(W - M, 100); ctx.stroke();

  // crosshairs
  ctx.lineWidth = 2.5;
  [[M, 180], [W - M, 180], [M, 1705], [W - M, 1705]].forEach(([x, y]) => {
    ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x + 14, y); ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 14); ctx.stroke();
  });

  // line counters
  ctx.font = '500 30px Inter'; ctx.letterSpacing = '2px'; ctx.fillStyle = C.ink;
  lines.forEach((L, i) => {
    if (ta < WORDS[i].s - D1) return;
    ctx.globalAlpha = 0.55 * clamp((ta - (WORDS[i].s - D1)) / 0.1);
    ctx.textAlign = L.dir > 0 ? 'right' : 'left';
    ctx.fillText('0' + (i + 1), L.dir > 0 ? W - M : M, L.cy - S * 0.34);
  });
  ctx.globalAlpha = 1; ctx.letterSpacing = '0px'; ctx.textAlign = 'left';

  // bottom shape row
  const y = 1800;
  let s;
  s = pop(ta, 1.72); if (s) { ctx.save(); ctx.translate(M + 34, y); ctx.scale(s, s); ctx.fillStyle = C.orange; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill(); ctx.restore(); }
  s = pop(ta, 1.78); if (s) { ctx.save(); ctx.translate(M + 150, y + 4); ctx.scale(s, s); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, 0, 38, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.restore(); }
  s = pop(ta, 1.84); if (s) { ctx.save(); ctx.translate(M + 262, y); ctx.scale(s, s); ctx.fillStyle = C.blue; ctx.beginPath(); ctx.moveTo(-34, 34); ctx.lineTo(34, 34); ctx.lineTo(34, -34); ctx.closePath(); ctx.fill(); ctx.restore(); }
  s = pop(ta, 1.90); if (s) { ctx.save(); ctx.translate(M + 372, y); ctx.scale(s, s); ctx.fillStyle = C.ink; [-26, 0, 26].forEach(dx => ctx.fillRect(dx - 6, -34, 12, 68)); ctx.restore(); }
  s = pop(ta, 1.96); if (s) { ctx.save(); ctx.translate(M + 470, y); ctx.scale(s, s); ctx.fillStyle = C.teal; ctx.fillRect(-30, -30, 60, 60); ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill(); ctx.restore(); }
  s = pop(ta, 2.02); if (s) {                       // arrow button
    ctx.save(); ctx.translate(W - M - 44, y); ctx.scale(s, s);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.fill();
    ctx.strokeStyle = C.paper; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 18); ctx.moveTo(-14, 5); ctx.lineTo(0, 19); ctx.lineTo(14, 5); ctx.stroke();
    ctx.restore();
  }
}

// ---------- frame ----------------------------------------------------
function renderFrame(t) {
  const ta = t + OFFSET;
  const frame = Math.round(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  drawBackground(frame, ta);
  drawChrome(ta);
  for (let i = 0; i < 4; i++) {
    const s = lineS(i, ta);
    if (s === null) continue;
    const hit = WORDS[i].s;
    if (ta < hit) {                                 // motion-trail ghosts while travelling
      [[0.036, 0.07], [0.024, 0.12], [0.012, 0.2]].forEach(([dt, a]) => {
        const sg = lineS(i, ta - dt); if (sg !== null) drawLine(i, sg, 1, ta, a);
      });
    }
    const q = ta - hit;                              // wall impact squash
    const scx = q >= 0 && q < 0.1 ? 1 - 0.07 * Math.sin((q / 0.1) * Math.PI) : 1;
    drawLine(i, s, scx, ta, 1);
  }
}
window.renderFrame = renderFrame;

// ---------- boot -----------------------------------------------------
(async () => {
  try {
    await Promise.all([document.fonts.load('600 100px Inter'), document.fonts.load('500 30px Inter')]);
    await document.fonts.ready;
    if (!document.fonts.check('600 100px Inter')) console.warn('Inter failed to load — falling back to a system font');
    if (LOGO_SRC) {
      logoImg = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('logo failed to load: ' + LOGO_SRC)); im.src = LOGO_SRC; });
    }
    makeGrain();
    layout();
    renderFrame(window.REEL.poster);
    window.__reelReady = true;
  } catch (e) {
    window.__reelError = String(e && e.message || e);
  }
})();
</script>
</body>
</html>
