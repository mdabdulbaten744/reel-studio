<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dry Ice Text Effect Maker — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--ink:#121212;--muted:#736e65;--line:rgba(18,18,18,.15);--chk1:#efece6;--chk2:#ffffff;--serif:'Instrument Serif',serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0d0d0d;transform-origin:0 0;isolation:isolate}
#viewport>*{position:absolute;left:0;top:0}
#ui{width:1080px;height:1920px;background:var(--bg);display:none;z-index:1;overflow:hidden;font-family:var(--mono);color:var(--ink)}
#stage,#grain{width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.10;pointer-events:none}
#vig{z-index:4;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(120% 85% at 50% 46%,rgba(0,0,0,0) 58%,rgba(0,0,0,.16) 100%)}

#uiCam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:510px 330px}
#uiInner{position:absolute;left:110px;top:0;width:800px;padding-top:340px}
.canvas-container{position:relative;width:800px;height:400px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:24px 24px;border-radius:3px;overflow:hidden}
.canvas-container canvas{width:100%;height:100%;display:block}
.text-input{margin-top:24px;height:100px;border-bottom:2px solid var(--ink);font-family:var(--serif);font-weight:400;font-size:84px;line-height:1.1;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center}
.text-input .sel{background:rgba(36,110,255,.30)}
#uiCaret{display:inline-block;width:4px;height:68px;background:var(--ink);margin-left:3px}
.row{margin-top:34px}
.row-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab{display:flex;align-items:center;gap:12px}
.lab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.85;flex-shrink:0}
.val{color:var(--ink);font-size:24px;letter-spacing:0;border-bottom:2px dashed var(--muted);min-width:56px;text-align:right}
.track{position:relative;height:3px;background:var(--line);margin:28px 0 8px}
.thumb{position:absolute;top:50%;left:0;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.btn{margin-top:46px;height:88px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--mono);font-weight:500;font-size:23px;letter-spacing:.12em;border-radius:2px}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
#cursor{position:absolute;left:0;top:0;width:60px;height:60px;z-index:50;pointer-events:none;transform-origin:10px 5px;opacity:0;filter:drop-shadow(0 5px 6px rgba(0,0,0,.28))}
.ripple{position:absolute;width:96px;height:96px;border:4px solid var(--ink);border-radius:50%;opacity:0;z-index:49;pointer-events:none}
#capMask{position:absolute;left:0;top:0;width:1080px;height:336px;background:var(--bg);z-index:5}
#cap{position:absolute;left:110px;top:236px;width:800px;height:92px;overflow:hidden}
.capl{position:absolute;left:0;top:0;height:92px;display:flex;align-items:center;gap:22px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:76px;line-height:92px;white-space:nowrap}
.capl b{font-family:var(--mono);font-style:normal;font-weight:500;font-size:26px;color:var(--muted);letter-spacing:.1em}
#toast{position:absolute;left:130px;top:760px;width:780px;height:220px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:34px;padding:26px;border-radius:4px;opacity:0;z-index:20;box-shadow:0 30px 80px rgba(0,0,0,.32)}
#toastCv{width:320px;height:160px;flex-shrink:0;border-radius:2px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:22px 22px}
#toast .tt{display:flex;flex-direction:column;gap:12px;font-family:var(--mono)}
#toast .tt b{font-size:25px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#toast .tt span{font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#a29d93}

#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <div id="ui">
    <div id="uiCam">
      <div id="uiInner">
        <div class="canvas-container"><canvas id="uiCanvas" width="1200" height="600"></canvas></div>
        <div class="text-input" id="uiTextBox"><span id="uiTxt"></span><i id="uiCaret"></i></div>

        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 10l7-7 7 7"/></svg>Haze Elevation</span>
            <span class="val" id="vElev">75%</span>
          </div>
          <div class="track" id="trkElev"><i class="thumb" id="thElev"></i></div>
        </div>
        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 18l6-6-6-6"/></svg>Horizontal Drift</span>
            <span class="val" id="vDrift">35px</span>
          </div>
          <div class="track" id="trkDrift"><i class="thumb" id="thDrift"></i></div>
        </div>
        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="6" cy="6" r="1.5"/><circle cx="18" cy="18" r="1.5"/><circle cx="18" cy="6" r="1.5"/><circle cx="6" cy="18" r="1.5"/></svg>Creep Dissolve</span>
            <span class="val" id="vDiss">22px</span>
          </div>
          <div class="track" id="trkDiss"><i class="thumb" id="thDiss"></i></div>
        </div>

        <div class="btn" id="btn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span id="btnLabel">DOWNLOAD PNG</span></div>

        <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.2 20.4 L11.3 13.7 L17.5 13.4 Z" fill="#fff" stroke="#121212" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="capMask"><div id="cap">
      <div class="capl"><b>01</b><span>Type any word</span></div>
      <div class="capl"><b>02</b><span>Raise the haze</span></div>
      <div class="capl"><b>03</b><span>Push the drift</span></div>
      <div class="capl"><b>04</b><span>Melt the edges</span></div>
      <div class="capl"><b>05</b><span>Download your PNG</span></div>
    </div></div>
    <div id="toast"><canvas id="toastCv" width="320" height="160"></canvas><div class="tt"><b>dry-ice-creep-4x.png</b><span>Transparent PNG · Ready</span></div></div>
  </div>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="22" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

/* ===================== ENGINE ===================== */
const REEL={width:1080,height:1920,fps:30,duration:22,poster:3.2};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const $=id=>document.getElementById(id);
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const EASE={
  lin:p=>p,i2:p=>p*p,i3:p=>p*p*p,o2:p=>1-(1-p)*(1-p),o3:p=>1-Math.pow(1-p,3),
  io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oexp:p=>p>=1?1:1-Math.pow(2,-10*p),
  oback:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
function kf(t,pts){
  if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){
    if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*EASE[b[2]||'io3']((t-a[0])/(b[0]-a[0]));}
  }
  return pts[pts.length-1][1];
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

const BRAND={bg:'#f7f5f0',ink:'#121212',muted:'#736e65',darkBg:'#0d0d0d',darkInk:'#f0eee9',ice:'#9fd4ff',iceText:'#eef5fb'};
const SERIF='"Instrument Serif",serif';
const MONO='"JetBrains Mono",ui-monospace,monospace';

function mono(c,txt,x,y,o={}){
  const{size=28,ls=0,align='left',color=BRAND.ink,alpha=1,weight=500}=o;
  if(alpha<=0)return;
  c.save();c.font=`${weight} ${size}px ${MONO}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';
  c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;
  let xx=x;
  if(align==='center'){c.textAlign='center';xx=x+ls/2;}else if(align==='right'){c.textAlign='right';xx=x+ls;}else c.textAlign='left';
  c.fillText(txt,xx,y);c.restore();
}
function block(c,lines,x,y,size,color,alpha=1){
  c.save();c.font=`italic 400 ${size}px ${SERIF}`;let mw=1;lines.forEach(l=>{mw=Math.max(mw,c.measureText(l).width);});
  const s=Math.min(size,size*860/mw);c.font=`italic 400 ${s}px ${SERIF}`;
  c.textAlign='center';c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;
  lines.forEach((l,i)=>c.fillText(l,x,y+(i-(lines.length-1)/2)*s));c.restore();
}

/* ===== the app's own dry-ice algorithm (same fit, same fog factor, same scatter/creep) ===== */
function sr(x,y){const n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n);}
const srcCache={};
function prepSrc(text,color,fontPx,bw,bh,scale,drift,slot){
  if(!text)return null;
  const k=[text,color,fontPx,bw,bh,scale,drift].join('|');
  if(srcCache[slot]&&srcCache[slot].k===k)return srcCache[slot];
  const off=mkCanvas(bw,bh),oc=off.getContext('2d',{willReadFrequently:true});
  const lines=text.split('\n');
  const padding=Math.abs(drift*scale)+60*scale;
  const ref=100*scale;
  oc.font=`400 ${ref}px ${SERIF}`;
  let mw=1;lines.forEach(l=>{mw=Math.max(mw,oc.measureText(l).width);});
  const refH=lines.length*ref*1.1;
  const availW=Math.max(10*scale,bw-padding),availH=Math.max(10*scale,bh-padding);
  const maxFs=Math.min(availW*ref/mw,availH*ref/refH);
  const fs=Math.max(10*scale,Math.min(fontPx,maxFs));
  oc.font=`400 ${fs}px ${SERIF}`;oc.textAlign='center';oc.textBaseline='middle';oc.fillStyle=color;
  const lh=fs*1.1,th=lines.length*lh,sy=bh/2-th/2+lh/2;
  lines.forEach((l,i)=>oc.fillText(l,bw/2,sy+i*lh));
  const buf=new Uint32Array(oc.getImageData(0,0,bw,bh).data.buffer);
  const arr=[];let minY=bh,maxY=0;
  for(let y=0;y<bh;y++){const r=y*bw;for(let x=0;x<bw;x++){if(buf[r+x]!==0){arr.push(r+x);if(y<minY)minY=y;if(y>maxY)maxY=y;}}}
  const S={k,bw,bh,buf,idx:Int32Array.from(arr),minY,maxY};
  srcCache[slot]=S;return S;
}
function renderIce(S,elev,drift,diss,scale,out){
  const{bw,bh,buf,idx,minY,maxY}=S;
  const ctx=out.getContext('2d');
  const img=ctx.createImageData(bw,bh),tb=new Uint32Array(img.data.buffer);
  const trY=minY+(maxY-minY+1)*(1-elev),sd=drift*scale;
  for(let n=0;n<idx.length;n++){
    const p=idx[n],sy=(p/bw)|0,sx=p-sy*bw,px=buf[p];
    if(sy<=trY){tb[p]=px;continue;}
    const ff=Math.min(1,(sy-trY)/Math.max(1,bh-trY));
    const r1=sr(sx,sy),r2=sr(sx+50,sy+50);
    if(r1<=ff*.4)continue;
    const dx=Math.round(sx+Math.round(ff*sd)+(r1-.5)*(ff*diss*2.5*scale));
    if(dx<0||dx>=bw)continue;
    const cs=Math.round(r2*ff*diss*.8*scale);
    for(let d=0;d<=cs;d++){const y=sy+d;if(y<bh)tb[y*bw+dx]=px;}
  }
  ctx.clearRect(0,0,bw,bh);ctx.putImageData(img,0,0);
}

/* ===================== TIMELINE ===================== */
const HF0=5.5,HF1=6.3;               // hook -> UI crossfade
const U0=5.9;const R=x=>U0+x;        // UI scene clock
const O0=17.0;const Or=x=>O0+x;      // outro clock
const K=a=>a.map(p=>[R(p[0]),p[1],p[2]]);
const DEF={elev:75,drift:35,diss:22};
const ELEV=K([[2.0,75],[2.6,0],[2.75,0],[3.5,100],[3.65,100],[4.1,50],[4.25,50],[4.7,75]]);
const DRIFT=K([[5.3,35],[5.7,-80],[5.85,-80],[6.3,90],[6.4,90],[6.7,35]]);
const DISS=K([[7.2,22],[7.55,3],[7.7,3],[8.1,30],[8.2,30],[8.5,22]]);
const TYPED='FROST',START='MIST';
const CH_T=[...TYPED].map((_,i)=>R(1.0)+i*.12+.012*Math.sin(i*91.7+3.3));
const CLICKS=[.8,9.3];
const DRAGS=[[2.0,4.7,'elev'],[5.3,6.7,'drift'],[7.2,8.5,'diss']];
const PRESS=[...CLICKS.map(c=>[c,c+.12]),...DRAGS.map(d=>[d[0],d[1]])].map(p=>[R(p[0]),R(p[1])]);
const RIPPLES=[...CLICKS,...DRAGS.map(d=>d[0])].map(R);
const CAP_T=[.3,1.8,5.1,7.0,9.2].map(R);

/* ===================== SCENES ===================== */
const stage=$('stage'),sc=stage.getContext('2d');
const grain=$('grain'),gc=grain.getContext('2d');
const ui=$('ui');
const layer=mkCanvas(W,H),lc=layer.getContext('2d');
const hookCv=mkCanvas(1080,700),outCv=mkCanvas(1080,700),uiIce=mkCanvas(1200,600);
let grainTile=null,PARTS=[];
const M={};

function buildAssets(){
  const rnd=mulberry32(5);grainTile=mkCanvas(512,512);
  const g=grainTile.getContext('2d'),id=g.createImageData(512,512);
  for(let i=0;i<512*512;i++){const v=rnd()*255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
  g.putImageData(id,0,0);
  const r2=mulberry32(11);
  for(let i=0;i<80;i++)PARTS.push({x:r2()*W,y:r2()*H,r:1+r2()*2.2,sp:12+r2()*26,ph:r2()*6.28,a:.12+r2()*.25});
}
function fogLayer(c,t,amt){
  for(let i=0;i<7;i++){
    const x=540+Math.sin(t*.35+i*1.7)*380+(i-3)*60,y=1330+(i%3)*70+Math.sin(t*.5+i)*25,r=380+i*35;
    const a=(.05+.08*amt)*(.7+.3*Math.sin(t*.8+i*2));
    const g=c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(190,220,245,${a})`);g.addColorStop(1,'rgba(190,220,245,0)');
    c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);
  }
}
function particles(c,t,k=1){
  c.save();c.fillStyle=BRAND.ice;
  PARTS.forEach(p=>{
    const y=(((p.y-t*p.sp)%H)+H)%H,x=p.x+Math.sin(t*.6+p.ph)*20;
    c.globalAlpha=p.a*k;c.beginPath();c.arc(x,y,p.r,0,Math.PI*2);c.fill();
  });c.restore();
}
function darkBg(c,t,amt,cy){
  c.fillStyle=BRAND.darkBg;c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(540,cy,40,540,cy,820);
  g.addColorStop(0,'rgba(110,160,210,.17)');g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  fogLayer(c,t,amt);particles(c,t);
}

/* ---------- HOOK 0 – 6.3 : steady, premium ---------- */
function drawHook(c,t){
  const elev=kf(t,[[0,0],[.3,0,'lin'],[4.6,1,'io3']]);
  darkBg(c,t,elev,980);
  const z=1+.055*(t/6);
  c.save();c.translate(540,980);c.scale(z,z);c.translate(-540,-980);
  const S=prepSrc('Vanish',BRAND.iceText,340,1080,700,3,60,'hook');
  renderIce(S,elev,60,30,3,hookCv);
  c.shadowColor='rgba(150,205,255,.5)';c.shadowBlur=36;
  c.drawImage(hookCv,0,630);
  c.restore();
  /* labels */
  mono(c,'DRY ICE TEXT EFFECT',540,270,{size:28,ls:8,align:'center',color:BRAND.darkInk,alpha:.7});
  /* headlines */
  c.save();c.beginPath();c.rect(0,330,W,300);c.clip();
  const o1=prog(t,4.7,.5,'i3')*280;
  if(o1<280)block(c,['Watch this word','turn to dry ice.'],540,470-o1,118,BRAND.darkInk);
  const p2=prog(t,4.9,.6,'oexp');
  if(p2>0)block(c,['Now make','your own.'],540,470+(1-p2)*280,118,BRAND.darkInk);
  c.restore();
  /* slider readout: teaches that one slider does this */
  const ra=prog(t,.3,.5,'o3')*(1-prog(t,4.9,.4,'i2'));
  if(ra>0){
    mono(c,'HAZE ELEVATION',90,1500,{size:24,ls:5,color:BRAND.darkInk,alpha:.65*ra});
    mono(c,Math.round(elev*100)+'%',990,1500,{size:24,align:'right',color:BRAND.darkInk,alpha:.9*ra});
    c.save();c.strokeStyle=BRAND.darkInk;c.globalAlpha=.25*ra;c.lineWidth=2;c.beginPath();c.moveTo(90,1545);c.lineTo(990,1545);c.stroke();
    c.globalAlpha=.8*ra;c.beginPath();c.moveTo(90,1545);c.lineTo(90+900*elev,1545);c.stroke();
    c.fillStyle=BRAND.darkInk;c.globalAlpha=.95*ra;c.beginPath();c.arc(90+900*elev,1545,12,0,Math.PI*2);c.fill();c.restore();
  }
  mono(c,'STAY TO THE END · MAKE ONE YOURSELF',540,1670,{size:24,ls:5,align:'center',color:BRAND.darkInk,alpha:.6*prog(t,.2,.8,'o3')});
}

/* ---------- OUTRO ---------- */
function drawOutro(c,t){
  const elev=kf(t,[[Or(.2),0],[Or(.9),0,'lin'],[Or(3.0),.75,'io3']]);
  darkBg(c,t,Math.max(elev,.4),760);
  const S=prepSrc('Your name',BRAND.iceText,330,1080,700,3,40,'out');
  renderIce(S,elev,40,24,3,outCv);
  c.save();c.shadowColor='rgba(150,205,255,.5)';c.shadowBlur=36;c.globalAlpha=prog(t,Or(.1),.6,'o3');
  c.drawImage(outCv,0,410);c.restore();
  const p1=prog(t,Or(1.0),.7,'oexp');
  c.save();c.beginPath();c.rect(0,1050,W,130);c.clip();
  block(c,['Try it on your name.'],540,1115+(1-p1)*130,76,BRAND.darkInk);c.restore();
  const ps=prog(t,Or(1.3),.7,'oexp');
  mono(c,'DRY ICE TEXT EFFECT MAKER',540,1225,{size:28,ls:lerp(18,8,ps),align:'center',color:BRAND.darkInk,alpha:ps*.85});
  mono(c,'CALLISTRA.DESIGN',540,1310,{size:46,ls:4,align:'center',color:BRAND.darkInk,alpha:prog(t,Or(1.7),.5,'o3'),weight:700});
  const up=prog(t,Or(1.9),.6,'oexp');
  c.save();c.strokeStyle=BRAND.ice;c.lineWidth=4;c.beginPath();c.moveTo(540-290*up,1358);c.lineTo(540+290*up,1358);c.stroke();c.restore();
  mono(c,'LINK IN BIO',540,1420,{size:26,ls:6,align:'center',color:'#8c877e',alpha:prog(t,Or(2.4),.5,'o3')});
  mono(c,'TRANSPARENT PNG · UP TO 8X EXPORT',540,1500,{size:22,ls:4,align:'center',color:'#8c877e',alpha:.8*prog(t,Or(2.8),.5,'o3')});
}

/* ---------- UI scene ---------- */
const uiCam=$('uiCam'),uiCanvas=$('uiCanvas'),uc=uiCanvas.getContext('2d');
const toastCv=$('toastCv'),tcx=toastCv.getContext('2d');
let uiKey='',rippleEls=[];
function off(el,root){let x=0,y=0,e=el;while(e&&e!==root){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}return{x,y,w:el.offsetWidth,h:el.offsetHeight};}
function measure(){
  const inner=$('uiInner');
  M.trk={elev:off($('trkElev'),inner),drift:off($('trkDrift'),inner),diss:off($('trkDiss'),inner)};
  M.input=off($('uiTextBox'),inner);M.btn=off($('btn'),inner);
  RIPPLES.forEach(()=>{const e=document.createElement('i');e.className='ripple';inner.appendChild(e);rippleEls.push(e);});
}
const center=o=>[o.x+o.w/2,o.y+o.h/2];
function thumbPos(row,v,min,max){const tr=M.trk[row],r=12;return[tr.x+r+(tr.w-2*r)*((v-min)/(max-min)),tr.y+tr.h/2];}
function arc(a,b,p){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),k=Math.sin(Math.PI*p)*d*.12;
  return[lerp(a[0],b[0],p)-dy/(d||1)*k,lerp(a[1],b[1],p)+dx/(d||1)*k];
}
let SEG=null;
function buildSeg(){
  SEG=[
    {t0:R(.3),t1:R(.8),to:()=>[M.input.x+300,M.input.y+M.input.h*.5]},
    {t0:R(1.55),t1:R(1.95),to:()=>thumbPos('elev',DEF.elev,0,100)},
    {t0:R(2.0),t1:R(4.7),fn:t=>thumbPos('elev',kf(t,ELEV),0,100)},
    {t0:R(4.75),t1:R(5.25),to:()=>thumbPos('drift',DEF.drift,-100,100)},
    {t0:R(5.3),t1:R(6.7),fn:t=>thumbPos('drift',kf(t,DRIFT),-100,100)},
    {t0:R(6.75),t1:R(7.15),to:()=>thumbPos('diss',DEF.diss,1,30)},
    {t0:R(7.2),t1:R(8.5),fn:t=>thumbPos('diss',kf(t,DISS),1,30)},
    {t0:R(8.6),t1:R(9.2),to:()=>center(M.btn)},
    {t0:R(10.3),t1:R(10.9),to:()=>[M.btn.x+M.btn.w-60,M.btn.y+M.btn.h+120]}
  ];
}
function cursorAt(t){
  let pos=[880,1500];
  for(const s of SEG){
    if(t<s.t0)return pos;
    if(s.fn){if(t<=s.t1)return s.fn(t);pos=s.fn(s.t1);continue;}
    const to=s.to();
    if(t<=s.t1)return arc(pos,to,EASE.io3((t-s.t0)/(s.t1-s.t0)));

  }

}
function pressedAt(t){return PRESS.some(p=>t>=p[0]&&t<=p[1]);}
function dragRow(t){for(const d of DRAGS)if(t>=R(d[0])&&t<=R(d[1]))return d[2];return'';}
function captionUpdate(t){
  document.querySelectorAll('.capl').forEach((el,i)=>{
    const pin=prog(t,CAP_T[i],.4,'oexp');
    const pout=i<CAP_T.length-1?prog(t,CAP_T[i+1],.3,'i3'):0;
    el.style.transform=`translateY(${(1-pin)*100-pout*100}px)`;
  });
}
function updateUI(t){
  const intro=prog(t,HF0,1.0,'o3');
  uiCam.style.transform=`scale(${1+.06*(1-intro)})`;
  const eN=kf(t,ELEV),dN=kf(t,DRIFT),sN=kf(t,DISS);
  const e=Math.round(eN),d=Math.round(dN),s=Math.round(sN);
  let n=0;CH_T.forEach(ct=>{if(t>=ct)n++;});
  const sel=t>=R(.8)&&t<CH_T[0];
  const text=t<CH_T[0]?START:TYPED.slice(0,n);
  const key=`${text}|${e}|${d}|${s}`;
  if(key!==uiKey){

  $('vElev').textContent=e+'%';$('vDrift').textContent=d+'px';$('vDiss').textContent=s+'px';
  const pos=(id,v,mn,mx)=>{$(id).style.left=`calc(12px + (100% - 24px) * ${(v-mn)/(mx-mn)})`;};
  pos('thElev',eN,0,100);pos('thDrift',dN,-100,100);pos('thDiss',sN,1,30);
  const dr=dragRow(t);
  [['thElev','elev'],['thDrift','drift'],['thDiss','diss']].forEach(([id,k])=>{$(id).style.transform=`translate(-50%,-50%) scale(${dr===k?1.7:1})`;});
  const rendering=t>=R(9.3)&&t<R(9.75);
  $('btnLabel').textContent=rendering?'RENDERING...':'DOWNLOAD PNG';
  $('btn').style.background=rendering?BRAND.muted:BRAND.ink;
  $('btn').style.transform=(t>=R(9.3)&&t<R(9.42))?'scale(.985)':'scale(1)';
  const tp=prog(t,R(9.75),.5,'oback');

  if(tp>0){tcx.clearRect(0,0,320,160);tcx.drawImage(uiCanvas,0,0,320,160);}

    if(p>=0&&p<=1){const c0=cursorAt(rt);el.style.left=c0[0]+'px';el.style.top=c0[1]+'px';el.style.opacity=.55*(1-p);el.style.transform=`translate(-50%,-50%) scale(${.3+.9*EASE.o3(p)})`;}
    else el.style.opacity=0;
  });
  captionUpdate(t);
}

function renderFrame(t){
  t=clamp(t,0,REEL.duration);
  sc.setTransform(1,0,0,1,0,0);sc.globalAlpha=1;sc.clearRect(0,0,W,H);
  const showUI=t>=HF0&&t<Or(.9);
  ui.style.display=showUI?'block':'none';
  if(showUI)updateUI(t);
  const ha=1-prog(t,HF0,HF1-HF0,'io3');
  if(ha>0){
    if(ha>=1)drawHook(sc,t);
    else{drawHook(lc,t);sc.globalAlpha=ha;sc.drawImage(layer,0,0);sc.globalAlpha=1;}
  }
  const oa=prog(t,O0,.8,'io3');
  if(oa>0){
    if(oa>=1)drawOutro(sc,t);
    else{drawOutro(lc,t);sc.globalAlpha=oa;sc.drawImage(layer,0,0);sc.globalAlpha=1;}
  }
  const fo=prog(t,REEL.duration-.5,.5);
  if(fo>0){sc.fillStyle='#000';sc.globalAlpha=fo;sc.fillRect(0,0,W,H);sc.globalAlpha=1;}
  const f=Math.floor(t*REEL.fps+.001),ox=(f*97)%512,oy=(f*57)%512;
  gc.clearRect(0,0,W,H);
  for(let x=-ox;x<W;x+=512)for(let y=-oy;y<H;y+=512)gc.drawImage(grainTile,x,y);

window.renderFrame=renderFrame;

/* ===================== SOUND ===================== */
async function buildAudio(){
  const SR=44100,DUR=REEL.duration;
  const oc=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const rand=mulberry32(7);
  const nb=oc.createBuffer(1,SR*3,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rand()*2-1;}
  const master=oc.createGain();master.gain.setValueAtTime(.72,0);master.gain.setValueAtTime(.72,DUR-.6);master.gain.linearRampToValueAtTime(0,DUR-.03);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=12;comp.ratio.value=10;comp.attack.value=.002;comp.release.value=.12;
  master.connect(comp);comp.connect(oc.destination);
  const rl=Math.floor(SR*2.2),ir=oc.createBuffer(2,rl,SR);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rand()*2-1)*Math.pow(1-i/rl,3.2);}
  const conv=oc.createConvolver();conv.buffer=ir;
  const revIn=oc.createGain(),revLp=oc.createBiquadFilter(),revOut=oc.createGain();
  revLp.type='lowpass';revLp.frequency.value=5000;revOut.gain.value=.55;
  revIn.connect(conv);conv.connect(revLp);revLp.connect(revOut);revOut.connect(master);
  const out=(g,o={})=>{let n=g;
    if(o.pan){const p=oc.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p;}
    n.connect(master);
    if(o.rev>0){const s=oc.createGain();s.gain.value=o.rev;n.connect(s);s.connect(revIn);}
  };
  const env=(p,t,peak,a,d)=>{p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(peak,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);};
  const nsrc=(t,dur,seed)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,(Math.abs(seed)*.37)%2);s.stop(t+dur);return s;};
  const flt=(type,f,q=1)=>{const b=oc.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const osc=(type,f,t,dur)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;};

  const thud=(t,g=.6)=>{
    const o=osc('sine',170,t,.45);o.frequency.exponentialRampToValueAtTime(44,t+.2);
    const og=oc.createGain();env(og.gain,t,g,.003,.32);o.connect(og);out(og,{rev:.18});
    const n=nsrc(t,.14,t*13.7),bp=flt('bandpass',950,.9),ng=oc.createGain();env(ng.gain,t,g*.6,.001,.075);n.connect(bp);bp.connect(ng);out(ng,{rev:.12});
  };
  const tick=(t,f=1200,g=.2,pan=0)=>{const o=osc('triangle',f,t,.08),gn=oc.createGain();env(gn.gain,t,g,.001,.05);o.connect(gn);out(gn,{pan,rev:.08});};
  const key=(t,i)=>{
    const n=nsrc(t,.03,t*5.3),hp=flt('highpass',1800),g1=oc.createGain();env(g1.gain,t,.22,.0008,.012);n.connect(hp);hp.connect(g1);out(g1,{pan:i%2?.1:-.1});
    const o=osc('sine',190+(i%3)*14,t,.06),g2=oc.createGain();env(g2.gain,t,.12,.001,.03);o.connect(g2);out(g2);
  };
  const clk=(t,g,f)=>{const n=nsrc(t,.03,t*9.1),bp=flt('bandpass',f,1.2),gn=oc.createGain();env(gn.gain,t,g,.0006,.007);n.connect(bp);bp.connect(gn);out(gn);};
  const click=(t,g=.3)=>{clk(t,g,2800);clk(t+.075,g*.6,2000);};
  const whoosh=(t,dur,o={})=>{
    const{g=.3,up=true,f0=250,f1=5200}=o;
    const n=nsrc(t,dur,t*7.3),bp=flt('bandpass',1,1.1);
    bp.frequency.setValueAtTime(up?f0:f1,t);bp.frequency.exponentialRampToValueAtTime(up?f1:f0,t+dur);
    const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+dur*(up?.7:.3));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(bp);bp.connect(gn);
    const p=oc.createStereoPanner();p.pan.setValueAtTime(up?-.7:.7,t);p.pan.linearRampToValueAtTime(up?.7:-.7,t+dur);gn.connect(p);out(p,{rev:.2});
  };
  const glide=(t,dur,f0,f1,g,type='sine')=>{
    const o=osc(type,f0,t,dur+.05);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const gn=oc.createGain();env(gn.gain,t,g,.01,dur);o.connect(gn);out(gn,{rev:.2});
  };
  const chime=(t,g=1)=>{[[659.25,0],[987.77,.09]].forEach(([f,d])=>{
    [[1,.2],[2,.05],[3,.02]].forEach(([m,a])=>{const o=osc('sine',f*m,t+d,1.8),gn=oc.createGain();env(gn.gain,t+d,a*g,.004,1.5);o.connect(gn);out(gn,{rev:.6});});
  });};
  const boom=(t,g)=>{
    const o=osc('sine',100,t,1.4);o.frequency.exponentialRampToValueAtTime(28,t+1.0);
    const og=oc.createGain();env(og.gain,t,g,.01,1.2);o.connect(og);out(og,{rev:.4});
  };
  const pad=(t0,t1,fs,g)=>{fs.forEach((f,i)=>{
    const o=osc('sine',f*(i%2?1.003:.997),t0,t1-t0+.2),gn=oc.createGain();
    gn.gain.setValueAtTime(.0001,t0);gn.gain.linearRampToValueAtTime(g,t0+(t1-t0)*.5);gn.gain.linearRampToValueAtTime(.0001,t1);
    o.connect(gn);out(gn,{rev:.45,pan:(i-1.5)*.3});
  });};
  const hiss=(t0,t1,peak)=>{
    const n=nsrc(t0,t1-t0,1.9),hp=flt('highpass',2500),bp=flt('bandpass',6000,.5),gn=oc.createGain();
    gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(peak,(t0+t1)/2);gn.gain.exponentialRampToValueAtTime(.0001,t1);
    n.connect(hp);hp.connect(bp);bp.connect(gn);out(gn,{rev:.2});
  };
  const ping=(t,f,g)=>{const o=osc('sine',f,t,.9),gn=oc.createGain();env(gn.gain,t,g,.002,.7);o.connect(gn);out(gn,{rev:.6,pan:(rand()-.5)*1.2});};
  const sliderTicks=(fn,t0,t1,step,fb,g)=>{
    let last=Math.round(fn(t0)/step);
    for(let t=t0;t<=t1;t+=1/240){const q=Math.round(fn(t)/step);if(q!==last){last=q;tick(t,fb+fn(t)*5,g,0);}}
  };

  /* hook: calm pad, cold vapour hiss rising with the haze, sparse glass pings */
  chime(.05,.55);boom(.02,.22);
  pad(0,6.4,[55,82.41,110,164.81],.05);
  hiss(.3,6.0,.09);
  for(let k=0;k<11;k++)ping(1.4+k*.32+rand()*.15,1800+rand()*2400,.025);
  whoosh(4.65,.55,{g:.12,f0:300,f1:3500});tick(4.9,1500,.08);
  whoosh(HF0,.8,{g:.14,up:false,f0:300,f1:3800});

  /* UI walkthrough */
  thud(R(.05),.25);
  click(R(.8));
  CH_T.forEach((ct,i)=>key(ct,i));
  click(R(2.0),.3);sliderTicks(t=>kf(t,ELEV),R(2.05),R(4.65),4,900,.05);click(R(4.7),.22);
  click(R(5.3),.3);sliderTicks(t=>kf(t,DRIFT),R(5.35),R(6.65),6,900,.05);click(R(6.7),.22);
  click(R(7.2),.3);sliderTicks(t=>kf(t,DISS),R(7.25),R(8.45),1,900,.05);click(R(8.5),.22);
  click(R(9.3));
  for(let k=0;k<9;k++)tick(R(9.35)+k*.05,1600+k*60,.07,0);
  whoosh(R(9.7),.3,{g:.1,f0:600,f1:3000});chime(R(9.75));

  /* outro */
  whoosh(O0-.1,.8,{g:.14});
  pad(O0,DUR,[65.41,98,130.81,196],.05);
  hiss(Or(.9),Or(3.4),.07);
  boom(Or(.3),.25);
  for(let k=0;k<6;k++)ping(Or(1.0+k*.3),2000+rand()*2200,.025);
  for(let i=0;i<4;i++)tick(Or(1.3)+i*.05,1000+i*180,.05,0);
  glide(Or(1.9),.45,600,2600,.05,'triangle');
  chime(Or(2.6));
  chime(Or(3.8),.5);
  return oc.startRendering();
}
let audioP=null;
const getAudio=()=>audioP||(audioP=buildAudio());
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate;
  const data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=peak>.89?.89/peak:1;
  const ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';
  for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await getAudio());

/* ===================== PREVIEW + BOOT ===================== */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;rg.max=REEL.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s';};
  function loop(){
    if(!playing)return;
    cur=base+(performance.now()-started)/1000;
    if(cur>=REEL.duration){cur=REEL.duration;show(cur);pause();btn.textContent='REPLAY';cur=0;return;}
    show(cur);requestAnimationFrame(loop);
  }
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){
    btn.textContent='PREPARING SOUND…';
    if(!buf)buf=await getAudio();
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);
    base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();
  }
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}

async function boot(){
  try{
    const lat="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([
      document.fonts.load('400 100px "Instrument Serif"',lat),
      document.fonts.load('italic 400 100px "Instrument Serif"',lat),
      document.fonts.load('500 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,/·%'),
      document.fonts.load('700 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-')
    ]).catch(()=>{});
    await document.fonts.ready;
    buildAssets();
    ui.style.display='block';measure();ui.style.display='none';buildSeg();
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e);}
}
window.addEventListener('load',boot);
