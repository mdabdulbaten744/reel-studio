<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glitch Slice Text Effect Maker — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--ink:#121212;--muted:#736e65;--line:rgba(18,18,18,.15);--chk1:#efece6;--chk2:#ffffff;--serif:'Instrument Serif',serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;isolation:isolate}
#viewport>*{position:absolute;left:0;top:0}
#ui{width:1080px;height:1920px;background:var(--bg);display:none;z-index:1;overflow:hidden;font-family:var(--mono);color:var(--ink)}
#stage,#grain{width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.12;pointer-events:none}
#vig{z-index:4;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(120% 85% at 50% 46%,rgba(0,0,0,0) 58%,rgba(0,0,0,.2) 100%)}
#uiCam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:510px 700px}
#uiInner{position:absolute;left:110px;top:0;width:800px;padding-top:340px}
.cc{position:relative;width:800px;height:400px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:24px 24px;border-radius:3px;overflow:hidden}
.cc canvas{width:100%;height:100%;display:block}
.ti{margin-top:24px;height:100px;border-bottom:2px solid var(--ink);font-family:var(--serif);font-size:84px;line-height:1.1;display:flex;align-items:center;white-space:nowrap}
.ti .sel{background:rgba(36,110,255,.30)}
#caret{display:inline-block;width:4px;height:68px;background:var(--ink);margin-left:3px}
.row{margin-top:26px}
.rh{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab{display:flex;align-items:center;gap:12px}
.lab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.85}
.val{color:var(--ink);font-size:24px;letter-spacing:0;border-bottom:2px dashed var(--muted);min-width:56px;text-align:right}
.track{position:relative;height:3px;background:var(--line);margin:26px 0 8px}
.thumb{position:absolute;top:50%;left:0;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.adv{margin-top:30px;border-top:2px solid var(--line);padding-top:20px}
.sum{display:flex;justify-content:space-between;font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{margin-top:34px;height:88px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:16px;font-weight:500;font-size:23px;letter-spacing:.12em;border-radius:2px}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
#cursor{position:absolute;left:0;top:0;width:60px;height:60px;z-index:50;transform-origin:10px 5px;opacity:0;filter:drop-shadow(0 5px 6px rgba(0,0,0,.28))}
.ripple{position:absolute;width:96px;height:96px;border:4px solid var(--ink);border-radius:50%;opacity:0;z-index:49}
#capMask{position:absolute;left:0;top:0;width:1080px;height:336px;background:var(--bg);z-index:5}
#cap{position:absolute;left:110px;top:236px;width:800px;height:92px;overflow:hidden}
.capl{position:absolute;left:0;top:0;height:92px;display:flex;align-items:center;gap:22px;font-family:var(--serif);font-style:italic;font-size:76px;white-space:nowrap}
.capl b{font-family:var(--mono);font-style:normal;font-weight:500;font-size:26px;color:var(--muted);letter-spacing:.1em}
#toast{position:absolute;left:130px;top:780px;width:780px;height:220px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:34px;padding:26px;border-radius:4px;opacity:0;z-index:20;box-shadow:0 30px 80px rgba(0,0,0,.32)}
#toastCv{width:320px;height:160px;flex-shrink:0;border-radius:2px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:22px 22px}
#toast .tt{display:flex;flex-direction:column;gap:12px}
#toast .tt b{font-size:25px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#toast .tt span{font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#a29d93}
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono)}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <div id="ui"><div id="uiCam"><div id="uiInner">
    <div class="cc"><canvas id="uiCanvas" width="1200" height="600"></canvas></div>
    <div class="ti"><span id="uiTxt"></span><i id="caret"></i></div>
    <div class="row"><div class="rh"><span class="lab"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Slice Thickness</span><span class="val" id="vF">2px</span></div><div class="track" id="tF"><i class="thumb" id="hF"></i></div></div>
    <div class="row"><div class="rh"><span class="lab"><svg viewBox="0 0 24 24"><path d="M18 8l4 4-4 4M6 16l-4-4 4-4M2 12h20"/></svg>Shear Offset</span><span class="val" id="vS">9px</span></div><div class="track" id="tS"><i class="thumb" id="hS"></i></div></div>
    <div class="row"><div class="rh"><span class="lab"><svg viewBox="0 0 24 24"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>Signal Chaos</span><span class="val" id="vC">30%</span></div><div class="track" id="tC"><i class="thumb" id="hC"></i></div></div>
    <div class="adv"><div class="sum"><span>Color and Size</span><span>＋</span></div></div>
    <div class="btn" id="btn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span id="btnL">DOWNLOAD PNG</span></div>
    <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.2 20.4 L11.3 13.7 L17.5 13.4 Z" fill="#fff" stroke="#121212" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
  <div id="capMask"><div id="cap">
    <div class="capl"><b>01</b><span>Type anything</span></div>
    <div class="capl"><b>02</b><span>Slice it thin</span></div>
    <div class="capl"><b>03</b><span>Tear it sideways</span></div>
    <div class="capl"><b>04</b><span>Add the chaos</span></div>
    <div class="capl"><b>05</b><span>Download PNG</span></div>
  </div></div>
  <div id="toast"><canvas id="toastCv" width="320" height="160"></canvas><div class="tt"><b>glitch-slice-4x.png</b><span>Transparent PNG · Ready</span></div></div>
  </div></div>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="17.2" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';
const REEL={width:1080,height:1920,fps:30,duration:17.2,poster:1.7};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const $=id=>document.getElementById(id),W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,p)=>a+(b-a)*p;
const EASE={lin:p=>p,i2:p=>p*p,i3:p=>p*p*p,o3:p=>1-Math.pow(1-p,3),io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,oexp:p=>p>=1?1:1-Math.pow(2,-10*p),oback:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
function kf(t,pts){if(t<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*EASE[b[2]||'io3']((t-a[0])/(b[0]-a[0]));}}return pts[pts.length-1][1];}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const BR={bg:'#f7f5f0',ink:'#121212',muted:'#736e65',dk:'#0d0d0d',dkInk:'#f0eee9',red:'#E3262B'};
const SERIF='"Instrument Serif",serif',MONO='"JetBrains Mono",ui-monospace,monospace';
function mono(c,txt,x,y,o={}){const{size=28,ls=0,align='left',color=BR.ink,alpha=1,weight=500}=o;if(alpha<=0)return;c.save();c.font=`${weight} ${size}px ${MONO}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;c.textAlign=align;c.fillText(txt,align==='center'?x+ls/2:x,y);c.restore();}
function block(c,lines,x,y,size,color,alpha=1){c.save();c.font=`italic 400 ${size}px ${SERIF}`;let mw=1;lines.forEach(l=>{mw=Math.max(mw,c.measureText(l).width);});const s=Math.min(size,size*860/mw);c.font=`italic 400 ${s}px ${SERIF}`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;lines.forEach((l,i)=>c.fillText(l,x,y+(i-(lines.length-1)/2)*s));c.restore();}

/* ---- the app's own glitch-slice algorithm (same fit, same band hash, same shear/chaos mix) ---- */
const SRC={},OUT={},mc=mk(4,4).getContext('2d');
const sr=(x,y)=>{const n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n);};
function srcOf(text,color,fs,w,h){
  const k=text+color+fs+w+h;if(SRC[k])return SRC[k];
  if(Object.keys(SRC).length>14)for(const x in SRC)delete SRC[x];
  const c=mk(w,h),x=c.getContext('2d',{willReadFrequently:true});
  x.font=`400 ${fs}px ${SERIF}`;x.textAlign='center';x.textBaseline='middle';x.fillStyle=color;
  const L=text.split('\n'),lh=fs*1.1,sy=h/2-L.length*lh/2+lh/2;L.forEach((l,i)=>x.fillText(l,w/2,sy+i*lh));
  return SRC[k]=new Uint32Array(x.getImageData(0,0,w,h).data.buffer);
}
function glitch(o){
  const{slot,text,color,fringe,shear,chaos,fs0=140,s=1,bw=800,bh=400,bo=0,padS=shear}=o;
  const w=Math.round(bw*s),h=Math.round(bh*s),L=text.split('\n');
  mc.font=`400 ${100*s}px ${SERIF}`;let mw=1;L.forEach(l=>{mw=Math.max(mw,mc.measureText(l).width);});
  const pad=padS*s+40*s,fit=Math.min((w-pad)*100*s/mw,(h-pad)*100*s/(L.length*110*s));
  const fs=Math.round(Math.max(10*s,Math.min(fs0*s,fit))/4)*4;
  const src=srcOf(text,color,fs,w,h);
  let u=OUT[slot];if(!u||u.w!==w||u.h!==h){const c=mk(w,h),x=c.getContext('2d'),img=x.createImageData(w,h);u=OUT[slot]={c,x,img,buf:new Uint32Array(img.data.buffer),w,h};}
  const buf=u.buf;buf.fill(0);const fr=Math.max(1,Math.round(fringe));
  for(let dy=0;dy<h;dy++){
    const band=Math.floor(dy/s/fr)+bo,dir=band%2===0?1:-1;
    const wave=Math.sin(band*.4)*shear,mac=sr(0,Math.floor(band/3)),mic=sr(0,band);
    const sh=Math.round((wave*(1-chaos)+dir*(mac*1.5+mic*.5)*shear*chaos)*s),ro=dy*w;
    if(sh>=0){if(sh<w)buf.set(src.subarray(ro,ro+w-sh),ro+sh);}else{const m=-sh;if(m<w)buf.set(src.subarray(ro+m,ro+w),ro);}
  }
  u.x.putImageData(u.img,0,0);return u.c;
}
function flash(c,a,col){if(a>.005){c.save();c.globalAlpha=a;c.fillStyle=col;c.fillRect(0,0,W,H);c.restore();}}
function stampAnim(u,dur=.12){if(u<0)return null;const p=clamp(u/dur);let s,blur;if(u<dur){s=1.32-.32*EASE.i2(p);blur=14*(1-p);}else{const q=u-dur;s=1-.035*Math.exp(-q*16)*Math.cos(q*55);blur=0;}return{s,blur,a:clamp(u/.04)};}
const WD=.3,WS=.045,WB=4;
function wipe(c,t,tIn,color){const cover=tIn+WD+(WB-1)*WS,bh=H/WB;c.fillStyle=color;for(let i=0;i<WB;i++){const pi=EASE.io3(clamp((t-(tIn+i*WS))/WD)),po=EASE.io3(clamp((t-(cover+i*WS))/WD)),x0=po*W,x1=pi*W;if(x1>x0+.5)c.fillRect(x0,i*bh,x1-x0,bh+1);}}

/* =====================================================================
   TIMELINE — visuals and sound read the same numbers
   ===================================================================== */
const SL=.95;                       // fake crash ends, slam
const HEAL1=2.3;                    // shear settles on default
const W1_IN=2.7,W1_COVER=W1_IN+WD+(WB-1)*WS,C0=W1_COVER,R=x=>C0+x;
const UI_LEN=10.2,W2_IN=C0+UI_LEN,W2_COVER=W2_IN+WD+(WB-1)*WS,D0=W2_COVER,Dr=x=>D0+x;
const TAIL=16.9;                    // cuts back to the crash frame so the reel loops
const K=a=>a.map(p=>[R(p[0]),p[1],p[2]]);
const DEF={fringe:2,shear:9,chaos:30};  // the app's defaults — every journey starts and ends here
const FR=K([[1.9,2],[2.3,16],[2.5,16],[2.9,1],[3.0,1],[3.3,2]]);
const SH=K([[3.8,9],[4.25,160],[4.45,160],[5.05,0],[5.15,0],[5.6,9]]);
const CH=K([[6.0,30],[6.4,100],[6.55,100],[7.0,0],[7.1,0],[7.5,30]]);
const HS=[[SL,150],[HEAL1,9,'o3']],HC=[[SL,100],[HEAL1,30,'o3']],HF=[[SL,6],[HEAL1,2,'o3']];
const TYPED='STOP',CH_T=[...TYPED].map((_,i)=>R(1.0)+i*.11+.012*Math.sin(i*91.7+3.3));
const CLICKS=[.65,8.3],DRAGS=[[1.9,3.3,'f'],[3.8,5.6,'s'],[6.0,7.5,'c']];
const PRESS=[...CLICKS.map(c=>[c,c+.12]),...DRAGS.map(d=>[d[0],d[1]])].map(p=>[R(p[0]),R(p[1])]);
const RIPPLES=[...CLICKS,...DRAGS.map(d=>d[0])].map(R);
const CAP_T=[.2,1.6,3.5,5.85,7.6].map(R);

/* =====================================================================
   SCENES
   ===================================================================== */
const sc=$('stage').getContext('2d'),gc=$('grain').getContext('2d'),ui=$('ui');
let grainTile=null;const M={};

/* 0 – 0.95 s : FAKE CRASH — looks like the viewer's phone broke (pattern interrupt) */
function crash(c,u){
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  const f=Math.floor(u*30),r=mulberry32(f*131+7),j=f%2?1:-1;
  const sh=kf(u,[[0,150],[.9,70,'lin']])*(.7+.6*r());
  const g=(slot,col)=>glitch({slot,text:'NO\nSIGNAL',color:col,fringe:3,shear:sh,chaos:1,fs0:260,s:1.35,bw:800,bh:560,bo:f,padS:40});
  const cy=930,put=(cv,dx)=>c.drawImage(cv,(W-cv.width)/2+dx,cy-cv.height/2);
  c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.85;
  put(g('r','#ff2a2a'),16*j);put(g('b','#00e5ff'),-16*j);c.restore();
  if(!(u>.5&&r()<.25))put(g('w','#ffffff'),0);
  for(let k=0;k<7;k++){const y=r()*H,hh=14+r()*150,dx=(r()-.5)*(u<.12?420:260);c.drawImage($('stage'),0,y,W,hh,dx,y,W,hh);}
  c.fillStyle='#fff';for(let k=0;k<26;k++){c.globalAlpha=.1+r()*.35;c.fillRect(r()*W,r()*H,40+r()*340,2+r()*4);}c.globalAlpha=1;
  c.fillStyle='rgba(255,255,255,.07)';for(let y=0;y<H;y+=6)c.fillRect(0,y,W,2);
  mono(c,'CH 03 — NO SIGNAL',80,300,{size:28,ls:6,color:'#fff',alpha:r()<.2?.2:.85});
  mono(c,'PLEASE STAND BY',540,1500,{size:30,ls:10,align:'center',color:'#fff',alpha:.6});
  if(u<.06)flash(c,.55,'#fff');
}
/* 0.95 – 2.7 s : slam → the same glitch "heals" onto the defaults */
function drawHook(c,t){
  if(t<SL){crash(c,t);return;}
  const q=t-SL;c.fillStyle=BR.bg;c.fillRect(0,0,W,H);
  const a=15*Math.exp(-q*18);c.save();c.translate(Math.sin(t*210)*a,Math.cos(t*173)*a*.8);
  const cv=glitch({slot:'h',text:'GLITCH',color:BR.ink,fringe:Math.round(kf(t,HF)),shear:kf(t,HS),chaos:kf(t,HC)/100,fs0:250,s:1.35,bo:Math.floor(Math.min(t,HEAL1)*14),padS:40});
  c.drawImage(cv,(W-cv.width)/2,1090-cv.height/2);
  const st=stampAnim(q,.1);c.save();c.translate(540,478);c.scale(st.s,st.s);c.globalAlpha=st.a;if(st.blur>.4)c.filter=`blur(${st.blur}px)`;block(c,['Your phone','is fine.'],0,0,170,BR.ink);c.restore();
  mono(c,'NOT A BUG. A TEXT EFFECT.',540,272,{size:28,ls:8,align:'center',alpha:.7*prog(t,SL+.05,.2)});
  mono(c,'3 SLIDERS · ZERO AFTER EFFECTS',540,1420,{size:28,ls:6,align:'center',alpha:prog(t,1.75,.25,'o3')});
  c.restore();flash(c,.18*Math.exp(-q*30),'#000');
}
function drawOutro(c,t){
  c.fillStyle=BR.dk;c.fillRect(0,0,W,H);
  const q=t-Dr(.2);
  if(q>=0){const a=14*Math.exp(-q*20);c.save();c.translate(Math.sin(t*210)*a,Math.cos(t*173)*a*.8);
    const cv=glitch({slot:'o',text:'GLITCH\nSLICE',color:BR.dkInk,fringe:2,shear:kf(t,[[Dr(.2),130],[Dr(1.2),9,'o3']]),chaos:kf(t,[[Dr(.2),100],[Dr(1.2),30,'o3']])/100,fs0:200,s:1.3,bw:800,bh:600,bo:Math.floor(Math.min(t,Dr(1.2))*14),padS:40});
    c.drawImage(cv,(W-cv.width)/2,640-cv.height/2);c.restore();}
  const p1=prog(t,Dr(1.0),.55,'oexp');c.save();c.beginPath();c.rect(0,1060,W,100);c.clip();block(c,['Type your own.'],540,1110+(1-p1)*100,70,BR.dkInk);c.restore();
  mono(c,'GLITCH SLICE TEXT EFFECT',540,1215,{size:30,ls:lerp(18,8,prog(t,Dr(1.2),.6,'oexp')),align:'center',color:BR.dkInk,alpha:.85*prog(t,Dr(1.2),.6,'oexp')});
  mono(c,'CALLISTRA.DESIGN',540,1300,{size:44,ls:4,align:'center',color:BR.dkInk,alpha:prog(t,Dr(1.5),.4,'o3'),weight:700});
  const up=prog(t,Dr(1.6),.45,'oexp');c.save();c.strokeStyle=BR.red;c.lineWidth=5;c.beginPath();c.moveTo(540-290*up,1345);c.lineTo(540+290*up,1345);c.stroke();c.restore();
  mono(c,'LINK IN BIO',540,1405,{size:26,ls:6,align:'center',color:'#8c877e',alpha:prog(t,Dr(2.0),.4,'o3')});
  flash(c,q>=0?.12*Math.exp(-q*30):0,'#fff');
}

/* ---------- UI scene ---------- */
const uiCam=$('uiCam'),uiCanvas=$('uiCanvas'),uc=uiCanvas.getContext('2d'),tcx=$('toastCv').getContext('2d');
let uiKey='',rippleEls=[];
function off(el,root){let x=0,y=0,e=el;while(e&&e!==root){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}return{x,y,w:el.offsetWidth,h:el.offsetHeight};}
function measure(){const inner=$('uiInner');M.trk={f:off($('tF'),inner),s:off($('tS'),inner),c:off($('tC'),inner)};M.input=off($('uiTxt').parentNode,inner);M.btn=off($('btn'),inner);
  RIPPLES.forEach(()=>{const e=document.createElement('i');e.className='ripple';inner.appendChild(e);rippleEls.push(e);});}
const RNG={f:[1,40],s:[0,200],c:[0,100]};
const tp=(row,v)=>{const tr=M.trk[row],r=12,[mn,mx]=RNG[row];return[tr.x+r+(tr.w-2*r)*((v-mn)/(mx-mn)),tr.y+tr.h/2];};
function arc(a,b,p){const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),k=Math.sin(Math.PI*p)*d*.12;return[lerp(a[0],b[0],p)-dy/(d||1)*k,lerp(a[1],b[1],p)+dx/(d||1)*k];}
let SEG=null;
function buildSeg(){SEG=[
  {t0:R(.2),t1:R(.62),to:()=>[M.input.x+330,M.input.y+50]},
  {t0:R(1.4),t1:R(1.85),to:()=>tp('f',DEF.fringe)},{t0:R(1.9),t1:R(3.3),fn:t=>tp('f',kf(t,FR))},
  {t0:R(3.35),t1:R(3.75),to:()=>tp('s',DEF.shear)},{t0:R(3.8),t1:R(5.6),fn:t=>tp('s',kf(t,SH))},
  {t0:R(5.65),t1:R(5.95),to:()=>tp('c',DEF.chaos)},{t0:R(6.0),t1:R(7.5),fn:t=>tp('c',kf(t,CH))},
  {t0:R(7.6),t1:R(8.25),to:()=>[M.btn.x+M.btn.w/2,M.btn.y+M.btn.h/2]},
  {t0:R(9.3),t1:R(9.9),to:()=>[M.btn.x+M.btn.w-60,M.btn.y+M.btn.h+130]}];}

const dragRow=t=>{for(const d of DRAGS)if(t>=R(d[0])&&t<=R(d[1]))return d[2];return'';};
function captionUpdate(t){document.querySelectorAll('.capl').forEach((el,i)=>{const pin=prog(t,CAP_T[i],.4,'oexp'),pout=i<CAP_T.length-1?prog(t,CAP_T[i+1],.3,'i3'):0;el.style.transform=`translateY(${(1-pin)*100-pout*100}px)`;});}

function renderFrame(t){
  t=clamp(t,0,REEL.duration);sc.setTransform(1,0,0,1,0,0);sc.clearRect(0,0,W,H);
  const showUI=t>=W1_COVER&&t<W2_COVER;ui.style.display=showUI?'block':'none';
  if(t<W1_COVER)drawHook(sc,t);else if(showUI)updateUI(t);else if(t>=TAIL)crash(sc,t-TAIL);else drawOutro(sc,t);
  wipe(sc,t,W1_IN,BR.ink);wipe(sc,t,W2_IN,BR.red);
  const f=Math.floor(t*REEL.fps+.001),ox=(f*97)%512,oy=(f*57)%512;
  gc.clearRect(0,0,W,H);for(let x=-ox;x<W;x+=512)for(let y=-oy;y<H;y+=512)gc.drawImage(grainTile,x,y);

window.renderFrame=renderFrame;

/* =====================================================================
   SOUND — Web Audio, rendered offline
   ===================================================================== */
async function buildAudio(){
  const SR=44100,DUR=REEL.duration,oc=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR),rand=mulberry32(7);
  const nb=oc.createBuffer(1,SR*3,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rand()*2-1;}
  const master=oc.createGain();master.gain.setValueAtTime(.72,0);master.gain.setValueAtTime(.72,DUR-.1);master.gain.linearRampToValueAtTime(0,DUR-.01);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=12;comp.ratio.value=10;comp.attack.value=.002;comp.release.value=.12;
  master.connect(comp);comp.connect(oc.destination);
  const rl=Math.floor(SR*1.8),ir=oc.createBuffer(2,rl,SR);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rand()*2-1)*Math.pow(1-i/rl,3.2);}
  const conv=oc.createConvolver();conv.buffer=ir;const revIn=oc.createGain(),revLp=oc.createBiquadFilter(),revOut=oc.createGain();revLp.type='lowpass';revLp.frequency.value=5000;revOut.gain.value=.5;
  revIn.connect(conv);conv.connect(revLp);revLp.connect(revOut);revOut.connect(master);
  const out=(g,o={})=>{let n=g;if(o.pan){const p=oc.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p;}n.connect(master);if(o.rev>0){const s=oc.createGain();s.gain.value=o.rev;n.connect(s);s.connect(revIn);}};
  const env=(p,t,pk,a,d)=>{p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(pk,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);};
  const nsrc=(t,d,seed)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,(Math.abs(seed)*.37)%2);s.stop(t+d);return s;};
  const flt=(type,f,q=1)=>{const b=oc.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const osc=(type,f,t,d)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+d);return o;};
  const thud=(t,g=.6)=>{const o=osc('sine',170,t,.45);o.frequency.exponentialRampToValueAtTime(44,t+.2);const og=oc.createGain();env(og.gain,t,g,.003,.32);o.connect(og);out(og,{rev:.18});
    const n=nsrc(t,.14,t*13.7),bp=flt('bandpass',950,.9),ng=oc.createGain();env(ng.gain,t,g*.7,.001,.075);n.connect(bp);bp.connect(ng);out(ng,{rev:.12});
    const c=nsrc(t,.04,t*3.1),hp=flt('highpass',3500),cg=oc.createGain();env(cg.gain,t,g*.45,.0005,.012);c.connect(hp);hp.connect(cg);out(cg);};
  const boom=(t,g)=>{const o=osc('sine',100,t,1.2);o.frequency.exponentialRampToValueAtTime(28,t+.9);const og=oc.createGain();env(og.gain,t,g,.004,1.0);o.connect(og);out(og,{rev:.35});};
  const tick=(t,f=1200,g=.2,pan=0)=>{const o=osc('triangle',f,t,.08),gn=oc.createGain();env(gn.gain,t,g,.001,.05);o.connect(gn);out(gn,{pan,rev:.08});};
  const key=(t,i)=>{const n=nsrc(t,.03,t*5.3),hp=flt('highpass',1800),g1=oc.createGain();env(g1.gain,t,.22,.0008,.012);n.connect(hp);hp.connect(g1);out(g1,{pan:i%2?.1:-.1});const o=osc('sine',190+(i%3)*14,t,.06),g2=oc.createGain();env(g2.gain,t,.12,.001,.03);o.connect(g2);out(g2);};
  const clk=(t,g,f)=>{const n=nsrc(t,.03,t*9.1),bp=flt('bandpass',f,1.2),gn=oc.createGain();env(gn.gain,t,g,.0006,.007);n.connect(bp);bp.connect(gn);out(gn);};
  const click=(t,g=.3)=>{clk(t,g,2800);clk(t+.075,g*.6,2000);};
  const whoosh=(t,d,o={})=>{const{g=.3,up=true,f0=250,f1=5200}=o;const n=nsrc(t,d,t*7.3),bp=flt('bandpass',1,1.1);bp.frequency.setValueAtTime(up?f0:f1,t);bp.frequency.exponentialRampToValueAtTime(up?f1:f0,t+d);
    const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+d*(up?.7:.3));gn.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(bp);bp.connect(gn);
    const p=oc.createStereoPanner();p.pan.setValueAtTime(up?-.7:.7,t);p.pan.linearRampToValueAtTime(up?.7:-.7,t+d);gn.connect(p);out(p,{rev:.15});};
  const chime=t=>{[[659.25,0],[987.77,.09]].forEach(([f,d])=>{[[1,.2],[2,.05],[3,.02]].forEach(([m,a])=>{const o=osc('sine',f*m,t+d,1.6),gn=oc.createGain();env(gn.gain,t+d,a,.004,1.3);o.connect(gn);out(gn,{rev:.55});});});};

  const zap=(t,g=.2)=>{const o=osc('sawtooth',2400,t,.2);o.frequency.exponentialRampToValueAtTime(90,t+.14);const gn=oc.createGain(),bp=flt('bandpass',1800,.8);env(gn.gain,t,g,.001,.12);o.connect(bp);bp.connect(gn);out(gn,{rev:.1});stat(t,.09,g*.8);};

  sliderTicks(t=>kf(t,HS),SL+.05,HEAL1,5,700,.05);chime(HEAL1+.02);

  click(R(8.3));for(let k=0;k<9;k++)tick(R(8.35)+k*.05,1600+k*60,.07,0);whoosh(R(8.7),.3,{g:.1,f0:600,f1:3000});chime(R(8.8));

  sliderTicks(t=>kf(t,[[Dr(.2),130],[Dr(1.2),9,'o3']]),Dr(.25),Dr(1.2),6,700,.04);

  for(let t=TAIL;t<DUR;t+=.03)if(rand()>.35)stat(t,.025,.18,rand()*1.6-.8);beep(TAIL,.3,1000,.08);zap(TAIL,.22);

}
let audioP=null;const getAudio=()=>audioP||(audioP=buildAudio());
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate,data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=peak>.89?.89/peak:1,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}

window.renderAudio=async()=>toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER (normal browser only) + BOOT
   ===================================================================== */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');pl.hidden=false;rg.max=REEL.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s';};
  function loop(){if(!playing)return;cur=base+(performance.now()-started)/1000;if(cur>=REEL.duration){show(REEL.duration);pause();btn.textContent='REPLAY';cur=0;return;}show(cur);requestAnimationFrame(loop);}
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){btn.textContent='PREPARING SOUND…';if(!buf)buf=await getAudio();if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();}
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}
async function boot(){
  try{
    const lat="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([document.fonts.load('400 100px "Instrument Serif"',lat),document.fonts.load('italic 400 100px "Instrument Serif"',lat),
      document.fonts.load('500 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,/·▾＋－—'),document.fonts.load('700 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ.')]).catch(()=>{});
    await document.fonts.ready;
    const rnd=mulberry32(5);grainTile=mk(512,512);const g=grainTile.getContext('2d'),id=g.createImageData(512,512);
    for(let i=0;i<512*512;i++){const v=rnd()*255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}g.putImageData(id,0,0);
    ui.style.display='block';measure();ui.style.display='none';buildSeg();
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e);}
}
window.addEventListener('load',boot);
})();
