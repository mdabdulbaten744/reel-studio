<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinetic Flowfield Text Effect Maker — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--ink:#f0eee9;--muted:#8c877e;--line:rgba(240,238,233,.16);--canvas:#141414;--chk1:#1a1a1a;--chk2:#101010;--accent:#FF5B2E;--disp:'Barlow Semi Condensed',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;isolation:isolate}
#viewport>*{position:absolute;left:0;top:0}
#ui{width:1080px;height:1920px;background:var(--bg);display:none;z-index:1;overflow:hidden;font-family:var(--mono);color:var(--ink)}
#stage,#grain{width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.09;pointer-events:none}
#vig{z-index:4;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(115% 82% at 50% 47%,rgba(0,0,0,0) 52%,rgba(0,0,0,.46) 100%)}

#uiCam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#uiInner{position:absolute;left:110px;top:0;width:800px;padding-top:340px}
.canvas-container{position:relative;width:800px;height:400px;background-color:var(--canvas);background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:24px 24px;border-radius:3px;overflow:hidden}
.canvas-container canvas{width:100%;height:100%;display:block}
.text-input{margin-top:24px;height:104px;border-bottom:2px solid var(--ink);font-family:var(--disp);font-weight:900;font-size:90px;line-height:1.1;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center;text-transform:uppercase}
.text-input .sel{background:rgba(36,110,255,.38)}
#uiCaret{display:inline-block;width:4px;height:74px;background:var(--ink);margin-left:3px}
.row{margin-top:24px}
.row-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab{display:flex;align-items:center;gap:12px}
.lab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.85;flex-shrink:0}
.val{color:var(--ink);font-size:24px;letter-spacing:0;border-bottom:2px dashed var(--muted);min-width:56px;text-align:right}
.track{position:relative;height:3px;background:var(--line);margin:26px 0 8px}
.thumb{position:absolute;top:50%;left:0;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.adv{margin-top:30px;border-top:2px solid var(--line);padding-top:20px}
.sum{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.adv-body{overflow:hidden;height:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 34px;padding-top:24px;padding-bottom:4px}
.color-sel{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);padding:10px 0 8px;margin-top:12px}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff}
.dd{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:14px 0 10px;border-bottom:2px solid var(--line);font-family:var(--mono);font-size:22px;color:var(--ink)}
.btn{margin-top:30px;height:88px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--mono);font-weight:500;font-size:23px;letter-spacing:.12em;border-radius:2px}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
#cursor{position:absolute;left:0;top:0;width:60px;height:60px;z-index:50;pointer-events:none;transform-origin:10px 5px;opacity:0;filter:drop-shadow(0 5px 8px rgba(0,0,0,.55))}
.ripple{position:absolute;width:96px;height:96px;border:4px solid var(--accent);border-radius:50%;opacity:0;z-index:49;pointer-events:none}
#capMask{position:absolute;left:0;top:0;width:1080px;height:336px;background:var(--bg);z-index:5}
#brand{position:absolute;left:110px;top:170px;font-family:var(--mono);font-weight:500;font-size:24px;letter-spacing:.14em;color:var(--muted)}
#cap{position:absolute;left:110px;top:226px;width:800px;height:96px;overflow:hidden}
.capl{position:absolute;left:0;top:0;height:96px;display:flex;align-items:center;gap:22px;font-family:var(--disp);font-weight:900;font-size:76px;line-height:96px;white-space:nowrap;text-transform:uppercase;color:var(--ink)}
.capl b{font-family:var(--mono);font-weight:500;font-size:26px;color:var(--accent);letter-spacing:.1em}
#toast{position:absolute;left:130px;top:760px;width:780px;height:220px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:34px;padding:26px;border-radius:4px;opacity:0;z-index:20;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#toastCv{width:320px;height:160px;flex-shrink:0;border-radius:2px;background-color:#141414;background-image:conic-gradient(#1a1a1a .25turn,#101010 .25turn .5turn,#1a1a1a .5turn .75turn,#101010 .75turn);background-size:22px 22px}
#toast .tt{display:flex;flex-direction:column;gap:12px;font-family:var(--mono)}
#toast .tt b{font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#toast .tt span{font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#736e65}

#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <div id="ui">
    <div id="uiCam">
      <div id="uiInner">
        <div id="pvWrap">
          <div class="canvas-container"><canvas id="uiCanvas" width="1200" height="600"></canvas></div>
          <div class="text-input" id="uiTextBox"><span id="uiTxt"></span><i id="uiCaret"></i></div>
        </div>
        <div id="ctlWrap">
          <div class="row">
            <div class="row-h">
              <span class="lab"><svg viewBox="0 0 24 24"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>Turbulence</span>
              <span class="val" id="vTurb">26%</span>
            </div>
            <div class="track" id="trkTurb"><i class="thumb" id="thTurb"></i></div>
          </div>
          <div class="row">
            <div class="row-h">
              <span class="lab"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Current Strength</span>
              <span class="val" id="vStr">26px</span>
            </div>
            <div class="track" id="trkStr"><i class="thumb" id="thStr"></i></div>
          </div>
          <div class="adv">
            <div class="sum" id="advSum"><span>Color and Size</span><span id="advSign">＋</span></div>
            <div class="adv-body" id="advBody"><div class="grid">
              <div>
                <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Size</span><span class="val" id="vSize">140px</span></div>
                <div class="track" id="trkSize"><i class="thumb" id="thSize"></i></div>
              </div>
              <div>
                <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>Color</span></div>
                <div class="color-sel"><i class="swatch" id="swatch"></i><span class="val" id="vColor" style="border:0;font-size:22px">#FFFFFF</span></div>
              </div>
              <div>
                <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Custom Font</span></div>
                <div class="dd"><span>Upload Font</span></div>
              </div>
              <div>
                <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Export Size</span></div>
                <div class="dd" id="ddExp"><span id="vExp">4x</span><span style="color:var(--muted)">▾</span></div>
              </div>
            </div></div>
          </div>
          <div class="btn" id="btn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span id="btnLabel">DOWNLOAD PNG</span></div>
        </div>
        <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.2 20.4 L11.3 13.7 L17.5 13.4 Z" fill="#fff" stroke="#121212" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="capMask"><div id="brand">CALLISTRA.DESIGN</div><div id="cap">
      <div class="capl"><b>01</b><span>Type anything</span></div>
      <div class="capl"><b>02</b><span>Bend turbulence</span></div>
      <div class="capl"><b>03</b><span>Set the current</span></div>
      <div class="capl"><b>04</b><span>Color &amp; size</span></div>
      <div class="capl"><b>05</b><span>Download the PNG</span></div>
    </div></div>
    <div id="toast"><canvas id="toastCv" width="320" height="160"></canvas><div class="tt"><b>kinetic-flowfield-8x.png</b><span>Transparent PNG · Ready</span></div></div>
  </div>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="24" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   ENGINE (reusable)
   ===================================================================== */
const REEL={width:1080,height:1920,fps:30,duration:24,poster:1.75};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const $=id=>document.getElementById(id);
const W=1080,H=1920,PI=Math.PI;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const EASE={
  lin:p=>p,i2:p=>p*p,i3:p=>p*p*p,o2:p=>1-(1-p)*(1-p),o3:p=>1-Math.pow(1-p,3),
  io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oexp:p=>p>=1?1:1-Math.pow(2,-10*p),
  oback:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
function kf(t,pts){
  if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){
    if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*EASE[b[2]||'io3']((t-a[0])/(b[0]-a[0]));}
  }
  return pts[pts.length-1][1];
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const hex2=n=>Math.round(n).toString(16).padStart(2,'0');
function mixHex(a,b,p){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return'#'+pa.map((v,i)=>hex2(lerp(v,pb[i],p))).join('');}

const BR={bg:'#0d0d0d',cream:'#f0eee9',paper:'#f7f5f0',ink:'#121212',muted:'#8c877e',accent:'#FF5B2E'};
const DISP='"Barlow Semi Condensed",sans-serif';
const MONO='"JetBrains Mono",ui-monospace,monospace';

function mono(c,txt,x,y,o={}){
  const{size=28,ls=0,align='left',color=BR.cream,alpha=1,weight=500}=o;
  if(alpha<=0)return;
  c.save();c.font=`${weight} ${size}px ${MONO}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';
  c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;
  let xx=x;
  if(align==='center'){c.textAlign='center';xx=x+ls/2;}else if(align==='right'){c.textAlign='right';xx=x+ls;}else c.textAlign='left';
  c.fillText(txt,xx,y);c.restore();
}
function disp(c,txt,x,y,o={}){
  const{size=96,ls=0,align='center',color=BR.cream,alpha=1,weight=900}=o;
  if(alpha<=0)return;
  c.save();c.font=`${weight} ${size}px ${DISP}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';
  c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;c.textAlign=align;
  c.fillText(txt,align==='center'?x+ls/2:x,y);c.restore();
}
/* deterministic handheld drift, max ~3px */
const hh=(t,s)=>Math.sin(t*1.3+s)*1.5+Math.sin(t*2.9+s*2.1)*.9+Math.sin(t*.7+s*3.3)*.6;
function flash(c,a,col){if(a>.005){c.save();c.globalAlpha=Math.min(1,a);c.fillStyle=col;c.fillRect(0,0,W,H);c.restore();}}
function streak(c,y,a,col){
  if(a<.01)return;
  c.save();c.globalCompositeOperation='lighter';
  const g=c.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'rgba(255,91,46,0)');g.addColorStop(.5,col);g.addColorStop(1,'rgba(255,91,46,0)');
  c.fillStyle=g;
  c.globalAlpha=Math.min(1,a);c.fillRect(0,y-2,W,4);
  c.globalAlpha=Math.min(1,a*.38);c.fillRect(0,y-10,W,20);
  c.globalAlpha=Math.min(1,a*.14);c.fillRect(0,y-34,W,68);
  c.restore();
}
function camApply(c,cam,par=1){
  c.translate(540+cam.dx*par,900+cam.dy*par);c.rotate(cam.rot*par*PI/180);
  const z=1+(cam.z-1)*par;c.scale(z,z);c.translate(-540,-900);
}
function layer(c,cam,par,fn){c.save();camApply(c,cam,par);fn();c.restore();}
const mkCam=(z=1,rot=0,dx=0,dy=0)=>({z,rot,dx,dy});

/* =====================================================================
   THE APP'S OWN ALGORITHM (Perlin flowfield, same table, same walk)
   ===================================================================== */
const Perlin={
  p:new Uint8Array(512),
  init:function(){
    const permutation=[151,160,137,91,90,15,
    131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
    190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,
    88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,
    77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,
    102,143,54,65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,
    135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,
    5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,
    223,183,170,213,119,248,152, 2,44,145,31,179,228,165,55,110,178,224,183,225,
    40,242,172,239,249,14,236,97,21,50,45,127,4,150,254,138,209,204,184,218,61,
    84,121,98,223,34,39,176,155,51,193,113,70,213,9,144,3,180,243,108,181,241,
    251,114,238,205,107,177,157,167,115,195,192,67,69,215,128,1,214,141,93,246,
    24,185,199,147,22,66,129,222,61,191,101,43,210,106,41,253,153,112,149,154,
    156,127,152,78,162,171,81,21,120,207,11,104,221,58,18,24,206,24,242,123];
    for(let i=0;i<256;i++){this.p[256+i]=this.p[i]=permutation[i%permutation.length];}
  },
  fade:function(t){return t*t*t*(t*(t*6-15)+10);},
  lerp:function(t,a,b){return a+t*(b-a);},
  grad:function(hash,x,y){const h=hash&7,u=h<4?x:y,v=h<4?y:x;return((h&1)===0?u:-u)+((h&2)===0?v:-v);},
  noise:function(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    x-=Math.floor(x);y-=Math.floor(y);
    const u=this.fade(x),v=this.fade(y);
    const A=this.p[X]+Y,B=this.p[X+1]+Y;
    return this.lerp(v,this.lerp(u,this.grad(this.p[A],x,y),this.grad(this.p[B],x-1,y)),
                       this.lerp(u,this.grad(this.p[A+1],x,y-1),this.grad(this.p[B+1],x-1,y-1)));
  }
};
Perlin.init();

/* exact port of renderToCanvas: fit, 2px grid sample, 8-step walk, dot radius. Used for the live UI preview and cached outputs. */
function flowCanvas(o){
  const{text,color,turb,S,fs,scale=1,bw=800,bh=400}=o;
  if(!text)return null;
  const TW=Math.round(bw*scale),TH=Math.round(bh*scale);
  const off=mkCanvas(TW,TH),oc=off.getContext('2d',{willReadFrequently:true});
  const lines=text.split('\n'),sS=S*scale,pad=sS+40*scale,ref=100*scale;
  oc.font=`900 ${ref}px ${DISP}`;
  let mw=1;lines.forEach(l=>{mw=Math.max(mw,oc.measureText(l).width);});
  const rth=lines.length*(ref*1.1),aw=Math.max(10*scale,TW-pad),ah=Math.max(10*scale,TH-pad);
  const calc=Math.min(aw*ref/mw,ah*ref/rth);
  const f=Math.max(10*scale,Math.min(fs*scale,calc));
  oc.font=`900 ${f}px ${DISP}`;oc.textAlign='center';oc.textBaseline='middle';oc.fillStyle=color;
  const lh=f*1.1,th=lines.length*lh,sy=TH/2-th/2+lh/2;
  lines.forEach((l,i)=>oc.fillText(l,TW/2,sy+i*lh));
  const buf=new Uint32Array(oc.getImageData(0,0,TW,TH).data.buffer);
  const out=mkCanvas(TW,TH),c=out.getContext('2d');
  const step=Math.max(2,Math.round(2*scale)),ns=(.002*(Math.max(1,turb)/20))/scale,r=Math.max(.75,1*scale);
  const sd=sS/8;
  c.fillStyle=color;c.beginPath();
  for(let y=0;y<TH;y+=step){const ro=y*TW;for(let x=0;x<TW;x+=step){
    if(buf[ro+x]===0)continue;
    let px=x,py=y;
    for(let s=0;s<8;s++){const a=Perlin.noise(px*ns,py*ns)*PI*4;px+=Math.cos(a)*sd;py+=Math.sin(a)*sd;}
    c.moveTo(px+r,py);c.arc(px,py,r,0,PI*2);
  }}
  c.fill();
  return out;
}

/* sampled dot set (same fit and 2px grid, in app space 800x400) for fast cinematic playback */
function buildSet(text,fs){
  const bw=800,bh=400,cv=mkCanvas(bw,bh),oc=cv.getContext('2d',{willReadFrequently:true});
  const lines=text.split('\n'),ref=100,pad=26+40;
  oc.font=`900 ${ref}px ${DISP}`;
  let mw=1;lines.forEach(l=>{mw=Math.max(mw,oc.measureText(l).width);});
  const rth=lines.length*ref*1.1,aw=Math.max(10,bw-pad),ah=Math.max(10,bh-pad);
  const f=Math.max(10,Math.min(fs,Math.min(aw*ref/mw,ah*ref/rth)));
  oc.font=`900 ${f}px ${DISP}`;oc.textAlign='center';oc.textBaseline='middle';oc.fillStyle='#000';
  const lh=f*1.1,th=lines.length*lh,sy=bh/2-th/2+lh/2;
  lines.forEach((l,i)=>oc.fillText(l,bw/2,sy+i*lh));
  const buf=new Uint32Array(oc.getImageData(0,0,bw,bh).data.buffer);
  const xa=[],ya=[];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let y=0;y<bh;y+=2){for(let x=0;x<bw;x+=2){if(buf[y*bw+x]!==0){xa.push(x);ya.push(y);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}}
  const n=xa.length,xs=new Float32Array(xa),ys=new Float32Array(ya),nx=new Float32Array(n);
  for(let i=0;i<n;i++)nx[i]=(xs[i]-x0)/Math.max(1,x1-x0);

const TMP=new Float32Array(2*70000),TMP2=new Float32Array(2*70000),SARR=new Float32Array(70000);
function flowTraj(set,S,ns,toff,out,Sarr,add){

function plotPts(c,out,n,k,ox,oy,r,color,alpha,comp,gx,gy){

  }

}
/* draw a dot set displaced by strength S. trails/ghosts add motion blur, glow adds halation */
function drawFlow(c,set,S,o){
  const{k,ox,oy,turb,color,alpha=1,toff=0,trails=null,glow=0,ghosts=null,Sarr=null}=o;
  const r=o.r||k,ns=.0001*turb;
  if(trails)for(const tr of trails){
    flowTraj(set,S+tr[0],ns,toff,TMP2,Sarr,tr[0]);
    plotPts(c,TMP2,set.n,k,ox,oy,r,tr[2],tr[1]*alpha);
  }
  flowTraj(set,S,ns,toff,TMP,Sarr,0);
  if(ghosts)for(const g of ghosts)plotPts(c,TMP,set.n,k,ox,oy,r,color,g[2]*alpha,null,g[0],g[1]);

const fitK=(set,wpx,mx=2.2)=>Math.min(mx,wpx/Math.max(1,set.w));

/* ambient flow-field: seeded dust riding streamlines of the same noise */
function drawField(c,t,i0,i1,o){
  const ns=.0013,toff=t*.04,L=560;
  for(let cls=0;cls<2;cls++){
    c.save();c.globalAlpha=cls?o.a*.9:o.a;c.fillStyle=cls?BR.accent:o.col||BR.cream;c.beginPath();
    for(let i=i0;i<i1;i++){
      if(fcls[i]!==cls)continue;
      const fr=(t*fv[i]+fph[i])%1,Si=fr*L,sd=Si/8,rr=fsz[i]*o.rs*Math.sin(PI*fr);
      if(rr<.12)continue;
      let px=fx[i],py=fy[i];
      for(let s=0;s<8;s++){const a=Perlin.noise(px*ns+toff,py*ns)*PI*4;px+=Math.cos(a)*sd;py+=Math.sin(a)*sd;}
      if(px<-60||px>W+60||py<-60||py>H+60)continue;
      c.moveTo(px+rr,py);c.arc(px,py,rr,0,6.2832);
    }
    c.fill();c.restore();
  }
}
function drawBokeh(c,t,mul=1){
  c.save();c.globalCompositeOperation='lighter';
  for(const b of bokeh){
    const x=((b.x+b.vx*t)%1260+1260)%1260-90,y=((b.y+b.vy*t)%2100+2100)%2100-90,s=b.s*(1+.05*Math.sin(t*1.3+b.ph));
    c.globalAlpha=b.a*mul;c.drawImage(b.e?bokSprE:bokSpr,x-s/2,y-s/2,s,s);
  }
  c.restore();
}
function haze(c,t,a,x=540,y=860){
  const g=c.createRadialGradient(x,y,0,x,y,1050);const k=a*(.8+.2*Math.sin(t*2.3));
  g.addColorStop(0,`rgba(255,91,46,${k})`);g.addColorStop(.55,`rgba(255,91,46,${k*.25})`);g.addColorStop(1,'rgba(255,91,46,0)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}
function grade(c,a=.2){
  c.save();c.globalCompositeOperation='soft-light';
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,`rgba(40,70,120,${a})`);g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(255,110,50,${a*1.2})`);
  c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
}
function maskRise(c,y0,h,p,fn){c.save();c.beginPath();c.rect(0,y0,W,h);c.clip();c.translate(0,(1-p)*h*.9);fn();c.restore();}

/* =====================================================================
   0 – 2.0 s : THE HOOK  (a swarm of dust becomes a word)
   ===================================================================== */
const hookS=t=>{
  if(t<IMP){const u=clamp(t/(IMP-.05));return 26+400*Math.pow(1-u,2.4);}
  const q=t-IMP;return 26-22*Math.exp(-q*9)*Math.cos(q*38)+2.2*Math.sin(t*4.1);
};
function hookCam(t){
  const q=t-IMP,sh=q>=0?18*Math.exp(-q*16):0;
  const z=kf(t,[[0,1.5],[IMP-.05,1.02,'o3'],[M0,1.07,'io3']])+(q>=0?.06*Math.exp(-q*14):0);
  const rot=kf(t,[[0,-5],[IMP-.05,1,'o3'],[M0,0,'io3']]);
  return mkCam(z,rot,hh(t,1)+Math.sin(t*210)*sh,hh(t,5)+Math.cos(t*173)*sh*.8);
}
function drawHook(c,t){
  c.fillStyle=BR.bg;c.fillRect(0,0,W,H);
  const q=t-IMP,cam=hookCam(t);
  haze(c,t,.11);
  layer(c,cam,.4,()=>drawField(c,t,0,FN1,{rs:.95,a:.5}));
  layer(c,cam,.75,()=>drawField(c,t,FN1,FN,{rs:1.5,a:.75}));
  const k=fitK(HOOK,940,1.9),ox=540-HOOK.cx*k,oy=900-HOOK.cy*k;
  const S=hookS(t),rate=(S-hookS(t-.033))/.033;
  c.save();camApply(c,cam,1);
  const rr=Math.min(60,Math.abs(rate))*.0155;
  drawFlow(c,HOOK,S,{k,ox,oy,turb:17,color:BR.cream,toff:t*.05,glow:.1,glowColor:BR.accent,
    trails:[[-rate*.016,.55,BR.accent],[-rate*.034,.3,BR.accent],[-rate*.06,.15,BR.cream]].map(a=>[a[0]*(1+rr*0),a[1],a[2]])});
  c.restore();
  layer(c,cam,1.8,()=>drawBokeh(c,t,1));
  grade(c,.18);
  /* copy: the open loop, then the answer */
  const sx=q>=0?Math.sin(t*210)*14*Math.exp(-q*16):0,sy=q>=0?Math.cos(t*173)*11*Math.exp(-q*16):0;
  c.save();c.translate(sx,sy);

  }else{

/* =====================================================================
   2.0 – 4.0 s : MONTAGE (six subjects, cuts accelerate .5 → .25)
   ===================================================================== */
function montCam(i,p){
  switch(i){
    case 0:return mkCam(1+.14*EASE.o2(p),0,0,0);
    case 1:return mkCam(1.22-.22*EASE.o3(p),6*(1-EASE.o3(p)),0,0);
    case 2:return mkCam(1.05,0,-480*(1-EASE.o3(clamp(p*1.25))),0);
    case 3:return mkCam(1.1-.05*p,0,0,260*(1-EASE.o3(p)));
    case 4:return mkCam(1.04+.05*p,-9+12*EASE.io3(p),0,0);
    default:return mkCam(.86+.14*EASE.oback(clamp(p*1.15)),0,0,0);
  }
}
function drawMontage(c,t){

/* =====================================================================

/* =====================================================================
   SOUND — a film mix, synthesised offline. A in minor, 120 BPM.
   ===================================================================== */
async function buildAudio(){
  const SR=44100,DUR=REEL.duration;
  const oc=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const rand=mulberry32(7);
  const nb=oc.createBuffer(1,SR*3,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rand()*2-1;}
  const master=oc.createGain();master.gain.setValueAtTime(.85,0);master.gain.setValueAtTime(.85,DUR-.5);master.gain.linearRampToValueAtTime(0,DUR-.03);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.14;
  master.connect(comp);comp.connect(oc.destination);
  const rl=Math.floor(SR*2.6),ir=oc.createBuffer(2,rl,SR);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rand()*2-1)*Math.pow(1-i/rl,3);}
  const conv=oc.createConvolver();conv.buffer=ir;
  const revIn=oc.createGain(),revLp=oc.createBiquadFilter(),revOut=oc.createGain();
  revLp.type='lowpass';revLp.frequency.value=4500;revOut.gain.value=.55;
  revIn.connect(conv);conv.connect(revLp);revLp.connect(revOut);revOut.connect(master);
  const bed=oc.createGain();bed.connect(master);
  const BASE=.55,duck=[];

  const out=(g,o={})=>{let n=g;
    if(o.pan){const p=oc.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p;}
    n.connect(o.bed?bed:master);
    if(o.rev>0){const s=oc.createGain();s.gain.value=o.rev;n.connect(s);s.connect(revIn);}
  };
  const env=(p,t,peak,a,d)=>{p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(peak,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);};
  const nsrc=(t,dur,seed)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,(Math.abs(seed)*.37)%2,undefined);s.stop(t+dur);return s;};
  const flt=(type,f,q=1)=>{const b=oc.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const osc=(type,f,t,dur)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;};

  /* ---- building blocks ---- */
  const impact=(t,g=1)=>{
    const s=osc('sine',120,t,1.3);s.frequency.exponentialRampToValueAtTime(30,t+.9);
    const sg=oc.createGain();env(sg.gain,t,g*.9,.004,1.1);s.connect(sg);out(sg,{rev:.25});
    const b=osc('sine',190,t,.5);b.frequency.exponentialRampToValueAtTime(52,t+.22);
    const bg=oc.createGain();env(bg.gain,t,g*.7,.003,.34);b.connect(bg);out(bg,{rev:.2});
    const n=nsrc(t,.2,t*13.7),bp=flt('bandpass',1100,.8),ng=oc.createGain();env(ng.gain,t,g*.75,.001,.12);n.connect(bp);bp.connect(ng);out(ng,{rev:.35});
    const c=nsrc(t,.05,t*3.1),hp=flt('highpass',4200),cg=oc.createGain();env(cg.gain,t,g*.5,.0005,.014);c.connect(hp);hp.connect(cg);out(cg);
    const tl=nsrc(t,1.8,t*2.7),lp=flt('lowpass',3200),tg=oc.createGain();env(tg.gain,t,g*.28,.01,1.5);tl.connect(lp);lp.connect(tg);out(tg,{rev:.9});
  };
  const thud=(t,g=.5)=>{
    const o=osc('sine',170,t,.4);o.frequency.exponentialRampToValueAtTime(46,t+.18);
    const og=oc.createGain();env(og.gain,t,g,.003,.28);o.connect(og);out(og,{rev:.15});
    const n=nsrc(t,.1,t*9.7),bp=flt('bandpass',900,.9),ng=oc.createGain();env(ng.gain,t,g*.6,.001,.06);n.connect(bp);bp.connect(ng);out(ng,{rev:.1});
  };
  const tick=(t,f=1200,g=.2,pan=0)=>{const o=osc('triangle',f,t,.08),gn=oc.createGain();env(gn.gain,t,g,.001,.05);o.connect(gn);out(gn,{pan,rev:.1});};
  const key=(t,i)=>{
    const n=nsrc(t,.03,t*5.3),hp=flt('highpass',1800),g1=oc.createGain();env(g1.gain,t,.22,.0008,.012);n.connect(hp);hp.connect(g1);out(g1,{pan:i%2?.1:-.1});
    const o=osc('sine',190+(i%3)*14,t,.06),g2=oc.createGain();env(g2.gain,t,.12,.001,.03);o.connect(g2);out(g2);
  };
  const clk=(t,g,f)=>{const n=nsrc(t,.03,t*9.1),bp=flt('bandpass',f,1.2),gn=oc.createGain();env(gn.gain,t,g,.0006,.007);n.connect(bp);bp.connect(gn);out(gn);};
  const click=(t,g=.3)=>{clk(t,g,2800);clk(t+.075,g*.6,2000);};
  const whoosh=(t,dur,o={})=>{
    const{g=.3,up=true,f0=250,f1=5200}=o;
    const n=nsrc(t,dur,t*7.3),bp=flt('bandpass',1,1.1);
    bp.frequency.setValueAtTime(up?f0:f1,t);bp.frequency.exponentialRampToValueAtTime(up?f1:f0,t+dur);
    const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+dur*(up?.7:.3));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(bp);bp.connect(gn);
    const p=oc.createStereoPanner();p.pan.setValueAtTime(o.dir||(up?-.7:.7),t);p.pan.linearRampToValueAtTime(-(o.dir||(up?-.7:.7)),t+dur);gn.connect(p);out(p,{rev:.2});
  };
  const riser=(t0,t1,g,f1=6000)=>{
    const n=nsrc(t0,t1-t0,3.3),bp=flt('bandpass',1,2.5);
    bp.frequency.setValueAtTime(260,t0);bp.frequency.exponentialRampToValueAtTime(f1,t1);
    const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t1-.04);gn.gain.linearRampToValueAtTime(0,t1);
    n.connect(bp);bp.connect(gn);out(gn,{rev:.15});
    const o=osc('sawtooth',180,t0,t1-t0+.02);o.frequency.exponentialRampToValueAtTime(1400,t1);
    const lp=flt('lowpass',1,.7);lp.frequency.setValueAtTime(300,t0);lp.frequency.exponentialRampToValueAtTime(5000,t1);
    const og=oc.createGain();og.gain.setValueAtTime(.0001,t0);og.gain.exponentialRampToValueAtTime(g*.35,t1-.04);og.gain.linearRampToValueAtTime(0,t1);
    o.connect(lp);lp.connect(og);out(og,{rev:.2});
  };
  const downlift=(t,dur,g)=>{
    const n=nsrc(t,dur,t*1.9),bp=flt('bandpass',1,2);
    bp.frequency.setValueAtTime(5200,t);bp.frequency.exponentialRampToValueAtTime(240,t+dur);
    const gn=oc.createGain();env(gn.gain,t,g,.02,dur);n.connect(bp);bp.connect(gn);out(gn,{rev:.3,pan:.2});
  };
  const glide=(t,dur,f0,f1,g,type='sine')=>{const o=osc(type,f0,t,dur+.05);o.frequency.exponentialRampToValueAtTime(f1,t+dur);const gn=oc.createGain();env(gn.gain,t,g,.01,dur);o.connect(gn);out(gn,{rev:.25});};
  const chime=(t)=>{[[659.25,0],[987.77,.09],[1318.5,.18]].forEach(([f,d])=>{
    [[1,.18],[2,.05],[3,.02]].forEach(([m,a])=>{const o=osc('sine',f*m,t+d,1.8),gn=oc.createGain();env(gn.gain,t+d,a,.004,1.5);o.connect(gn);out(gn,{rev:.6});});
  });};
  const wind=(t0,t1,g)=>{
    const n=nsrc(t0,t1-t0,6.1),bp=flt('bandpass',1,.9);
    bp.frequency.setValueAtTime(2600,t0);bp.frequency.exponentialRampToValueAtTime(650,t1);
    const lfo=osc('sine',5.5,t0,t1-t0),lg=oc.createGain();lg.gain.value=380;lfo.connect(lg);lg.connect(bp.frequency);
    const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.setValueAtTime(g*.4,t0+.01);gn.gain.exponentialRampToValueAtTime(g,t1-.05);gn.gain.linearRampToValueAtTime(0,t1);
    n.connect(bp);bp.connect(gn);
    const p=oc.createStereoPanner();p.pan.setValueAtTime(-.6,t0);p.pan.linearRampToValueAtTime(.6,t1);gn.connect(p);out(p,{rev:.25});
  };
  const sliderTicks=(fn,t0,t1,step,fb,g)=>{
    let last=Math.round(fn(t0)/step);
    for(let t=t0;t<=t1;t+=1/240){const q=Math.round(fn(t)/step);if(q!==last){last=q;tick(t,fb+fn(t)*14,g,0);}}
  };
  /* particles locking into place: dense crackle that accelerates and rises in pitch */
  const swarm=(t0,t1,N,g)=>{
    for(let k=0;k<N;k++){
      const u=k/N,tt=t0+(t1-t0)*(1-Math.pow(1-u,1.9));
      tick(tt,700+u*u*3800,g*(.5+u*.7),(k%2?.45:-.45)*(.4+.6*rand()));
    }
  };

  /* ---- bed: pad in A minor (Am F C G), pulse on every beat, off-beat hats ---- */
  const CH=[[110,164.8,261.6],[87.3,130.8,220],[130.8,196,329.6],[98,146.8,246.9]];
  for(let s=0;s*2<DUR;s++){
    const t0=s*2,fr=CH[s%4],dur=2.5;
    fr.forEach((f,j)=>{[-7,0,7].forEach(dt=>{
      const o=oc.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;
      const lp=flt('lowpass',1,.6);lp.frequency.setValueAtTime(380,t0);lp.frequency.linearRampToValueAtTime(1500+s*60,t0+1.2);lp.frequency.linearRampToValueAtTime(500,t0+dur);
      const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.linearRampToValueAtTime(.022-j*.003,t0+.45);gn.gain.linearRampToValueAtTime(.0001,t0+dur);
      o.connect(lp);lp.connect(gn);out(gn,{bed:true,pan:(j-1)*.3,rev:.3});o.start(t0);o.stop(t0+dur+.05);
    });});
  }
  const lastBeat=Math.floor(DUR/BEAT);
  for(let b=1;b<lastBeat;b++){
    const t=b*BEAT;if(t>DUR-.6)break;
    if(t>=DROP&&t<TT)continue;
    const o=osc('sine',62,t,.2);o.frequency.exponentialRampToValueAtTime(40,t+.14);
    const og=oc.createGain();env(og.gain,t,t<M0?.18:.3,.004,.15);o.connect(og);out(og,{bed:true});
    if(t>=M0&&t<P0-.5||t>=P0){
      const th=t+BEAT/2,n=nsrc(th,.05,th*4.4),hp=flt('highpass',7500),hg=oc.createGain();env(hg.gain,th,.05,.001,.03);n.connect(hp);hp.connect(hg);out(hg,{bed:true,pan:b%2?.35:-.35});
    }
  }

  /* ---- 0 – 2.0 : hook ---- */
  impact(0,.5);wind(0,IMP-.02,.2);
  swarm(.1,IMP-.05,150,.04);
  riser(.7,IMP-.02,.1,7000);
  impact(IMP,1.0);downlift(IMP+.02,1.0,.12);whoosh(IMP,.4,{g:.14,up:false,f0:300,f1:4200});
  duck.push([0,.35,.1,.3],[IMP,.18,.1,.55]);
  tick(IMP+.15,1500,.08);
  /* ---- montage: every cut is a sound, pitch climbs with the speed ---- */
  M_T0.forEach((t0,i)=>{
    tick(t0,620*Math.pow(2,i*.2),.24,i%2?.3:-.3);
    thud(t0+.01,.38+.04*i);
    if(i===2)whoosh(t0-.12,.2,{g:.2,f0:500,f1:6000,dir:-.8});
    duck.push([t0,.5,.03,Math.min(.2,M_DUR[i]-.07)]);
  });
  riser(M0+.4,DROP,.16,8000);
  /* dropout, then the title hit */
  duck.push([DROP,0,.15,.02]);
  impact(TT,1.1);whoosh(TT-.02,.45,{g:.18,up:false,f0:300,f1:4600});
  duck.push([TT,.2,.1,.6]);
  swarm(TT,TT+.4,40,.035);
  for(let i=0;i<4;i++)tick(TT+.55+i*.06,1000+i*160,.06);
  /* dust blow into the app */
  riser(H0-.55,H0,.14,6000);whoosh(H0-.5,.5,{g:.22,f0:400,f1:5200});
  impact(H0,.55);click(H0+.05,.2);
  duck.push([H0,.3,.05,.3]);
  /* ---- hero UI ---- */
  click(R(.8));
  CH_T.forEach((ct,i)=>key(ct,i));
  click(R(1.7),.3);sliderTicks(t=>kf(t,TURB),R(1.75),R(3.25),1,800,.05);click(R(3.3),.22);
  /* re-hook: dropout, hard cut, flash */
  duck.push([RH0-.1,0,.08,.02]);
  impact(RH0,.85);whoosh(RH0,.35,{g:.16,up:false,f0:300,f1:4600});
  duck.push([RH0,.25,.1,.4]);
  whoosh(RH1-.12,.3,{g:.14,f0:600,f1:4000});thud(RH1,.35);
  click(R(5.0),.3);sliderTicks(t=>kf(t,STR),R(5.05),R(6.2),1,800,.05);click(R(6.3),.22);
  click(R(6.65));whoosh(R(6.7),.3,{g:.08,f0:800,f1:2400});
  click(R(7.3),.3);sliderTicks(t=>kf(t,SIZE),R(7.35),R(8.25),5,700,.05);click(R(8.3),.22);
  click(COL_T);glide(COL_T,.5,330,990,.08);
  click(EXP_T);tick(EXP_T+.1,1500,.1);
  click(DL_T);
  for(let k=0;k<9;k++)tick(DL_T+.05+k*.05,1600+k*60,.07);
  whoosh(TOAST_T-.05,.3,{g:.1,f0:600,f1:3000});chime(TOAST_T);
  /* ---- payoff ---- */
  PB.slice(0,4).forEach((b,i)=>{
    const t=P0+b;
    if(i===0)downlift(P0-.1,.5,.1);
    thud(t,.6);whoosh(t-.1,.25,{g:.2,f0:500,f1:5200,dir:i%2?.8:-.8});
    duck.push([t,.4,.04,.2]);
  });
  riser(P0+2.2,L0-.02,.14,7000);
  /* ---- lockup ---- */
  impact(L0,1.0);duck.push([L0,.2,.1,.6]);
  swarm(L0,L0+.5,50,.035);
  whoosh(L0+.85,.35,{g:.12});
  for(let i=0;i<4;i++)tick(L0+.7+i*.06,1000+i*170,.05);
  glide(L0+1.2,.4,600,2600,.05,'triangle');
  chime(L0+1.6);
  downlift(23.0,1.0,.16);

  /* ---- ducking automation (sidechain feel) ---- */
  duck.sort((a,b)=>a[0]-b[0]);
  bed.gain.setValueAtTime(BASE,0);
  duck.forEach(([t,d,hold,rel])=>{
    bed.gain.setValueAtTime(BASE*d,Math.max(0,t));
    bed.gain.setValueAtTime(BASE*d,t+hold);
    bed.gain.linearRampToValueAtTime(BASE,t+hold+rel);
  });
  return oc.startRendering();
}
let audioP=null;
const getAudio=()=>audioP||(audioP=buildAudio());
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate;
  const data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=.79/Math.max(peak,1e-6);                 // peak at -2 dBFS
  const ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';
  for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER (normal browser only) + BOOT
   ===================================================================== */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;rg.max=REEL.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s';};
  function loop(){
    if(!playing)return;
    cur=base+(performance.now()-started)/1000;
    if(cur>=REEL.duration){cur=REEL.duration;show(cur);pause();btn.textContent='REPLAY';cur=0;return;}
    show(cur);requestAnimationFrame(loop);
  }
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){
    btn.textContent='PREPARING SOUND…';
    if(!buf)buf=await getAudio();
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);
    base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();
  }
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}

async function boot(){
  try{
    const lat="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([
      document.fonts.load('900 100px "Barlow Semi Condensed"',lat),
      document.fonts.load('600 100px "Barlow Semi Condensed"',lat),
      document.fonts.load('500 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,/·▾＋－’%'),
      document.fonts.load('700 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-')
    ]).catch(()=>{});
    await document.fonts.ready;
    buildAssets();
    ui.style.display='block';measure();ui.style.display='none';buildSeg();
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e);}
}
window.addEventListener('load',boot);
})();
