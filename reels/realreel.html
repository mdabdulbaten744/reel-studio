<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Callistra — Glitch Slice Short Film (Reel)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px monospace}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport"><canvas id="stage" width="1080" height="1920"></canvas></div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="34" step="0.01" value="0"><span id="pTime">0.0s</span></div>
<script>
(function(){
'use strict';
const REEL={width:1080,height:1920,fps:30,duration:34,poster:32};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const $=id=>document.getElementById(id);
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const EASE={lin:p=>p,o3:p=>1-Math.pow(1-p,3),io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,io2:p=>p<.5?2*p*p:1-2*(1-p)*(1-p),oexp:p=>p>=1?1:1-Math.pow(2,-10*p)};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=(x,y)=>{const n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n);};
const tri=x=>Math.abs((((x%2)+2)%2)-1)*2-1;
const SERIF='"Instrument Serif",serif',MONO='"JetBrains Mono",ui-monospace,monospace';

/* ---------- timeline (seconds) ---------- */
const T=[0,3.6,10.6,13.8,16.8,20.0,22.8,26.0,29.2,34];   // classroom, paper, rails, wires, building, globe, return, phone, finale
const PAPER='#f3efe6',INK='#121212';

/* ---------- GLITCH SLICE: the app's own algorithm, DEFAULT values, never altered ---------- */
const GS={fringe:2,shear:9,chaos:30,fontSize:140,color:'#000000'};   // app defaults: 2px / 9px / 30% / 140px
function glitchSlice(text,scale){
  const bw=800*scale,bh=400*scale,off=mkCanvas(bw,bh),o=off.getContext('2d');
  const fr=GS.fringe,sh=GS.shear,ch=GS.chaos/100,pad=sh*scale+40*scale,ref=100*scale;
  o.font=`400 ${ref}px ${SERIF}`;const mw=Math.max(1,o.measureText(text).width);
  const mx=Math.min((Math.max(10*scale,bw-pad))*ref/mw,(Math.max(10*scale,bh-pad))*ref/(ref*1.1));
  const fs=Math.max(10*scale,Math.min(GS.fontSize*scale,mx));
  o.font=`400 ${fs}px ${SERIF}`;o.textAlign='center';o.textBaseline='middle';o.fillStyle=GS.color;
  o.fillText(text,bw/2,bh/2);
  const src=new Uint32Array(o.getImageData(0,0,bw,bh).data.buffer);
  const out=mkCanvas(bw,bh),oc=out.getContext('2d'),td=oc.createImageData(bw,bh),tb=new Uint32Array(td.data.buffer);
  for(let dy=0;dy<bh;dy++){
    const band=Math.floor((dy/scale)/fr),dir=band%2===0?1:-1;
    const wave=Math.sin(band*.4)*sh,macro=hash(0,Math.floor(band/3)),micro=hash(0,band);
    const chaos=dir*(macro*1.5+micro*.5)*sh;
    const sx0=Math.round((wave*(1-ch)+chaos*ch)*scale),ro=dy*bw;
    for(let dx=0;dx<bw;dx++){const sx=dx-sx0;if(sx>=0&&sx<bw){const p=src[ro+sx];if(p!==0)tb[ro+dx]=p;}}
  }
  oc.putImageData(td,0,0);
  const cl=mkCanvas(bw,bh),cc=cl.getContext('2d');cc.drawImage(off,0,0);
  return{glitch:out,clean:cl,bw,bh};
}

/* ---------- shared look ---------- */
let grainTile=null,BG=null,BLD=null,GL=null;
function paperBG(c,col=PAPER){c.fillStyle=col;c.fillRect(0,0,W,H);c.save();c.globalAlpha=.07;c.globalCompositeOperation='multiply';c.fillStyle=c.createPattern(grainTile,'repeat');c.fillRect(0,0,W,H);c.restore();}
function vign(c,a=.22){const g=c.createRadialGradient(540,930,500,540,930,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);c.fillStyle=g;c.fillRect(0,0,W,H);}
function fade(c,a,col='#f3efe6'){if(a>.003){c.save();c.globalAlpha=a;c.fillStyle=col;c.fillRect(0,0,W,H);c.restore();}}
function mono(c,txt,x,y,o={}){const{size=28,ls=6,color=INK,alpha=1,weight=500,align='center'}=o;if(alpha<=0)return;c.save();c.font=`${weight} ${size}px ${MONO}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';c.textBaseline='middle';c.textAlign=align;c.fillStyle=color;c.globalAlpha=alpha;c.fillText(txt,x+(align==='center'?ls/2:0),y);c.restore();}
function sky(c,h0,h1){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,h0);g.addColorStop(1,h1);c.fillStyle=g;c.fillRect(0,0,W,H);}

/* ---------- premium materials ---------- */
let WOOD,CONC,FIBRE,CHALK,SKYL=null;
const lin=(c,x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g;};
const pat=(c,tile)=>c.createPattern(tile,'repeat');
function buildTiles(){
  const r=mulberry32(21);let c;
  WOOD=mkCanvas(512,512);c=WOOD.getContext('2d');c.fillStyle='#8a7760';c.fillRect(0,0,512,512);
  for(let i=0;i<900;i++){const y=r()*512,x=r()*512-100,l=80+r()*360;c.strokeStyle=r()<.5?`rgba(45,30,16,${.04+r()*.1})`:`rgba(225,205,175,${.03+r()*.07})`;c.lineWidth=.6+r()*1.8;c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+l/3,y+(r()-.5)*7,x+2*l/3,y+(r()-.5)*7,x+l,y+(r()-.5)*3);c.stroke();}
  CONC=mkCanvas(512,512);c=CONC.getContext('2d');c.fillStyle='#b2b4b0';c.fillRect(0,0,512,512);
  for(let i=0;i<7000;i++){const v=r()<.5?0:255;c.fillStyle=`rgba(${v},${v},${v},${r()*.09})`;c.fillRect(r()*512,r()*512,1+r()*3,1+r()*3);}
  for(let i=0;i<46;i++){const x=r()*512,y=r()*512,g=c.createRadialGradient(x,y,0,x,y,40+r()*90);g.addColorStop(0,`rgba(55,55,50,${.05+r()*.06})`);g.addColorStop(1,'rgba(55,55,50,0)');c.fillStyle=g;c.fillRect(0,0,512,512);}
  FIBRE=mkCanvas(512,512);c=FIBRE.getContext('2d');c.fillStyle='#f2eee4';c.fillRect(0,0,512,512);
  for(let i=0;i<2200;i++){const x=r()*512,y=r()*512,a=r()*6.28,l=3+r()*10;c.strokeStyle=`rgba(${r()<.55?'125,108,80':'255,255,250'},${.05+r()*.1})`;c.lineWidth=.6;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}
  CHALK=mkCanvas(896,516);c=CHALK.getContext('2d');
  for(let i=0;i<14;i++){const x=r()*896,y=r()*516,g=c.createRadialGradient(x,y,0,x,y,70+r()*110);g.addColorStop(0,'rgba(220,225,222,.07)');g.addColorStop(1,'rgba(220,225,222,0)');c.fillStyle=g;c.fillRect(0,0,896,516);}
  c.fillStyle='rgba(246,244,236,.94)';c.textAlign='center';c.textBaseline='middle';c.font=`400 92px ${SERIF}`;c.fillText('START WITH A',448,136);c.fillText('STRAIGHT LINE',448,246);
  c.fillRect(110,332,676,5);
  c.font=`500 30px ${MONO}`;if('letterSpacing' in c)c.letterSpacing='5px';c.globalAlpha=.85;c.fillText('THE FIRST EXERCISE IN DRAWING',448,420);c.globalAlpha=1;
  c.globalCompositeOperation='destination-out';
  for(let i=0;i<5200;i++){c.fillStyle=`rgba(0,0,0,${.25+r()*.6})`;c.beginPath();c.arc(r()*896,r()*516,.4+r()*1.5,0,7);c.fill();}
  for(let i=0;i<60;i++){c.strokeStyle=`rgba(0,0,0,${.2+r()*.3})`;c.lineWidth=.6;const x=r()*896,y=r()*516;c.beginPath();c.moveTo(x,y);c.lineTo(x+r()*40-20,y+r()*12-6);c.stroke();}
}
function pencilShape(c,len){
  c.fillStyle=lin(c,0,-19,0,19,[[0,'#f0dcb8'],[.5,'#cfae7c'],[1,'#e2c79a']]);c.beginPath();c.moveTo(0,0);c.lineTo(80,-19);c.lineTo(80,19);c.fill();
  c.strokeStyle='rgba(90,60,30,.35)';c.lineWidth=1;for(let k=-3;k<=3;k++){c.beginPath();c.moveTo(14,k*1.4);c.lineTo(80,k*5.2);c.stroke();}
  c.fillStyle=lin(c,0,-6,0,6,[[0,'#6a6d72'],[.5,'#1d1f22'],[1,'#0c0d0f']]);c.beginPath();c.moveTo(0,0);c.lineTo(28,-6.5);c.lineTo(28,6.5);c.fill();
  const bx=80,bl=len-80-72;
  c.fillStyle=lin(c,0,-19,0,19,[[0,'#5a5f65'],[.2,'#3d4146'],[.34,'#26292d'],[.66,'#1a1c1f'],[.8,'#121315'],[1,'#08090a']]);c.fillRect(bx,-19,bl,38);
  c.fillStyle='rgba(255,255,255,.2)';c.fillRect(bx,-17,bl,3);c.fillStyle='rgba(0,0,0,.35)';c.fillRect(bx,-6.5,bl,1.2);c.fillRect(bx,6.5,bl,1.2);
  c.fillStyle='#c9a24e';c.fillRect(bx+60,-2.5,bl*.5,5);c.fillStyle='rgba(255,240,190,.5)';c.fillRect(bx+60,-2.5,bl*.5,1.4);
  const fx=bx+bl;c.fillStyle=lin(c,0,-19,0,19,[[0,'#f2f4f6'],[.3,'#9da3a8'],[.55,'#d9dde0'],[.8,'#7b8187'],[1,'#4c5156']]);c.fillRect(fx,-19,52,38);
  c.fillStyle='rgba(0,0,0,.35)';[10,18,26,34].forEach(o=>c.fillRect(fx+o,-19,2,38));
  c.fillStyle=lin(c,0,-19,0,19,[[0,'#f0b9bc'],[.5,'#d58d92'],[1,'#a95e66']]);c.beginPath();c.roundRect(fx+52,-19,22,38,[0,8,8,0]);c.fill();
}
function drawPencil(c,x,y,lift){
  c.save();c.translate(x,y);
  c.save();c.translate(20+lift*46,18+lift*46);c.rotate(-1.2);c.filter=`blur(${5+lift*14}px)`;c.fillStyle=`rgba(0,0,0,${.34-lift*.15})`;c.fillRect(0,-17,520,34);c.restore();
  c.save();c.translate(4,3);c.rotate(-1.2);c.filter='blur(2px)';c.fillStyle=`rgba(0,0,0,${.4*(1-lift)})`;c.fillRect(0,-8,200,16);c.restore();
  c.translate(0,-lift*30);c.rotate(-1.2);pencilShape(c,520);c.restore();
}

/* ---------- 1. classroom ---------- */
function drawClass(c,t){
  const e=EASE.io3(clamp(t/3.4)),z=1+1.7*e,ay=lerp(960,1560,e);
  c.save();c.translate(540,960);c.scale(z,z);c.translate(-540,-ay);
  c.save();c.filter=`blur(${(e*8).toFixed(1)}px)`;
  c.fillStyle=lin(c,0,0,0,1250,[[0,'#dedcd6'],[.6,'#cac8c2'],[1,'#a6a39c']]);c.fillRect(-700,-700,2480,1960);
  c.fillStyle='#9d9b95';c.fillRect(-700,1020,2480,240);c.fillStyle='rgba(255,255,255,.4)';c.fillRect(-700,1018,2480,4);c.fillStyle='rgba(0,0,0,.22)';c.fillRect(-700,1022,2480,10);
  c.save();c.globalCompositeOperation='screen';for(let i=0;i<3;i++){c.fillStyle=lin(c,0,0,300,1250,[[0,'rgba(255,246,222,.55)'],[1,'rgba(255,246,222,0)']]);c.beginPath();c.moveTo(-40+i*380,-100);c.lineTo(110+i*380,-100);c.lineTo(520+i*380,1250);c.lineTo(250+i*380,1250);c.fill();}c.restore();
  c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=40;c.shadowOffsetY=18;c.fillStyle=lin(c,70,0,70,820,[[0,'#8a7258'],[1,'#5b4833']]);c.fillRect(56,216,968,596);c.restore();
  c.fillStyle='rgba(255,230,190,.25)';c.fillRect(56,216,968,5);c.fillStyle='rgba(0,0,0,.35)';c.fillRect(56,806,968,6);
  const bg=c.createRadialGradient(540,430,60,540,520,640);bg.addColorStop(0,'#323837');bg.addColorStop(1,'#1c2120');c.fillStyle=bg;c.fillRect(80,240,920,540);
  c.fillStyle='rgba(0,0,0,.4)';c.fillRect(80,240,920,10);c.fillRect(80,240,10,540);
  c.drawImage(CHALK,92,252);
  c.fillStyle=lin(c,0,790,0,830,[[0,'#a89a86'],[1,'#6f6252']]);c.fillRect(56,810,968,30);c.fillStyle='rgba(255,255,255,.3)';c.fillRect(56,810,968,3);
  c.fillStyle='#efece4';c.fillRect(150,792,64,18);c.fillStyle='#d8d4c9';c.fillRect(150,806,64,4);c.fillStyle='#2f3234';c.fillRect(780,780,150,32);c.fillStyle='#c9b78a';c.fillRect(780,780,150,10);
  c.restore();
  c.fillStyle=pat(c,WOOD);c.beginPath();c.moveTo(-60,1210);c.lineTo(1140,1210);c.lineTo(1420,2200);c.lineTo(-340,2200);c.fill();
  c.strokeStyle='rgba(30,18,8,.28)';c.lineWidth=2;for(let k=-6;k<=6;k++){c.beginPath();c.moveTo(540+k*100,1210);c.lineTo(540+k*330,2200);c.stroke();}
  c.fillStyle=lin(c,0,1210,0,2100,[[0,'rgba(0,0,0,.42)'],[.35,'rgba(0,0,0,.05)'],[1,'rgba(255,235,200,.1)']]);c.beginPath();c.moveTo(-60,1210);c.lineTo(1140,1210);c.lineTo(1420,2200);c.lineTo(-340,2200);c.fill();
  c.fillStyle='rgba(255,235,200,.35)';c.fillRect(-60,1206,1200,4);
  c.save();c.filter='blur(28px)';c.fillStyle='rgba(0,0,0,.55)';c.fillRect(262,1440,590,380);c.restore();
  c.fillStyle='#35383b';c.fillRect(246,1402,588,386);c.fillStyle='#f6f3ea';for(let k=0;k<5;k++)c.fillRect(250,1394+k*2,580,2);
  c.fillStyle=lin(c,250,0,830,0,[[0,'#ece7da'],[.45,'#fbf8f1'],[1,'#ebe6d9']]);c.fillRect(250,1390,580,386);c.save();c.globalAlpha=.5;c.globalCompositeOperation='multiply';c.fillStyle=pat(c,FIBRE);c.fillRect(250,1390,580,386);c.restore();
  c.fillStyle=lin(c,0,1390,0,1440,[[0,'rgba(0,0,0,.18)'],[1,'rgba(0,0,0,0)']]);c.fillRect(250,1390,580,50);
  for(let i=0;i<14;i++){const x=266+i*40;c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.arc(x,1404,6,0,7);c.fill();c.strokeStyle=lin(c,x-8,1380,x+8,1420,[[0,'#f4f6f8'],[.5,'#8f959a'],[1,'#d9dde0']]);c.lineWidth=4.5;c.beginPath();c.ellipse(x,1396,7,15,.25,0,7);c.stroke();}
  c.save();c.translate(700,1700);c.rotate(-.32);c.save();c.translate(12,16);c.filter='blur(7px)';c.fillStyle='rgba(0,0,0,.4)';c.fillRect(0,-12,440,28);c.restore();c.scale(.8,.8);pencilShape(c,520);c.restore();
  c.restore();
  vign(c,.34);fade(c,prog(t,3.25,.35));
}

/* ---------- 2. paper: crooked lines, then the intentional curve ---------- */
const LINES=[{y:470,tilt:.05,wob:12,ph:1.3},{y:740,tilt:-.08,wob:16,ph:4.1},{y:1010,tilt:.035,wob:20,ph:2.2}].map(L=>{const a=[];for(let x=150;x<=930;x+=6)a.push([x,L.y+L.tilt*(x-540)+L.wob*Math.sin(x*.011+L.ph)+L.wob*.5*Math.sin(x*.027+L.ph*2)]);return a;});
const CURVE=(()=>{const a=[];for(let x=110;x<=1010;x+=5)a.push([x,1430+85*Math.sin(x*.021)+34*tri(x/72)+3*Math.sin(x*.19)]);return a;})();
const SEG=[[0,.5,'m',[1060,1350],LINES[0][0]],[.5,1.4,'d',LINES[0]],[1.4,1.75,'m',LINES[0][LINES[0].length-1],LINES[1][0]],[1.75,2.65,'d',LINES[1]],[2.65,3.0,'m',LINES[1][LINES[1].length-1],LINES[2][0]],[3.0,3.9,'d',LINES[2]],[3.9,4.7,'h',LINES[2][LINES[2].length-1]],[4.7,5.1,'m',LINES[2][LINES[2].length-1],CURVE[0]],[5.1,6.8,'d',CURVE]];
function graphite(c,pts,n,w,seed){
  if(n<2)return;
  for(let pass=0;pass<3;pass++){
    c.beginPath();for(let i=0;i<n;i++){const j=(hash(i+seed,pass)-.5)*(pass?2.6:1),p=pts[i];i?c.lineTo(p[0]+j,p[1]+(hash(pass,i+seed)-.5)*(pass?2.6:1)):c.moveTo(p[0],p[1]);}
    c.strokeStyle=`rgba(34,34,40,${.6-pass*.17})`;c.lineWidth=w-pass*1.6;c.lineCap='round';c.lineJoin='round';c.stroke();
  }
  c.fillStyle='rgba(40,40,46,.35)';for(let i=0;i<n;i+=2){const p=pts[i],k=hash(i,seed);c.beginPath();c.arc(p[0]+(k-.5)*20,p[1]+(hash(seed,i)-.5)*20,.5+k*1.2,0,7);c.fill();}
}
function pencilState(t){
  let res={x:1060,y:1350,lift:1},drawn=[];
  for(const s of SEG){
    const p=clamp((t-s[0])/(s[1]-s[0]));
    if(s[2]==='d'){const q=EASE.io2(p),n=Math.round(q*(s[3].length-1))+1;if(t>=s[0]){drawn.push([s[3],p>=1?s[3].length:n,s[3]===CURVE]);const pt=s[3][Math.min(n,s[3].length)-1];res={x:pt[0],y:pt[1],lift:0};}}
    else if(s[2]==='h'){if(t>=s[0])res={x:s[3][0],y:s[3][1],lift:t>s[0]?Math.min(1,(t-s[0])*2):0};}
    else if(t>=s[0]){const q=EASE.io3(p);res={x:lerp(s[3][0],s[4][0],q),y:lerp(s[3][1],s[4][1],q),lift:Math.sin(Math.PI*q)*.9};}
  }
  return{res,drawn};
}
function drawPaper(c,t){
  c.fillStyle=pat(c,WOOD);c.fillRect(0,0,W,H);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(0,0,W,H);
  const ps=pencilState(t),e=prog(t,5.1,1.7,'io3'),z=1+.3*e,ax=lerp(540,ps.res.x,e),ay=lerp(960,ps.res.y,e);
  c.save();c.translate(540,960);c.scale(z,z);c.translate(-ax,-ay);
  c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=50;c.shadowOffsetY=20;c.fillStyle='#30333a';c.fillRect(60,70,960,1780);c.restore();
  c.fillStyle='#f6f2e8';c.fillRect(66,84,946,1752);
  c.fillStyle=pat(c,FIBRE);c.fillRect(70,90,940,1740);
  c.fillStyle=lin(c,70,90,1010,1830,[[0,'rgba(255,248,230,.35)'],[.5,'rgba(255,255,255,0)'],[1,'rgba(90,70,40,.16)']]);c.fillRect(70,90,940,1740);
  c.fillStyle=lin(c,0,90,0,170,[[0,'rgba(0,0,0,.2)'],[1,'rgba(0,0,0,0)']]);c.fillRect(70,90,940,80);
  for(let i=0;i<15;i++){const x=110+i*62;c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.arc(x,96,8,0,7);c.fill();c.strokeStyle=lin(c,x-9,60,x+9,130,[[0,'#f7f9fa'],[.5,'#8a9096'],[1,'#d9dde0']]);c.lineWidth=6;c.beginPath();c.ellipse(x,88,9,22,.2,0,7);c.stroke();}
  c.save();c.beginPath();c.rect(70,90,940,1740);c.clip();

    c.fillStyle=hot?'#f6f3ec':INK;c.font=`400 100px ${SERIF}`;c.textAlign='center';c.fillText(k,x+90,y+78);});
  const call=prog(t,1.95,.2),ring=Math.max(0,t-2.15);
  c.fillStyle='#17181a';c.beginPath();c.arc(540,1450,82-call*6,0,7);c.fill();
  c.strokeStyle='#f6f3ec';c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(505,1425);c.quadraticCurveTo(500,1480,555,1485);c.moveTo(505,1425);c.lineTo(523,1412);c.moveTo(555,1485);c.lineTo(568,1470);c.stroke();
  if(ring>0)for(let i=0;i<3;i++){const q=((ring*.9+i/3)%1);c.strokeStyle=`rgba(18,18,18,${.5*(1-q)})`;c.lineWidth=4;c.beginPath();c.arc(540,1450,90+q*180,0,7);c.stroke();}
  c.restore();vign(c,.18);
}

/* ---------- 9. the finale ---------- */
function drawFinale(c,t){
  const e=prog(t,0,4.8,'io3');
  c.save();c.translate(540,960);c.scale(1.9+.06*e,1.9+.06*e);c.translate(-540,-770);
  drawBldWarp(c,1,6+t);
  const gp=prog(t,.7,1.9,'io3');drawSign(c,6+t,gp);
  c.restore();vign(c,.3);
  const a=prog(t,3.0,.6,'o3');
  if(a>0){c.save();c.globalAlpha=a;const g=c.createLinearGradient(0,1560,0,1920);g.addColorStop(0,'rgba(15,15,15,0)');g.addColorStop(1,'rgba(15,15,15,.78)');c.fillStyle=g;c.fillRect(0,1560,W,360);c.restore();
    mono(c,'CALLISTRA.DESIGN',540,1760,{size:42,ls:6,color:'#f4f1ea',alpha:a,weight:700});mono(c,'GLITCH SLICE TEXT EFFECT',540,1830,{size:24,ls:8,color:'#f4f1ea',alpha:a*.7});}
}

/* ---------- renderFrame ---------- */
const stage=$('stage'),sc=stage.getContext('2d');
function renderFrame(t){
  t=clamp(t,0,REEL.duration-.001);
  let i=0;for(let k=0;k<T.length-1;k++)if(t>=T[k])i=k;
  const l=t-T[i];
  sc.save();sc.clearRect(0,0,W,H);
  [drawClass,drawPaper,drawRails,drawWires,drawBuilding,drawGlobe,drawReturn,drawPhone,drawFinale][i](sc,l);
  if(!window.__bt){window.__bt=mkCanvas(W/4,H/4);}
  {const b=window.__bt.getContext('2d');b.clearRect(0,0,W/4,H/4);b.filter='brightness(1.25) contrast(1.1)';b.drawImage(stage,0,0,W/4,H/4);b.filter='none';sc.save();sc.globalCompositeOperation='screen';sc.globalAlpha=.22;sc.filter='blur(14px)';sc.drawImage(window.__bt,0,0,W,H);sc.restore();}
  const cutFlash=Math.exp(-l*28)*.18;if(i>1&&cutFlash>.004){sc.fillStyle='rgba(255,255,255,'+cutFlash+')';sc.fillRect(0,0,W,H);}
  sc.save();sc.globalAlpha=.06;sc.globalCompositeOperation='overlay';sc.fillStyle=sc.createPattern(grainTile,'repeat');sc.translate(Math.floor(t*30%7)*37,Math.floor(t*30%5)*23);sc.fillRect(-300,-300,W+600,H+600);sc.restore();
  sc.restore();
}
window.renderFrame=renderFrame;

/* ---------- sound design ---------- */
async function buildAudio(){
  const SR=44100,oc=new OfflineAudioContext(2,SR*REEL.duration,SR),r=mulberry32(11);
  const nb=oc.createBuffer(1,SR*2,SR),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=r()*2-1;
  const ib=oc.createBuffer(2,SR*1.6,SR);for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(r()*2-1)*Math.pow(1-i/d.length,3);}
  const cv=oc.createConvolver();cv.buffer=ib;const wet=oc.createGain();wet.gain.value=.22;cv.connect(wet);wet.connect(oc.destination);
  const dry=oc.createGain();dry.gain.value=.9;dry.connect(oc.destination);
  const out=(n,pan=0,rev=.15)=>{const p=oc.createStereoPanner();p.pan.value=pan;n.connect(p);p.connect(dry);const g=oc.createGain();g.gain.value=rev;p.connect(g);g.connect(cv);};
  const env=(g,t,pk,at,de)=>{g.setValueAtTime(.0001,t);g.linearRampToValueAtTime(pk,t+at);g.exponentialRampToValueAtTime(.0001,t+at+de);};
  const nz=(t,dur,type,f,q,g,pan=0,rev=.1,f1)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,r()*1.5,dur+.05);const fl=oc.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);fl.Q.value=q;const gn=oc.createGain();env(gn.gain,t,g,Math.min(.02,dur*.3),dur);s.connect(fl);fl.connect(gn);out(gn,pan,rev);};
  const tn=(t,f0,f1,dur,g,type='sine',rev=.2)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);o.start(t);o.stop(t+dur+.05);const gn=oc.createGain();env(gn.gain,t,g,.004,dur);o.connect(gn);out(gn,0,rev);};
  const thud=(t,g=.6)=>{tn(t,160,42,.5,g);nz(t,.12,'bandpass',900,.9,g*.6);};
  const tick=(t,f=1400,g=.12,pan=0)=>{const o=oc.createOscillator();o.type='triangle';o.frequency.value=f;o.start(t);o.stop(t+.06);const gn=oc.createGain();env(gn.gain,t,g,.001,.04);o.connect(gn);out(gn,pan,.08);};
  const whoosh=(t,d,g=.25,up=true)=>nz(t,d,'bandpass',up?250:5000,1,g,up?-.5:.5,.2,up?5000:250);
  const chime=(t)=>[[659.25,0],[987.77,.09],[1318.5,.18]].forEach(([f,d])=>tn(t+d,f,f*.998,1.6,.12,'sine',.6));
  const scratch=(t,dur,g)=>{for(let k=0;k<dur*40;k++)nz(t+k/40,.05,'bandpass',2200+((k*37)%9)*220,1.4,g*(.6+.4*Math.sin(k*1.7)),Math.sin(k)*.2,.05);};
  /* 1 classroom */
  nz(0,3.6,'lowpass',260,.5,.05,0,.3);whoosh(.1,3.3,.16);for(let k=0;k<6;k++)tick(.3+k*.5,500,.04);thud(3.5,.5);
  /* 2 paper */
  const P=T[1];
  [[.5,1.4],[1.75,2.65],[3.0,3.9]].forEach(([a,b])=>{scratch(P+a,b-a,.08);tick(P+b+.02,700,.15);});
  [[1.4,1.75],[2.65,3.0]].forEach(([a,b])=>nz(P+a,b-a,'bandpass',3000,1,.03,.3));
  tn(P+4.7,320,180,.12,.18);scratch(P+5.1,1.7,.07);tn(P+5.1,400,500,1.6,.015);tick(P+6.85,1100,.2);whoosh(P+6.3,.6,.25);
  /* 3 rails */
  const R=T[2];thud(R,.7);whoosh(R+.2,.9,.3);for(let k=0;k<12;k++){tick(R+1.2+k*.17,260+(k%2)*90,.2,k%2?.3:-.3);nz(R+1.2+k*.17,.05,'bandpass',1800,2,.1);}tn(R,70,70,3.2,.05,'sine',.3);
  /* 4 wires */
  const Wd=T[3];thud(Wd,.5);[0,.12,.24,.36,.48].forEach((d,i)=>tn(Wd+.9+d,440*Math.pow(2,i/5),440*Math.pow(2,i/5)*.995,1.4,.1,'triangle',.5));whoosh(Wd+.9,1.4,.15);
  /* 5 building */
  const B=T[4];thud(B,.6);tn(B+1.0,60,100,1.7,.14,'sine',.4);nz(B+1.0,1.7,'lowpass',500,.6,.14,0,.3,160);chime(B+2.6);
  /* 6 globe */
  const G=T[5];thud(G,.7);tn(G,90,30,1.5,.35);whoosh(G+.4,2.0,.18);chime(G+2.1);
  /* 7 return */
  const Rt=T[6];thud(Rt,.5);whoosh(Rt+.1,3.0,.22);tn(Rt,80,260,3.0,.05,'sawtooth',.2);
  /* 8 phone */
  const Ph=T[7];whoosh(Ph,.5,.2,false);for(let k=0;k<ADDR.length;k++)tick(Ph+.5+k*.1,1500+(k%4)*90,.12,k%2?.15:-.15);
  tick(Ph+2.0,900,.2);thud(Ph+2.0,.3);for(let k=0;k<3;k++){tn(Ph+2.2+k*1.0,440,440,.45,.12,'sine',.3);tn(Ph+2.2+k*1.0,480,480,.45,.1,'sine',.3);}
  /* 9 finale: slices rip across */
  const F=T[8];thud(F,.5);for(let k=0;k<60;k++)tick(F+.7+k*.03,1600+((k*53)%11)*140,.06,(k%2?.4:-.4));nz(F+.7,1.9,'highpass',2000,.7,.12,0,.2);whoosh(F+.6,.4,.25);
  thud(F+2.6,.9);tn(F+2.6,120,28,1.2,.3);chime(F+2.7);nz(F+2.6,.4,'highpass',3000,.6,.1);
  return oc.startRendering();
}
let audioP=null;const getAudio=()=>audioP||(audioP=buildAudio());
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate,data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=peak>.89?.89/peak:1,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await getAudio());

/* ---------- preview player (normal browser only) + boot ---------- */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;rg.max=REEL.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopA=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s';};
  function loop(){if(!playing)return;cur=base+(performance.now()-started)/1000;if(cur>=REEL.duration){show(REEL.duration);pause();btn.textContent='REPLAY';cur=0;return;}show(cur);requestAnimationFrame(loop);}
  function pause(){playing=false;stopA();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){btn.textContent='PREPARING SOUND…';if(!buf)buf=await getAudio();if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')await actx.resume();stopA();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();}
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}
async function boot(){
  try{
    const lat='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,';
    await Promise.all([document.fonts.load('400 100px "Instrument Serif"',lat),document.fonts.load('500 30px "JetBrains Mono"',lat),document.fonts.load('700 30px "JetBrains Mono"',lat)]).catch(()=>{});
    await document.fonts.ready;
    const rnd=mulberry32(5);grainTile=mkCanvas(256,256);const g=grainTile.getContext('2d'),id=g.createImageData(256,256);
    for(let i=0;i<256*256;i++){const v=rnd()*255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
    g.putImageData(id,0,0);
    buildTiles();buildBuilding();GL=glitchSlice('STRAIGHT',2);
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e);}
}
window.addEventListener('load',boot);
})();
