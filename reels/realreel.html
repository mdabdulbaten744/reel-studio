<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Callistra — Glitch Slice Short Film Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--ink:#121212;--muted:#736e65;--accent:#121212;--border:rgba(18,18,18,0.12);--canvas:#ffffff;--serif:'Instrument Serif',serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;isolation:isolate}
#viewport>*{position:absolute;left:0;top:0}
#stage,#grain{width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.08;pointer-events:none}
#vig{z-index:4;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(115% 82% at 50% 47%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 100%)}

#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="24" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

const REEL={width:1080,height:1920,fps:30,duration:24,poster:12.0};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const W=1080,H=1920,PI=Math.PI;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const EASE={
  lin:p=>p,i2:p=>p*p,i3:p=>p*p*p,o2:p=>1-(1-p)*(1-p),o3:p=>1-Math.pow(1-p,3),
  io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oexp:p=>p>=1?1:1-Math.pow(2,-10*p)
};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
const mulberry32=a=>function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

/* Spatial random generator matching glitch slice app */
function getSpatialRandom(x, y) {
    let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
}

/* Glitch Slice Renderer with strict default slider values (fringe=2, shear=9, chaos=30%) */
function renderGlitchSlice(text, options = {}) {
    const {
        width = 900,
        height = 450,
        fringe = 2,
        shear = 9,
        chaos = 0.3,
        fontSize = 140,
        textColor = '#121212',
        fontFamily = '"Instrument Serif", serif',
        scale = 1
    } = options;

    const TW = Math.round(width * scale);
    const TH = Math.round(height * scale);
    const off = mkCanvas(TW, TH);
    const octx = off.getContext('2d', { willReadFrequently: true });

    const lines = text.split('\n');
    const scaledShear = shear * scale;
    const padding = scaledShear + (40 * scale);
    const refSize = 100 * scale;

    octx.font = `400 ${refSize}px ${fontFamily}`;
    let maxRefWidth = 1;
    lines.forEach(line => {
        let width = octx.measureText(line).width;
        if (width > maxRefWidth) maxRefWidth = width;
    });

    const refTotalHeight = lines.length * (refSize * 1.1);
    const availWidth = Math.max(10 * scale, TW - padding);
    const availHeight = Math.max(10 * scale, TH - padding);
    const maxFontSizeW = (availWidth * refSize) / maxRefWidth;
    const maxFontSizeH = (availHeight * refSize) / refTotalHeight;
    const calculatedMaxFontSize = Math.min(maxFontSizeW, maxFontSizeH);
    const scaledFontSize = Math.max(10 * scale, Math.min(fontSize * scale, calculatedMaxFontSize));

    octx.font = `400 ${scaledFontSize}px ${fontFamily}`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillStyle = textColor;

    const lineHeight = scaledFontSize * 1.1;
    const totalHeight = lines.length * lineHeight;
    let startY = (TH / 2) - (totalHeight / 2) + (lineHeight / 2);

    lines.forEach((line, index) => {
        octx.fillText(line, TW / 2, startY + (index * lineHeight));
    });

    const sourceData = octx.getImageData(0, 0, TW, TH);
    const targetCanvas = mkCanvas(TW, TH);
    const targetCtx = targetCanvas.getContext('2d');
    const targetData = targetCtx.createImageData(TW, TH);
    const sourceBuffer = new Uint32Array(sourceData.data.buffer);
    const targetBuffer = new Uint32Array(targetData.data.buffer);

    for (let dy = 0; dy < TH; dy++) {
        const unscaledY = dy / scale;
        const band = Math.floor(unscaledY / fringe);
        const dir = (band % 2 === 0) ? 1 : -1;

        const waveShift = Math.sin(band * 0.4) * shear;
        const macroClump = getSpatialRandom(0, Math.floor(band / 3));
        const microNoise = getSpatialRandom(0, band);
        const chaosIntensity = (macroClump * 1.5 + microNoise * 0.5);
        const chaoticShift = dir * chaosIntensity * shear;

        const shiftAmount = (waveShift * (1 - chaos)) + (chaoticShift * chaos);
        const scaledShiftX = Math.round(shiftAmount * scale);

        const rowOffset = dy * TW;
        for (let dx = 0; dx < TW; dx++) {
            const sx = dx - scaledShiftX;
            if (sx >= 0 && sx < TW) {
                const sourcePixel = sourceBuffer[rowOffset + sx];
                if (sourcePixel !== 0) {
                    targetBuffer[rowOffset + dx] = sourcePixel;
                }
            }
        }
    }
    targetCtx.putImageData(targetData, 0, 0);
    return targetCanvas;
}

const stage=$('stage'),sc=stage.getContext('2d');
const grain=$('grain'),gc=grain.getContext('2d');
let grainTile=null, glitchImg=null, callistraImg=null;

function buildAssets(){
  const g=mkCanvas(512,512);grainTile=g;
  const gx=g.getContext('2d'),id=gx.createImageData(512,512),r2=mulberry32(5);
  for(let i=0;i<512*512;i++){const v=r2()*255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
  gx.putImageData(id,0,0);

  // Pre-render glitch slice text assets with strict default values (fringe=2, shear=9, chaos=30%)
  glitchImg = renderGlitchSlice("CALLISTRA", { width: 900, height: 350, fringe: 2, shear: 9, chaos: 0.3, fontSize: 130, textColor: '#121212', scale: 1.5 });
  callistraImg = renderGlitchSlice("callistra.design", { width: 900, height: 250, fringe: 2, shear: 9, chaos: 0.3, fontSize: 90, textColor: '#f0eee9', scale: 1.5 });
}

/* Editorial typography helpers */
function editorial(c,txt,x,y,o={}){
  const{size=80,align='center',color='#121212',alpha=1,italic=false}=o;
  if(alpha<=0)return;
  c.save();c.font=`${italic?'italic':''} 400 ${size}px ${'\"Instrument Serif\", serif'}`;
  c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;c.textAlign=align;
  c.fillText(txt,x,y);c.restore();
}

function mono(c,txt,x,y,o={}){
  const{size=24,ls=2,align='left',color='#121212',alpha=1,weight=500}=o;
  if(alpha<=0)return;
  c.save();c.font=`${weight} ${size}px ${'\"JetBrains Mono\", monospace'}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';
  c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;
  let xx=x;
  if(align==='center'){c.textAlign='center';xx=x+ls/2;}else if(align==='right'){c.textAlign='right';xx=x+ls;}else c.textAlign='left';
  c.fillText(txt,xx,y);c.restore();
}

function flash(c,a,col){if(a>.005){c.save();c.globalAlpha=Math.min(1,a);c.fillStyle=col;c.fillRect(0,0,W,H);c.restore();}}
function streak(c,y,a,col){
  if(a<.01)return;
  c.save();c.globalCompositeOperation='lighter';
  const g=c.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'rgba(255,91,46,0)');g.addColorStop(.5,col);g.addColorStop(1,'rgba(255,91,46,0)');
  c.fillStyle=g;
  c.globalAlpha=Math.min(1,a);c.fillRect(0,y-2,W,4);
  c.restore();
}
function grade(c,a=.15){
  c.save();c.globalCompositeOperation='soft-light';
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,`rgba(30,50,90,${a})`);g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(200,90,40,${a*1.2})`);
  c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
}

/* =====================================================================
   SCENE RENDERERS (0.0s to 24.0s)
   ===================================================================== */

/* Scene 1 (0.0s - 2.5s): Art Classroom & Pencil's Struggle */
function drawSceneClassroom(c, t) {
  c.fillStyle = '#f7f5f0';
  c.fillRect(0, 0, W, H);

  // Wooden desk surface texture & perspective
  c.fillStyle = '#e8e2d5';
  c.fillRect(100, 1100, 880, 700);
  c.strokeStyle = '#d4cbb8';
  c.lineWidth = 2;
  c.strokeRect(100, 1100, 880, 700);

  // Instructional Blackboard in background
  c.fillStyle = '#1a221f';
  c.fillRect(140, 150, 800, 420);
  c.strokeStyle = '#32423d';
  c.lineWidth = 6;
  c.strokeRect(140, 150, 800, 420);

  editorial(c, "START WITH A STRAIGHT LINE", 540, 260, { size: 52, color: '#f0eee9' });
  mono(c, "THE FIRST EXERCISE IN DRAWING", 540, 340, { size: 22, ls: 4, align: 'center', color: '#8c877e' });

  // Sketchbook on desk
  c.fillStyle = '#ffffff';
  c.shadowColor = 'rgba(0,0,0,0.18)';
  c.shadowBlur = 40;
  c.shadowOffsetY = 20;
  c.fillRect(200, 680, 680, 880);
  c.shadowBlur = 0; c.shadowOffsetY = 0;

  // Paper border
  c.strokeStyle = '#eae6dc';
  c.lineWidth = 2;
  c.strokeRect(220, 700, 640, 840);

  // Pencil drawing attempts
  const p = clamp(t / 2.5);
  c.save();
  c.strokeStyle = '#2b2621';
  c.lineWidth = 3.5;
  c.lineCap = 'round';
  c.lineJoin = 'round';

  // Attempt 1 (Crooked line 1)
  if (t > 0.4) {
    c.beginPath();
    c.moveTo(280, 820);
    c.lineTo(500, 840);
    c.lineTo(720, 810);
    c.lineTo(800, 835);
    c.stroke();
  }
  // Attempt 2 (Crooked line 2)
  if (t > 0.9) {
    c.beginPath();
    c.moveTo(280, 920);
    c.lineTo(460, 895);
    c.lineTo(640, 935);
    c.lineTo(800, 915);
    c.stroke();
  }
  // Attempt 3 (Frustrated scribble / pause)
  if (t > 1.4) {
    c.beginPath();
    c.moveTo(280, 1020);
    c.lineTo(420, 1050);
    c.lineTo(600, 1010);
    c.lineTo(800, 1045);
    c.stroke();
  }

  // Final Intentional Curved Line (The breakthrough)
  if (t > 1.9) {
    const cp = clamp((t - 1.9) / 0.6);
    c.strokeStyle = '#121212';
    c.lineWidth = 4.5;
    c.beginPath();
    c.moveTo(280, 1200);
    c.bezierCurveTo(400, 1100 + 50*Math.sin(cp*PI), 680, 1350 - 50*Math.sin(cp*PI), 820, 1220);
    c.stroke();

    // Graphite pencil tip moving along the curve (no hand)
    const px = lerp(280, 820, cp);
    const py = 1200 + 40*Math.sin(cp*PI);
    c.fillStyle = '#b58838'; // Wood pencil color
    c.save();
    c.translate(px, py);
    c.rotate(-0.4);
    c.fillRect(-35, -5, 40, 10);
    c.fillStyle = '#222'; // Lead tip
    c.beginPath();
    c.moveTo(5, -5); c.lineTo(15, 0); c.lineTo(5, 5); c.fill();
    c.restore();
  }
  c.restore();
}

/* Scene 2 (2.5s - 5.0s): World Transformation (Railway, Wires, Building) */
function drawSceneTransformation(c, t) {
  const u = t - 2.5;
  c.fillStyle = '#141414';
  c.fillRect(0, 0, W, H);

  c.save();
  if (u < 0.8) {
    // Railway tracks transforming into rhythmic zigzags
    c.strokeStyle = '#c5bfb3';
    c.lineWidth = 10;
    c.beginPath();
    const progTr = clamp(u / 0.8);
    for (let y = 200; y < 1720; y += 120) {
      const offset = 180 * Math.sin(y * 0.015) * progTr;
      c.moveTo(380 + offset, y); c.lineTo(700 + offset, y + 60);
    }
    c.stroke();

    c.strokeStyle = '#e0dad0';
    c.lineWidth = 14;
    c.beginPath();
    for (let y = 200; y < 1720; y += 120) {
      const offset = 180 * Math.sin(y * 0.015) * progTr;
      c.moveTo(360 + offset, y); c.lineTo(360 + offset, y + 120);
      c.moveTo(720 + offset, y); c.lineTo(720 + offset, y + 120);
    }
    c.stroke();
    editorial(c, "GEOMETRY IN MOTION", 540, 1750, { size: 42, color: '#f0eee9' });

  } else if (u < 1.7) {
    // Roadside Electric Wires developing rhythmic curves
    const progW = clamp((u - 0.8) / 0.9);
    c.strokeStyle = '#a8a296';
    c.lineWidth = 4;
    for (let i = 0; i < 5; i++) {
      c.beginPath();
      const baseY = 300 + i * 320;
      c.moveTo(80, baseY);
      c.bezierCurveTo(320, baseY + 200 * progW * (i % 2 === 0 ? 1 : -1), 760, baseY - 200 * progW * (i % 2 === 0 ? 1 : -1), 1000, baseY);
      c.stroke();
    }
    // Utility poles
    c.fillStyle = '#2b2621';
    c.fillRect(80, 200, 30, 1400);
    c.fillRect(970, 200, 30, 1400);
    editorial(c, "RHYTHMIC WAVES", 540, 1750, { size: 42, color: '#f0eee9' });

  } else {
    // Architectural building edges bending gracefully
    const progB = clamp((u - 1.7) / 0.8);
    c.fillStyle = '#202022';
    c.beginPath();
    c.moveTo(180, 1700);
    c.lineTo(180, 400);
    c.bezierCurveTo(180 + 120 * progB, 300, 900 - 120 * progB, 300, 900, 400);
    c.lineTo(900, 1700);
    c.closePath();
    c.fill();

    // Windows with curved frames
    c.fillStyle = '#3a383f';
    for (let y = 500; y < 1500; y += 220) {
      for (let x = 280; x < 800; x += 180) {
        c.fillRect(x + 30 * Math.sin(y * 0.02) * progB, y, 100, 140);
      }
    }
    editorial(c, "NEW ARCHITECTURAL RULES", 540, 1750, { size: 42, color: '#f0eee9' });
  }
  c.restore();
}

/* Scene 3 (5.0s - 7.0s): Global Reveal & Return to Building */
function drawSceneGlobal(c, t) {
  const u = t - 5.0;
  c.fillStyle = '#0d0d0d';
  c.fillRect(0, 0, W, H);

  const progG = clamp(u / 2.0);
  c.save();
  c.translate(540, 960);

  // Distorted Globe representing Earth
  const r = 380;
  c.fillStyle = '#182430';
  c.beginPath();
  c.arc(0, 0, r, 0, PI * 2);
  c.fill();

  c.strokeStyle = '#ff5b2e';
  c.lineWidth = 4;
  c.beginPath();
  for (let angle = 0; angle < PI * 2; angle += 0.05) {
    const wave = r + 45 * Math.sin(angle * 8 + progG * 10);
    const x = Math.cos(angle) * wave;
    const y = Math.sin(angle) * wave;
    if (angle === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath();
  c.stroke();

  editorial(c, "THE WORLD REDEFINED", 0, 600, { size: 54, color: '#f0eee9' });
  c.restore();
}

/* Scene 4 (7.0s - 10.5s): Phone Interface & Dialing */
function drawScenePhone(c, t) {
  const u = t - 7.0;
  c.fillStyle = '#121212';
  c.fillRect(0, 0, W, H);

  // Phone Frame
  c.fillStyle = '#1c1c1e';
  c.strokeStyle = '#3a3a3c';
  c.lineWidth = 6;
  c.beginPath();
  c.roundRect(140, 260, 800, 1400, 48);
  c.fill(); c.stroke();

  // Screen
  c.fillStyle = '#0a0a0c';
  c.beginPath();
  c.roundRect(170, 290, 740, 1340, 36);
  c.fill();

  // Header & Brand
  mono(c, "CALLISTRA SECURE TERMINAL", 540, 420, { size: 22, ls: 6, align: 'center', color: '#8c877e' });

  // Input Field
  c.fillStyle = '#161618';
  c.beginPath();
  c.roundRect(220, 520, 640, 110, 16);
  c.fill();

  const typingProg = clamp(u / 2.5);
  const fullText = "callistra.design";
  const charCount = Math.floor(typingProg * fullText.length);
  const typedText = fullText.slice(0, charCount);

  c.save();
  c.font = '500 42px "JetBrains Mono", monospace';
  c.fillStyle = '#f0eee9';
  c.textBaseline = 'middle';
  c.textAlign = 'left';
  c.fillText(typedText, 260, 575);
  c.restore();

  // Custom Typographic Keypad
  const keys = [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['z','x','c','v','b','n','m','.', '/']
  ];
  
  keys.forEach((row, ri) => {
    const rx = 220 + (ri === 1 ? 40 : ri === 2 ? 100 : 0);
    row.forEach((char, ci) => {
      const bx = rx + ci * 64;
      const by = 800 + ri * 130;
      c.fillStyle = '#222226';
      c.beginPath();
      c.roundRect(bx, by, 54, 96, 12);
      c.fill();
      mono(c, char.toUpperCase(), bx + 27, by + 48, { size: 26, align: 'center', color: '#f0eee9' });
    });
  });

  // Call / Connect Button
  c.fillStyle = '#ff5b2e';
  c.beginPath();
  c.roundRect(220, 1240, 640, 100, 20);
  c.fill();
  mono(c, "INITIATE CALL", 540, 1290, { size: 26, ls: 6, align: 'center', color: '#ffffff', weight: 700 });
}

/* Scene 5 (10.5s - 17.0s): The Billboard & Glitch Slice Transformation */
function drawSceneGlitchSlice(c, t) {
  const u = t - 10.5;
  c.fillStyle = '#141414';
  c.fillRect(0, 0, W, H);

  // Architectural Building Façade with Billboard
  c.fillStyle = '#1e1e22';
  c.fillRect(100, 200, 880, 1520);

  // Billboard Frame
  c.fillStyle = '#f2ede2';
  c.shadowColor = 'rgba(0,0,0,0.5)';
  c.shadowBlur = 50;
  c.fillRect(160, 600, 760, 720);
  c.shadowBlur = 0;

  // Clean Typography Memory of Old World (Early in scene)
  if (u < 1.5) {
    editorial(c, "CALLISTRA", 540, 920, { size: 130, color: '#121212' });
    mono(c, "THE LAST REMNANT OF PERFECTION", 540, 1060, { size: 22, ls: 6, align: 'center', color: '#736e65' });
  } else {
    // The Glitch Slice Transformation using exact default app values (fringe=2, shear=9, chaos=30%)
    const glitchProg = clamp((u - 1.5) / 1.5);
    c.save();
    c.translate(540, 960);
    c.scale(1.2 + 0.05 * Math.sin(t * 5), 1.2 + 0.05 * Math.cos(t * 5));
    if (glitchImg) {
      c.drawImage(glitchImg, -glitchImg.width / 4, -glitchImg.height / 4, glitchImg.width / 2, glitchImg.height / 2);
    }
    c.restore();

    if (u > 2.5) {
      mono(c, "GLITCH SLICE EFFECT APPLIED", 540, 1180, { size: 24, ls: 8, align: 'center', color: '#ff5b2e', weight: 700 });
    }
  }
}

/* Scene 6 (17.0s - 20.0s): Product Showcase Artifacts */
function drawSceneShowcase(c, t) {
  const u = t - 17.0;
  c.fillStyle = '#0f0f11';
  c.fillRect(0, 0, W, H);

  // Editorial Product Presentation Mockup Card
  c.fillStyle = '#f7f5f0';
  c.shadowColor = 'rgba(0,0,0,0.4)';
  c.shadowBlur = 60;
  c.fillRect(120, 260, 840, 1400);
  c.shadowBlur = 0;

  c.fillStyle = '#121212';
  c.fillRect(180, 340, 720, 800);

  if (callistraImg) {
    c.save();
    c.translate(540, 740);
    c.drawImage(callistraImg, -callistraImg.width / 4, -callistraImg.height / 4, callistraImg.width / 2, callistraImg.height / 2);
    c.restore();
  }

  editorial(c, "Callistra Design Systems", 180, 1260, { size: 64, color: '#121212' });
  mono(c, "MINIMALIST TYPOGRAPHY TOOLS & WEGL SHADERS", 180, 1340, { size: 20, ls: 6, color: '#736e65', weight: 700 });
  mono(c, "CALLISTRA.DESIGN", 180, 1420, { size: 24, ls: 8, color: '#ff5b2e', weight: 700 });
}

/* Scene 7 (20.0s - 24.0s): Final Lockup & CTA (Avoiding Instagram UI Blocked Zones) */
function drawSceneLockup(c, t) {
  const u = t - 20.0;
  c.fillStyle = '#f7f5f0';
  c.fillRect(0, 0, W, H);

  haze(c, t, 0.12, 540, 960);

  const p1 = prog(u, 0.2, 0.6, 'oexp');
  editorial(c, "CALLISTRA", 540, 800, { size: 150, color: '#121212' });
  mono(c, "GLITCH SLICE TEXT EFFECT MAKER", 540, 940, { size: 28, ls: 10, align: 'center', color: '#736e65', weight: 700 });

  // Safe Zone Respected Call to Action (Center-Top, avoiding bottom-left Instagram UI overlay)
  c.fillStyle = '#121212';
  c.beginPath();
  c.roundRect(240, 1080, 600, 100, 12);
  c.fill();
  mono(c, "LINK IN BIO", 540, 1130, { size: 28, ls: 12, align: 'center', color: '#f7f5f0', weight: 700 });

  streak(c, 1300, 0.6 * Math.exp(-u * 2), 'rgba(255,91,46,1)');
}

function haze(c, t, a, x=540, y=960){
  const g=c.createRadialGradient(x,y,0,x,y,1050);
  g.addColorStop(0,`rgba(255,91,46,${a})`);g.addColorStop(.6,`rgba(255,91,46,${a*.2})`);g.addColorStop(1,'rgba(255,91,46,0)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}

function renderFrame(t){
  t=clamp(t,0,REEL.duration);
  sc.setTransform(1,0,0,1,0,0);sc.clearRect(0,0,W,H);

  if(t < 2.5) drawSceneClassroom(sc, t);
  else if(t < 5.0) drawSceneTransformation(sc, t);
  else if(t < 7.0) drawSceneGlobal(sc, t);
  else if(t < 10.5) drawScenePhone(sc, t);
  else if(t < 17.0) drawSceneGlitchSlice(sc, t);
  else if(t < 20.0) drawSceneShowcase(sc, t);
  else drawSceneLockup(sc, t);

  grade(sc, 0.12);

  const fo=prog(t, REEL.duration-.4, .4);
  if(fo>0){sc.fillStyle='#000';sc.globalAlpha=fo;sc.fillRect(0,0,W,H);sc.globalAlpha=1;}

  const f=Math.floor(t*REEL.fps+.001),ox=(f*97)%512,oy=(f*57)%512;
  gc.clearRect(0,0,W,H);
  for(let x=-ox;x<W;x+=512)for(let y=-oy;y<H;y+=512)gc.drawImage(grainTile,x,y);
}
window.renderFrame=renderFrame;

/* =====================================================================
   SOUNDTRACK GENERATION (Synthesized via OfflineAudioContext)
   ===================================================================== */
async function buildAudio(){
  const SR=44100,DUR=REEL.duration;
  const oc=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const rand=mulberry32(7);
  const nb=oc.createBuffer(1,SR*3,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rand()*2-1;}
  const master=oc.createGain();master.gain.setValueAtTime(.85,0);master.gain.setValueAtTime(.85,DUR-.5);master.gain.linearRampToValueAtTime(0,DUR-.03);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.14;
  master.connect(comp);comp.connect(oc.destination);

  const rl=Math.floor(SR*2.6),ir=oc.createBuffer(2,rl,SR);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rand()*2-1)*Math.pow(1-i/rl,3);}
  const conv=oc.createConvolver();conv.buffer=ir;
  const revIn=oc.createGain(),revLp=oc.createBiquadFilter(),revOut=oc.createGain();
  revLp.type='lowpass';revLp.frequency.value=4500;revOut.gain.value=.55;
  revIn.connect(conv);conv.connect(revLp);revLp.connect(revOut);revOut.connect(master);

  const out=(g,o={})=>{let n=g;
    if(o.pan){const p=oc.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p;}
    n.connect(master);
    if(o.rev>0){const s=oc.createGain();s.gain.value=o.rev;n.connect(s);s.connect(revIn);}
  };
  const env=(p,t,peak,a,d)=>{p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(peak,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);};
  const nsrc=(t,dur,seed)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,(Math.abs(seed)*.37)%2,undefined);s.stop(t+dur);return s;};
  const flt=(type,f,q=1)=>{const b=oc.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const osc=(type,f,t,dur)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;};

  const impact=(t,g=1)=>{
    const s=osc('sine',120,t,1.3);s.frequency.exponentialRampToValueAtTime(30,t+.9);
    const sg=oc.createGain();env(sg.gain,t,g*.9,.004,1.1);s.connect(sg);out(sg,{rev:.25});
  };
  const thud=(t,g=.5)=>{
    const o=osc('sine',170,t,.4);o.frequency.exponentialRampToValueAtTime(46,t+.18);
    const og=oc.createGain();env(og.gain,t,g,.003,.28);o.connect(og);out(og,{rev:.15});
  };
  const tick=(t,f=1200,g=.2)=>{const o=osc('triangle',f,t,.08),gn=oc.createGain();env(gn.gain,t,g,.001,.05);o.connect(gn);out(gn,{rev:.1});};
  
  // Ambient atmospheric bed & structural impacts
  impact(0, 0.8);
  impact(2.5, 0.9);
  impact(5.0, 1.0);
  impact(10.5, 1.2); // Glitch slice transformation hit
  impact(17.0, 0.9);
  impact(20.0, 1.1);

  for(let t=0; t<DUR; t+=2) {
    thud(t, 0.3);
  }

  return oc.startRendering();
}
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate;
  const data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=.79/Math.max(peak,1e-6);
  const ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';
  for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await buildAudio());

function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;rg.max=REEL.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s';};
  function loop(){
    if(!playing)return;
    cur=base+(performance.now()-started)/1000;
    if(cur>=REEL.duration){cur=REEL.duration;show(cur);pause();btn.textContent='REPLAY';cur=0;return;}
    show(cur);requestAnimationFrame(loop);
  }
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){
    btn.textContent='PREPARING SOUND…';
    if(!buf)buf=await getAudio();
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);
    base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();
  }
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}

async function boot(){
  try{
    const lat="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([
      document.fonts.load('400 100px "Instrument Serif"',lat),
      document.fonts.load('500 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,/·▾＋－’%'),
      document.fonts.load('700 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-')
    ]).catch(()=>{});
    await document.fonts.ready;
    buildAssets();
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e);}
}
window.addEventListener('load',boot);
})();
