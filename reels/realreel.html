<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Chrome Text Effect Maker — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--ink:#121212;--muted:#736e65;--line:rgba(18,18,18,.14);--chk1:#efece6;--chk2:#ffffff;--bar:'Barlow Condensed',serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;isolation:isolate}
#viewport>*{position:absolute;left:0;top:0}
#ui{width:1080px;height:1920px;background:var(--bg);display:none;z-index:1;overflow:hidden;font-family:var(--mono);color:var(--ink)}
#stage,#grain{width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.10;pointer-events:none}
#vig{z-index:4;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(120% 85% at 50% 46%,rgba(0,0,0,0) 58%,rgba(0,0,0,.14) 100%)}

/* ---- UI scene: mirrors the app's own markup + styling, scaled up for a phone ---- */
#uiCam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 380px}
#uiInner{position:absolute;left:140px;top:0;width:800px;padding-top:380px}
.canvas-container{position:relative;width:800px;height:400px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:24px 24px;border-radius:3px;overflow:hidden}
.canvas-container canvas{width:100%;height:100%;display:block}
.text-input{margin-top:22px;height:96px;border-bottom:2px solid var(--ink);font-family:var(--bar);font-weight:900;font-size:80px;line-height:1.1;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center}
.text-input .sel{background:rgba(36,110,255,.30)}
#uiCaret{display:inline-block;width:4px;height:64px;background:var(--ink);margin-left:3px}
.row{margin-top:20px}
.row-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab{display:flex;align-items:center;gap:12px}
.lab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.85;flex-shrink:0}
.val{color:var(--ink);font-size:24px;letter-spacing:0;border-bottom:2px dashed var(--muted);min-width:56px;text-align:right}
.track{position:relative;height:3px;background:var(--line);margin:22px 0 6px}
.thumb{position:absolute;top:50%;left:0;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.adv{margin-top:26px;border-top:2px solid var(--line);padding-top:18px}
.sum{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.adv-body{overflow:hidden;height:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 34px;padding-top:22px;padding-bottom:4px}
.color-sel{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);padding:10px 0 8px;margin-top:12px}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#E8103C}
.dd{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:14px 0 10px;border-bottom:2px solid var(--line);font-family:var(--mono);font-size:22px;color:var(--ink)}
.btn{margin-top:28px;height:88px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--mono);font-weight:500;font-size:23px;letter-spacing:.12em;border-radius:2px}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
#cursor{position:absolute;left:0;top:0;width:60px;height:60px;z-index:50;pointer-events:none;transform-origin:10px 5px;opacity:0;filter:drop-shadow(0 5px 6px rgba(0,0,0,.28))}
.ripple{position:absolute;width:96px;height:96px;border:4px solid var(--ink);border-radius:50%;opacity:0;z-index:49;pointer-events:none}
#capMask{position:absolute;left:0;top:0;width:1080px;height:366px;background:var(--bg);z-index:5}
#head{position:absolute;left:140px;top:262px;width:800px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-weight:500;font-size:24px;letter-spacing:.1em;text-transform:uppercase}
#head .d{color:var(--muted)}
#ttl{position:absolute;left:140px;top:292px;width:800px;height:76px;font-family:var(--bar);font-weight:900;font-size:80px;line-height:76px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}

/* ---- preview player (normal browser only; never part of the video) ---- */
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <div id="ui">
    <div id="uiCam">
      <div id="uiInner">
        <div class="canvas-container"><canvas id="uiCanvas" width="800" height="400"></canvas></div>
        <div class="text-input" id="uiTextBox"><span id="uiTxt"></span><i id="uiCaret"></i></div>

        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Bevel Depth</span>
            <span class="val" id="vBevel">20px</span>
          </div>
          <div class="track" id="trkBevel"><i class="thumb" id="thBevel"></i></div>
        </div>

        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>Liquid Melt</span>
            <span class="val" id="vMelt">50%</span>
          </div>
          <div class="track" id="trkMelt"><i class="thumb" id="thMelt"></i></div>
        </div>

        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20M2 12h20"/></svg>Rainbow Sheen</span>
            <span class="val" id="vSheen">65%</span>
          </div>
          <div class="track" id="trkSheen"><i class="thumb" id="thSheen"></i></div>
        </div>

        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Gloss &amp; Contrast</span>
            <span class="val" id="vGloss">80%</span>
          </div>
          <div class="track" id="trkGloss"><i class="thumb" id="thGloss"></i></div>
        </div>

        <div class="adv">
          <div class="sum" id="advSum"><span>Color and Size</span><span id="advSign">＋</span></div>
          <div class="adv-body" id="advBody"><div class="grid">
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Size</span><span class="val" id="vSize">140px</span></div>
              <div class="track" id="trkSize"><i class="thumb" id="thSize"></i></div>
            </div>
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>Color</span></div>
              <div class="color-sel"><i class="swatch" id="swatch"></i><span class="val" id="vColor" style="border:0;font-size:22px">#E8103C</span></div>
            </div>
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Custom Font</span></div>
              <div class="dd"><span>Upload Font</span></div>
            </div>
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Export Size</span></div>
              <div class="dd" id="ddExp"><span>4x</span><span style="color:var(--muted)">▾</span></div>
            </div>
          </div></div>
        </div>

        <div class="btn" id="btn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span>DOWNLOAD PNG</span></div>

        <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.2 20.4 L11.3 13.7 L17.5 13.4 Z" fill="#fff" stroke="#121212" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="capMask">
      <div id="head"><span>Callistra.design</span><span class="d">Day 3</span></div>
      <div id="ttl">Liquid Chrome</div>
    </div>
  </div>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="7" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   ENGINE  (reusable)
   ===================================================================== */
const REEL={width:1080,height:1920,fps:30,duration:7,poster:6.4};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const $=id=>document.getElementById(id);
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const EASE={
  lin:p=>p,i2:p=>p*p,i3:p=>p*p*p,o2:p=>1-(1-p)*(1-p),o3:p=>1-Math.pow(1-p,3),
  io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oexp:p=>p>=1?1:1-Math.pow(2,-10*p),
  oback:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
function kf(t,pts){
  if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){
    if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*EASE[b[2]||'io3']((t-a[0])/(b[0]-a[0]));}
  }
  return pts[pts.length-1][1];
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const hex2=n=>Math.round(n).toString(16).padStart(2,'0');
function mixHex(a,b,p){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return'#'+pa.map((v,i)=>hex2(lerp(v,pb[i],p))).join('');}

const BRAND={bg:'#f7f5f0',ink:'#121212',muted:'#736e65'};
/* the three chrome colours used in this reel — no black, no yellow, no green */
const PAL={red:'#E8103C',pink:'#FF3FA4',blue:'#3340FF'};
const BAR='"Barlow Condensed",serif';
const MONO='"JetBrains Mono",ui-monospace,monospace';
const CS=RENDER?1.5:1;            // canvas supersampling (video render = 1.5x, live preview = 1x)

/* =====================================================================
   THE APP'S OWN ALGORITHM — copied from the Liquid Chrome tool, DOM-free
   ===================================================================== */
function hexToRgb(hex){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function hsvToRgb(h,s,v){h=((h%1)+1)%1;const i=Math.floor(h*6),f=h*6-i;const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:return[v,t,p];case 1:return[q,v,p];case 2:return[p,v,t];case 3:return[p,q,v];case 4:return[t,p,v];default:return[v,p,q];}}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;
  if(d>0){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}
  return[h,max===0?0:d/max,max];}
function hash2D(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function smoothNoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const n00=hash2D(i,j),n10=hash2D(i+1,j),n01=hash2D(i,j+1),n11=hash2D(i+1,j+1);
  const top=n00+sx*(n10-n00),bottom=n01+sx*(n11-n01);return top+sy*(bottom-top);}
function fbm(x,y){let total=0,amp=.55,freq=1;for(let k=0;k<3;k++){total+=smoothNoise(x*freq,y*freq)*amp;freq*=2.05;amp*=.5;}return total;}
function edt(mask,Wd,Ht,maxDist){
  const INF=1e8,distSq=new Float32Array(Wd*Ht);
  for(let x=0;x<Wd;x++){let d=INF;
    for(let y=0;y<Ht;y++){const idx=y*Wd+x;d=mask[idx]?0:d+1;distSq[idx]=d*d;}
    d=INF;
    for(let y=Ht-1;y>=0;y--){const idx=y*Wd+x;d=mask[idx]?0:d+1;distSq[idx]=Math.min(distSq[idx],d*d);}
  }
  const s=new Int32Array(Wd),t=new Int32Array(Wd),fin=new Float32Array(Wd*Ht),maxDSq=maxDist*maxDist;
  for(let y=0;y<Ht;y++){
    const ro=y*Wd;let q=0;s[0]=0;t[0]=0;
    for(let u=1;u<Wd;u++){
      while(q>=0){
        const v=s[q],fv=distSq[ro+v],fu=distSq[ro+u];
        const sep=Math.floor((fu-fv+u*u-v*v)/(2*(u-v)));
        if(sep<=t[q]){q--;}else{if(sep<Wd){q++;s[q]=u;t[q]=sep;}break;}
      }
      if(q<0){q=0;s[0]=u;t[0]=0;}
    }
    for(let u=Wd-1;u>=0;u--){
      const v=s[q],d=(u-v)*(u-v)+distSq[ro+v];
      fin[ro+u]=Math.sqrt(Math.min(maxDSq,d));
      if(u===t[q]&&q>0)q--;
    }
  }
  return fin;
}
/* o: text,color,bevel(px),melt(0-1),irid(0-1),refl(0-1),fontSize,scale,bw,bh  → canvas of (bw*scale)x(bh*scale) */
function chromeCanvas(o){
  const{text,color,bevel=20,melt=.5,irid=.65,refl=.8,fontSize=140,scale=1,bw=800,bh=400}=o;
  const tw=Math.round(bw*scale),th=Math.round(bh*scale);
  const out=mkCanvas(tw,th);
  if(!text||!text.trim())return out;
  const tctx=out.getContext('2d');
  const off=mkCanvas(tw,th),octx=off.getContext('2d',{willReadFrequently:true});
  const lines=text.split('\n'),padding=45*scale,refSize=100*scale;
  octx.font=`900 ${refSize}px ${BAR}`;
  let maxRefWidth=1;lines.forEach(l=>{const w=octx.measureText(l).width;if(w>maxRefWidth)maxRefWidth=w;});
  const refTotalHeight=lines.length*(refSize*1.05);
  const availW=Math.max(10*scale,tw-padding),availH=Math.max(10*scale,th-padding);
  const maxFW=(availW*refSize)/maxRefWidth,maxFH=(availH*refSize)/refTotalHeight;
  const calcMax=Math.min(maxFW,maxFH);
  const fs=Math.max(10*scale,Math.min(fontSize*scale,calcMax));
  octx.font=`900 ${fs}px ${BAR}`;octx.textAlign='center';octx.textBaseline='middle';octx.fillStyle='#FFFFFF';
  const lh=fs*1.05,totH=lines.length*lh;let startY=(th/2)-(totH/2)+(lh/2);
  lines.forEach((l,i)=>octx.fillText(l,tw/2,startY+i*lh));
  const md=octx.getImageData(0,0,tw,th).data,mask=new Uint8Array(tw*th);
  for(let i=0,p=3;i<mask.length;i++,p+=4)mask[i]=md[p]>110?1:0;
  const bev=Math.max(2,bevel);
  const maxRadius=Math.max(4,bev*scale);
  const distMap=edt(mask,tw,th,maxRadius);
  const heightMap=new Float32Array(tw*th),noiseScale=.016/scale,meltD=melt*(14*scale);
  for(let y=0;y<th;y++){const row=y*tw;for(let x=0;x<tw;x++){
    const idx=row+x,d=distMap[idx];
    if(d>0){
      const nD=Math.min(1,d/maxRadius);
      let el=Math.sqrt(Math.max(0,1-Math.pow(1-nD,2)));
      if(meltD>0){
        const wave=fbm(x*noiseScale,y*noiseScale);
        const ripple=Math.sin(wave*Math.PI*4+nD*3)*.18;
        el=Math.max(.05,Math.min(1,el+ripple*melt));
      }
      heightMap[idx]=el;
    }
  }}
  const urgb=hexToRgb(color),uh=rgbToHsv(urgb.r,urgb.g,urgb.b);
  const isDark=uh[2]<.12,isWhite=uh[1]<.08&&uh[2]>.92,isNeutral=isDark||isWhite||uh[1]<.08;
  const baseHue=uh[0],vividSat=Math.max(uh[1],.75);
  const td=tctx.createImageData(tw,th),px=td.data;
  for(let y=1;y<th-1;y++){const row=y*tw;for(let x=1;x<tw-1;x++){
    const idx=row+x;
    if(!mask[idx])continue;
    const dzdx=(heightMap[idx+1]-heightMap[idx-1])*1.8,dzdy=(heightMap[idx+tw]-heightMap[idx-tw])*1.8,nz=.45;
    const len=Math.sqrt(dzdx*dzdx+dzdy*dzdy+nz*nz)||1;
    const nx=-dzdx/len,ny=-dzdy/len,normZ=nz/len;
    const refX=2*nx*normZ,refY=2*ny*normZ;
    const theta=Math.atan2(refY,refX),rho=Math.min(1,Math.sqrt(refX*refX+refY*refY)),normAngle=(theta+Math.PI)/(Math.PI*2);
    const horizon=Math.sin(refY*Math.PI*3.2+Math.cos(refX*Math.PI*2.2));
    const chromeLobe=Math.pow(Math.max(0,.5+.5*horizon),2.2);
    const topLight=Math.pow(Math.max(0,refY*.65+refX*.35+.5),2.5);
    let core=45+chromeLobe*160+topLight*150;core=Math.min(255,core*refl);
    const L=core/255,edgeMask=.45+(1-normZ)*.55;
    const wave1=Math.sin(normAngle*Math.PI*4+refY*2.8),wave2=Math.cos(rho*Math.PI*3.2-refX*1.6);
    const tt=.5+.5*(wave1*.6+wave2*.4);
    let r,g,b;
    if(isNeutral){
      if(isWhite){r=core;g=core*.98;b=core*1.02;}
      else{const db=25+chromeLobe*60+topLight*180;r=db*.95;g=db*.98;b=db*1.05;}
      if(irid>0){const spec=hsvToRgb(tt*1.2,.9,.4+.6*Math.min(1,L+.2));const k=Math.min(1,irid*edgeMask*1.15);
        r=r*(1-k)+spec[0]*255*k;g=g*(1-k)+spec[1]*255*k;b=b*(1-k)+spec[2]*255*k;}
    }else{
      const hue=baseHue+(tt-.5)*(300/360)*irid*edgeMask;
      const pure=hsvToRgb(hue,vividSat,1);
      if(L<.5){const k=.12+.88*(L/.5);r=pure[0]*k*255;g=pure[1]*k*255;b=pure[2]*k*255;}
      else{const w=Math.min(1,(L-.5)/.5),mw=w*w*.7;r=(pure[0]*(1-mw)+mw)*255;g=(pure[1]*(1-mw)+mw)*255;b=(pure[2]*(1-mw)+mw)*255;}
      const fres=Math.pow(Math.max(0,1-normZ),2.2),rim=fres*.45*refl;
      r+=pure[0]*255*rim;g+=pure[1]*255*rim;b+=pure[2]*255*rim;
    }
    const spL=Math.min(1,Math.pow(Math.max(0,-refX*.45-refY*.7+.6),8)*(refl*1.4));
    r+=(255-r)*spL;g+=(255-g)*spL;b+=(255-b)*spL;
    if(isNeutral){const fr=Math.pow(Math.max(0,1-normZ),2.2),rg=fr*120*refl;r+=rg;g+=rg*1.05;b+=rg*1.15;}
    const d=distMap[idx];let alpha=255;

/* ---------- hook copy ---------- */
const HOOK_SRC=[
  {t0:S1_T0,t1:HS2-.06,lines:[["IT'S",{t:'DAY 3',c:'red'},'OF'],['CREATING','A','NEW'],['TEXT','EFFECT','MAKER'],['EVERYDAY.']],maxFs:176},
  {t0:S2_T0,t1:A,lines:[['IT','WILL','BE',{t:'FREE',c:'pink'}],['FOR','TODAY','AND'],['ACCESSIBLE','AT'],[{t:'CALLISTRA.DESIGN',c:'blue'}]],maxFs:176}

const stage=$('stage'),sc=stage.getContext('2d');

/* lay out the two hook sentences, bake chrome words with the app's algorithm */
function buildHook(){
  const m=mkCanvas(10,10).getContext('2d');
  const meas=s=>{m.font=`900 100px ${BAR}`;return m.measureText(s).width;};
  const sp=meas(' ');
  HOOK_SRC.forEach(src=>{
    let maxW=1;
    const lw=src.lines.map(line=>{
      let w=0;line.forEach((it,i)=>{const s=typeof it==='string'?it:it.t;w+=meas(s)+(i?sp:0);});
      maxW=Math.max(maxW,w);return w;});
    const fs=Math.min(src.maxFs,880*100/maxW);
    const lh=fs*.98,total=src.lines.length*lh,cy0=930-total/2+lh/2;
    let idx=0;const lines=src.lines.map((line,li)=>{
      let x=540-lw[li]*fs/100/2;const words=[];
      line.forEach(it=>{
        const s=typeof it==='string'?it:it.t,ww=meas(s)*fs/100;
        const wd={s,x,w:ww,idx:idx++,chrome:null};
        if(it.c){
          const bw=Math.ceil(ww)+60,bh=Math.ceil(fs*1.05)+70;
          wd.chrome={cv:chromeCanvas({text:s,color:PAL[it.c],bevel:20*fs/140,melt:.5,irid:.65,refl:.8,fontSize:fs,scale:1.5,bw,bh}),bw,bh};
        }
        words.push(wd);x+=ww+sp*fs/100;
      });
      return{cy:cy0+li*lh,words};
    });
    HOOK.push({fs,lh,lines,t0:src.t0,t1:src.t1,count:idx});
  });
  const rnd=mulberry32(5);grainTile=mkCanvas(512,512);
  const g=grainTile.getContext('2d'),id=g.createImageData(512,512);
  for(let i=0;i<512*512;i++){const v=rnd()*255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
  g.putImageData(id,0,0);
}
function flash(c,a,col){if(a>.005){c.save();c.globalAlpha=a;c.fillStyle=col;c.fillRect(0,0,W,H);c.restore();}}

/* ---------- 0 – 2.2 s : the opening line ---------- */
function drawHook(c,t){
  c.fillStyle=BRAND.bg;c.fillRect(0,0,W,H);
  const si=t<HS2?0:1,S=HOOK[si];
  const exit=si===0?prog(t,HS2-.07,.07,'i2'):0;
  /* small shake when the chrome word lands */
  const lt=si===0?S.t0+1*WSTAG+.12:S2_T0+3*WSTAG+.12,q=t-lt;
  let sx=0,sy=0;if(q>=0&&q<.5){const a=7*Math.exp(-q*22);sx=Math.sin(t*210)*a;sy=Math.cos(t*173)*a*.8;}
  c.save();c.translate(sx,sy);
  S.lines.forEach((ln,li)=>{
    c.save();
    c.beginPath();c.rect(0,ln.cy-S.lh*.62,W,S.lh*1.24);c.clip();
    ln.words.forEach(wd=>{
      const p=prog(t,S.t0+wd.idx*WSTAG,WDUR,'oexp');
      if(p<=0)return;
      const dy=(1-p)*S.fs*1.15-exit*S.fs*1.2;
      if(wd.chrome){
        const k=wd.chrome;
        c.drawImage(k.cv,wd.x-(k.bw-wd.w)/2,ln.cy+dy-k.bh/2,k.bw,k.bh);
      }else{
        c.font=`900 ${S.fs}px ${BAR}`;c.textBaseline='middle';c.textAlign='left';c.fillStyle=BRAND.ink;
        c.fillText(wd.s,wd.x,ln.cy+dy);
      }
    });
    c.restore();
  });
  c.restore();
}

function thumbPos(row,v){const[mn,mx]=TR[row],tr=M.trk[row],r=12;return[tr.x+r+(tr.w-2*r)*((v-mn)/(mx-mn)),tr.y+tr.h/2];}
function arc(a,b,p){

    {t0:R(.67),t1:R(.78),to:()=>thumbPos('bevel',DEF.bevel)},

function renderFrame(t){
  t=clamp(t,0,REEL.duration);
  sc.setTransform(1,0,0,1,0,0);sc.clearRect(0,0,W,H);

async function buildAudio(){
  const SR=44100,DUR=REEL.duration;

  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate;
  const data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=peak>.79?.79/peak:1;           // peak stays below -2 dBFS
  const ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';
  for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER (normal browser only) + BOOT
   ===================================================================== */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;rg.max=REEL.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s';};
  function loop(){
    if(!playing)return;
    cur=base+(performance.now()-started)/1000;
    if(cur>=REEL.duration){cur=REEL.duration;show(cur);pause();btn.textContent='REPLAY';cur=0;return;}
    show(cur);requestAnimationFrame(loop);
  }
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){
    btn.textContent='PREPARING SOUND…';
    if(!buf)buf=await getAudio();
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);
    base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();
  }
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}

async function boot(){
  try{
    const lat="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([
      document.fonts.load('900 100px "Barlow Condensed"',lat),
      document.fonts.load('500 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,/·▾＋－#&'),
      document.fonts.load('700 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-')
    ]).catch(()=>{});
    await document.fonts.ready;
    buildHook();
    ui.style.display='block';measure();ui.style.display='none';buildSeg();
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e);}
}
window.addEventListener('load',boot);
})();
