<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Text Is Your Design — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo+Black&family=Barlow+Condensed:wght@900&family=Barlow+Semi+Condensed:wght@900&family=Caveat:wght@700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--ink:#121212;--muted:#736e65;--line:rgba(18,18,18,.15);--chk1:#efece6;--chk2:#ffffff;--serif:'Instrument Serif',serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#fcfbf8;transform-origin:0 0;isolation:isolate}
#viewport>*{position:absolute;left:0;top:0}
#ui{width:1080px;height:1920px;background:var(--bg);display:none;z-index:1;overflow:hidden;font-family:var(--mono);color:var(--ink)}
#stage,#grain{width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.10;pointer-events:none}
#vig{z-index:4;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(120% 85% at 50% 46%,rgba(0,0,0,0) 62%,rgba(0,0,0,.10) 100%)}

/* ---- maker scenes: mirror the apps' own markup + styling, scaled up for a phone ---- */
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;overflow:hidden;background:var(--bg)}
.cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 340px}
.inner{position:absolute;left:110px;top:0;width:800px;padding-top:340px}
.canvas-container{position:relative;width:800px;height:400px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:24px 24px;border-radius:3px;overflow:hidden}
.canvas-container canvas{width:100%;height:100%;display:block}
.text-input{margin-top:24px;height:100px;border-bottom:2px solid var(--ink);font-weight:400;font-size:84px;line-height:1.1;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center}
.row{margin-top:24px}
.row-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab{display:flex;align-items:center;gap:12px}
.lab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.85;flex-shrink:0}
.val{color:var(--ink);font-size:24px;letter-spacing:0;border-bottom:2px dashed var(--muted);min-width:56px;text-align:right}
.track{position:relative;height:3px;background:var(--line);margin:26px 0 8px}
.thumb{position:absolute;top:50%;left:0;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.adv{margin-top:30px;border-top:2px solid var(--line);padding-top:20px}
.sum{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{margin-top:30px;height:88px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--mono);font-weight:500;font-size:23px;letter-spacing:.12em;border-radius:2px}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.cursor{position:absolute;left:0;top:0;width:60px;height:60px;z-index:50;pointer-events:none;transform-origin:10px 5px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.28))}
.ripple{position:absolute;width:96px;height:96px;border:4px solid var(--ink);border-radius:50%;opacity:0;z-index:49;pointer-events:none}
.capmask{position:absolute;left:0;top:0;width:1080px;height:336px;background:var(--bg);z-index:5}
.cap{position:absolute;left:110px;top:236px;width:800px;height:92px;overflow:hidden}
.capl{position:absolute;left:0;top:0;width:800px;height:92px;display:flex;align-items:center;gap:22px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:64px;line-height:92px;white-space:nowrap}
.capl b{font-family:var(--mono);font-style:normal;font-weight:500;font-size:26px;color:var(--muted);letter-spacing:.1em}
.capl i{margin-left:auto;font-family:var(--mono);font-style:normal;font-weight:500;font-size:17px;letter-spacing:.12em;color:var(--muted)}

/* ---- preview player (normal browser only; never part of the video) ---- */
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <div id="ui"></div>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="7" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   ENGINE  (reusable)
   ===================================================================== */
const RENDER=/[?&]render=1/.test(location.search);
const $=id=>document.getElementById(id);
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const EASE={
  lin:p=>p,i2:p=>p*p,i3:p=>p*p*p,o2:p=>1-(1-p)*(1-p),o3:p=>1-Math.pow(1-p,3),
  io2:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,
  io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oexp:p=>p>=1?1:1-Math.pow(2,-10*p),
  oback:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const BRAND={bg:'#f7f5f0',ink:'#121212',muted:'#736e65',paper:'#fcfbf8'};

/* =====================================================================
   TIMELINE (seconds) — visuals and sound read the same numbers.
   To slow the pen down, lengthen the WORDS windows; everything else follows.
   ===================================================================== */
const HOOK_END=3.8;                  // typography hook ends, maker showcase starts
const SD=.54;                        // one maker glance
const SHOW_T0=k=>HOOK_END+k*SD;
const NMAKERS=5;
const DUR=HOOK_END+NMAKERS*SD+.2;    // 6.7 s (last glance holds on the finished defaults)
/* pen windows: [draw start, draw end] per word, with a short lifted travel between */
const WORDS=[[0,.62],[.76,1.36],[1.50,1.84],[1.98,2.58],[2.72,3.38]];
const PEN_EXIT=[3.40,3.76];
const FILL_DIM=[3.40,3.72];

/* =====================================================================
   HOOK — alphabet specimen sheet, pen circles the five words
   ===================================================================== */
const CELL=120,COLS=9,ROWS=16;
const FONTS=[
  {f:'Abril Fatface',w:400,s:'normal',k:1.00},
  {f:'Instrument Serif',w:400,s:'normal',k:1.15},
  {f:'Playfair Display',w:900,s:'normal',k:.98},
  {f:'Anton',w:400,s:'normal',k:1.00},
  {f:'Space Grotesk',w:700,s:'normal',k:1.00},
  {f:'Archivo Black',w:400,s:'normal',k:.92},
  {f:'Barlow Condensed',w:900,s:'normal',k:1.18},
  {f:'JetBrains Mono',w:700,s:'normal',k:.96},
  {f:'Caveat',w:700,s:'normal',k:1.28},
  {f:'Instrument Serif',w:400,s:'italic',k:1.15}
];
/* the five words, placed on purpose: across, down, across, diagonal, across */
const SENT=[
  {cells:[[1,2],[2,2],[3,2],[4,2]],ch:'Your',fn:[0,8,4,2],dir:1,th:-2.3,seed:3},
  {cells:[[6,3],[6,4],[6,5],[6,6]],ch:'text',fn:[3,9,5,8],dir:-1,th:-2.0,seed:11},
  {cells:[[2,5],[3,5]],ch:'is',fn:[6,7],dir:1,th:-2.5,seed:5},
  {cells:[[1,7],[2,8],[3,9],[4,10]],ch:'your',fn:[2,5,1,3],dir:-1,th:-2.2,seed:17},
  {cells:[[1,12],[2,12],[3,12],[4,12],[5,12],[6,12],[7,12]],ch:'design.',fn:[4,0,8,2,1,6,7],dir:1,th:-2.4,seed:23}
];
let LET=[],LOOPS=[],hookReady=false;
function buildHook(){
  const rnd=mulberry32(2024),cx=document.createElement('canvas').getContext('2d');
  const used={};
  SENT.forEach((w,wi)=>[...w.ch].forEach((ch,i)=>{used[w.cells[i][0]+','+w.cells[i][1]]={w:wi,i,ch,fn:w.fn[i]};}));
  const pool='abcdefghijklmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZabdeghkmnqrstuw';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const u=used[c+','+r];
    let ch,fi,size,rot,jx,jy,alpha;
    if(u){ch=u.ch;fi=u.fn;const F=FONTS[fi];size=100*F.k*(ch==='.'?1.5:1);rot=(rnd()-.5)*.09;jx=(rnd()-.5)*8;jy=(rnd()-.5)*8;}
    else{ch=pool[Math.floor(rnd()*pool.length)];fi=Math.floor(rnd()*FONTS.length);const F=FONTS[fi];size=(54+rnd()*54)*F.k;rot=(rnd()-.5)*.34;jx=(rnd()-.5)*26;jy=(rnd()-.5)*26;}
    const F=FONTS[fi];cx.font=`${F.s} ${F.w} ${size}px "${F.f}"`;
    const m=cx.measureText(ch);
    LET.push({ch,fi,size,rot,x:c*CELL+CELL/2+jx,y:r*CELL+CELL/2+jy,w:u?u.w:-1,i:u?u.i:-1,
      dy:(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2});
  }
  /* hand-drawn loops: imperfect ellipses that overshoot and never quite meet */
  SENT.forEach((w,wi)=>{
    const a0=w.cells[0],a1=w.cells[w.cells.length-1];
    const p0=[a0[0]*CELL+CELL/2,a0[1]*CELL+CELL/2],p1=[a1[0]*CELL+CELL/2,a1[1]*CELL+CELL/2];
    const span=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]);
    const r2=mulberry32(w.seed*77);
    LOOPS.push({cx:(p0[0]+p1[0])/2+(r2()-.5)*10,cy:(p0[1]+p1[1])/2+(r2()-.5)*10,
      phi:Math.atan2(p1[1]-p0[1],p1[0]-p0[0]),a:span/2+104,b:92+r2()*10,
      th:w.th,dir:w.dir,turns:1.1+r2()*.05,p1:r2()*6.28,p2:r2()*6.28,p3:r2()*6.28,drift:.08+r2()*.04,
      s0:wi===0?.07:0});
  });
  hookReady=true;
}
function loopPt(L,s){
  const th=L.th+L.dir*Math.PI*2*L.turns*s;
  const r=1+.035*Math.sin(2*th+L.p1)+.028*Math.sin(3*th+L.p2)+.015*Math.sin(5*th+L.p3)+L.drift*s;
  const x=L.a*r*Math.cos(th),y=L.b*r*Math.sin(th),c=Math.cos(L.phi),sn=Math.sin(L.phi);
  return[L.cx+x*c-y*sn,L.cy+x*sn+y*c];
}
/* draw progress of word i at time t (0..1 along its loop) */
function wordS(i,t){
  const[a,b]=WORDS[i];if(t<a)return i===0?LOOPS[0].s0:0;
  const u=clamp((t-a)/(b-a));
  const e=i===0?EASE.o2(u):EASE.io2(u);
  return lerp(LOOPS[i].s0,1,e);
}
function wordDone(i,t){return t>=WORDS[i][1]-.04;}
/* pen tip position, lift (0 drawing … 1 travelling) */
function penState(t){
  for(let i=0;i<WORDS.length;i++){
    const[a,b]=WORDS[i];
    if(t<=b){
      if(t>=a||i===0){const s=wordS(i,t);return{p:loopPt(LOOPS[i],s),lift:0,i};}
      /* travelling from word i-1 end to word i start */
      const pb=WORDS[i-1][1],u=EASE.io3(clamp((t-pb)/(a-pb)));
      const A=loopPt(LOOPS[i-1],1),B=loopPt(LOOPS[i],LOOPS[i].s0);
      const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy)||1;
      const cxp=mx-dy/d*d*.16,cyp=my+dx/d*d*.16;
      const x=(1-u)*(1-u)*A[0]+2*(1-u)*u*cxp+u*u*B[0],y=(1-u)*(1-u)*A[1]+2*(1-u)*u*cyp+u*u*B[1];
      return{p:[x,y],lift:Math.sin(Math.PI*u),i:i-.5};
    }
  }
  /* after the sentence: the pen lifts and slides away to the upper right */
  const last=loopPt(LOOPS[WORDS.length-1],1),u=EASE.io3(clamp((t-PEN_EXIT[0])/(PEN_EXIT[1]-PEN_EXIT[0])));
  return{p:[last[0]+u*620,last[1]-u*980],lift:Math.min(1,u*3),i:99};
}
function strokeLoop(c,L,s,alpha=1){
  if(s<=0)return;
  const N=Math.max(2,Math.ceil(170*s));
  c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle='#101011';c.globalAlpha=alpha;
  let prev=loopPt(L,0);
  for(let k=1;k<=N;k++){
    const q=s*k/N,p=loopPt(L,q);
    const wd=6.6*(.55+.45*Math.min(1,q/.07))*(1-.55*clamp((q-.9)/.1))*(1+.12*Math.sin(q*31+L.p1));
    c.lineWidth=wd;c.beginPath();c.moveTo(prev[0],prev[1]);c.lineTo(p[0],p[1]);c.stroke();prev=p;
  }
  c.restore();
}
/* the pen, seen from above. tip at (x,y); body runs to the upper right and out of frame */
function drawPen(c,x,y,ang,lift){
  c.save();c.translate(x,y);c.rotate(ang);c.scale(1,1.32);
  const L=1500,tipL=96;
  const body=(g)=>{
    c.beginPath();
    c.moveTo(0,0);c.lineTo(tipL,-12);c.lineTo(tipL+16,-12.5);c.lineTo(tipL+16,-15);c.lineTo(340,-18.5);c.lineTo(L,-19);
    c.lineTo(L,19);c.lineTo(340,18.5);c.lineTo(tipL+16,15);c.lineTo(tipL+16,12.5);c.lineTo(tipL,12);c.closePath();
  };
  /* soft shadow, bigger and further when the pen is lifted */
  c.save();c.shadowColor='rgba(0,0,0,.30)';c.shadowBlur=18+lift*26;c.shadowOffsetX=22+lift*26;c.shadowOffsetY=34+lift*30;
  /* (canvas shadow offsets ignore the transform, so the shadow always falls to the lower right) */
  c.fillStyle='#0a0a0a';body();c.fill();c.restore();
  /* barrel */
  let g=c.createLinearGradient(0,-19,0,19);
  g.addColorStop(0,'#050505');g.addColorStop(.28,'#34343a');g.addColorStop(.42,'#17171a');g.addColorStop(1,'#030303');
  c.fillStyle=g;body();c.fill();
  /* metal tip section */
  g=c.createLinearGradient(0,-13,0,13);g.addColorStop(0,'#6a6a70');g.addColorStop(.35,'#e7e7ea');g.addColorStop(.6,'#9b9ba2');g.addColorStop(1,'#4b4b50');
  c.fillStyle=g;c.beginPath();c.moveTo(7,-1.6);c.lineTo(tipL,-12);c.lineTo(tipL+16,-12.5);c.lineTo(tipL+16,12.5);c.lineTo(tipL,12);c.lineTo(7,1.6);c.closePath();c.fill();
  c.fillStyle='#0b0b0c';c.beginPath();c.moveTo(0,0);c.lineTo(10,-2);c.lineTo(10,2);c.closePath();c.fill();
  /* grip ring + clip + gloss */
  c.fillStyle='rgba(255,255,255,.22)';c.fillRect(tipL+36,-3.5,L,3);
  g=c.createLinearGradient(0,-19,0,19);g.addColorStop(0,'#55555b');g.addColorStop(.4,'#d9d9dd');g.addColorStop(1,'#6a6a70');
  c.fillStyle=g;c.fillRect(tipL+16,-16,12,32);c.fillRect(560,-26,330,9);
  c.restore();
}
function drawLetter(c,l,alpha,color,scale){
  const F=FONTS[l.fi];
  c.save();c.translate(l.x,l.y);c.rotate(l.rot);c.scale(scale,scale);
  c.font=`${F.s} ${F.w} ${l.size}px "${F.f}"`;c.textAlign='center';c.textBaseline='alphabetic';
  c.fillStyle=color;c.globalAlpha=alpha;c.fillText(l.ch,0,l.dy);c.restore();
}
function drawHook(c,t){
  c.fillStyle=BRAND.paper;c.fillRect(0,0,W,H);
  const zoom=1+.03*prog(t,0,HOOK_END,'io2');
  c.save();c.translate(540,900);c.scale(zoom,zoom);c.translate(-540,-900);
  const dim=prog(t,FILL_DIM[0],FILL_DIM[1]-FILL_DIM[0],'io2');
  const fillA=lerp(.62,.2,dim);
  /* fillers */
  for(const l of LET)if(l.w<0)drawLetter(c,l,fillA,'#141414',1);
  /* sentence letters: stay quiet until their loop closes, then pop to full ink */
  for(const l of LET)if(l.w>=0){
    const done=WORDS[l.w][1]-.06,q=t-done-l.i*.035;
    let a=fillA*1.0,col='#141414',sc=1;
    if(q>=0){a=lerp(fillA,1,clamp(q/.08));sc=1+.16*Math.sin(Math.PI*clamp(q/.28))*Math.exp(-q*3);}
    drawLetter(c,l,a,col,sc);
  }
  /* loops */
  for(let i=0;i<WORDS.length;i++){const s=wordS(i,t);if(t>=WORDS[i][0]||i===0)strokeLoop(c,LOOPS[i],s);}
  /* pen */
  const ps=penState(t),dt=1/120,pn=penState(t+dt),pv=penState(Math.max(0,t-dt));
  const vx=(pn.p[0]-pv.p[0])/(2*dt);
  const ang=-1.22+clamp(vx/9000,-.12,.12)+.02*Math.sin(t*3.1);
  drawPen(c,ps.p[0],ps.p[1],ang,ps.lift);
  c.restore();
}

/* =====================================================================
   THE FIVE MAKERS — each one runs the app's own render code
