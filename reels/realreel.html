<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Callistra — Glitch Slice Short Film (Reel)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#vp{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;background:#111}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px}
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px 'JetBrains Mono',monospace;z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px 'JetBrains Mono',monospace}
#player input{flex:1}
</style>
</head>
<body>
<div id="vp"><canvas id="stage" width="1080" height="1920"></canvas></div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="44" step="0.01" value="0"><span id="pTime">0.0s</span></div>
<script>
(()=>{
/* ===== CONTRACT ===== */
const W=1080,H=1920,R={width:W,height:H,fps:30,duration:44,poster:42.6};window.REEL=R;
const RENDER=/[?&]render=1/.test(location.search),$=i=>document.getElementById(i);
const PI=Math.PI,cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lp=(a,b,p)=>a+(b-a)*p;
const E={l:p=>p,o2:p=>1-(1-p)*(1-p),io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const pg=(t,s,d,e='l')=>E[e](cl((t-s)/d)),sm=p=>{p=cl(p);return p*p*(3-2*p)};
const tri=x=>1-4*Math.abs(x-Math.floor(x)-.5);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(w,h)=>{const e=document.createElement('canvas');e.width=w;e.height=h;return e};
const S=$('stage').getContext('2d'),SC2=mk(W,H),X2=SC2.getContext('2d');
const SERIF='"Instrument Serif",serif',MONO='"JetBrains Mono",monospace';
const grad=(c,x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([p,col])=>g.addColorStop(p,col));return g};

/* ===== GLITCH SLICE — the app's own algorithm, DEFAULT values untouched ===== */
const GS={text:'STAY STRAIGHT',fringe:2,shear:9,chaos:.30,fontSize:140,color:'#000000',font:'"Instrument Serif", serif'};
const sr=(x,y)=>{const n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n)};
function glitch(scale,doSlice){
  const tw=800*scale,th=400*scale,off=mk(tw,th),o=off.getContext('2d');
  const fr=GS.fringe,sh=GS.shear,ch=GS.chaos,lines=GS.text.split('\n'),pad=sh*scale+40*scale,ref=100*scale;
  o.font=`400 ${ref}px ${GS.font}`;let mw=1;lines.forEach(l=>{mw=Math.max(mw,o.measureText(l).width)});
  const rh=lines.length*ref*1.1,aw=Math.max(10*scale,tw-pad),ah=Math.max(10*scale,th-pad);
  const size=Math.max(10*scale,Math.min(GS.fontSize*scale,Math.min(aw*ref/mw,ah*ref/rh)));
  o.font=`400 ${size}px ${GS.font}`;o.textAlign='center';o.textBaseline='middle';o.fillStyle=GS.color;
  const lh=size*1.1,sy=th/2-lines.length*lh/2+lh/2;lines.forEach((l,i)=>o.fillText(l,tw/2,sy+i*lh));
  if(!doSlice)return off;
  const src=new Uint32Array(o.getImageData(0,0,tw,th).data.buffer),out=mk(tw,th),oc=out.getContext('2d'),td=oc.createImageData(tw,th),tb=new Uint32Array(td.data.buffer);
  for(let dy=0;dy<th;dy++){
    const band=Math.floor(dy/scale/fr),dir=band%2===0?1:-1,wave=Math.sin(band*.4)*sh;
    const ci=sr(0,Math.floor(band/3))*1.5+sr(0,band)*.5,shift=wave*(1-ch)+dir*ci*sh*ch,s0=Math.round(shift*scale),ro=dy*tw;
    for(let dx=0;dx<tw;dx++){const sx=dx-s0;if(sx>=0&&sx<tw){const p=src[ro+sx];if(p!==0)tb[ro+dx]=p}}
  }
  oc.putImageData(td,0,0);return out;
}

/* ===== ASSETS ===== */
let GRAIN,PAPER,BLD,BILL,GL,LT,LM;
function buildAssets(){
  const r=rng(5);
  const g=mk(512,512),gc=g.getContext('2d'),gd=gc.createImageData(512,512);
  for(let i=0;i<gd.data.length;i+=4){const v=r()*255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255}
  gc.putImageData(gd,0,0);GRAIN=S.createPattern(g,'repeat');
  const p=mk(256,256),pc=p.getContext('2d');
  for(let i=0;i<2600;i++){pc.fillStyle=r()<.5?'rgba(120,110,90,.10)':'rgba(255,255,255,.35)';pc.fillRect(r()*256,r()*256,1+r()*2,1+r()*1.5)}
  PAPER=S.createPattern(p,'repeat');
  const lm=mk(720,360),lx=lm.getContext('2d');lx.fillStyle='#000';
  LAND.forEach(po=>{lx.beginPath();po.forEach(([lo,la],i)=>lx[i?'lineTo':'moveTo']((lo+180)*2,(90-la)*2));lx.closePath();lx.fill()});
  LM=lx.getImageData(0,0,720,360);LT=mk(760,760);
  /* the building (clean, straight) */
  const b=(BLD=mk(W,H)).getContext('2d');
  b.fillStyle=grad(b,290,0,790,0,[[0,'#c3c6c7'],[.5,'#b4b8b9'],[1,'#a7abad']]);b.fillRect(290,170,500,1350);
  b.fillStyle='#8d9294';b.fillRect(276,148,528,30);b.fillStyle='#7d8284';b.fillRect(276,172,528,6);
  b.fillStyle='#9ea2a4';b.fillRect(290,178,30,1342);b.fillRect(760,178,30,1342);
  for(let k=0;k<14;k++){
    const y=236+k*84;b.fillStyle='#a1a5a7';b.fillRect(290,y-6,500,7);b.fillStyle='rgba(255,255,255,.25)';b.fillRect(290,y+1,500,2);
    for(let i=0;i<5;i++){
      const x=332+i*88;b.fillStyle='#3a4146';b.fillRect(x-4,y+8,72,62);
      b.fillStyle=grad(b,x,y+12,x+64,y+66,[[0,'#8ea1ad'],[.5,'#5d717e'],[1,'#3f515c']]);b.fillRect(x,y+12,64,54);
      b.fillStyle='rgba(255,255,255,.18)';b.beginPath();b.moveTo(x,y+66);b.lineTo(x+34,y+12);b.lineTo(x+50,y+12);b.lineTo(x+16,y+66);b.fill();
      b.fillStyle='#3a4146';b.fillRect(x+30,y+12,3,54);
    }
  }
  b.fillStyle='#2f383d';b.fillRect(350,1420,380,92);b.fillStyle='#8d9ca4';for(let i=0;i<4;i++)b.fillRect(354+i*93,1424,87,84);
  b.fillStyle='#808587';b.fillRect(276,1508,528,14);
  /* the billboard typography: clean + Glitch Slice, scale 2 */
  BILL={c:mk(1600,800),clean:glitch(2,false),gl:glitch(2,true)};
}
function billUpdate(p){
  const b=BILL.c.getContext('2d');b.clearRect(0,0,1600,800);b.drawImage(BILL.clean,0,0);if(p<=0)return;
  for(let i=0;i<200;i++){const th=.62*(i/200)+.38*sr(3.1,i);if(th<p*1.001){b.clearRect(0,i*4,1600,4);b.drawImage(BILL.gl,0,i*4,1600,4,0,i*4,1600,4)}}
}

/* ===== PENCIL ===== */
function pencil(c,x,y,a,s,lift){
  c.save();c.translate(x,y);c.rotate(a);c.scale(s,s);
  c.save();c.shadowColor='rgba(0,0,0,'+(.34-.12*lift)+')';c.shadowBlur=(14+lift*26)*s;c.shadowOffsetX=10+lift*24;c.shadowOffsetY=14+lift*30;
  c.fillStyle='#2d3033';c.fillRect(-520,-13,458,26);c.restore();
  c.fillStyle='#d6b78c';c.beginPath();c.moveTo(-16,-5);c.lineTo(-62,-13);c.lineTo(-62,13);c.lineTo(-16,5);c.fill();
  c.fillStyle='#202224';c.beginPath();c.moveTo(0,0);c.lineTo(-18,-5.4);c.lineTo(-18,5.4);c.fill();
  c.fillStyle='#2d3033';c.fillRect(-520,-13,458,26);c.fillStyle='#3f4346';c.fillRect(-520,-13,458,9);c.fillStyle='#1f2123';c.fillRect(-520,5,458,8);
  c.fillStyle='#9a9ea2';c.fillRect(-552,-13,32,26);c.fillStyle='#74787c';c.fillRect(-538,-13,3,26);c.fillRect(-546,-13,3,26);
  c.fillStyle='#c9c2b6';c.beginPath();c.roundRect(-592,-13,40,26,6);c.fill();
  c.restore();
}

/* ===== SCENE 1: CLASSROOM (0–4.7) ===== */
function sClass(c,t){
  const e=E.io(pg(t,.4,4.2)),z=lp(1,2.75,e),cy=lp(960,1450,e);
  c.save();c.translate(540,960);c.scale(z,z);c.translate(-540,-cy);
  c.fillStyle=grad(c,0,0,0,1250,[[0,'#d6d2c8'],[1,'#c4bfb3']]);c.fillRect(-900,-900,2880,2150);
  let g=c.createRadialGradient(950,150,40,950,150,1100);g.addColorStop(0,'rgba(255,252,240,.45)');g.addColorStop(1,'rgba(255,252,240,0)');c.fillStyle=g;c.fillRect(-900,-900,2880,2150);
  c.fillStyle='#b5b0a4';c.fillRect(-900,1060,2880,20);c.fillStyle='#8c887f';c.fillRect(-900,1250,2880,70);
  /* hanging ruler + set square (inorganic wall objects) */
  c.fillStyle='#c7c9ca';c.fillRect(62,300,36,640);c.fillStyle='#6b6e70';for(let i=0;i<32;i++)c.fillRect(62,310+i*20,i%5?14:24,2);
  c.fillStyle='rgba(120,150,170,.4)';c.strokeStyle='#7d8b93';c.lineWidth=3;c.beginPath();c.moveTo(965,330);c.lineTo(965,520);c.lineTo(1045,520);c.closePath();c.fill();c.stroke();
  /* board */
  c.fillStyle='#8d9195';c.fillRect(140,250,800,570);c.fillStyle=grad(c,0,266,0,804,[[0,'#2c3032'],[1,'#212426']]);c.fillRect(156,266,768,538);
  c.fillStyle='rgba(255,255,255,.035)';c.fillRect(200,330,500,60);c.fillRect(420,640,380,50);
  c.fillStyle='#7e8387';c.fillRect(140,820,800,18);c.fillStyle='#e8e5dc';c.fillRect(200,824,34,8);c.fillRect(260,826,22,7);
  c.textAlign='center';c.textBaseline='alphabetic';c.fillStyle='#ece9e0';c.font=`400 92px ${SERIF}`;
  c.fillText('START WITH A',540,470);c.fillText('STRAIGHT LINE',540,574);
  c.fillRect(250,616,580,4);c.font=`500 26px ${MONO}`;c.letterSpacing='4px';c.fillStyle='rgba(236,233,224,.78)';c.fillText('THE FIRST EXERCISE IN DRAWING',540,700);c.letterSpacing='0px';
  /* bench */
  c.fillStyle=grad(c,0,1290,0,2400,[[0,'#bdb8ab'],[1,'#98938a']]);
  c.beginPath();c.moveTo(-300,1290);c.lineTo(1380,1290);c.lineTo(2100,2400);c.lineTo(-1020,2400);c.fill();
  c.strokeStyle='rgba(0,0,0,.07)';c.lineWidth=3;[-100,300,700,1100].forEach(x=>{c.beginPath();c.moveTo(x,1290);c.lineTo(540+(x-540)*2.7,2400);c.stroke()});
  c.strokeStyle='#d6d1c5';c.lineWidth=6;c.beginPath();c.moveTo(-300,1290);c.lineTo(1380,1290);c.stroke();
  /* sketchbook */
  const q=(dy)=>{c.beginPath();c.moveTo(370,1340+dy);c.lineTo(710,1340+dy);c.lineTo(770,1540+dy);c.lineTo(310,1540+dy);c.closePath()};
  c.save();c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=26;c.shadowOffsetY=16;c.fillStyle='#d9d5ca';q(10);c.fill();c.restore();
  c.fillStyle='#f2efe7';q(0);c.fill();c.fillStyle='#3c3d3f';for(let i=0;i<14;i++){c.beginPath();c.arc(384+i*23.5,1340,3.4,0,PI*2);c.fill()}
  pencil(c,812,1572,2.62,.32,0);
  c.restore();
}

/* ===== SCENE 2: THE DRAWING (4.1–15.1) ===== */
const tw=x=>.72*tri(x-.25)+.28*Math.sin(2*PI*x);
const sp=[
  u=>[180+720*u,470+26*u+6*Math.sin(u*9)],
  u=>[190+710*u,650-42*Math.sin(PI*u)+7*Math.sin(u*14)],
  u=>[175+725*u,830+36*Math.sin(2*PI*u*1.1)-30*u],
  u=>[170+810*u,1180-112*(.55+.45*Math.sin(PI*u))*(1-sm((u-.78)/.18))*tw(3.5*u)]
];
const ST=[[4.95,5.95],[6.5,7.5],[8.05,9.05],[10.1,12.8]],REST=[820,1440];
const mv=(A,B)=>u=>{const e=E.io(u);return[lp(A[0],B[0],e),lp(A[1],B[1],e),Math.sin(PI*u)*.9]};
const hold=A=>()=>[A[0],A[1],0];
const SEG=[
  {a:0,b:4.5,g:hold(REST)},{a:4.5,b:4.95,g:mv(REST,sp[0](0))},
  {a:4.95,b:5.95,k:0},{a:5.95,b:6.5,g:mv(sp[0](1),sp[1](0))},
  {a:6.5,b:7.5,k:1},{a:7.5,b:8.05,g:mv(sp[1](1),sp[2](0))},
  {a:8.05,b:9.05,k:2},{a:9.05,b:9.7,g:hold(sp[2](1))},
  {a:9.7,b:10.1,g:mv(sp[2](1),sp[3](0))},{a:10.1,b:12.8,k:3},
  {a:12.8,b:13.8,g:u=>[lp(980,1320,E.io(u)),1180,Math.min(1,u*2)]}
];
const eu=l=>lp(l,E.io(l),.65);
function tipAt(t){
  let s=SEG[SEG.length-1];for(const q of SEG)if(t<q.b){s=q;break}
  const l=cl((t-s.a)/(s.b-s.a));
  if(s.k!==undefined){const p=sp[s.k](eu(l));return[p[0],p[1],0]}
  return s.g(l);
}
const PTS=sp.map((f,k)=>{const r=rng(40+k),n=k<3?150:380;return Array.from({length:n},(_,i)=>{const p=f(i/(n-1));return[p[0]+(r()-.5)*2.2,p[1]+(r()-.5)*2.2,r(),r(),r()]})});
function stroke(c,P,fr,w){
  const n=Math.floor(fr*(P.length-1));if(n<1)return;
  c.lineCap='round';c.lineJoin='round';
  for(const [col,lw] of [['rgba(70,70,76,.45)',w*2],['rgba(24,24,28,.8)',w*.95]]){c.strokeStyle=col;c.lineWidth=lw;c.beginPath();c.moveTo(P[0][0],P[0][1]);for(let i=1;i<=n;i++)c.lineTo(P[i][0],P[i][1]);c.stroke()}
  for(let i=0;i<=n;i++){const q=P[i];c.fillStyle='rgba(243,240,232,.6)';c.fillRect(q[0]+(q[2]-.5)*7,q[1]+(q[3]-.5)*7,2,2);c.fillStyle='rgba(30,30,34,.45)';c.fillRect(q[0]+(q[4]-.5)*9,q[1]+(q[2]-.5)*9,1.6,1.6)}
}
function sPaper(c,t){
  const tp=tipAt(t),w=E.io(pg(t,9.6,1.5)),rp=E.io(pg(t,12.8,1.6));
  const z=lp(lp(1,1.9,w),2.5,rp),cx=lp(lp(540,Math.min(tp[0],980),w),900,rp),cy=lp(lp(960,tp[1],w),1180,rp);
  c.save();c.translate(540,lp(960,1000,w));c.rotate(-PI/2*rp);c.scale(z,z);c.translate(-cx,-cy);
  c.fillStyle='#a39e92';c.fillRect(-3000,-3000,7000,8000);
  c.save();c.shadowColor='rgba(0,0,0,.38)';c.shadowBlur=36;c.shadowOffsetY=14;c.fillStyle='#f3f0e8';c.fillRect(100,260,880,1400);c.restore();
  c.fillStyle=PAPER;c.fillRect(100,260,880,1400);c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=2;c.strokeRect(100,260,880,1400);
  ST.forEach(([a,b],k)=>{const f=t<a?0:t>=b?1:eu((t-a)/(b-a));stroke(c,PTS[k],f,k<3?2.7:3.1)});
  pencil(c,tp[0],tp[1],2.4+.04*Math.sin(t*4),.8,tp[2]);
  c.restore();
}

/* ===== SCENE 3: RAILWAY (14.2–20.1) ===== */
function sRail(c,t){
  const lt=Math.max(0,t-15),yh=560,gh=H-yh;
  c.fillStyle=grad(c,0,0,0,yh,[[0,'#cdd4d9'],[1,'#ecebe4']]);c.fillRect(0,0,W,yh+2);
  c.fillStyle=grad(c,0,yh,0,H,[[0,'#bab8b1'],[1,'#8b8982']]);c.fillRect(0,yh,W,gh);
  const p=pg(t,16.5,2.3,'io'),front=lp(-2,19,p),scr=lt*.55;
  const cx=y=>{const d=1100/(y-yh),f=sm((front-d)/2.4);return 540+240*((y-yh)/gh)*f*tri(d*.5+scr)};
  const ys=[];for(let y=600;y<=H+24;y+=6)ys.push(y);
  c.fillStyle='#8a8780';c.beginPath();ys.forEach((y,i)=>{const k=(y-yh)/gh;c[i?'lineTo':'moveTo'](cx(y)-330*k,y)});
  for(let i=ys.length-1;i>=0;i--){const y=ys[i],k=(y-yh)/gh;c.lineTo(cx(y)+330*k,y)}c.fill();
  c.lineCap='butt';
  for(let j=0;j<46;j++){const d=((j*.3-2*scr)%13.8+13.8)%13.8+.8,y=yh+1100/d,k=(y-yh)/gh,x=cx(y);c.strokeStyle='#5e5b55';c.lineWidth=14*k+1;c.beginPath();c.moveTo(x-250*k,y);c.lineTo(x+250*k,y);c.stroke()}
  for(const s of[-1,1])for(const [col,lw,o] of [['#454b51',17,0],['#b6bcc2',4,-3]]){
    c.strokeStyle=col;
    for(let i=1;i<ys.length;i++){const y0=ys[i-1],y1=ys[i],k0=(y0-yh)/gh,k1=(y1-yh)/gh;c.lineWidth=lw*k1+.8;c.beginPath();c.moveTo(cx(y0)+s*150*k0+o*k0,y0);c.lineTo(cx(y1)+s*150*k1+o*k1,y1);c.stroke()}
  }
  c.fillStyle=grad(c,0,yh,0,yh+260,[[0,'rgba(236,235,228,.92)'],[1,'rgba(236,235,228,0)']]);c.fillRect(0,yh,W,260);
}

/* ===== SCENE 4: ELECTRIC WIRES (19.4–24.6) ===== */
function wireLayer(c,t,al,p){
  const X=[-450,90,540,990,1530],AR=[430,640,850,1060];
  c.globalAlpha=al;
  X.forEach(x=>{c.fillStyle='#5f6061';c.fillRect(x-11,330,22,1010);AR.forEach(y=>{c.fillStyle='#4f5051';c.fillRect(x-76,y-6,152,12);c.fillStyle='#8d9296';c.fillRect(x-44,y-18,10,12);c.fillRect(x+34,y-18,10,12)})});
  c.strokeStyle='#1f2022';c.lineWidth=4;c.lineJoin='round';
  AR.forEach((ay,j)=>{for(let gi=0;gi<4;gi++){
    const x0=X[gi]+39,x1=X[gi+1]-39,f=sm((p*4.2-gi*.9)/1.3),A=34+13*j;c.beginPath();
    for(let i=0;i<=60;i++){const u=i/60,x=lp(x0,x1,u),y=ay-12+44*4*u*(1-u)*.9+f*A*Math.sin(PI*u)*Math.sin(2*PI*2.5*u+j*.5);c[i?'lineTo':'moveTo'](x,y)}
    c.stroke()}});
  c.globalAlpha=1;
}
function sWire(c,t){
  const lt=t-19.4,p=pg(t,21,2.6,'io');
  c.fillStyle=grad(c,0,0,0,1330,[[0,'#d3d9dc'],[1,'#ece9e1']]);c.fillRect(0,0,W,1340);
  c.fillStyle=grad(c,0,1330,0,H,[[0,'#8a8b8c'],[1,'#6a6b6d']]);c.fillRect(0,1330,W,H-1330);
  c.fillStyle='#a9aaaa';c.fillRect(0,1330,W,10);
  c.save();c.translate(-lt*8,0);
  c.save();c.translate(540,1330);c.scale(.5,.5);c.translate(-660,-1330);wireLayer(c,t,.5,p);c.restore();
  wireLayer(c,t,1,p);
  c.restore();
}

/* ===== SCENE 5/7/9: THE BUILDING ===== */
const dxW=y=>(46*Math.sin(y*.0105+.6)+22*tri(y/150))*sm((1520-y)/300);
function bldScene(c,z,cy,p,bp){
  c.save();c.translate(540,960);c.scale(z,z);c.translate(-540,-cy);
  c.fillStyle=grad(c,0,-1500,0,1520,[[0,'#c9d0d5'],[1,'#efece5']]);c.fillRect(-900,-1500,2880,3020);

function toWavB64(buf){

  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a}}

  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};

/* ===== PREVIEW PLAYER (normal browser only) + BOOT ===== */
function initPreview(){
  const vp=$('vp'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');pl.hidden=false;rg.max=R.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px'};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopA=()=>{if(srcN){try{srcN.stop()}catch(e){}srcN=null}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s'};
  function loop(){if(!playing)return;cur=base+(performance.now()-started)/1000;if(cur>=R.duration){show(R.duration);pause();btn.textContent='REPLAY';cur=0;return}show(cur);requestAnimationFrame(loop)}
  function pause(){playing=false;stopA();if(btn.textContent==='PAUSE')btn.textContent='PLAY'}
  async function play(){btn.textContent='PREPARING SOUND…';if(!buf)buf=await getAudio();if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')await actx.resume();
    stopA();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop()}
  btn.onclick=()=>{playing?pause():play()};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play()};
  show(0);
}
async function boot(){

    await document.fonts.ready;
    GL=mk(1080,1080);buildAssets();
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e)}
}

})();
