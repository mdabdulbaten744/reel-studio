<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Text Is Your Design — Callistra Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;
  --paper:#faf8f5;
  --ink:#121212;
  --muted:#736e65;
  --line:rgba(18,18,18,.14);
  --accent:#C23A1E;
  --chk1:#efece6;
  --chk2:#ffffff;
  --serif:'Instrument Serif',serif;
  --cond:'Barlow Condensed',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;isolation:isolate}
#stage,#grain{position:absolute;left:0;top:0;width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.085;pointer-events:none}
#vig{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:4;pointer-events:none;background:radial-gradient(120% 85% at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,.14) 100%)}

/* Preview bar (browser preview only) */
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em;cursor:pointer}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="8" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   ENGINE & SYSTEM CONTRACT
   ===================================================================== */
const REEL = { width: 1080, height: 1920, fps: 30, duration: 8.0, poster: 4.3 };
window.REEL = REEL;
const RENDER = /[?&]render=1/.test(location.search);
const $ = id => document.getElementById(id);
const W = 1080, H = 1920;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const EASE = {
  lin: p => p,
  i2: p => p * p,
  i3: p => p * p * p,
  o2: p => 1 - (1 - p) * (1 - p),
  o3: p => 1 - Math.pow(1 - p, 3),
  io2: p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  io3: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  oexp: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  oback: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};
const prog = (t, s, d, e = 'lin') => EASE[e](clamp((t - s) / d));

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

const BRAND = {
  bg: '#f7f5f0',
  paper: '#faf8f5',
  ink: '#121212',
  muted: '#736e65',
  line: 'rgba(18,18,18,.14)',
  accent: '#C23A1E',
  darkBg: '#0d0d0d',
  darkInk: '#f0eee9'
};

const SERIF = '"Instrument Serif", Georgia, serif';
const COND = '"Barlow Condensed", "Arial Narrow", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';

function mono(c, txt, x, y, o = {}) {
  const { size = 26, ls = 0, align = 'left', color = BRAND.ink, alpha = 1, weight = 500 } = o;
  if (alpha <= 0) return;
  c.save();
  c.font = `${weight} ${size}px ${MONO}`;
  if ('letterSpacing' in c) c.letterSpacing = ls + 'px';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.globalAlpha = alpha;
  let xx = x;
  if (align === 'center') { c.textAlign = 'center'; xx = x + ls / 2; }
  else if (align === 'right') { c.textAlign = 'right'; xx = x + ls; }
  else c.textAlign = 'left';
  c.fillText(txt, xx, y);
  c.restore();
}

function flash(c, a, col = '#000') {
  if (a > 0.005) {
    c.save();
    c.globalAlpha = clamp(a, 0, 1);
    c.fillStyle = col;
    c.fillRect(0, 0, W, H);
    c.restore();
  }
}

/* =====================================================================
   PART 1: SPECIMEN SHEET & PEN PATH ("YOUR TEXT IS YOUR DESIGN")
   ===================================================================== */
// Target arrangement of the final phrase in the safe area center
const TARGET_WORDS = [
  { word: "Your",   targetY: 830,  targetX: 540 - 240, font: `italic 400 136px ${SERIF}`,  cap: false },
  { word: "text",   targetY: 830,  targetX: 540 + 200, font: `900 142px ${COND}`,          cap: true },
  { word: "is",     targetY: 980,  targetX: 540 - 290, font: `italic 400 120px ${SERIF}`,  cap: false },
  { word: "your",   targetY: 980,  targetX: 540 - 70,  font: `500 100px ${MONO}`,          cap: true },
  { word: "design.",targetY: 980,  targetX: 540 + 250, font: `italic 400 144px ${SERIF}`,  cap: false }
];

// Scatter typography specimens across the sheet background
const SPECIMEN_CHARS = [];
const SPECIMEN_FONTS = [
  `900 78px ${COND}`,
  `italic 400 84px ${SERIF}`,
  `400 90px ${SERIF}`,
  `500 68px ${MONO}`,
  `700 72px ${MONO}`,
  `900 102px ${COND}`,
  `italic 400 108px ${SERIF}`
];

// Target pickup positions and timings for the 5 words (0.0s - 3.8s)
const PICKUPS = [
  { word: "Your",    tPick: 0.70, tArrive: 1.05, sx: 240,  sy: 480,  tx: 300, ty: 830, font: `italic 400 136px ${SERIF}` },
  { word: "text",    tPick: 1.40, tArrive: 1.75, sx: 820,  sy: 560,  tx: 740, ty: 830, font: `900 142px ${COND}` },
  { word: "is",      tPick: 2.10, tArrive: 2.45, sx: 320,  sy: 1280, tx: 250, ty: 980, font: `italic 400 120px ${SERIF}` },
  { word: "your",    tPick: 2.75, tArrive: 3.05, sx: 760,  sy: 1220, tx: 470, ty: 980, font: `500 100px ${MONO}` },
  { word: "design.", tPick: 3.35, tArrive: 3.75, sx: 540,  sy: 1420, tx: 790, ty: 980, font: `italic 400 144px ${SERIF}` }
];

function initSpecimenSheet() {
  const rnd = mulberry32(101);
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz&?!*0123456789";
  for (let row = 0; row < 10; row++) {
    for (let col = 0; col < 6; col++) {
      const char = alphabet[Math.floor(rnd() * alphabet.length)];
      const bx = 110 + col * 165 + (rnd() - 0.5) * 45;
      const by = 260 + row * 155 + (rnd() - 0.5) * 45;
      const f = SPECIMEN_FONTS[Math.floor(rnd() * SPECIMEN_FONTS.length)];
      const rot = (rnd() - 0.5) * 0.16;
      SPECIMEN_CHARS.push({ char, x: bx, y: by, font: f, rot, alpha: 0.18 + rnd() * 0.14 });
    }
  }
}

// Compute continuous pen tip path
function getPenTipAt(t) {
  // Waypoints connecting the words
  const pts = [
    { t: 0.00, x: 180, y: 380 },
    { t: 0.70, x: PICKUPS[0].sx, y: PICKUPS[0].sy },
    { t: 1.05, x: PICKUPS[0].tx, y: PICKUPS[0].ty },
    { t: 1.40, x: PICKUPS[1].sx, y: PICKUPS[1].sy },
    { t: 1.75, x: PICKUPS[1].tx, y: PICKUPS[1].ty },
    { t: 2.10, x: PICKUPS[2].sx, y: PICKUPS[2].sy },
    { t: 2.45, x: PICKUPS[2].tx, y: PICKUPS[2].ty },
    { t: 2.75, x: PICKUPS[3].sx, y: PICKUPS[3].sy },
    { t: 3.05, x: PICKUPS[3].tx, y: PICKUPS[3].ty },
    { t: 3.35, x: PICKUPS[4].sx, y: PICKUPS[4].sy },
    { t: 3.75, x: PICKUPS[4].tx + 30, y: PICKUPS[4].ty },
    { t: 4.40, x: 920, y: 1040 }
  ];

  if (t <= pts[0].t) return [pts[0].x, pts[0].y];
  if (t >= pts[pts.length - 1].t) return [pts[pts.length - 1].x, pts[pts.length - 1].y];

  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i].t) {
      const p0 = pts[i - 1], p1 = pts[i];
      const p = (t - p0.t) / (p1.t - p0.t);
      const ep = EASE.io3(p);
      // Gentle curve deviation
      const dx = p1.x - p0.x, dy = p1.y - p0.y;
      const arch = Math.sin(p * Math.PI) * 40 * ((i % 2 === 0) ? 1 : -1);
      return [p0.x + dx * ep - (dy / (Math.hypot(dx, dy) || 1)) * arch,
              p0.y + dy * ep + (dx / (Math.hypot(dx, dy) || 1)) * arch];
    }
  }
  return [pts[pts.length - 1].x, pts[pts.length - 1].y];
}

/* Draws real luxury drafting fountain pen */
function drawPen(c, x, y, angle = -Math.PI / 4) {
  c.save();
  c.translate(x, y);
  c.rotate(angle);

  // Soft contact drop shadow
  c.save();
  c.fillStyle = 'rgba(0,0,0,0.22)';
  c.beginPath();
  c.ellipse(10, 16, 24, 7, Math.PI / 6, 0, Math.PI * 2);
  c.filter = 'blur(8px)';
  c.fill();
  c.restore();

  // Fine ink contact point
  c.fillStyle = BRAND.ink;
  c.beginPath();
  c.arc(0, 0, 3.5, 0, Math.PI * 2);
  c.fill();

  // Nib: polished iridium steel tip
  c.beginPath();
  c.moveTo(0, 0);
  c.lineTo(-12, -45);
  c.lineTo(-18, -90);
  c.lineTo(18, -90);
  c.lineTo(12, -45);
  c.closePath();
  c.fillStyle = '#1c1b18';
  c.fill();
  c.strokeStyle = '#d4af37';
  c.lineWidth = 2.5;
  c.stroke();

  // Nib slit & breather hole
  c.strokeStyle = '#e6c86e';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(0, 0);
  c.lineTo(0, -50);
  c.stroke();
  c.beginPath();
  c.arc(0, -52, 3.5, 0, Math.PI * 2);
  c.fillStyle = '#e6c86e';
  c.fill();

  // Pen grip section (matte black with gold trim)
  c.fillStyle = '#222';
  c.fillRect(-20, -180, 40, 90);
  c.fillStyle = '#d4af37';
  c.fillRect(-22, -186, 44, 6);

  // Lacquered barrel
  c.fillStyle = '#0f0f0f';
  c.beginPath();
  c.moveTo(-22, -186);
  c.lineTo(-24, -420);
  c.lineTo(24, -420);
  c.lineTo(22, -186);
  c.closePath();
  c.fill();

  // Pen barrel specular highlight
  c.strokeStyle = 'rgba(255,255,255,0.22)';
  c.lineWidth = 4;
  c.beginPath();
  c.moveTo(-10, -190);
  c.lineTo(-11, -410);
  c.stroke();

  c.restore();
}

function drawSpecimenScene(c, t) {
  // Clean white paper sheet with faint typographic specimen guide rules
  c.fillStyle = BRAND.paper;
  c.fillRect(0, 0, W, H);

  // Architectural specimen guide rules
  c.save();
  c.strokeStyle = BRAND.line;
  c.lineWidth = 1.5;
  c.beginPath();
  // Header specimen lines
  c.moveTo(90, 180); c.lineTo(990, 180);
  c.moveTo(90, 1740); c.lineTo(990, 1740);
  // Baselines for words
  c.moveTo(110, 890); c.lineTo(970, 890);
  c.moveTo(110, 1040); c.lineTo(970, 1040);
  c.stroke();
  c.restore();

  // Editorial sheet labels
  mono(c, "CALLISTRA TYPOGRAPHIC SPECIMEN", 100, 140, { size: 24, ls: 6, alpha: 0.65 });
  mono(c, "PLATE NO. 01 / LIVE ASSEMBLY", 980, 140, { size: 22, ls: 3, align: 'right', alpha: 0.65 });
  mono(c, "1080 × 1920 PX", 100, 1780, { size: 22, ls: 4, alpha: 0.55 });
  mono(c, "ALL TYPE IS SHAPE", 980, 1780, { size: 22, ls: 4, align: 'right', alpha: 0.55 });

  // Draw background specimen letters (they remain neatly distributed)
  SPECIMEN_CHARS.forEach(item => {
    c.save();
    c.translate(item.x, item.y);
    c.rotate(item.rot);
    c.font = item.font;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = BRAND.ink;
    c.globalAlpha = item.alpha * (1 - prog(t, 3.8, 0.4));
    c.fillText(item.char, 0, 0);
    c.restore();
  });

  // Ink trajectory tether line drawn by the pen
  const penTip = getPenTipAt(t);
  c.save();
  c.strokeStyle = 'rgba(18,18,18,0.22)';
  c.lineWidth = 2.5;
  c.setLineDash([4, 6]);
  c.beginPath();
  const stepCount = Math.floor(t * 30);
  for (let i = 0; i <= stepCount; i++) {
    const pt = getPenTipAt((i / 30));
    if (i === 0) c.moveTo(pt[0], pt[1]);
    else c.lineTo(pt[0], pt[1]);
  }
  c.lineTo(penTip[0], penTip[1]);
  c.stroke();
  c.restore();

  // Reveal words as pen reaches & transports each word
  PICKUPS.forEach(p => {
    if (t < p.tPick) return;

    let wx, wy, wScale = 1, wAlpha = 1;
    if (t < p.tArrive) {
      const u = prog(t, p.tPick, p.tArrive - p.tPick, 'io3');
      wx = lerp(p.sx, p.tx, u);
      wy = lerp(p.sy, p.ty, u);
      wScale = 1 + 0.18 * Math.sin(u * Math.PI);
      wAlpha = clamp(u * 2, 0.3, 1);
    } else {
      wx = p.tx;
      wy = p.ty;
      // Settling snap
      const q = t - p.tArrive;
      if (q < 0.25) {
        wScale = 1 + 0.12 * Math.exp(-q * 16) * Math.cos(q * 40);
      }
    }

    c.save();
    c.translate(wx, wy);
    c.scale(wScale, wScale);
    c.font = p.font;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = BRAND.ink;
    c.globalAlpha = wAlpha;
    c.fillText(p.word, 0, 0);
    c.restore();
  });

  // Dynamic ink ripples when pen picks a letter up
  PICKUPS.forEach(p => {
    const dt = t - p.tPick;
    if (dt >= 0 && dt <= 0.4) {
      const pr = dt / 0.4;
      c.save();
      c.strokeStyle = BRAND.ink;
      c.lineWidth = 3 * (1 - pr);
      c.globalAlpha = 0.5 * (1 - pr);
      c.beginPath();
      c.arc(p.sx, p.sy, 12 + 60 * EASE.o3(pr), 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
  });

  // Draw continuous moving fountain pen
  if (t < 4.4) {
    const ptPrev = getPenTipAt(Math.max(0, t - 0.03));
    const angle = Math.atan2(penTip[1] - ptPrev[1], penTip[0] - ptPrev[0]) - Math.PI / 2;
    drawPen(c, penTip[0], penTip[1], angle);
  }

  // Final sentence hold & typographic impact emphasis (3.8s - 4.5s)
  if (t >= 3.8) {
    const slamP = prog(t, 3.8, 0.25, 'oexp');
    c.save();
    c.strokeStyle = BRAND.accent;
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(540 - 360 * slamP, 1070);
    c.lineTo(540 + 360 * slamP, 1070);
    c.stroke();
    c.restore();

    mono(c, "NOW WATCH IT BECOME INTERACTIVE", 540, 1140, {
      size: 28, ls: 8, align: 'center', alpha: prog(t, 3.95, 0.25, 'oexp'), color: BRAND.accent, weight: 700
    });
  }
}

/* =====================================================================
   PART 2: THE 5 TEXT EFFECT MAKERS (REAL ALGORITHMS)
   Showcasing:
     1. Glitch Slice
     2. Stamp Wear
     3. Yarn Loop
     4. Kinetic Flowfield
     5. Impact Matrix
   ===================================================================== */

// --- 1. Glitch Slice Canvas generator ---
function renderGlitchSlice(text, fringe = 4, shear = 36, chaos = 0.35, color = '#121212') {
  const w = 800, h = 400, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 130px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = color;
  octx.fillText(text, w / 2, h / 2);

  const src = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  const img = ctx.createImageData(w, h);
  const dst = new Uint32Array(img.data.buffer);

  for (let dy = 0; dy < h; dy++) {
    const band = Math.floor(dy / fringe);
    const dir = (band % 2 === 0) ? 1 : -1;
    const wave = Math.sin(band * 0.4) * shear;
    const noise = Math.sin(dy * 12.9898 + band * 78.233) * 43758.5453;
    const chaotic = dir * (noise - Math.floor(noise)) * shear * 1.5;
    const shift = Math.round((wave * (1 - chaos)) + (chaotic * chaos));
    const rOff = dy * w;
    for (let dx = 0; dx < w; dx++) {
      const sx = dx - shift;
      if (sx >= 0 && sx < w) {
        const p = src[rOff + sx];
        if (p !== 0) dst[rOff + dx] = p;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// --- 2. Stamp Wear Canvas generator ---
function renderStampWear(text, erosion = 0.5, edge = 0.65, color = '#121212') {
  const w = 800, h = 400, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 130px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = color;
  octx.fillText(text, w / 2, h / 2);

  const src = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  const img = ctx.createImageData(w, h);
  const dst = new Uint32Array(img.data.buffer);

  const R = 3;
  const em = new Float32Array(w * h);
  for (let y = 0; y < h; y += 2) {
    const r = y * w;
    for (let x = 0; x < w; x += 2) {
      if (src[r + x] === 0) continue;
      let md = R + 1;
      for (let dy = -R; dy <= R; dy += 2) {
        const ny = y + dy; if (ny < 0 || ny >= h) continue;
        const nr = ny * w;
        for (let dx = -R; dx <= R; dx += 2) {
          const nx = x + dx;
          if (nx < 0 || nx >= w || src[nr + nx] === 0) {
            const d = Math.hypot(dx, dy); if (d < md) md = d;
          }
        }
      }
      em[r + x] = Math.min(1, md / R);
    }
  }

  const innerT = 1 - erosion * 0.7, edgeT = 1 - edge * 0.95;
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      const p = src[r + x];
      if (p === 0) continue;
      const n = (Math.sin(x * 12.98 + y * 78.23) * 43758.545) % 1;
      const ef = em[r + (x & ~1)] || 0.5;
      if (Math.abs(n) < (ef * innerT + (1 - ef) * edgeT)) dst[r + x] = p;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// --- 3. Yarn Loop Canvas generator ---
function renderYarnLoop(text, grid = 6, loop = 7, fuzz = 0.45, color = '#121212') {
  const w = 800, h = 400, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `400 130px ${SERIF}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000';
  octx.fillText(text, w / 2, h / 2);

  const buf = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.8; ctx.lineCap = 'round';

  for (let by = 0; by < h; by += grid) {
    const ro = by * w;
    for (let bx = 0; bx < w; bx += grid) {
      if (buf[ro + bx] === 0) continue;
      const n = Math.sin(bx * 12.98 + by * 78.23) * 43758.545;
      const rS = n - Math.floor(n);
      const fx = (rS - 0.5) * (loop * 0.8 * fuzz);
      const cx = bx + fx, cy = by;
      ctx.beginPath(); ctx.arc(cx, cy - loop * 0.3, loop, 0.2 * Math.PI, 0.8 * Math.PI, true); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - loop * 0.4, cy + loop * 0.2, loop * 0.6, 1.2 * Math.PI, 1.8 * Math.PI, false); ctx.stroke();
    }
  }
  return cv;
}

// --- 4. Kinetic Flowfield generator ---
function renderKineticFlowfield(text, turbulence = 22, strength = 24, color = '#121212') {
  const w = 800, h = 400, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 130px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000';
  octx.fillText(text, w / 2, h / 2);

  const buf = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  ctx.fillStyle = color;
  const step = 4, dotRadius = 1.6;

  for (let y = 0; y < h; y += step) {
    const ro = y * w;
    for (let x = 0; x < w; x += step) {
      if (buf[ro + x] !== 0) {
        let px = x, py = y;
        const steps = 6, dist = strength / steps;
        for (let s = 0; s < steps; s++) {
          const ang = (Math.sin(px * 0.015 * (turbulence / 20) + py * 0.015) * 0.5 + 0.5) * Math.PI * 4;
          px += Math.cos(ang) * dist;
          py += Math.sin(ang) * dist;
        }
        ctx.beginPath(); ctx.arc(px, py, dotRadius, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  return cv;
}

// --- 5. Impact Matrix generator ---
function renderImpactMatrix(text, jitter = 10, bleed = 0.55, color = '#121212') {
  const w = 800, h = 400, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 130px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000';
  octx.fillText(text, w / 2, h / 2);

  const mask = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  ctx.fillStyle = color;
  const step = 5, baseR = 1.8;

  for (let y = 0; y < h; y += step) {
    const row = y / step;
    const wave = Math.sin(row * 0.5) * (jitter * 0.5);
    const n = Math.sin(row * 127.1) * 43758.5;
    const shiftX = Math.round(wave + ((n - Math.floor(n)) - 0.5) * jitter);

    for (let x = 0; x < w; x += step) {
      const sx = x - shiftX;
      if (sx >= 0 && sx < w) {
        if (mask[y * w + sx] !== 0) {
          const rSeed = (Math.sin(x * 12.9 + y * 78.2) * 43758.5) % 1;
          const r = (Math.abs(rSeed) < bleed) ? baseR * 1.5 : baseR;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }
  return cv;
}

/* =====================================================================
   SOUNDTRACK (SYNTHESIZED OFFLINE VIA WEB AUDIO API)
   ===================================================================== */
async function buildAudio() {
  const SR = 44100, DUR = REEL.duration;
  const oc = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  const rand = mulberry32(42);

  // Noise buffer
  const nb = oc.createBuffer(1, SR * 3, SR);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = rand() * 2 - 1;

  // Master bus
  const master = oc.createGain();
  master.gain.setValueAtTime(0.78, 0);
  master.gain.setValueAtTime(0.78, DUR - 0.4);
  master.gain.linearRampToValueAtTime(0, DUR - 0.02);

  const comp = oc.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 10; comp.ratio.value = 8;
  comp.attack.value = 0.002; comp.release.value = 0.12;
  master.connect(comp);
  comp.connect(oc.destination);

  // Subtle algorithmic room reverb
  const rl = Math.floor(SR * 1.5), ir = oc.createBuffer(2, rl, SR);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < rl; i++) d[i] = (rand() * 2 - 1) * Math.pow(1 - i / rl, 3.5);
  }
  const conv = oc.createConvolver(); conv.buffer = ir;
  const revIn = oc.createGain(), revOut = oc.createGain();
  revOut.gain.value = 0.35;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(master);

  const out = (g, o = {}) => {
    let n = g;
    if (o.pan) { const p = oc.createStereoPanner(); p.pan.value = o.pan; n.connect(p); n = p; }
    n.connect(master);
    if (o.rev > 0) { const s = oc.createGain(); s.gain.value = o.rev; n.connect(s); s.connect(revIn); }
  };

  const env = (p, t, peak, a, d) => {
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(peak, t + a);
    p.exponentialRampToValueAtTime(0.0001, t + a + d);
  };
  const nsrc = (t, dur, seed) => {
    const s = oc.createBufferSource(); s.buffer = nb; s.loop = true;
    s.start(t, (Math.abs(seed) * 0.37) % 2, undefined); s.stop(t + dur); return s;
  };
  const flt = (type, f, q = 1) => {
    const b = oc.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b;
  };
  const osc = (type, f, t, dur) => {
    const o = oc.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    o.start(t); o.stop(t + dur); return o;
  };

  // Sound primitives
  const penScratch = (t, dur = 0.35, pan = 0) => {
    const n = nsrc(t, dur, t * 19.1), bp = flt('bandpass', 3200, 1.8), g = oc.createGain();
    env(g.gain, t, 0.08, 0.02, dur - 0.02);
    n.connect(bp); bp.connect(g); out(g, { pan, rev: 0.1 });
  };
  const wordSnap = (t, pitch = 880) => {
    const o = osc('triangle', pitch, t, 0.09), gn = oc.createGain();
    env(gn.gain, t, 0.32, 0.001, 0.08);
    o.connect(gn); out(gn, { rev: 0.15 });
    const n = nsrc(t, 0.04, t * 7.3), hp = flt('highpass', 4500), ng = oc.createGain();
    env(ng.gain, t, 0.25, 0.0008, 0.02);
    n.connect(hp); hp.connect(ng); out(ng);
  };
  const thud = (t, g = 0.7) => {
    const o = osc('sine', 160, t, 0.45);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.22);
    const og = oc.createGain(); env(og.gain, t, g, 0.003, 0.35);
    o.connect(og); out(og, { rev: 0.25 });
    const n = nsrc(t, 0.12, 5.1), bp = flt('bandpass', 850, 1.0), ng = oc.createGain();
    env(ng.gain, t, g * 0.6, 0.001, 0.08);
    n.connect(bp); bp.connect(ng); out(ng);
  };
  const shutterCut = (t, pitch = 1400) => {
    const o = osc('square', pitch, t, 0.05), gn = oc.createGain();
    env(gn.gain, t, 0.2, 0.001, 0.04);
    o.connect(gn); out(gn);
    const n = nsrc(t, 0.03, t * 3.7), hp = flt('highpass', 2400), ng = oc.createGain();
    env(ng.gain, t, 0.3, 0.0005, 0.025);
    n.connect(hp); hp.connect(ng); out(ng);
  };
  const chime = (t) => {
    [[659.25, 0], [987.77, 0.08], [1318.51, 0.16]].forEach(([f, d]) => {
      const o = osc('sine', f, t + d, 1.4), g = oc.createGain();
      env(g.gain, t + d, 0.22, 0.003, 1.1);
      o.connect(g); out(g, { rev: 0.5 });
    });
  };

  // 1. Pen glide sounds and word pick-up snaps
  PICKUPS.forEach((p, i) => {
    penScratch(p.tPick - 0.25, 0.28, (i % 2 === 0) ? -0.2 : 0.2);
    wordSnap(p.tArrive, 740 + i * 110);
  });

  // 2. Big typographic slam on "Your text is your design."
  thud(3.8, 0.85);

  // 3. Fast shutter sound on every tool glance cut
  for (let i = 0; i < 5; i++) {
    const tc = SHOWCASE_T0 + i * SHOWCASE_DUR;
    shutterCut(tc, 1100 + i * 160);
    // Click of slider
    penScratch(tc + 0.15, 0.18, 0);
  }

  // 4. Outro boom & chime
  thud(7.1, 0.8);
  chime(7.2);

  return oc.startRendering();
}

let audioP = null;
const getAudio = () => audioP || (audioP = buildAudio());

function toWavB64(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const data = []; let peak = 0;
  for (let c = 0; c < ch; c++) {
    const d = buf.getChannelData(c); data.push(d);
    for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
  }
  const gain = peak > 0.89 ? 0.89 / peak : 1;
  const ab = new ArrayBuffer(44 + n * ch * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE');
  ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true);
  v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * ch * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    for (let c = 0; c < ch; c++) {
      v.setInt16(o, Math.round(clamp(data[c][i] * gain, -1, 1) * 32767), true);
      o += 2;
    }
  }
  const bytes = new Uint8Array(ab); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
window.renderAudio = async () => toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER & BOOTSTRAP
   ===================================================================== */
function initPreview() {
  const vp = $('viewport'), pl = $('player'), btn = $('pBtn'), rg = $('pRange'), tm = $('pTime');
  pl.hidden = false; rg.max = REEL.duration;
  const fit = () => {
    const s = Math.min(innerWidth / W, (innerHeight - 64) / H);
    vp.style.transform = `scale(${s})`;
    vp.style.left = ((innerWidth - W * s) / 2) + 'px';
  };
  addEventListener('resize', fit); fit();

  let playing = false, base = 0, started = 0, cur = 0, actx = null, srcN = null, buf = null;
  const stopAudio = () => { if (srcN) { try { srcN.stop(); } catch(e) {} srcN = null; } };
  const show = t => { renderFrame(t); rg.value = t; tm.textContent = t.toFixed(1) + 's'; };

  function loop() {
    if (!playing) return;
    cur = base + (performance.now() - started) / 1000;
    if (cur >= REEL.duration) {
      cur = REEL.duration; show(cur); pause(); btn.textContent = 'REPLAY'; cur = 0; return;
    }
    show(cur);
    requestAnimationFrame(loop);
  }
  function pause() {
    playing = false; stopAudio(); if (btn.textContent === 'PAUSE') btn.textContent = 'PLAY';
  }
  async function play() {
    btn.textContent = 'PREPARING SOUND…';
    if (!buf) buf = await getAudio();
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') await actx.resume();
    stopAudio();
    srcN = actx.createBufferSource();
    srcN.buffer = buf;
    srcN.connect(actx.destination);
    srcN.start(0, cur);
    base = cur; started = performance.now(); playing = true; btn.textContent = 'PAUSE'; loop();
  }
  btn.onclick = () => { playing ? pause() : play(); };
  rg.oninput = () => {
    const was = playing; pause(); cur = parseFloat(rg.value); show(cur); if (was) play();
  };
  show(0);
}

async function boot() {
  try {
    const lat = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([
      document.fonts.load('400 100px "Instrument Serif"', lat),
      document.fonts.load('italic 400 100px "Instrument Serif"', lat),
      document.fonts.load('900 100px "Barlow Condensed"', lat),
      document.fonts.load('500 30px "JetBrains Mono"', lat),
      document.fonts.load('700 30px "JetBrains Mono"', lat)
    ]).catch(() => {});
    await document.fonts.ready;

    buildGrainTile();
    initSpecimenSheet();
    prepareToolCanvases();

    if (!RENDER) initPreview();
    window.__reelReady = true;
  } catch(e) {
    window.__reelError = String(e && e.stack || e);
    console.error(e);
  }
}
window.addEventListener('load', boot);

})();
</script>
</body>
