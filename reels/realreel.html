<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Text Is Your Design — Callistra Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f6f0;
  --paper:#faf8f4;
  --ink:#141414;
  --muted:#736e65;
  --line:rgba(20,20,20,.12);
  --accent:#C23A1E;
  --serif:'Instrument Serif',Georgia,serif;
  --cond:'Barlow Condensed',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;isolation:isolate}
#stage,#grain{position:absolute;left:0;top:0;width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.075;pointer-events:none}
#vig{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:4;pointer-events:none;background:radial-gradient(130% 90% at 50% 50%,rgba(0,0,0,0) 65%,rgba(0,0,0,.15) 100%)}

/* Interactive preview bar (browser preview only) */
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em;cursor:pointer}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="7.8" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   SYSTEM & ENGINE CONFIGURATION
   ===================================================================== */
const REEL = { width: 1080, height: 1920, fps: 30, duration: 7.8, poster: 4.1 };
window.REEL = REEL;
const RENDER = /[?&]render=1/.test(location.search);
const $ = id => document.getElementById(id);
const W = 1080, H = 1920;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const EASE = {
  lin: p => p,
  i2: p => p * p,
  i3: p => p * p * p,
  o2: p => 1 - (1 - p) * (1 - p),
  o3: p => 1 - Math.pow(1 - p, 3),
  io2: p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  io3: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  oexp: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)
};
const prog = (t, s, d, e = 'lin') => EASE[e](clamp((t - s) / d));

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

const BRAND = {
  bg: '#f8f6f0',
  paper: '#faf8f4',
  ink: '#141414',
  muted: '#736e65',
  line: 'rgba(20,20,20,.12)',
  accent: '#C23A1E',
  darkBg: '#0e0e0e',
  darkInk: '#f2f0ec'
};

const SERIF = '"Instrument Serif", Georgia, serif';
const COND = '"Barlow Condensed", sans-serif';
const MONO = '"JetBrains Mono", monospace';

function mono(c, txt, x, y, o = {}) {
  const { size = 26, ls = 0, align = 'left', color = BRAND.ink, alpha = 1, weight = 500 } = o;
  if (alpha <= 0) return;
  c.save();
  c.font = `${weight} ${size}px ${MONO}`;
  if ('letterSpacing' in c) c.letterSpacing = ls + 'px';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.globalAlpha = alpha;
  let xx = x;
  if (align === 'center') { c.textAlign = 'center'; xx = x + ls / 2; }
  else if (align === 'right') { c.textAlign = 'right'; xx = x + ls; }
  else c.textAlign = 'left';
  c.fillText(txt, xx, y);
  c.restore();
}

function flash(c, a, col = '#000') {
  if (a > 0.005) {
    c.save();
    c.globalAlpha = clamp(a, 0, 1);
    c.fillStyle = col;
    c.fillRect(0, 0, W, H);
    c.restore();
  }
}

/* =====================================================================
   PART 1: IMPERFECT LINE-BASED CIRCLES AROUND SPECIMEN LETTERS
   The 5 words to assemble:
     1. "Your"   ('Y', 'o', 'u', 'r')
     2. "text"   ('t', 'e', 'x', 't')
     3. "is"     ('i', 's')
     4. "your"   ('y', 'o', 'u', 'r')
     5. "design."('d', 'e', 's', 'i', 'g', 'n', '.')
   ===================================================================== */

// Scattered placement of the target letters across the sheet
const TARGET_LETTERS = [
  // 1. "Your" (0.00s – 0.85s)
  { wordIdx: 0, char: 'Y', x: 260, y: 460, rx: 62, ry: 70, font: `italic 400 136px ${SERIF}`,  t0: 0.05, t1: 0.22, seed: 11 },
  { wordIdx: 0, char: 'o', x: 440, y: 520, rx: 56, ry: 58, font: `500 112px ${MONO}`,          t0: 0.25, t1: 0.42, seed: 19 },
  { wordIdx: 0, char: 'u', x: 620, y: 465, rx: 58, ry: 64, font: `900 120px ${COND}`,          t0: 0.45, t1: 0.62, seed: 27 },
  { wordIdx: 0, char: 'r', x: 800, y: 515, rx: 56, ry: 62, font: `italic 400 124px ${SERIF}`,  t0: 0.65, t1: 0.84, seed: 35 },

  // 2. "text" (0.90s – 1.70s)
  { wordIdx: 1, char: 't', x: 280, y: 735, rx: 56, ry: 66, font: `900 130px ${COND}`,          t0: 0.92, t1: 1.08, seed: 43 },
  { wordIdx: 1, char: 'e', x: 460, y: 690, rx: 54, ry: 58, font: `italic 400 126px ${SERIF}`,  t0: 1.12, t1: 1.28, seed: 51 },
  { wordIdx: 1, char: 'x', x: 630, y: 750, rx: 58, ry: 62, font: `700 114px ${MONO}`,          t0: 1.32, t1: 1.48, seed: 59 },
  { wordIdx: 1, char: 't', x: 800, y: 705, rx: 56, ry: 66, font: `900 130px ${COND}`,          t0: 1.52, t1: 1.68, seed: 67 },

  // 3. "is" (1.75s – 2.25s)
  { wordIdx: 2, char: 'i', x: 450, y: 955, rx: 50, ry: 64, font: `400 128px ${SERIF}`,         t0: 1.78, t1: 1.98, seed: 73 },
  { wordIdx: 2, char: 's', x: 630, y: 935, rx: 56, ry: 62, font: `italic 400 128px ${SERIF}`,  t0: 2.02, t1: 2.22, seed: 81 },

  // 4. "your" (2.30s – 3.05s)
  { wordIdx: 3, char: 'y', x: 280, y: 1190, rx: 58, ry: 68, font: `700 118px ${MONO}`,         t0: 2.32, t1: 2.48, seed: 89 },
  { wordIdx: 3, char: 'o', x: 460, y: 1150, rx: 56, ry: 60, font: `900 126px ${COND}`,         t0: 2.52, t1: 2.68, seed: 97 },
  { wordIdx: 3, char: 'u', x: 630, y: 1205, rx: 58, ry: 64, font: `italic 400 128px ${SERIF}`, t0: 2.72, t1: 2.86, seed: 103 },
  { wordIdx: 3, char: 'r', x: 800, y: 1165, rx: 56, ry: 62, font: `500 116px ${MONO}`,         t0: 2.90, t1: 3.04, seed: 109 },

  // 5. "design." (3.10s – 3.90s)
  { wordIdx: 4, char: 'd', x: 180, y: 1425, rx: 56, ry: 66, font: `900 124px ${COND}`,         t0: 3.12, t1: 3.22, seed: 115 },
  { wordIdx: 4, char: 'e', x: 300, y: 1390, rx: 52, ry: 58, font: `italic 400 126px ${SERIF}`, t0: 3.24, t1: 3.34, seed: 121 },
  { wordIdx: 4, char: 's', x: 420, y: 1435, rx: 54, ry: 60, font: `700 112px ${MONO}`,         t0: 3.36, t1: 3.46, seed: 127 },
  { wordIdx: 4, char: 'i', x: 540, y: 1395, rx: 48, ry: 64, font: `400 128px ${SERIF}`,        t0: 3.48, t1: 3.56, seed: 131 },
  { wordIdx: 4, char: 'g', x: 660, y: 1440, rx: 56, ry: 68, font: `italic 400 128px ${SERIF}`, t0: 3.58, t1: 3.68, seed: 137 },
  { wordIdx: 4, char: 'n', x: 780, y: 1400, rx: 56, ry: 62, font: `900 124px ${COND}`,         t0: 3.70, t1: 3.80, seed: 143 },
  { wordIdx: 4, char: '.', x: 885, y: 1430, rx: 40, ry: 40, font: `900 124px ${COND}`,         t0: 3.82, t1: 3.90, seed: 149 }
];

// Aesthetic background specimen letters scattered in the margins (no header/footer bars!)
const BG_SPECIMENS = [];
function initBgSpecimens() {
  const rnd = mulberry32(888);
  const pool = "ABCDEFGHIJKLMOPQRSTUVWXYZabcdefghjklmpqrtuvwxz0123456789&?";
  const fonts = [
    `italic 400 88px ${SERIF}`,
    `900 96px ${COND}`,
    `500 78px ${MONO}`,
    `400 92px ${SERIF}`,
    `700 80px ${MONO}`
  ];
  // Scatter around without overlapping the target letters
  for (let gy = 260; gy <= 1640; gy += 150) {
    for (let gx = 100; gx <= 980; gx += 175) {
      const rx = gx + (rnd() - 0.5) * 55;
      const ry = gy + (rnd() - 0.5) * 55;
      // Check distance to target letters
      let tooClose = false;
      for (let t of TARGET_LETTERS) {
        if (Math.hypot(rx - t.x, ry - t.y) < 115) { tooClose = true; break; }
      }
      if (!tooClose) {
        const char = pool[Math.floor(rnd() * pool.length)];
        const font = fonts[Math.floor(rnd() * fonts.length)];
        const rot = (rnd() - 0.5) * 0.14;
        BG_SPECIMENS.push({ char, x: rx, y: ry, font, rot, alpha: 0.22 + rnd() * 0.1 });
      }
    }
  }
}

// Compute organic, imperfect hand-drawn loop point at angle a
function getLoopPoint(l, a) {
  // Harmonic wobble for authentic imperfect hand-drawn line
  const s = l.seed;
  const w1 = Math.sin(a * 2 + s) * 0.08;
  const w2 = Math.cos(a * 3 + s * 1.5) * 0.05;
  const rMult = 1 + w1 + w2;
  const px = l.x + Math.cos(a) * l.rx * rMult;
  const py = l.y + Math.sin(a) * l.ry * rMult;
  return [px, py];
}

// Compute pen position at time t
function getPenPosAt(t) {
  // Before first letter
  if (t <= TARGET_LETTERS[0].t0) {
    const ptStart = getLoopPoint(TARGET_LETTERS[0], -Math.PI * 0.6);
    return [lerp(TARGET_LETTERS[0].x - 80, ptStart[0], clamp(t / TARGET_LETTERS[0].t0)),
            lerp(TARGET_LETTERS[0].y - 80, ptStart[1], clamp(t / TARGET_LETTERS[0].t0))];
  }
  // After all letters: pen rests under the final period
  const last = TARGET_LETTERS[TARGET_LETTERS.length - 1];
  if (t >= last.t1) {
    const pEnd = getLoopPoint(last, Math.PI * 1.6);
    const pWait = [last.x + 40, last.y + 40];
    const u = clamp((t - last.t1) / 0.2);
    return [lerp(pEnd[0], pWait[0], u), lerp(pEnd[1], pWait[1], u)];
  }

  // Find active letter or flight between letters
  for (let i = 0; i < TARGET_LETTERS.length; i++) {
    const cur = TARGET_LETTERS[i];
    // Inside active circling
    if (t >= cur.t0 && t <= cur.t1) {
      const u = (t - cur.t0) / (cur.t1 - cur.t0);
      const startAngle = -Math.PI * 0.6;
      const totalSweep = Math.PI * 2.25; // 360 deg + slight overlap
      const ang = startAngle + u * totalSweep;
      return getLoopPoint(cur, ang);
    }
    // Transition between cur and next letter
    if (i < TARGET_LETTERS.length - 1) {
      const next = TARGET_LETTERS[i + 1];
      if (t > cur.t1 && t < next.t0) {
        const u = (t - cur.t1) / (next.t0 - cur.t1);
        const p1 = getLoopPoint(cur, -Math.PI * 0.6 + Math.PI * 2.25);
        const p2 = getLoopPoint(next, -Math.PI * 0.6);
        // Subtle natural arc flight
        const mx = (p1[0] + p2[0]) / 2;
        const my = Math.min(p1[1], p2[1]) - 25;
        const eu = EASE.io3(u);
        const qx = (1 - eu) * (1 - eu) * p1[0] + 2 * (1 - eu) * eu * mx + eu * eu * p2[0];
        const qy = (1 - eu) * (1 - eu) * p1[1] + 2 * (1 - eu) * eu * my + eu * eu * p2[1];
        return [qx, qy];
      }
    }
  }
  return [TARGET_LETTERS[0].x, TARGET_LETTERS[0].y];
}

/* Draws authentic drafting pen */
function drawPen(c, x, y, angle = -Math.PI / 4) {
  c.save();
  c.translate(x, y);
  c.rotate(angle);

  // Soft nib contact drop shadow
  c.save();
  c.fillStyle = 'rgba(0,0,0,0.22)';
  c.beginPath();
  c.ellipse(12, 18, 26, 8, Math.PI / 6, 0, Math.PI * 2);
  c.filter = 'blur(8px)';
  c.fill();
  c.restore();

  // Ink contact point
  c.fillStyle = BRAND.ink;
  c.beginPath();
  c.arc(0, 0, 3.5, 0, Math.PI * 2);
  c.fill();

  // Nib: polished iridium tip
  c.beginPath();
  c.moveTo(0, 0);
  c.lineTo(-12, -45);
  c.lineTo(-18, -90);
  c.lineTo(18, -90);
  c.lineTo(12, -45);
  c.closePath();
  c.fillStyle = '#1c1b18';
  c.fill();
  c.strokeStyle = '#d4af37';
  c.lineWidth = 2.5;
  c.stroke();

  // Nib slit & breather hole
  c.strokeStyle = '#e6c86e';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(0, 0);
  c.lineTo(0, -50);
  c.stroke();
  c.beginPath();
  c.arc(0, -52, 3.5, 0, Math.PI * 2);
  c.fillStyle = '#e6c86e';
  c.fill();

  // Pen grip section (matte black with gold ring)
  c.fillStyle = '#222';
  c.fillRect(-20, -180, 40, 90);
  c.fillStyle = '#d4af37';
  c.fillRect(-22, -186, 44, 6);

  // Lacquered barrel
  c.fillStyle = '#0f0f0f';
  c.beginPath();
  c.moveTo(-22, -186);
  c.lineTo(-24, -420);
  c.lineTo(24, -420);
  c.lineTo(22, -186);
  c.closePath();
  c.fill();

  // Barrel specular reflection
  c.strokeStyle = 'rgba(255,255,255,0.22)';
  c.lineWidth = 4;
  c.beginPath();
  c.moveTo(-10, -190);
  c.lineTo(-11, -410);
  c.stroke();

  c.restore();
}

function drawSpecimenScene(c, t) {
  // Clean white paper sheet — NO horizontal header/footer bars, pure typography
  c.fillStyle = BRAND.paper;
  c.fillRect(0, 0, W, H);

  // Background specimen letters (dim smoothly when all words are circled at 3.9s)
  const bgDim = 1 - 0.7 * prog(t, 3.85, 0.35);
  BG_SPECIMENS.forEach(item => {
    c.save();
    c.translate(item.x, item.y);
    c.rotate(item.rot);
    c.font = item.font;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = BRAND.ink;
    c.globalAlpha = item.alpha * bgDim;
    c.fillText(item.char, 0, 0);
    c.restore();
  });

  // Draw target letters
  TARGET_LETTERS.forEach(l => {
    const isCircled = t >= l.t1;
    const isCircling = (t >= l.t0 && t < l.t1);
    let a = 0.32;
    let scale = 1.0;
    if (isCircling) {
      const u = (t - l.t0) / (l.t1 - l.t0);
      a = lerp(0.32, 1.0, u);
      scale = 1.0 + 0.12 * Math.sin(u * Math.PI);
    } else if (isCircled) {
      a = 1.0;
      // Settling punch
      const dt = t - l.t1;
      if (dt < 0.25) scale = 1.0 + 0.1 * Math.exp(-dt * 14) * Math.cos(dt * 30);
    }

    c.save();
    c.translate(l.x, l.y);
    c.scale(scale, scale);
    c.font = l.font;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = BRAND.ink;
    c.globalAlpha = a;
    c.fillText(l.char, 0, 0);
    c.restore();
  });

  // Draw imperfect hand-drawn ink loop around each letter
  TARGET_LETTERS.forEach(l => {
    if (t < l.t0) return;
    const startAngle = -Math.PI * 0.6;
    const totalSweep = Math.PI * 2.25;
    let endAngle;
    if (t >= l.t1) {
      endAngle = startAngle + totalSweep;
    } else {
      const u = (t - l.t0) / (l.t1 - l.t0);
      endAngle = startAngle + u * totalSweep;
    }

    c.save();
    c.strokeStyle = BRAND.ink;
    c.lineWidth = 3.8;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();

    const steps = 48;
    const stepAngle = (endAngle - startAngle) / steps;
    for (let i = 0; i <= steps; i++) {
      const a = startAngle + i * stepAngle;
      const pt = getLoopPoint(l, a);
      if (i === 0) c.moveTo(pt[0], pt[1]);
      else c.lineTo(pt[0], pt[1]);
    }
    c.stroke();
    c.restore();
  });

  // Faint pen connection trajectory
  c.save();
  c.strokeStyle = 'rgba(20,20,20,0.18)';
  c.lineWidth = 1.8;
  c.setLineDash([3, 5]);
  c.beginPath();
  const currentPen = getPenPosAt(t);
  const sampleFrames = Math.floor(t * 30);
  for (let f = 0; f <= sampleFrames; f++) {
    const pt = getPenPosAt(f / 30);
    if (f === 0) c.moveTo(pt[0], pt[1]);
    else c.lineTo(pt[0], pt[1]);
  }
  c.lineTo(currentPen[0], currentPen[1]);
  c.stroke();
  c.restore();

  // Draw the moving pen
  if (t < 4.35) {
    const ptPrev = getPenPosAt(Math.max(0, t - 0.025));
    const angle = Math.atan2(currentPen[1] - ptPrev[1], currentPen[0] - ptPrev[0]) - Math.PI / 2;
    drawPen(c, currentPen[0], currentPen[1], angle);
  }

  // 3.9s - 4.4s: Hold the reveal of "Your text is your design."
  if (t >= 3.9) {
    const slamP = prog(t, 3.9, 0.22, 'oexp');
    c.save();
    c.strokeStyle = BRAND.accent;
    c.lineWidth = 4.5;
    c.beginPath();
    c.moveTo(540 - 380 * slamP, 1540);
    c.lineTo(540 + 380 * slamP, 1540);
    c.stroke();
    c.restore();

    mono(c, "YOUR TEXT IS YOUR DESIGN", 540, 1600, {
      size: 32, ls: 8, align: 'center', alpha: prog(t, 4.0, 0.22, 'oexp'), color: BRAND.accent, weight: 700
    });
  }
}

/* =====================================================================
   PART 2: THE 5 TEXT EFFECT MAKERS (REAL ALGORITHMS)
   SHOWCASING:
     1. Glitch Slice      (019-glitch-slice)
     2. Stamp Wear        (010-stamp-wear)
     3. Yarn Loop         (011-yarn-loop)
     4. Kinetic Flowfield (001-kinetic-flowfield)
     5. Impact Matrix     (002-impact-matrix)

   REQUIREMENT:
   "your slider dragging animation should go from random values
    to my app's default values. I mean the mouse cursor should
    tweak the sliders to set the final output as same as my
    app's default values."
   ===================================================================== */

// 1. Glitch Slice
function renderGlitchSlice(text, fringe, shear, chaos = 0.35, color = '#141414') {
  const w = 840, h = 420, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 132px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = color;
  octx.fillText(text, w / 2, h / 2);

  const src = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  const img = ctx.createImageData(w, h);
  const dst = new Uint32Array(img.data.buffer);

  for (let dy = 0; dy < h; dy++) {
    const band = Math.floor(dy / fringe);
    const dir = (band % 2 === 0) ? 1 : -1;
    const wave = Math.sin(band * 0.45) * shear;
    const noise = Math.sin(dy * 12.9898 + band * 78.233) * 43758.5453;
    const chaotic = dir * (noise - Math.floor(noise)) * shear * 1.5;
    const shift = Math.round((wave * (1 - chaos)) + (chaotic * chaos));
    const rOff = dy * w;
    for (let dx = 0; dx < w; dx++) {
      const sx = dx - shift;
      if (sx >= 0 && sx < w) {
        const p = src[rOff + sx];
        if (p !== 0) dst[rOff + dx] = p;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// 2. Stamp Wear
function renderStampWear(text, erosion, edge = 0.65, color = '#141414') {
  const w = 840, h = 420, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 132px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = color;
  octx.fillText(text, w / 2, h / 2);

  const src = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  const img = ctx.createImageData(w, h);
  const dst = new Uint32Array(img.data.buffer);

  const R = 3;
  const em = new Float32Array(w * h);
  for (let y = 0; y < h; y += 2) {
    const r = y * w;
    for (let x = 0; x < w; x += 2) {
      if (src[r + x] === 0) continue;
      let md = R + 1;
      for (let dy = -R; dy <= R; dy += 2) {
        const ny = y + dy; if (ny < 0 || ny >= h) continue;
        const nr = ny * w;
        for (let dx = -R; dx <= R; dx += 2) {
          const nx = x + dx;
          if (nx < 0 || nx >= w || src[nr + nx] === 0) {
            const d = Math.hypot(dx, dy); if (d < md) md = d;
          }
        }
      }
      em[r + x] = Math.min(1, md / R);
    }
  }

  const innerT = 1 - erosion * 0.7, edgeT = 1 - edge * 0.95;
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      const p = src[r + x];
      if (p === 0) continue;
      const n = (Math.sin(x * 12.98 + y * 78.23) * 43758.545) % 1;
      const ef = em[r + (x & ~1)] || 0.5;
      if (Math.abs(n) < (ef * innerT + (1 - ef) * edgeT)) dst[r + x] = p;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// 3. Yarn Loop
function renderYarnLoop(text, loopR, grid = 6, fuzz = 0.45, color = '#141414') {
  const w = 840, h = 420, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `italic 400 132px ${SERIF}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000';
  octx.fillText(text, w / 2, h / 2);

  const buf = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.8; ctx.lineCap = 'round';

  for (let by = 0; by < h; by += grid) {
    const ro = by * w;
    for (let bx = 0; bx < w; bx += grid) {
      if (buf[ro + bx] === 0) continue;
      const n = Math.sin(bx * 12.98 + by * 78.23) * 43758.545;
      const rS = n - Math.floor(n);
      const fx = (rS - 0.5) * (loopR * 0.8 * fuzz);
      const cx = bx + fx, cy = by;
      ctx.beginPath(); ctx.arc(cx, cy - loopR * 0.3, loopR, 0.2 * Math.PI, 0.8 * Math.PI, true); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - loopR * 0.4, cy + loopR * 0.2, loopR * 0.6, 1.2 * Math.PI, 1.8 * Math.PI, false); ctx.stroke();
    }
  }
  return cv;
}

// 4. Kinetic Flowfield
function renderKineticFlowfield(text, strength, turbulence = 22, color = '#141414') {
  const w = 840, h = 420, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 132px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000';
  octx.fillText(text, w / 2, h / 2);

  const buf = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  ctx.fillStyle = color;
  const step = 4, dotRadius = 1.6;

  for (let y = 0; y < h; y += step) {
    const ro = y * w;
    for (let x = 0; x < w; x += step) {
      if (buf[ro + x] !== 0) {
        let px = x, py = y;
        const steps = 6, dist = strength / steps;
        for (let s = 0; s < steps; s++) {
          const ang = (Math.sin(px * 0.015 * (turbulence / 20) + py * 0.015) * 0.5 + 0.5) * Math.PI * 4;
          px += Math.cos(ang) * dist;
          py += Math.sin(ang) * dist;
        }
        ctx.beginPath(); ctx.arc(px, py, dotRadius, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  return cv;
}

// 5. Impact Matrix
function renderImpactMatrix(text, jitter, bleed = 0.55, color = '#141414') {
  const w = 840, h = 420, cv = mkCanvas(w, h), ctx = cv.getContext('2d');
  const off = mkCanvas(w, h), octx = off.getContext('2d');
  octx.font = `900 132px ${COND}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000';
  octx.fillText(text, w / 2, h / 2);

  const mask = new Uint32Array(octx.getImageData(0, 0, w, h).data.buffer);
  ctx.fillStyle = color;
  const step = 5, baseR = 1.8;

  for (let y = 0; y < h; y += step) {
    const row = y / step;
    const wave = Math.sin(row * 0.5) * (jitter * 0.5);
    const n = Math.sin(row * 127.1) * 43758.5;
    const shiftX = Math.round(wave + ((n - Math.floor(n)) - 0.5) * jitter);

    for (let x = 0; x < w; x += step) {
      const sx = x - shiftX;
      if (sx >= 0 && sx < w) {
        if (mask[y * w + sx] !== 0) {
          const rSeed = (Math.sin(x * 12.9 + y * 78.2) * 43758.5) % 1;
          const r = (Math.abs(rSeed) < bleed) ? baseR * 1.5 : baseR;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }
  return cv;
}

/* =====================================================================
   PART 3: DRAW FAST 5-TOOL SHOWCASE GLANCES (4.4s – 7.0s)
   ===================================================================== */
const SHOWCASE_T0 = 4.40;
const SHOWCASE_DUR = 0.52; // 5 tools × ~0.52s = 2.60s

function drawToolGlance(c, t) {
  const elapsed = t - SHOWCASE_T0;
  const index = clamp(Math.floor(elapsed / SHOWCASE_DUR), 0, TOOL_SHOWCASE.length - 1);
  const tool = TOOL_SHOWCASE[index];
  const tLocal = elapsed - index * SHOWCASE_DUR;

  // Screen background
  c.fillStyle = BRAND.bg;
  c.fillRect(0, 0, W, H);

  // Hard cut pulse / punch
  const punch = Math.exp(-tLocal * 26) * 10;
  c.save();
  c.translate(0, punch);

  // Top header status bar
  mono(c, "CALLISTRA.DESIGN", 100, 220, { size: 26, ls: 4, alpha: 0.75, weight: 700 });
  mono(c, `[ 0${index + 1} / 05 ]`, 980, 220, { size: 24, ls: 3, align: 'right', alpha: 0.75 });

  // Big headline for the tool
  c.save();
  c.font = `900 88px ${COND}`;
  c.fillStyle = BRAND.ink;
  c.fillText(tool.name, 100, 320);
  c.restore();

  // Draw UI frame container
  const uiX = 100, uiY = 380, uiW = 880, uiH = 1240;
  c.save();
  c.fillStyle = '#ffffff';
  c.strokeStyle = BRAND.line;
  c.lineWidth = 2;
  c.beginPath();
  c.roundRect(uiX, uiY, uiW, uiH, 8);
  c.fill();
  c.stroke();
  c.restore();

  // Canvas preview box with checkerboard
  const cvX = uiX + 40, cvY = uiY + 40, cvW = uiW - 80, cvH = 460;
  c.save();
  c.beginPath();
  c.rect(cvX, cvY, cvW, cvH);
  c.clip();

  // Checkerboard
  const chkSize = 22;
  for (let cy = cvY; cy < cvY + cvH; cy += chkSize) {
    for (let cx = cvX; cx < cvX + cvW; cx += chkSize) {
      c.fillStyle = ((cx / chkSize + cy / chkSize) % 2 === 0) ? '#efece6' : '#ffffff';
      c.fillRect(cx, cy, chkSize, chkSize);
    }
  }

  // TWEAK SLIDER ANIMATION: from random value to app's default value
  // Drag runs from tLocal = 0.08s to 0.36s
  const dragProg = prog(tLocal, 0.08, 0.28, 'io3');
  const frameIdx = clamp(Math.round(dragProg * 6), 0, 6);
  const activeCanvas = TOOL_FRAMES[index][frameIdx];
  c.drawImage(activeCanvas, cvX, cvY, cvW, cvH);
  c.strokeStyle = BRAND.line;
  c.lineWidth = 2;
  c.strokeRect(cvX, cvY, cvW, cvH);
  c.restore();

  // Input row
  const inpY = cvY + cvH + 50;
  mono(c, tool.word, cvX, inpY + 12, { size: 36, alpha: 0.9, weight: 700 });
  c.save();
  c.strokeStyle = BRAND.ink;
  c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(cvX, inpY + 45);
  c.lineTo(cvX + cvW, inpY + 45);
  c.stroke();
  c.restore();

  // Slider 1: Tweaked by mouse cursor from startVal to defaultVal!
  const sl1 = tool.slider1;
  const sl1Y = inpY + 105;
  const currentVal1 = Math.round(lerp(sl1.startVal, sl1.defaultVal, dragProg));
  const isAtDefault = dragProg >= 0.98;

  mono(c, sl1.label.toUpperCase(), cvX, sl1Y, { size: 22, ls: 3, color: BRAND.muted });
  mono(c, `${currentVal1}${sl1.unit}${isAtDefault ? " (DEFAULT)" : ""}`, cvX + cvW, sl1Y, {
    size: 24, align: 'right', weight: 700, color: isAtDefault ? BRAND.accent : BRAND.ink
  });

  // Slider 1 track & knob
  c.save();
  c.strokeStyle = BRAND.line;
  c.lineWidth = 3.5;
  c.beginPath();
  c.moveTo(cvX, sl1Y + 35);
  c.lineTo(cvX + cvW, sl1Y + 35);
  c.stroke();

  const sl1Norm = (currentVal1 - sl1.min) / (sl1.max - sl1.min);
  const thumb1X = cvX + cvW * sl1Norm;
  c.fillStyle = isAtDefault ? BRAND.accent : BRAND.ink;
  c.beginPath();
  c.arc(thumb1X, sl1Y + 35, 13, 0, Math.PI * 2);
  c.fill();
  c.restore();

  // Slider 2 (Secondary parameter at default)
  const sl2 = tool.slider2;
  const sl2Y = sl1Y + 115;
  mono(c, sl2.label.toUpperCase(), cvX, sl2Y, { size: 22, ls: 3, color: BRAND.muted });
  mono(c, `${sl2.defaultVal}${sl2.unit} (DEFAULT)`, cvX + cvW, sl2Y, { size: 24, align: 'right', weight: 700 });

  c.save();
  c.strokeStyle = BRAND.line;
  c.lineWidth = 3.5;
  c.beginPath();
  c.moveTo(cvX, sl2Y + 35);
  c.lineTo(cvX + cvW, sl2Y + 35);
  c.stroke();

  const sl2Norm = (sl2.defaultVal - sl2.min) / (sl2.max - sl2.min);
  c.fillStyle = BRAND.ink;
  c.beginPath();
  c.arc(cvX + cvW * sl2Norm, sl2Y + 35, 12, 0, Math.PI * 2);
  c.fill();
  c.restore();

  // Accordion bar: COLOR & CANVAS SIZE
  const advY = sl2Y + 105;
  c.save();
  c.strokeStyle = BRAND.line;
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(cvX, advY);
  c.lineTo(cvX + cvW, advY);
  c.stroke();
  c.restore();
  mono(c, "COLOR AND SIZE", cvX, advY + 35, { size: 22, ls: 3, color: BRAND.muted });
  mono(c, "＋", cvX + cvW, advY + 35, { size: 26, align: 'right', color: BRAND.muted });

  // Download Button CTA
  const btnY = uiY + uiH - 125;
  const isExporting = tLocal > 0.40;
  c.save();
  c.fillStyle = isExporting ? BRAND.accent : BRAND.ink;
  c.beginPath();
  c.roundRect(cvX, btnY, cvW, 82, 4);
  c.fill();
  c.restore();

  mono(c, isExporting ? "EXPORTING PNG..." : "DOWNLOAD PNG", cvX + cvW / 2, btnY + 41, {
    size: 24, ls: 4, align: 'center', color: '#ffffff', weight: 700
  });

  // MOUSE CURSOR: Moves to knob, drags it to default, then moves down to Download button
  let curX = thumb1X, curY = sl1Y + 35;
  if (tLocal < 0.08) {
    const uIn = tLocal / 0.08;
    curX = lerp(cvX + 60, thumb1X, uIn);
    curY = lerp(cvY + 300, sl1Y + 35, uIn);
  } else if (tLocal <= 0.36) {
    curX = thumb1X;
    curY = sl1Y + 35;
  } else {
    const uOut = clamp((tLocal - 0.36) / 0.12);
    curX = lerp(thumb1X, cvX + cvW / 2, uOut);
    curY = lerp(sl1Y + 35, btnY + 41, uOut);
  }

  c.save();
  c.translate(curX, curY);
  c.fillStyle = '#ffffff';
  c.strokeStyle = '#121212';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(0, 0); c.lineTo(0, 26); c.lineTo(7, 20); c.lineTo(16, 29); c.lineTo(21, 26); c.lineTo(12, 17); c.lineTo(22, 17);
  c.closePath();
  c.fill();
  c.stroke();
  c.restore();

  c.restore(); // end camera punch

  // Quick 1-frame cut flash between tools
  flash(c, 0.14 * Math.exp(-tLocal * 26), '#000');
}

/* =====================================================================
   MAIN RENDER FUNCTION (PURE FUNCTION OF t)
   ===================================================================== */
const stage = $('stage'), sc = stage.getContext('2d');
const grain = $('grain'), gc = grain.getContext('2d');
let grainTile = null;

function buildGrainTile() {
  const rnd = mulberry32(13);
  grainTile = mkCanvas(512, 512);
  const g = grainTile.getContext('2d'), id = g.createImageData(512, 512);
  for (let i = 0; i < 512 * 512; i++) {
    const v = rnd() * 255;
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v;
    id.data[i * 4 + 3] = 255;
  }
  g.putImageData(id, 0, 0);
}

function renderFrame(t) {
  t = clamp(t, 0, REEL.duration);
  sc.setTransform(1, 0, 0, 1, 0, 0);
  sc.clearRect(0, 0, W, H);

  if (t < SHOWCASE_T0) {
    drawSpecimenScene(sc, t);
  } else if (t < 7.00) {
    drawToolGlance(sc, t);
  } else {
    drawOutro(sc, t);
  }

  // Animated subtle film grain
  const f = Math.floor(t * REEL.fps + 0.001);
  const ox = (f * 97) % 512, oy = (f * 57) % 512;
  gc.clearRect(0, 0, W, H);
  for (let x = -ox; x < W; x += 512) {
    for (let y = -oy; y < H; y += 512) {
      gc.drawImage(grainTile, x, y);
    }
  }
}
window.renderFrame = renderFrame;

/* =====================================================================
   OFFLINE AUDIO SYNTHESIZER
   ===================================================================== */
async function buildAudio() {
  const SR = 44100, DUR = REEL.duration;
  const oc = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  const rand = mulberry32(42);

  const nb = oc.createBuffer(1, SR * 3, SR);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = rand() * 2 - 1;

  const master = oc.createGain();
  master.gain.setValueAtTime(0.78, 0);
  master.gain.setValueAtTime(0.78, DUR - 0.35);
  master.gain.linearRampToValueAtTime(0, DUR - 0.02);

  const comp = oc.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 10; comp.ratio.value = 8;
  comp.attack.value = 0.002; comp.release.value = 0.12;
  master.connect(comp);
  comp.connect(oc.destination);

  const rl = Math.floor(SR * 1.5), ir = oc.createBuffer(2, rl, SR);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < rl; i++) d[i] = (rand() * 2 - 1) * Math.pow(1 - i / rl, 3.5);
  }
  const conv = oc.createConvolver(); conv.buffer = ir;
  const revIn = oc.createGain(), revOut = oc.createGain();
  revOut.gain.value = 0.35;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(master);

  const out = (g, o = {}) => {
    let n = g;
    if (o.pan) { const p = oc.createStereoPanner(); p.pan.value = o.pan; n.connect(p); n = p; }
    n.connect(master);
    if (o.rev > 0) { const s = oc.createGain(); s.gain.value = o.rev; n.connect(s); s.connect(revIn); }
  };

  const env = (p, t, peak, a, d) => {
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(peak, t + a);
    p.exponentialRampToValueAtTime(0.0001, t + a + d);
  };
  const nsrc = (t, dur, seed) => {
    const s = oc.createBufferSource(); s.buffer = nb; s.loop = true;
    s.start(t, (Math.abs(seed) * 0.37) % 2, undefined); s.stop(t + dur); return s;
  };
  const flt = (type, f, q = 1) => {
    const b = oc.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b;
  };
  const osc = (type, f, t, dur) => {
    const o = oc.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    o.start(t); o.stop(t + dur); return o;
  };

  const penScratch = (t, dur = 0.16, pan = 0) => {
    const n = nsrc(t, dur, t * 19.1), bp = flt('bandpass', 3400, 2.2), g = oc.createGain();
    env(g.gain, t, 0.09, 0.015, dur - 0.015);
    n.connect(bp); bp.connect(g); out(g, { pan, rev: 0.1 });
  };
  const letterSnap = (t, pitch = 820) => {
    const o = osc('triangle', pitch, t, 0.06), gn = oc.createGain();
    env(gn.gain, t, 0.22, 0.001, 0.05);
    o.connect(gn); out(gn, { rev: 0.12 });
  };
  const thud = (t, g = 0.7) => {
    const o = osc('sine', 160, t, 0.45);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.22);
    const og = oc.createGain(); env(og.gain, t, g, 0.003, 0.35);
    o.connect(og); out(og, { rev: 0.25 });
  };
  const shutterCut = (t, pitch = 1400) => {
    const o = osc('square', pitch, t, 0.05), gn = oc.createGain();
    env(gn.gain, t, 0.2, 0.001, 0.04);
    o.connect(gn); out(gn);
    const n = nsrc(t, 0.03, t * 3.7), hp = flt('highpass', 2400), ng = oc.createGain();
    env(ng.gain, t, 0.3, 0.0005, 0.025);
    n.connect(hp); hp.connect(ng); out(ng);
  };
  const chime = (t) => {
    [[659.25, 0], [987.77, 0.08], [1318.51, 0.16]].forEach(([f, d]) => {
      const o = osc('sine', f, t + d, 1.4), g = oc.createGain();
      env(g.gain, t + d, 0.22, 0.003, 1.1);
      o.connect(g); out(g, { rev: 0.5 });
    });
  };

  // 1. Circling friction & snap for each letter
  TARGET_LETTERS.forEach((l, idx) => {
    penScratch(l.t0, l.t1 - l.t0, (idx % 2 === 0) ? -0.2 : 0.2);
    letterSnap(l.t1, 680 + (idx % 7) * 90);
  });

  // 2. Big typographic slam on "Your text is your design."
  thud(3.9, 0.85);

  // 3. Fast shutter sound + slider ratchet on every tool glance cut
  for (let i = 0; i < 5; i++) {
    const tc = SHOWCASE_T0 + i * SHOWCASE_DUR;
    shutterCut(tc, 1100 + i * 160);
    // Slider tweak zip
    penScratch(tc + 0.10, 0.22, 0.1);
    letterSnap(tc + 0.36, 1200);
  }

  // 4. Outro boom & chime
  thud(7.0, 0.8);
  chime(7.1);

  return oc.startRendering();
}

let audioP = null;
const getAudio = () => audioP || (audioP = buildAudio());

function toWavB64(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const data = []; let peak = 0;
  for (let c = 0; c < ch; c++) {
    const d = buf.getChannelData(c); data.push(d);
    for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
  }
  const gain = peak > 0.89 ? 0.89 / peak : 1;
  const ab = new ArrayBuffer(44 + n * ch * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE');
  ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true);
  v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * ch * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    for (let c = 0; c < ch; c++) {
      v.setInt16(o, Math.round(clamp(data[c][i] * gain, -1, 1) * 32767), true);
      o += 2;
    }
  }
  const bytes = new Uint8Array(ab); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
window.renderAudio = async () => toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER & INITIALIZATION
   ===================================================================== */
function initPreview() {
  const vp = $('viewport'), pl = $('player'), btn = $('pBtn'), rg = $('pRange'), tm = $('pTime');
  pl.hidden = false; rg.max = REEL.duration;
  const fit = () => {
    const s = Math.min(innerWidth / W, (innerHeight - 64) / H);
    vp.style.transform = `scale(${s})`;
    vp.style.left = ((innerWidth - W * s) / 2) + 'px';
  };
  addEventListener('resize', fit); fit();

  let playing = false, base = 0, started = 0, cur = 0, actx = null, srcN = null, buf = null;
  const stopAudio = () => { if (srcN) { try { srcN.stop(); } catch(e) {} srcN = null; } };
  const show = t => { renderFrame(t); rg.value = t; tm.textContent = t.toFixed(1) + 's'; };

  function loop() {
    if (!playing) return;
    cur = base + (performance.now() - started) / 1000;
    if (cur >= REEL.duration) {
      cur = REEL.duration; show(cur); pause(); btn.textContent = 'REPLAY'; cur = 0; return;
    }
    show(cur);
    requestAnimationFrame(loop);
  }
  function pause() {
    playing = false; stopAudio(); if (btn.textContent === 'PAUSE') btn.textContent = 'PLAY';
  }
  async function play() {
    btn.textContent = 'PREPARING SOUND…';
    if (!buf) buf = await getAudio();
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') await actx.resume();
    stopAudio();
    srcN = actx.createBufferSource();
    srcN.buffer = buf;
    srcN.connect(actx.destination);
    srcN.start(0, cur);
    base = cur; started = performance.now(); playing = true; btn.textContent = 'PAUSE'; loop();
  }
  btn.onclick = () => { playing ? pause() : play(); };
  rg.oninput = () => {
    const was = playing; pause(); cur = parseFloat(rg.value); show(cur); if (was) play();
  };
  show(0);
}

async function boot() {
  try {
    const lat = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([
      document.fonts.load('400 100px "Instrument Serif"', lat),
      document.fonts.load('italic 400 100px "Instrument Serif"', lat),
      document.fonts.load('900 100px "Barlow Condensed"', lat),
      document.fonts.load('500 30px "JetBrains Mono"', lat),
      document.fonts.load('700 30px "JetBrains Mono"', lat)
    ]).catch(() => {});
    await document.fonts.ready;

    buildGrainTile();
    initBgSpecimens();
    prepareToolFrames();

    if (!RENDER) initPreview();
    window.__reelReady = true;
  } catch(e) {
    window.__reelError = String(e && e.stack || e);
    console.error(e);
  }
}
window.addEventListener('load', boot);

})();
