(()=>{

    const X=SX+(n*step-cx)*s;if(X<34)continue;c.fillText((n*step).toFixed(dec),X+3,112);
  }
  for(let n=Math.ceil(y0/step);n<=Math.floor(y1/step);n++){
    if(!(!minor||n%10===0))continue;
    const Y=SY+(n*step-cy)*s;if(Y<150)continue;
    c.save();c.translate(2,Y-3);c.rotate(-Math.PI/2);c.textBaseline='top';c.fillText((n*step).toFixed(dec),0,0);c.restore();
  }
}
function chrome(s,cx,cy,t){
  c.fillStyle='#1a1a1a';c.fillRect(0,0,1080,110);c.fillStyle='#2e2e2e';c.fillRect(0,108,1080,2);
  c.textBaseline='middle';c.textAlign='left';
  c.fillStyle='#d8d8d8';c.font='600 26px Inter,sans-serif';c.fillText('poster_FINAL_v27_reallyfinal.ai',30,34);
  c.fillStyle='#0e0e0e';rr(760,12,290,46,8);c.fill();c.strokeStyle='#ffd166';c.lineWidth=2;c.stroke();
  c.fillStyle='#ffd166';c.font='700 28px "JetBrains Mono",monospace';c.textAlign='right';
  c.fillText(Math.round(s*100).toLocaleString('en-US')+'%',1036,36);
  c.textAlign='left';
  c.fillStyle=(Math.floor(t*6)%2)?'#ff3b30':'rgba(255,59,48,.35)';c.beginPath();c.arc(40,82,8,0,6.2832);c.fill();
  c.fillStyle='#fff';c.font='700 22px "JetBrains Mono",monospace';c.fillText('REC   POV: 1,000,000% ZOOM',58,83);
  c.fillStyle='#1a1a1a';c.fillRect(0,1860,1080,60);
  c.fillStyle='#8f8f8f';c.font='500 20px "JetBrains Mono",monospace';c.textBaseline='middle';
  c.fillText('X '+cx.toFixed(4)+'   Y '+cy.toFixed(4),30,1890);
  c.textAlign='right';c.fillText('Smart Guides ON · Pixel Preview',1050,1890);c.textAlign='left';
}
function keycap(x,y,w,h,label,press,size){
  c.save();c.translate(x+w/2,y+h/2);const k=press?.92:1;c.scale(k,k);
  c.fillStyle=press?'#f0261c':'#f2f2f2';rr(-w/2,-h/2,w,h,16);c.fill();c.strokeStyle='#000';c.lineWidth=4;c.stroke();
  c.fillStyle=press?'#fff':'#111';c.font='700 '+(size||56)+'px Inter,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(label,0,4);c.restore();
}
function cursor(x,y,pressed){
  c.save();c.translate(x,y);if(pressed)c.scale(.88,.88);
  c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=10;c.shadowOffsetY=3;
  c.beginPath();c.moveTo(0,0);c.lineTo(0,34);c.lineTo(8,26);c.lineTo(14,40);c.lineTo(20,37);c.lineTo(14,24);c.lineTo(25,24);c.closePath();
  c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=2.5;c.lineJoin='round';c.fill();c.stroke();c.restore();
}
function ring(x,y,age){
  if(age<0||age>.28)return;const p=age/.28;
  c.save();c.strokeStyle='rgba(255,255,255,'+(1-p)+')';c.lineWidth=5*(1-p)+1;
  c.beginPath();c.arc(x,y,12+50*eo(p),0,6.2832);c.stroke();
  c.fillStyle='rgba(240,38,28,'+(.35*(1-p))+')';c.fill();c.restore();
}

function drawA(t){
  const cm=camA(t),s=cm.s,cx=cm.cx,cy=cm.cy,p=cm.p;
  const sh=(p>0&&p<1)?Math.sin(Math.PI*p):0;
  const SX=540+Math.sin(t*131)*6*sh,SY=960+Math.cos(t*97)*6*sh;
  SC=s;
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.clearRect(0,0,1080,1920);
  c.fillStyle='#232323';c.fillRect(0,0,1080,1920);
  const nx=nudge(t);
  const dcx=SX+(DX0+nx-cx)*s,dcy=SY+(DY0-cy)*s;
  if(s<=1200){c.save();c.translate(SX-cx*s,SY-cy*s);c.scale(s,s);drawPoster();c.restore()}
  else{c.fillStyle='#efe8d6';c.fillRect(0,0,1080,1920)}
  /* the dot (drawn in screen space for numeric precision) */
  c.fillStyle='#121212';c.beginPath();c.arc(dcx,dcy,DR*s,0,6.2832);c.fill();
  const hl=ss(6,30,s);
  if(hl>0){c.save();c.globalAlpha=hl;c.strokeStyle='#2d8cff';c.lineWidth=3;c.stroke();c.restore()}
  drawGrid(s,cx,cy,SX,SY);
  if(s<=1200){c.save();c.translate(SX-cx*s,SY-cy*s);c.scale(s,s);drawAnn(t,s,nx);c.restore()}
  /* anchor, handles, ghost of original edge, readout */
  const al=ss(300,3000,s);
  if(al>0){
    const ax=SX+(DX0+nx+DR-cx)*s,ay=dcy,gx=SX+(DX0+DR-cx)*s;
    c.save();c.globalAlpha=al;
    c.setLineDash([14,10]);c.strokeStyle='#ff4fa3';c.lineWidth=2;c.beginPath();c.moveTo(gx,150);c.lineTo(gx,1850);c.stroke();c.setLineDash([]);
    c.strokeStyle='#2d8cff';c.lineWidth=2;c.beginPath();c.moveTo(ax,ay-150);c.lineTo(ax,ay+150);c.stroke();
    c.fillStyle='#2d8cff';for(const d of[-150,150]){c.beginPath();c.arc(ax,ay+d,8,0,6.2832);c.fill()}
    c.fillStyle='#fff';c.strokeStyle='#2d8cff';c.lineWidth=3;c.fillRect(ax-13,ay-13,26,26);c.strokeRect(ax-13,ay-13,26,26);
    const l1='ΔX '+(nx>=0?'+':'')+nx.toFixed(4)+' px',l2='x '+(761.4+nx).toFixed(4);
    c.font='700 30px "JetBrains Mono",monospace';c.textAlign='left';c.textBaseline='middle';
    const w=Math.max(c.measureText(l1).width,c.measureText(l2).width);
    c.fillStyle='#111';rr(ax+36,ay-110,w+32,92,12);c.fill();
    c.fillStyle='#ffd166';c.fillText(l1,ax+52,ay-80);c.fillStyle='#9a9a9a';c.fillText(l2,ax+52,ay-42);
    c.restore();
  }
  rulers(s,cx,cy,SX,SY);
  chrome(s,cx,cy,t);
  /* mouse + key caps (screen-recording feel) */
  let lastK=null;for(const k of KEYS)if(t>=k.t)lastK=k;
  if(lastK&&t<.31)keycap(40,1730,110,110,lastK.k,t-lastK.t<.05,56);
  if(t>=.30&&t<.82){keycap(40,1730,110,110,'⌘',true,56);keycap(164,1730,110,110,'−',Math.floor(t*30)%2===0,56)}
  cursor(720+Math.sin(t*9)*4,1180+Math.cos(t*7)*3,false);
  finish(0,t);
}

/* ======================================================================
   APP SCENES (B–E) — the real app, driven only through its own functions
   ====================================================================== */
let W=null,D=null,curScene=-1,lastPreset=-9;
const E=code=>W.eval(code);
const secEl=()=>D.querySelector('.sections');
function setTab(n){const b=D.querySelector('.tab[data-t="'+n+'"]');if(b&&b.getAttribute('aria-selected')!=='true')b.click()}
function scrollTarget(el,off){const s=secEl();s.scrollTop=0;const r=el.getBoundingClientRect(),sr=s.getBoundingClientRect();return Math.max(0,r.top-sr.top-off)}
function R(el){const r=el.getBoundingClientRect();return{l:r.left*2,t:r.top*2,w:r.width*2,h:r.height*2,cx:(r.left+r.width/2)*2,cy:(r.top+r.height/2)*2}}
const seedAt=n=>n===0?7:((n*48271+9973)%90000)+1000;
const DEFAULT="Object.assign(state,{seed:7,shape:55,halftone:45,mismatch:40,style:'clean',age:0,folds:0,bleed:0,dropout:0,smear:0,tearH:50,tearV:50,fibers:0,stock:'mag'});$('palette').value='mix';$('tape').checked=false;$('staple').checked=false;";

function setupScene(sc){
  E("prevText='';uids=[];nextUid=1;$('textInput').value='note';syncUids('note');rebuildStrip();overrides={};selUid=null;group.clear();$('rcase').checked=true;$('rfont').checked=true;$('format').value='square';applyFormat();"+DEFAULT);
  if(sc>=3)E("applyPreset('Punk Cover')");
  setTab(sc===1||sc===2?'text':'style');
  secEl().scrollTop=0;
  lastPreset=-9;
}

/* B — Fine-tune it. */
function sceneB(t){
  const tb=t-B[1],uid=W.uids[1],sel=tb>=.12;
  E('selUid='+(sel?uid:'null'));
  const mr=Math.round(-32*eio(clamp((tb-.28)/.34))),ms=Math.round(100+65*eio(clamp((tb-.70)/.34)));
  if(tb>=.28)E('overrides['+uid+']=Object.assign(overrides['+uid+']||{},{mrot:'+mr+',mscl:'+ms+'})');
  else E('delete overrides['+uid+']');
  E('performDraw()');
  if(sel)secEl().scrollTop=scrollTarget(D.getElementById('mrot'),60)*eio(clamp((tb-.12)/.26));
  const chip=R(D.querySelectorAll('#letterStrip .letter-btn')[2]);
  const thumb=(id,v,mn,mx)=>{const r=R(D.getElementById(id));return[r.l+28+(v-mn)/(mx-mn)*(r.w-56),r.cy]};
  let p;
  if(tb<.12)p=mix([700,1500],[chip.cx,chip.cy],eio(tb/.12));
  else if(tb<.28)p=mix([chip.cx,chip.cy],thumb('mrot',0,-180,180),eio((tb-.12)/.16));
  else if(tb<.62)p=thumb('mrot',mr,-180,180);
  else if(tb<.70)p=mix(thumb('mrot',mr,-180,180),thumb('mscl',100,30,300),eio((tb-.62)/.08));
  else p=thumb('mscl',ms,30,300);
  return{p:p,pressed:(tb>=.28&&tb<.62)||tb>=.70,taps:[.12,.28,.70],tl:tb,n:0};
}

/* C — Indecisive? */
const SEQ=['Xerox Zine','Riso Poster','Crime Headline','Xerox Zine','Riso Poster','Punk Cover'];
const CT=[.24,.34,.44,.54,.64,.74];
function sceneC(t){
  const tc=t-B[2];
  setTab(tc>=.05?'style':'text');
  let idx=-1;CT.forEach((x,i)=>{if(tc>=x)idx=i});
  if(idx!==lastPreset){lastPreset=idx;if(idx<0)E(DEFAULT);else E("applyPreset('"+SEQ[idx]+"')")}
  E('performDraw()');
  if(tc>=.05)secEl().scrollTop=scrollTarget(D.getElementById('presetChips'),150)*eio(clamp((tc-.07)/.18));
  const tab=R(D.querySelector('.tab[data-t="style"]'));
  const chips=[...D.querySelectorAll('#presetChips .letter-btn')];
  const chipOf=n=>{const e=chips.find(b=>b.textContent===n);const r=R(e);return[r.cx,r.cy]};
  const w=[[0,[800,1330]],[.05,[tab.cx,tab.cy]]];
  for(let i=0;i<CT.length;i++){const q=chipOf(SEQ[i]);w.push([CT[i]-.03,q]);w.push([CT[i]+.01,q])}
  const p=follow(w,tc);
  const age=tapAge([.05].concat(CT),tc);
  return{p:p,pressed:age<.09,taps:[.05].concat(CT),tl:tc,n:0};
}

/* D & E — Shuffle it. / Never the same note twice. */
const TD=[.30,.45,.58,.70,.82];
const TE=[.04,.165,.29,.415,.54,.665,.79,.915,1.04];
function sceneShuf(sc,t){
  const tl=t-B[sc],taps=sc===3?TD:TE;
  let n=sc===3?0:5;taps.forEach(x=>{if(tl>=x)n++});
  E('state.seed='+seedAt(n));
  E('performDraw()');
  const sP=scrollTarget(D.getElementById('presetChips'),150),sS=scrollTarget(D.getElementById('shuffleBtn'),200);
  secEl().scrollTop=sc===3?lerp(sP,sS,eio(clamp(tl/.25))):sS;
  const btn=D.getElementById('shuffleBtn'),age=tapAge(taps,tl);
  btn.style.transform=age<.09?'scale(.94)':'';btn.style.filter=age<.09?'brightness(1.3)':'';
  const b=R(btn);
  let p=sc===3?follow([[0,[640,1250]],[.26,[b.cx,b.cy]]],tl):[b.cx,b.cy];
  p=[p[0]+Math.sin(t*37)*3,p[1]+Math.cos(t*29)*3];
  return{p:p,pressed:age<.09,taps:taps,tl:tl,n:n};
}

function driveApp(sc,t){
  if(sc!==curScene){setupScene(sc);curScene=sc}
  let info;
  if(sc===1)info=sceneB(t);else if(sc===2)info=sceneC(t);else info=sceneShuf(sc,t);
  cam.style.transform=sc===4?'scale('+(1+.05*eio(clamp(info.tl/1.22)))+')':'none';
  /* overlay */
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.clearRect(0,0,1080,1920);
  ring(info.p[0],info.p[1],tapAge(info.taps,info.tl));
  cursor(info.p[0],info.p[1],info.pressed);
  if(sc>=3){
    c.save();c.textAlign='right';c.textBaseline='middle';c.font='900 54px "Barlow Condensed",sans-serif';
    const lab='SHUFFLE ×'+info.n,w=c.measureText(lab).width;
    c.fillStyle='#F0261C';rr(1044-w-36,150,w+36,76,18);c.fill();
    c.fillStyle='#fff';c.fillText(lab,1026,190);c.restore();
  }
  finish(sc,t);
}

/* ======================================================================
   shared finishing layer: vignette, caption, cut flashes
   ====================================================================== */
let VG=null;
function finish(sc,t){
  if(!VG){VG=c.createRadialGradient(540,960,520,540,960,1250);VG.addColorStop(0,'rgba(0,0,0,0)');VG.addColorStop(1,'rgba(0,0,0,.5)')}
  c.save();c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.fillStyle=VG;c.fillRect(0,0,1080,1920);c.restore();
  const txt=CAPS[sc],k=eo(clamp((t-B[sc])/.08)),y=sc===0?1790:1030;
  c.save();c.textAlign='center';c.textBaseline='middle';
  let size=96;c.font='900 '+size+'px "Barlow Condensed",sans-serif';
  const w=c.measureText(txt).width;
  if(w>960){size=Math.floor(96*960/w);c.font='900 '+size+'px "Barlow Condensed",sans-serif'}
  c.translate(540,y);const z=.92+.08*k;c.scale(z,z);c.globalAlpha=k;
  c.lineJoin='round';c.lineWidth=14;c.strokeStyle='#000';c.strokeText(txt,0,0);c.fillStyle='#fff';c.fillText(txt,0,0);c.restore();
  for(let i=1;i<5;i++){const d=t-B[i];if(d>=0&&d<.07){c.fillStyle='rgba(255,255,255,'+(.5*(1-d/.07))+')';c.fillRect(0,0,1080,1920)}}
}

/* ======================================================================
   public contract
   ====================================================================== */
function sceneOf(t){for(let i=4;i>0;i--)if(t>=B[i])return i;return 0}
window.renderFrame=function(t){
  t=clamp(t,0,DUR-0.001);
  const sc=sceneOf(t);
  if(sc===0){ifw.style.visibility='hidden';cam.style.transform='none';drawA(t)}
  else{ifw.style.visibility='visible';driveApp(sc,t)}
};

(async()=>{
  try{
    await Promise.all([
      document.fonts.load('900 100px "Barlow Condensed"'),
      document.fonts.load('700 14px "JetBrains Mono"'),
      document.fonts.load('500 14px "JetBrains Mono"'),
      document.fonts.load('600 20px Inter'),
      document.fonts.load('700 20px Inter')
    ]);
    const b64=$('appb64').textContent.trim();
    const src=new TextDecoder().decode(Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)));
    await new Promise(res=>{ifr.onload=res;ifr.srcdoc=src});
    W=ifr.contentWindow;D=W.document;
    await D.fonts.ready;
    await E('Promise.all(FONT_POOL.map(f=>document.fonts.load(fontStr(f,40),"Aa")))');
    D.documentElement.dataset.theme='dark';
    E('normCache={};tileCache.clear();');
    setupScene(1);curScene=1;
    E('performDraw()');
    curScene=-1;
    window.renderFrame(0);
    window.__reelReady=true;
    if(!RENDER){
      if(Q.has('t')){window.renderFrame(parseFloat(Q.get('t')))}
      else{
        const t0=performance.now();
        const loop=()=>{const t=((performance.now()-t0)/1000)%(DUR+.5);window.renderFrame(Math.min(t,DUR-.001));requestAnimationFrame(loop)};
        requestAnimationFrame(loop);
      }
    }
  }catch(e){window.__reelError=String(e&&e.stack||e)}
})();
})();
</script>
