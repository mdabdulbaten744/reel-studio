<script>
/* =====================================================================
   NEWSPAPER CUTOUT API  v1.0
   Code-only version of "Newspaper Cutout Studio" (same engine, no UI).
   Single self-contained file. No dependencies. Browser only (uses <canvas>).

   ---------------------------------------------------------------------
   QUICK START  (paste this file inside a <script> tag in your HTML)
   ---------------------------------------------------------------------
     <canvas id="poster" width="1200" height="1600"></canvas>
     <script>
       // ...this whole file here...
       (async () => {
         await NewspaperCutout.ready();            // loads the Google Fonts once
         const ctx = document.getElementById('poster').getContext('2d');

         // draw a cutout title straight onto your own poster canvas:
         NewspaperCutout.drawTo(ctx, { text: 'BREAKING', preset: 'Punk Cover', seed: 42 },
                                { x: 600, y: 300, width: 900, anchor: 'center', rotate: -0.08 });
       })();
     <\/script>

   ---------------------------------------------------------------------
   FUNCTIONS
   ---------------------------------------------------------------------
   NewspaperCutout.ready()                 -> Promise. Loads fonts. Await it ONCE before rendering.
   NewspaperCutout.render(opts)            -> HTMLCanvasElement (transparent PNG-like, auto-cropped). Sync.
   NewspaperCutout.renderAsync(opts)       -> Promise<canvas> (awaits ready() for you).
   NewspaperCutout.toDataURL(opts)         -> Promise<string>  e.g. img.src = await ...toDataURL(opts)
   NewspaperCutout.toBlob(opts)            -> Promise<Blob>    (PNG)
   NewspaperCutout.toImage(opts)           -> Promise<HTMLImageElement>
   NewspaperCutout.mount(element, opts)    -> Promise<canvas>  appends the result into a DOM element
   NewspaperCutout.drawTo(ctx, opts, place)-> draws onto YOUR canvas context (best for posters).
          place = { x, y, width, height, anchor: 'topleft'|'center', rotate: radians, alpha: 0..1 }
          give width OR height (the other keeps aspect ratio). Returns {width,height} actually drawn.
   NewspaperCutout.loadCustomFont(urlOrArrayBuffer, name?) -> Promise. Then use font:'custom' (see overrides)
                                           and it joins the Mixed Fonts pool.
   NewspaperCutout.randomSeed()            -> number
   NewspaperCutout.config({ injectFonts:false }) -> call BEFORE ready() if your page already loads
                                           the fonts itself (see FONT LIST at bottom).
   Lists: NewspaperCutout.presets, .palettes, .styles, .fonts, .stocks, .types, .formats

   ---------------------------------------------------------------------
   OPTIONS  (every option is optional)
   ---------------------------------------------------------------------
   text         'Cutout'   Text to render. Use \n for new lines.
   type         'letters'  'letters' (ransom letters) | 'words' (word scraps) |
                           'strip' (headline strip, one strip per line) | 'collage' (torn headline collage)
   preset       null       'Punk Cover' | 'Xerox Zine' | 'Crime Headline' | 'Riso Poster' |
                           'Receipt' | 'Classified' | 'Pop Comic'   (your own options override the preset)
   seed         7          Number. Same seed + same options = identical result every time. 'random' ok.
   shape        55         0-100  Shape randomness (how torn/uneven the scraps are)
   halftone     45         0-100  Halftone print texture
   mismatch     40         0-100  Baseline mismatch (jumping / rotated letters)
   style        'clean'    'clean' | 'classified' | 'xerox' | 'riso' | 'letterpress' | 'redacted' | 'thermal' | 'comic'
   palette      'mix'      'mix' | 'vivid' | 'news' | 'punk' | 'dada' | 'soft' | 'neon' | 'single'
                           (giving paper or ink without a palette switches to 'single' automatically)
   paper        '#ece5d3'  Paper colour   (used with palette 'single')
   ink          '#17150f'  Ink colour     (used with palette 'single')
   randomCase   true       Random upper/lower case per letter
   mixedFonts   true       Random font per letter. false = Barlow Condensed (or your custom font)
   tape         false      Tape pieces on scraps
   staple       false      Staples on scraps
   size         140        30-250. Upper limit of letter size (it still auto-fits the canvas)
   shadow       55         0-100  Paper drop shadow
   stock        'mag'      'news' (thin newsprint) | 'mag' | 'card' (thick cardboard) | 'gloss'
   tearH        50         0-100  Tear on top/bottom edges
   tearV        50         0-100  Tear on side edges
   fibers       0          0-100  Edge fibres
   age          0          0-100  Paper age & stains
   folds        0          0-100  Fold lines
   bleed        0          0-100  Ink bleed
   dropout      0          0-100  Ink dropout (worn print)
   smear        0          0-100  Ink smear

   OUTPUT SIZE
   scale        2          Pixel multiplier (1,2,4,8...). Capped at 12.
   width        null       Exact output width in px  (overrides scale; keeps aspect ratio)
   height       null       Exact output height in px (overrides scale; keeps aspect ratio)
   crop         true       Auto-crop transparent edges (like the app's PNG export)
   padding      0          Transparent px added around the cropped result

   PER-LETTER CONTROL  (type 'letters' only)
   overrides    {}         Keyed by the character position in `text` (0 = first char, spaces and \n count).
        { 0: { font:'anton', case:'upper', ink:'#fff', paper:'#e11', rotate:-8, scale:130,
               dx:10, dy:-6, z:1, seed:3, shape:80, halftone:20, mismatch:0 },
          3: { font:'abril' } }
        font  = one of NewspaperCutout.fonts (e.g. 'anton','bebas','abril','alfa','playfair','custom'...)
        case  = 'upper' | 'lower'          rotate = degrees        scale = percent (30-300)
        dx/dy = nudge in px at base size   z = layer (+ front / - back)

   POSTER MODE  (optional; usually you will compose the poster yourself with drawTo)
   format       'free'     'free' (cutout only) | 'poster' (4:5) | 'square' | 'story' (9:16) | 'banner' (16:9)
   backdrop     'news'     'news' | 'cream' | 'kraft' | 'black' | 'pink' | 'cobalt'
   scraps       50         0-100 loose decorative scraps
   wall         false      Draw the poster framed on a wall
   (in poster mode the canvas is NOT cropped and scale is capped at 4)

   ---------------------------------------------------------------------
   EXAMPLES
   ---------------------------------------------------------------------
   // 1) <img> from code
   const img = await NewspaperCutout.toImage({ text:'SALE', preset:'Riso Poster', seed:11, width:800 });
   document.body.appendChild(img);

   // 2) Different title lines in one poster
   await NewspaperCutout.ready();
   NewspaperCutout.drawTo(ctx, { text:'MIDNIGHT', type:'letters', seed:5, palette:'punk' },
                          { x:600, y:260, width:1000, anchor:'center' });
   NewspaperCutout.drawTo(ctx, { text:'live at the old mill', type:'strip', style:'letterpress', seed:9 },
                          { x:600, y:520, width:700, anchor:'center', rotate:0.05 });

   // 3) Per-letter edit
   NewspaperCutout.mount(document.getElementById('title'), {
     text:'HELLO', overrides:{ 0:{ ink:'#ffffff', paper:'#e11d1d', rotate:-6 }, 4:{ font:'abril' } }
   });

   // 4) Single colour, thick cardboard, taped
   NewspaperCutout.toDataURL({ text:'Cardboard', palette:'single', paper:'#c9a46b', ink:'#2b1d0d',
                               stock:'card', tape:true, scale:3 }).then(url => el.src = url);

   NOTES
   - Needs internet the first time (fonts come from Google Fonts). Await ready() first;
     if you render before fonts load, letters would use fallback fonts.
   - Rendering is deterministic: keep your seed to keep your design stable.
   - Each render is CPU-heavy (a few ms to a few hundred ms). Render once, then reuse the
     canvas / dataURL instead of re-rendering every frame.

   FONT LIST (if you set config({injectFonts:false}) load these yourself):
   Barlow Condensed 900, JetBrains Mono 700, Abril Fatface, Alfa Slab One, Anton, Bebas Neue,
   Chivo 900, Courier Prime 700, DM Serif Display, Libre Baskerville 700, Old Standard TT 700 (+italic),
   Oswald 700, Playfair Display 900 (+italic), Special Elite.
   ===================================================================== */
(function (root) {

    { key: 'playfair',  name: 'Playfair Display',  css: '"Playfair Display", serif',        w: 900, s: 'normal' },
    { key: 'playfairi', name: 'Playfair Italic',   css: '"Playfair Display", serif',        w: 900, s: 'italic' },
    { key: 'abril',     name: 'Abril Fatface',     css: '"Abril Fatface", serif',           w: 400, s: 'normal' },
    { key: 'alfa',      name: 'Alfa Slab One',     css: '"Alfa Slab One", serif',           w: 400, s: 'normal' },
    { key: 'anton',     name: 'Anton',             css: '"Anton", sans-serif',              w: 400, s: 'normal' },
    { key: 'bebas',     name: 'Bebas Neue',        css: '"Bebas Neue", sans-serif',         w: 400, s: 'normal' },
    { key: 'oswald',    name: 'Oswald',            css: '"Oswald", sans-serif',             w: 700, s: 'normal' },
    { key: 'chivo',     name: 'Chivo Black',       css: '"Chivo", sans-serif',              w: 900, s: 'normal' },
    { key: 'baskerv',   name: 'Libre Baskerville', css: '"Libre Baskerville", serif',       w: 700, s: 'normal' },
    { key: 'oldstd',    name: 'Old Standard TT',   css: '"Old Standard TT", serif',         w: 700, s: 'normal' },
    { key: 'oldstdi',   name: 'Old Standard Italic', css: '"Old Standard TT", serif',       w: 700, s: 'italic' },
    { key: 'dmserif',   name: 'DM Serif Display',  css: '"DM Serif Display", serif',        w: 400, s: 'normal' },
    { key: 'elite',     name: 'Special Elite',     css: '"Special Elite", monospace',       w: 400, s: 'normal' },
    { key: 'courier',   name: 'Courier Prime',     css: '"Courier Prime", monospace',       w: 700, s: 'normal' },
    { key: 'jetbrains', name: 'JetBrains Mono',    css: '"JetBrains Mono", monospace',      w: 700, s: 'normal' }

const MAIN_FONT = FONT_POOL[0];
let customFont = null;
const FONT_URLS = [
    'https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap',
    'https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Anton&family=Bebas+Neue&family=Chivo:wght@900&family=Courier+Prime:wght@700&family=DM+Serif+Display&family=Libre+Baskerville:wght@700&family=Old+Standard+TT:ital,wght@0,700;1,700&family=Oswald:wght@700&family=Playfair+Display:ital,wght@0,900;1,900&family=Special+Elite&display=swap'
];
const CFG = { injectFonts: true };
let fontsPromise = null, fontsReady = false, warned = false;

function fontStr(f, px) { return `${f.s} ${f.w} ${px}px ${f.css}`; }
function fontByKey(k) {
    if (k === 'custom' && customFont) return customFont;

}

    if (!CFG.injectFonts || typeof document === 'undefined') return [];

        .then(() => document.fonts.ready)
        .then(() => { normCache = {}; tileCache.clear(); fontsReady = true; });
    return fontsPromise;

const mctx = document.createElement('canvas').getContext('2d');

    const n = asc > 1 ? Math.max(0.55, Math.min(1.7, 72 / asc)) : 1;

/* ============================================================
   PALETTES  [paper, ink]
   ============================================================ */
const CREAM = [['#ece5d3', '#17150f'], ['#ece5d3', '#17150f'], ['#f4f0e4', '#1b1a17'], ['#ddd2b6', '#1c1a14'], ['#e9e1cc', '#17150f'], ['#c9c5bb', '#111111']];
const INKED = [['#efe8d6', '#c4311d'], ['#ece6d4', '#1f5fae'], ['#eee8d7', '#2a8a35'], ['#eee8d7', '#e8720f'], ['#ede7d8', '#6b2f8f']];
const COLOURED = [['#2d78c4', '#f4efe2'], ['#ef7d1d', '#fbf4e4'], ['#2f9a3e', '#f3efdf'], ['#c93a22', '#f4eadb'], ['#f0d23c', '#1a1710'], ['#17171a', '#efe7d6'], ['#e86fa0', '#fff3e6'], ['#1f9aa8', '#f6f1e2']];
const PUNK = [['#f4f0e4', '#111111'], ['#111111', '#f4f0e4'], ['#ff2e88', '#111111'], ['#f4f0e4', '#ff2e88'], ['#e8e0cf', '#111111'], ['#ffe600', '#111111']];
const DADA = [['#d9c7a0', '#2b2116'], ['#e6d8b8', '#3a2a17'], ['#c9b48a', '#1f160c'], ['#efe3c6', '#5a3a1c'], ['#b99f73', '#1a120a']];
const SOFT = [['#f6d6d9', '#4a2f3a'], ['#d7e6d3', '#2f4a3a'], ['#d6e2f2', '#2f3d5a'], ['#f7e8c4', '#5a4a2f'], ['#e4d7f0', '#42305a'], ['#fbe3d0', '#6a3a2a']];
const NEON = [['#c6ff3d', '#17121c'], ['#ff3dcb', '#fff4fb'], ['#2de2ff', '#0b1a2b'], ['#7a3dff', '#f3ecff'], ['#17121c', '#c6ff3d'], ['#ff7a1a', '#1a0f05']];
const PALETTES = {
    mix: [...CREAM, ...INKED, ...COLOURED],
    vivid: [...COLOURED, ...INKED],
    news: [...CREAM, ['#17171a', '#efe7d6']],
    punk: PUNK, dada: DADA, soft: SOFT, neon: NEON

/* ============================================================
   RANDOM + COLOR HELPERS
   ============================================================ */
function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);

        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };

    let h = 2166136261;
    for (const x of v) { h ^= (x | 0) + 0x9e3779b9 + (h << 6) + (h >>> 2); h = Math.imul(h, 16777619); }
    return h >>> 0;

function hash01(a, b) { return hashInts(a, b) / 4294967296; }
function vn1(seed, x) {
    const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f);

function rgba(hex, a) { const c = hexToRgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

const clamp01 = (v) => Math.max(0, Math.min(1, v));

/* ============================================================
   CONSTANTS
   ============================================================ */
const FORMATS = { free: [800, 400], poster: [800, 1000], square: [900, 900], story: [720, 1280], banner: [1280, 720] };
const STOCK = { news: { edge: 0.9, core: 0, grain: 1.25, sh: 0.65, gloss: 0 }, mag: { edge: 1.5, core: 0, grain: 1, sh: 1, gloss: 0 }, card: { edge: 2.2, core: 3, grain: 0.8, sh: 1.7, gloss: 0 }, gloss: { edge: 1.2, core: 0, grain: 0.3, sh: 1, gloss: 1 } };

const TYPES = ['letters', 'words', 'strip', 'collage'];
const PRESETS = {
    'Punk Cover': { shape: 80, halftone: 60, mismatch: 70, palette: 'punk', style: 'clean', tape: 1, staple: 1 },
    'Xerox Zine': { shape: 60, halftone: 80, mismatch: 50, palette: 'news', style: 'xerox', tape: 1, staple: 0 },
    'Crime Headline': { shape: 45, halftone: 35, mismatch: 25, palette: 'dada', style: 'letterpress', tape: 0, staple: 0 },
    'Riso Poster': { shape: 30, halftone: 55, mismatch: 35, palette: 'vivid', style: 'riso', tape: 0, staple: 0 },
    'Receipt': { shape: 10, halftone: 20, mismatch: 10, palette: 'news', style: 'thermal', tape: 0, staple: 0 },
    'Classified': { shape: 40, halftone: 30, mismatch: 30, palette: 'news', style: 'redacted', tape: 0, staple: 1 },
    'Pop Comic': { shape: 35, halftone: 85, mismatch: 45, palette: 'neon', style: 'comic', tape: 0, staple: 0 }
};
const DEFAULTS = {
    text: 'Cutout', type: 'letters', seed: 7, shape: 55, halftone: 45, mismatch: 40,
    style: 'clean', palette: 'mix', paper: '#ece5d3', ink: '#17150f',
    randomCase: true, mixedFonts: true, tape: false, staple: false,
    size: 140, shadow: 55, stock: 'mag',
    age: 0, folds: 0, bleed: 0, dropout: 0, smear: 0, tearH: 50, tearV: 50, fibers: 0,
    scale: 2, width: null, height: null, crop: true, padding: 0,
    format: 'free', backdrop: 'news', scraps: 50, wall: false, overrides: null
};

/* ============================================================
   RUNTIME CONTEXT  (set at the start of every render; rendering is synchronous)
   ============================================================ */
let O = null;      // normalized options
let S = null;      // style state (numbers 0-100 etc.)
let OV = {};       // per-letter overrides keyed by uid (= char index + 1)
let CW = 800, CH = 400;

function num(v, d, lo, hi) { v = Number(v); if (!isFinite(v)) v = d; return Math.max(lo, Math.min(hi, v)); }

function normalize(user) {

    if (user.preset && !preset) console.warn('NewspaperCutout: unknown preset "' + user.preset + '"');
    const merged = Object.assign({}, DEFAULTS, preset || {}, user);
    if (preset) { merged.tape = !!merged.tape; merged.staple = !!merged.staple; }
    if ((user.paper || user.ink) && user.palette == null && !(preset && preset.palette)) merged.palette = 'single';
    const o = {};

    o.type = TYPES.includes(merged.type) ? merged.type : 'letters';
    o.seed = merged.seed === 'random' ? 1 + Math.floor(Math.random() * 1e6) : (parseInt(merged.seed) || 1);
    o.shape = num(merged.shape, 55, 0, 100); o.halftone = num(merged.halftone, 45, 0, 100); o.mismatch = num(merged.mismatch, 40, 0, 100);
    o.style = STYLES.includes(merged.style) ? merged.style : 'clean';
    o.palette = (merged.palette === 'single' || PALETTES[merged.palette]) ? merged.palette : 'mix';
    o.paper = /^#[0-9a-f]{6}$/i.test(merged.paper) ? merged.paper : DEFAULTS.paper;

    o.stock = STOCK[merged.stock] ? merged.stock : 'mag';

    o.width = merged.width ? num(merged.width, 0, 1, 30000) : null;
    o.height = merged.height ? num(merged.height, 0, 1, 30000) : null;

    o.format = FORMATS[merged.format] ? merged.format : 'free';

    Object.keys(src).forEach(k => {

        if (a.font != null) r.font = a.font;
        if (a.case != null) r.caseMode = a.case;
        if (a.paper) r.paper = a.paper;
        if (a.ink) r.ink = a.ink;

/* ============================================================
   GRAIN TEXTURES
   ============================================================ */
let grainCache = null;

    if (grainCache) return grainCache;
    const SZ = 512;

    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = SZ; return c; };

    const paper = mk(); const pg = paper.getContext('2d');
    const low = document.createElement('canvas'); low.width = low.height = 40;
    const lg = low.getContext('2d'); const ld = lg.createImageData(40, 40);
    for (let i = 0; i < 1600; i++) { ld.data[i * 4] = 150; ld.data[i * 4 + 1] = 110; ld.data[i * 4 + 2] = 50; ld.data[i * 4 + 3] = rng() * 34; }

 add(flat(250,250,pTri('bl'),P.hot,{ht:'rgba(110,0,50,.4)',sp:11,fn:(u,v)=>v}),640,1795,{z:5,d:.8});
 add(flat(200,400,pHalfL,P.purple,{ht:'rgba(20,0,90,.4)',sp:12,fn:(u,v)=>1-v}),100,1715,{z:5,d:.6});
 add(star4(150,null,{chrome:1,pinch:.08}),340,1655,{z:6,d:1.2,rot:.15});
 add(dotFlat(88,P.lime),265,1852,{z:6,d:1.1});
 add(doodleStar(112,P.cream,R(44)),520,1860,{z:6,d:1.2,rot:.2});
 add(xMark(52,P.gold,11),160,1560,{z:6,d:1.2,rot:.3});

 const bk=[[P.orange,'rgba(130,30,0,.35)',1.7,-.25,-.12],[P.purple,'rgba(25,0,100,.4)',1.5,-.38,.28],[P.hot,'rgba(120,0,60,.35)',1.6,.3,-.22],[P.lime,'rgba(40,110,0,.45)',1.5,-.15,.3]];
 rows.forEach(r=>{const i=r.i,t=WORD_T[i],rs=(i%2?1:-1);
  /* shape tucked behind the word */
  const b=bk[i],D=r.hh*b[2];add(flat(D,D,pDisc,b[0],{ht:b[1],sp:12,fn:(u,v)=>1-v}),r.wx+b[3]*r.ww,r.cy+b[4]*r.hh,{z:10+i,d:.7,...pop(i,-.03)});

  add(wsp[i],r.wx,r.cy,{z:50,d:1,rot:rs*.022,bamp:1.2,sc:r.s,...pop(i,0,rs*.1)});

  /* ornament in the free space of the row */
  if(r.freeW>150){const cx=r.freeX+r.freeW/2,o=pop(i,.04),h=r.hh;
   if(i===0){add(star4(h*.5,P.gold,{border:0,pinch:.1}),cx,r.cy-h*.1,{z:40,d:1.2,rot:.12,...o});add(ringO(h*.2,P.cream,9),cx-h*.33,r.cy+h*.22,{z:40,d:1.2,...o});add(dotFlat(h*.12,P.hot),cx+h*.3,r.cy+h*.25,{z:40,d:1.2,...o});}
   if(i===1)add(pillSlider(Math.min(r.freeW-30,h*1.5),h*.34),cx,r.cy,{z:40,d:1.1,rot:-.05,...o});
   if(i===2){add(dotFlat(h*.22,P.cream),cx-h*.33,r.cy,{z:40,d:1.2,...o});add(xMark(h*.16,P.hot,9),cx,r.cy,{z:40,d:1.2,rot:.2,...o});add(dotFlat(h*.22,P.lime),cx+h*.33,r.cy,{z:40,d:1.2,...o});}
   if(i===3){const aw=Math.min(r.freeW-20,h*1.3);add(curlArrow(aw,aw*.55,P.lime,12),cx,r.cy,{z:40,d:1.2,rot:.05,...o});}
  }});
 items.sort((a,b)=>a.z-b.z||a.id-b.id);
}

/* ===================== per-frame render ===================== */
function drawFrame(t){
 const e=ease(t/DUR),cx=W/2,cy=H/2,k8=Math.floor(t*8);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(cx,cy);ctx.scale(1+.02*e,1+.02*e);ctx.drawImage(BG,-cx,-cy);ctx.restore();
 for(const it of items){
  let sc=it.sc,wob=0;
  if(it.t0!==undefined){const u=(t-it.t0)/(it.dur||.2);if(u<0)continue;const uu=Math.min(u,1);sc*=Math.max(.01,backOut(uu));wob=(1-uu)*(it.wob||0);}
  if(it.pulse!==undefined){const u=(t-it.pulse)/.14;if(u>0&&u<1)sc*=1+.07*Math.sin(u*Math.PI);}
  const zf=1+.045*e*it.d,bamp=it.bamp??2.4;let jx=0,jy=0,jr=0;
  if(it.boil){jx=(hash(it.id,k8)-.5)*bamp;jy=(hash(it.id,k8+501)-.5)*bamp;jr=(hash(it.id,k8+977)-.5)*(bamp<2?.006:.014);}
  const px=cx+(it.x-cx)*zf-18*e*(it.d-.9)+jx,py=cy+(it.y-cy)*zf-12*e*(it.d-.9)+jy,sp=it.sp;
  ctx.save();ctx.translate(px,py);ctx.rotate(it.rot+jr+wob+it.spin*t*.3);ctx.scale(sc*zf,sc*zf);ctx.drawImage(sp.c,-sp.w/2,-sp.h/2);
  if(it.dyn){ctx.translate(-sp.w/2+PADV,-sp.h/2+PADV);it.dyn(ctx,t,it);}
  ctx.restore();}
 /* unify: warm key light, shared print grain, blue vignette */
 ctx.save();ctx.globalCompositeOperation='soft-light';let g=ctx.createRadialGradient(W*.25,H*.2,50,W*.25,H*.2,W*1.1);g.addColorStop(0,'rgba(255,205,150,.45)');g.addColorStop(1,'rgba(60,70,230,.15)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
 ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.38;const k12=Math.floor(t*12),ox=(hash(k12,3)*512)|0,oy=(hash(k12,9)*512)|0;
 for(let i=-ox;i<W;i+=512)for(let j=-oy;j<H;j+=512)ctx.drawImage(GRAIN,i,j);ctx.restore();
 ctx.save();ctx.globalCompositeOperation='multiply';g=ctx.createRadialGradient(W/2,H*.5,H*.35,W/2,H*.5,H*.78);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(30,40,120,1)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
}

/* ===================== boot ===================== */
async function boot(){
 try{await document.fonts.load('100px "Jacquard 12"','C');}catch(e){}
 if(!document.fonts.check('100px "Jacquard 12"','C'))console.warn('Jacquard 12 did not load - the Callistra logo C is using a fallback font');
 await NC.ready();
 /* one cutout-API export per word, default look: only seed + width are set */
 const wraw=WORDS.map((w,i)=>NC.render({text:w,seed:SEEDS[i],width:280*w.length+140}));
 const wsp=wraw.map(c=>makeCut(c.width,c.height,(x,w,h)=>x.drawImage(c,0,0,w,h),{border:0,pad:PADV,sa:.45,sb:10,sx:5,sy:10}));
 BG=makeBG();build(wraw,wsp);
}
window.renderFrame=async function(t){t=clamp(+t||0,0,DUR);drawFrame(t);};
boot().then(()=>{window.__reelReady=true;}).catch(e=>{window.__reelError=String(e&&e.stack||e);});
})();
