<script>
/* =====================================================================
   NEWSPAPER CUTOUT API  v1.0
   Code-only version of "Newspaper Cutout Studio" (same engine, no UI).
   Single self-contained file. No dependencies. Browser only (uses <canvas>).

   ---------------------------------------------------------------------
   QUICK START  (paste this file inside a <script> tag in your HTML)
   ---------------------------------------------------------------------
     <canvas id="poster" width="1200" height="1600"></canvas>
     <script>
       // ...this whole file here...
       (async () => {
         await NewspaperCutout.ready();            // loads the Google Fonts once
         const ctx = document.getElementById('poster').getContext('2d');

         // draw a cutout title straight onto your own poster canvas:
         NewspaperCutout.drawTo(ctx, { text: 'BREAKING', preset: 'Punk Cover', seed: 42 },
                                { x: 600, y: 300, width: 900, anchor: 'center', rotate: -0.08 });
       })();
     <\/script>

   ---------------------------------------------------------------------
   FUNCTIONS
   ---------------------------------------------------------------------
   NewspaperCutout.ready()                 -> Promise. Loads fonts. Await it ONCE before rendering.
   NewspaperCutout.render(opts)            -> HTMLCanvasElement (transparent PNG-like, auto-cropped). Sync.
   NewspaperCutout.renderAsync(opts)       -> Promise<canvas> (awaits ready() for you).
   NewspaperCutout.toDataURL(opts)         -> Promise<string>  e.g. img.src = await ...toDataURL(opts)
   NewspaperCutout.toBlob(opts)            -> Promise<Blob>    (PNG)
   NewspaperCutout.toImage(opts)           -> Promise<HTMLImageElement>
   NewspaperCutout.mount(element, opts)    -> Promise<canvas>  appends the result into a DOM element
   NewspaperCutout.drawTo(ctx, opts, place)-> draws onto YOUR canvas context (best for posters).
          place = { x, y, width, height, anchor: 'topleft'|'center', rotate: radians, alpha: 0..1 }
          give width OR height (the other keeps aspect ratio). Returns {width,height} actually drawn.
   NewspaperCutout.loadCustomFont(urlOrArrayBuffer, name?) -> Promise. Then use font:'custom' (see overrides)
                                           and it joins the Mixed Fonts pool.
   NewspaperCutout.randomSeed()            -> number
   NewspaperCutout.config({ injectFonts:false }) -> call BEFORE ready() if your page already loads
                                           the fonts itself (see FONT LIST at bottom).
   Lists: NewspaperCutout.presets, .palettes, .styles, .fonts, .stocks, .types, .formats

   ---------------------------------------------------------------------
   OPTIONS  (every option is optional)
   ---------------------------------------------------------------------
   text         'Cutout'   Text to render. Use \n for new lines.
   type         'letters'  'letters' (ransom letters) | 'words' (word scraps) |
                           'strip' (headline strip, one strip per line) | 'collage' (torn headline collage)
   preset       null       'Punk Cover' | 'Xerox Zine' | 'Crime Headline' | 'Riso Poster' |
                           'Receipt' | 'Classified' | 'Pop Comic'   (your own options override the preset)
   seed         7          Number. Same seed + same options = identical result every time. 'random' ok.
   shape        55         0-100  Shape randomness (how torn/uneven the scraps are)
   halftone     45         0-100  Halftone print texture
   mismatch     40         0-100  Baseline mismatch (jumping / rotated letters)
   style        'clean'    'clean' | 'classified' | 'xerox' | 'riso' | 'letterpress' | 'redacted' | 'thermal' | 'comic'
   palette      'mix'      'mix' | 'vivid' | 'news' | 'punk' | 'dada' | 'soft' | 'neon' | 'single'
                           (giving paper or ink without a palette switches to 'single' automatically)
   paper        '#ece5d3'  Paper colour   (used with palette 'single')
   ink          '#17150f'  Ink colour     (used with palette 'single')
   randomCase   true       Random upper/lower case per letter
   mixedFonts   true       Random font per letter. false = Barlow Condensed (or your custom font)
   tape         false      Tape pieces on scraps
   staple       false      Staples on scraps
   size         140        30-250. Upper limit of letter size (it still auto-fits the canvas)
   shadow       55         0-100  Paper drop shadow
   stock        'mag'      'news' (thin newsprint) | 'mag' | 'card' (thick cardboard) | 'gloss'
   tearH        50         0-100  Tear on top/bottom edges
   tearV        50         0-100  Tear on side edges
   fibers       0          0-100  Edge fibres
   age          0          0-100  Paper age & stains
   folds        0          0-100  Fold lines
   bleed        0          0-100  Ink bleed
   dropout      0          0-100  Ink dropout (worn print)
   smear        0          0-100  Ink smear

   OUTPUT SIZE
   scale        2          Pixel multiplier (1,2,4,8...). Capped at 12.
   width        null       Exact output width in px  (overrides scale; keeps aspect ratio)
   height       null       Exact output height in px (overrides scale; keeps aspect ratio)
   crop         true       Auto-crop transparent edges (like the app's PNG export)
   padding      0          Transparent px added around the cropped result

   PER-LETTER CONTROL  (type 'letters' only)
   overrides    {}         Keyed by the character position in `text` (0 = first char, spaces and \n count).
        { 0: { font:'anton', case:'upper', ink:'#fff', paper:'#e11', rotate:-8, scale:130,
               dx:10, dy:-6, z:1, seed:3, shape:80, halftone:20, mismatch:0 },
          3: { font:'abril' } }
        font  = one of NewspaperCutout.fonts (e.g. 'anton','bebas','abril','alfa','playfair','custom'...)
        case  = 'upper' | 'lower'          rotate = degrees        scale = percent (30-300)
        dx/dy = nudge in px at base size   z = layer (+ front / - back)

   POSTER MODE  (optional; usually you will compose the poster yourself with drawTo)
   format       'free'     'free' (cutout only) | 'poster' (4:5) | 'square' | 'story' (9:16) | 'banner' (16:9)
   backdrop     'news'     'news' | 'cream' | 'kraft' | 'black' | 'pink' | 'cobalt'
   scraps       50         0-100 loose decorative scraps
   wall         false      Draw the poster framed on a wall
   (in poster mode the canvas is NOT cropped and scale is capped at 4)

   ---------------------------------------------------------------------
   EXAMPLES
   ---------------------------------------------------------------------
   // 1) <img> from code
   const img = await NewspaperCutout.toImage({ text:'SALE', preset:'Riso Poster', seed:11, width:800 });
   document.body.appendChild(img);

   // 2) Different title lines in one poster
   await NewspaperCutout.ready();
   NewspaperCutout.drawTo(ctx, { text:'MIDNIGHT', type:'letters', seed:5, palette:'punk' },
                          { x:600, y:260, width:1000, anchor:'center' });
   NewspaperCutout.drawTo(ctx, { text:'live at the old mill', type:'strip', style:'letterpress', seed:9 },
                          { x:600, y:520, width:700, anchor:'center', rotate:0.05 });

   // 3) Per-letter edit
   NewspaperCutout.mount(document.getElementById('title'), {
     text:'HELLO', overrides:{ 0:{ ink:'#ffffff', paper:'#e11d1d', rotate:-6 }, 4:{ font:'abril' } }
   });

   // 4) Single colour, thick cardboard, taped
   NewspaperCutout.toDataURL({ text:'Cardboard', palette:'single', paper:'#c9a46b', ink:'#2b1d0d',
                               stock:'card', tape:true, scale:3 }).then(url => el.src = url);

   NOTES
   - Needs internet the first time (fonts come from Google Fonts). Await ready() first;
     if you render before fonts load, letters would use fallback fonts.
   - Rendering is deterministic: keep your seed to keep your design stable.
   - Each render is CPU-heavy (a few ms to a few hundred ms). Render once, then reuse the
     canvas / dataURL instead of re-rendering every frame.

   FONT LIST (if you set config({injectFonts:false}) load these yourself):
   Barlow Condensed 900, JetBrains Mono 700, Abril Fatface, Alfa Slab One, Anton, Bebas Neue,
   Chivo 900, Courier Prime 700, DM Serif Display, Libre Baskerville 700, Old Standard TT 700 (+italic),
   Oswald 700, Playfair Display 900 (+italic), Special Elite.
   ===================================================================== */
(function (root) {
'use strict';

/* ============================================================
   FONTS
   ============================================================ */
const FONT_POOL = [
    { key: 'barlow',    name: 'Barlow Condensed',  css: '"Barlow Condensed", sans-serif',   w: 900, s: 'normal' },

    { key: 'oldstd',    name: 'Old Standard TT',   css: '"Old Standard TT", serif',         w: 700, s: 'normal' },

/* ============================================================
   LAYOUT
   ============================================================ */
function buildChunks(text, mode) {
    const lineH = (mode === 'strip' || mode === 'collage') ? 150 : 125, tiles = [];
    text.split('\n').forEach((ln, li) => {
        const parts = mode === 'strip' ? [ln.trim()] : ln.split(/\s+/);
        const kind = mode === 'collage' ? 'strip' : mode;
        const row = []; let cursor = 0;
        parts.forEach((w, wi) => {
            if (!w) return;
            const t = resolveSpec(hashInts(wi, li, w.length) + 1, w, kind);
            if (mode === 'collage') { t.oy += (hash01(t.seedBase, 4) * 2 - 1) * 20; t.rot += (hash01(t.seedBase, 3) * 2 - 1) * 0.16; t.overlap += 10; }

            row.push(t);
        });
        if (!row.length) return;
        const last = row[row.length - 1], shift = -(row[0].gx + row[0].bx0 + last.gx + last.bx1) / 2;
        row.forEach(t => { t.gx += shift; tiles.push(t); });
    });
    return tiles;
}

function buildLayout(text) {
    if (O.type !== 'letters') return buildChunks(text, O.type);
    const lines = text.split('\n');
    const lineH = 125;
    const tiles = [];
    let idx = 0;
    lines.forEach((ln, li) => {
        const row = [];
        let cursor = 0;
        for (let c = 0; c < ln.length; c++, idx++) {
            const ch = ln[c];
            if (/\s/.test(ch)) { cursor += 36; continue; }
            const t = resolveSpec(idx + 1, ch);   // uid = character index + 1
            t.gx = cursor - t.bx0;
            t.gy = li * lineH + t.oy;
            cursor += t.bw - t.overlap;
            row.push(t);
        }
        idx++; // newline
        if (!row.length) return;
        const minX = row[0].gx + row[0].bx0;
        const last = row[row.length - 1];
        const maxX = last.gx + last.bx1;
        const shift = -(minX + maxX) / 2;
        row.forEach(t => { t.gx += shift; tiles.push(t); });
    });
    return tiles;
}

function plan() {
    const text = O.text;
    const tiles = text.trim() ? buildLayout(text) : [];
    if (!tiles.length) return null;
    const poster = O.format !== 'free';
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    tiles.forEach(t => {

    });

    return { tiles, cX: (minX + maxX) / 2, cY: (minY + maxY) / 2, bw, bh, k };

/* ===================== tablet, video, per-frame render ===================== */
const HL_SEEDS=[7,19],HL_TOP=250;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let bezel,tabShadow,dotsOv,HL1,HL2;
function buildTablet(){
 const w=VW+BZ*2,h=VH+BZ*2;
 tabShadow=makeCut(w,h,(x)=>{x.beginPath();x.roundRect(0,0,w,h,34);x.fillStyle='#0c0a10';x.fill();},{pad:80,sa:.7,sb:30,sy:34,sx:16});
 bezel=makeCut(w,h,(x)=>{x.beginPath();x.roundRect(0,0,w,h,34);const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#3a3644');g.addColorStop(.5,'#16131c');g.addColorStop(1,'#07060a');x.fillStyle=g;x.fill();
  x.strokeStyle='#d8d2c6';x.lineWidth=5;x.beginPath();x.roundRect(2.5,2.5,w-5,h-5,32);x.stroke();
  x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;x.beginPath();x.roundRect(BZ-6,BZ-6,VW+12,VH+12,14);x.stroke();
  x.fillStyle='#262230';x.beginPath();x.arc(BZ/2,h/2,5,0,TAU);x.fill();x.fillStyle='#3d6bd0';x.beginPath();x.arc(BZ/2,h/2,2.2,0,TAU);x.fill();
  x.save();x.globalCompositeOperation='overlay';x.globalAlpha=.5;tileFill(x,w,h);x.restore();
  x.globalCompositeOperation='destination-out';x.fillStyle='#000';x.beginPath();x.roundRect(BZ,BZ,VW,VH,10);x.fill();},{pad:80,shadow:0});
 dotsOv=cv(VW,VH);const x=dotsOv.getContext('2d');dots(x,0,0,VW,VH,6,.78,'rgba(40,10,60,.05)',(u,v)=>.55+.45*Math.sin(u*7+v*5),2.4);
}
function seekVideo(t){return new Promise(res=>{const vt=clamp(t/DUR,0,1)*VID_DUR*.995,k=Math.min(Math.floor(vt*30),101),tt=(k+.5)/30;
 if(Math.abs(vid.currentTime-tt)<1e-3&&vid.readyState>=2){res();return;}
 let done=false;const fin=()=>{if(done)return;done=true;vid.removeEventListener('seeked',fin);res();};
 vid.addEventListener('seeked',fin);vid.currentTime=tt;setTimeout(fin,4000);});}
const ease=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
const backOut=u=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);};

function drawTablet(t,it,px,py,sc,rot){
 ctx.save();ctx.translate(px,py);ctx.rotate(rot);ctx.scale(sc,sc);
 ctx.drawImage(tabShadow.c,-tabShadow.w/2,-tabShadow.h/2);
 ctx.save();ctx.beginPath();ctx.roundRect(-VW/2,-VH/2,VW,VH,10);ctx.clip();
 ctx.imageSmoothingQuality='high';ctx.drawImage(vid,-VW/2,-VH/2,VW,VH);
 ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(255,236,214,.10)';ctx.fillRect(-VW/2,-VH/2,VW,VH);
 ctx.drawImage(dotsOv,-VW/2,-VH/2);

 ctx.globalAlpha=.16;for(let i=-VW/2;i<VW/2;i+=512)for(let j=-VH/2;j<VH/2;j+=512)ctx.drawImage(GRAIN,i,j);
 ctx.globalCompositeOperation='screen';ctx.globalAlpha=1;const gx=-VW*.6+ease(t/DUR)*VW*.35,g=ctx.createLinearGradient(gx,-VH/2,gx+VW*.5,VH/2);
 g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(-VW/2,-VH/2,VW,VH);
 ctx.restore();
 ctx.drawImage(bezel.c,-bezel.w/2,-bezel.h/2);
 ctx.restore();}

function drawFrame(t){
 const e=ease(t/DUR),cx=W/2,cy=H/2,k8=Math.floor(t*8);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);ctx.fillStyle=P.ink;ctx.fillRect(0,0,W,H);
 for(const it of items){
  let sc=it.sc,a=1;
  if(it.ap>0){const u=(t-it.ap)/.32;if(u<0)continue;sc*=Math.max(.01,backOut(Math.min(u,1)));}
  const zf=1+.055*e*it.d,bamp=it.hl?.9:2.4;
  let jx=0,jy=0,jr=0;if(it.boil){jx=(hash(it.id,k8)-.5)*bamp;jy=(hash(it.id,k8+501)-.5)*bamp;jr=(hash(it.id,k8+977)-.5)*(it.hl?.006:.014);}
  const px=cx+(it.x-cx)*zf-22*e*(it.d-.9)+jx,py=cy+(it.y-cy)*zf-14*e*(it.d-.9)+jy;
  let rot=it.rot+jr+it.spin*t*.3;
  if(it.tab){drawTablet(t,it,px,py,zf*sc*(1+.02*e),it.rot+.02*e+jr);continue;}
  const sp=it.sp;let s=sc*zf;
  if(it.hl){s*=it.hlScale*(1+.008*Math.sin(t*3+it.hl));}
  ctx.save();ctx.translate(px,py);ctx.rotate(rot);ctx.scale(s,s);ctx.drawImage(sp.c,-sp.w/2,-sp.h/2);ctx.restore();}
 /* unify: warm key light, shared print grain, vignette */
 ctx.save();ctx.globalCompositeOperation='soft-light';let g=ctx.createRadialGradient(W*.25,H*.2,50,W*.25,H*.2,W*1.1);g.addColorStop(0,'rgba(255,205,150,.55)');g.addColorStop(1,'rgba(90,60,200,.18)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
 ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.42;const k12=Math.floor(t*12),ox=(hash(k12,3)*512)|0,oy=(hash(k12,9)*512)|0;
 for(let i=-ox;i<W;i+=512)for(let j=-oy;j<H;j+=512)ctx.drawImage(GRAIN,i,j);ctx.restore();
 ctx.save();ctx.globalCompositeOperation='multiply';g=ctx.createRadialGradient(W/2,H*.5,H*.35,W/2,H*.5,H*.78);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(40,20,70,1)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
}

/* ===================== boot ===================== */
async function boot(){
 vid=document.getElementById('v');
 await new Promise((res,rej)=>{if(vid.readyState>=2)return res();vid.addEventListener('loadeddata',res,{once:true});vid.addEventListener('error',()=>rej(new Error('embedded video failed to decode')),{once:true});vid.load();});
 await NC.ready();
 /* headline: two separate exports from the Newspaper Cutout API, default look */
 HL1=NC.render({text:'GRAPHIC',seed:HL_SEEDS[0],width:1500});
 HL2=NC.render({text:'DESIGNERS,',seed:HL_SEEDS[1],width:1500});
 const hl1={c:HL1,w:HL1.width,h:HL1.height},hl2={c:HL2,w:HL2.width,h:HL2.height};
 const T1=1000,T2=1020,s1=T1/hl1.w,s2=T2/hl2.w,h1=hl1.h*s1,h2=hl2.h*s2;
 build(hl1,hl2);buildTablet();
 const top=HL_TOP;
 items.forEach(it=>{if(it.hl===1){it.hlScale=s1;it.y=top+h1/2;}if(it.hl===2){it.hlScale=s2;it.y=top+h1-h1*.04+h2/2;}});
 window.__hl={h1,h2,top};
}
window.renderFrame=async function(t){t=clamp(+t||0,0,DUR);await seekVideo(t);drawFrame(t);};
boot().then(()=>{window.__reelReady=true;}).catch(e=>{window.__reelError=String(e&&e.stack||e);});
})();
