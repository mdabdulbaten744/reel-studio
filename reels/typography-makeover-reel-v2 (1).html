<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typography Makeover — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0d0d0d;transform-origin:0 0;isolation:isolate}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px}
/* preview player (normal browser only; never part of the video) */
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px 'JetBrains Mono',monospace;z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px 'JetBrains Mono',monospace;letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport"><canvas id="stage" width="1080" height="1920"></canvas></div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="6" step="0.0333333" value="0"><span id="pTime">f0</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   ENGINE  (same contract as the other reels)
   ===================================================================== */
const FPS=30, DURATION=6, FRAMES=DURATION*FPS;           // exactly 6 seconds
const REEL={width:1080,height:1920,fps:FPS,duration:DURATION,poster:3.2};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const ALLOW_FALLBACK=/[?&]allowfallback=1/.test(location.search);   // local testing only
const $=id=>document.getElementById(id);
const W=1080,H=1920,TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeInCubic=p=>p*p*p;
const easeInOutCubic=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOutExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

/* =====================================================================
   DESIGN  (Kinetic Flowfield tokens: dark theme, fonts, dot colour)
   ===================================================================== */
const BG='#0d0d0d', INK='#f0eee9', WHITE='#ffffff', STEEL='#bdbab2', HANDLE='#2a2a2a', WOOD='#8a4b2a';
const DISPLAY='"Barlow Condensed","Arial Narrow",Impact,sans-serif';
const PLAIN='Arial, Helvetica, "Liberation Sans", sans-serif';   // the "boring" typeface
const MONO='"JetBrains Mono",ui-monospace,monospace';

const WORD='TYPE';
const CAPTION=['GIVING BORING TYPOGRAPHY','A MAKEOVER.'];   // always on, at the top
const WORD_CY=900, WORD_MAX_W=860;
const CAP_TOP=330;

/* the tool's defaults, at its own 800×400 preview scale */
const FX={turbulence:26,strength:26,fontSize:140};

/* the cut and the tools */
const SWEEP_A=30, SWEEP_B=1100;
const RY=1130, RH=56, RL=1000, RX_REST=40;               // steel tape / ruler row
const KNIFE_TIP=1060;                                    // chisel tip at the bottom of the word

/* =====================================================================
   PERLIN — copied verbatim from the Kinetic Flowfield tool
   ===================================================================== */
const Perlin={
  p:new Uint8Array(512),
  init:function(){
    const permutation=[151,160,137,91,90,15,
    131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
    190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,
    88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,
    77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,
    102,143,54,65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,
    135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,
    5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,
    223,183,170,213,119,248,152, 2,44,145,31,179,228,165,55,110,178,224,183,225,
    40,242,172,239,249,14,236,97,21,50,45,127,4,150,254,138,209,204,184,218,61,
    84,121,98,223,34,39,176,155,51,193,113,70,213,9,144,3,180,243,108,181,241,
    251,114,238,205,107,177,157,167,115,195,192,67,69,215,128,1,214,141,93,246,
    24,185,199,147,22,66,129,222,61,191,101,43,210,106,41,253,153,112,149,154,
    156,127,152,78,162,171,81,21,120,207,11,104,221,58,18,24,206,24,242,123];
    for(let i=0;i<256;i++){this.p[256+i]=this.p[i]=permutation[i%permutation.length];}
  },
  fade:function(t){return t*t*t*(t*(t*6-15)+10);},
  lerp:function(t,a,b){return a+t*(b-a);},
  grad:function(hash,x,y){
    const h=hash&7;
    const u=h<4?x:y;
    const v=h<4?y:x;
    return((h&1)===0?u:-u)+((h&2)===0?v:-v);
  },
  noise:function(x,y){
    const X=Math.floor(x)&255;
    const Y=Math.floor(y)&255;
    x-=Math.floor(x);
    y-=Math.floor(y);
    const u=this.fade(x);
    const v=this.fade(y);
    const A=this.p[X]+Y, B=this.p[X+1]+Y;
    return this.lerp(v,this.lerp(u,this.grad(this.p[A],x,y),
                                     this.grad(this.p[B],x-1,y)),
                        this.lerp(u,this.grad(this.p[A+1],x,y-1),
                                     this.grad(this.p[B+1],x-1,y-1)));
  }
};
Perlin.init();

/* =====================================================================
   LAYOUT — computed once after fonts are ready
   ===================================================================== */
const CAP={size:100,lh:98};
let PL=null;                                             // plain word (before)
let FL=null;                                             // flowfield word (after)

function buildLayouts(){
  const probe=mkCanvas(8,8).getContext('2d');
  probe.font=`900 100px ${DISPLAY}`;
  let widest=1;CAPTION.forEach(s=>{widest=Math.max(widest,probe.measureText(s).width);});
  CAP.size=Math.min(112,Math.floor(100*940/widest));
  CAP.lh=Math.round(CAP.size*0.98);
  PL=buildWord(WORD,400,PLAIN,probe,false);
  FL=buildWord(WORD,900,DISPLAY,probe,true);
}

function buildWord(text,weight,family,probe,sample){
  const L={text};
  probe.font=`${weight} 100px ${family}`;
  const size=Math.round(100*WORD_MAX_W/probe.measureText(text).width);
  L.size=size;
  L.fontStr=`${weight} ${size}px ${family}`;
  probe.font=L.fontStr;
  const mm=probe.measureText(text);
  L.w=mm.width;
  L.wordX=W/2-mm.width/2;
  L.asc=mm.actualBoundingBoxAscent;
  L.wordY=WORD_CY+L.asc/2;
  if(!sample)return L;

  const k=size/FX.fontSize;
  L.strength=FX.strength*k;
  L.step=Math.max(2,Math.round(2*k));
  L.dotR=Math.max(0.75,k);
  L.noiseScale=(0.002*(FX.turbulence/20))/k;

  const cv=mkCanvas(W,H),c=cv.getContext('2d',{willReadFrequently:true});
  c.font=L.fontStr;c.fillStyle='#fff';c.textBaseline='alphabetic';
  c.fillText(text,L.wordX,L.wordY);
  const d=c.getImageData(0,0,W,H).data;
  const pts=[];
  for(let y=0;y<H;y+=L.step){
    for(let x=0;x<W;x+=L.step){
      if(d[(y*W+x)*4+3]>0)pts.push(x,y);
    }
  }
  L.pts=Float32Array.from(pts);
  return L;
}

/* =====================================================================
   TIMELINE (seconds)
   0.00–0.40  plain word rises in
   0.35–1.95  steel tape measures the word and slides away
   1.45–2.95  spirit level slides in, bubble centres, slides out
   1.95–2.75  plumb bob hangs and settles on the word's left edge
   2.00–2.35  chisel drops in; hammer taps it from 2.55 s
   2.30–4.30  chisel cuts left→right; flowfield replaces plain type behind it
   4.35–5.60  set square checks the corner, sparkles, finished word
   5.60–6.00  fade to black
   ===================================================================== */
function sweepX(tt){
  if(tt<2.3)return SWEEP_A;
  if(tt>=4.3)return SWEEP_B;
  return lerp(SWEEP_A,SWEEP_B,easeInOutCubic((tt-2.3)/2.0));
}

/* =====================================================================
   DRAWING
   ===================================================================== */
const stage=$('stage'),sc=stage.getContext('2d');
function frameIndex(t){return clamp(Math.floor(t*FPS+.001),0,FRAMES-1);}

function drawCaption(c,tt){
  c.save();
  c.font=`900 ${CAP.size}px ${DISPLAY}`;
  c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';
  CAPTION.forEach((s,i)=>{
    const p=easeOutExpo(clamp((tt-0.1-i*0.1)/0.8));
    const yc=CAP_TOP+i*CAP.lh;
    c.save();
    c.beginPath();c.rect(0,yc-CAP.lh/2,W,CAP.lh);c.clip();
    c.fillText(s,W/2,yc+(1-p)*CAP.lh*0.9);
    c.restore();
  });
  c.restore();
}

/* the plain "before" word: rises out of a mask */
function drawPlain(c,L,p){
  if(p<=0)return;
  c.save();
  c.font=L.fontStr;c.fillStyle=WHITE;c.textBaseline='alphabetic';
  const top=L.wordY-L.asc, bottom=L.wordY+L.asc*0.1;
  const h=(bottom-top)*p;
  c.beginPath();c.rect(0,bottom-h,W,H);c.clip();
  c.fillText(L.text,L.wordX,L.wordY+(1-p)*90);
  c.restore();
}

/* the real flowfield, sampled from the word and displaced along the noise field */
function drawFlow(c,L,tt){
  const pts=L.pts, ns=L.noiseScale, R=L.dotR;
  const off=tt*0.12;
  const strength=L.strength*(0.85+0.15*Math.sin(TAU*tt/5));
  const stepDist=strength/8;
  c.fillStyle=WHITE;
  c.beginPath();
  for(let i=0;i<pts.length;i+=2){
    let px=pts[i],py=pts[i+1];
    for(let s=0;s<8;s++){
      const a=Perlin.noise(px*ns+off,py*ns-off*0.6)*Math.PI*4;
      px+=Math.cos(a)*stepDist;
      py+=Math.sin(a)*stepDist;
    }
    c.moveTo(px+R,py);
    c.arc(px,py,R,0,TAU);
  }
  c.fill();
}

function label(c,txt,x,y,align,alpha){
  if(alpha<=0)return;
  c.save();
  c.font=`500 26px ${MONO}`;
  if('letterSpacing' in c)c.letterSpacing='6px';
  c.textAlign=align;c.textBaseline='middle';
  c.fillStyle=`rgba(240,238,233,${alpha})`;
  c.fillText(txt,x,y);
  c.restore();
}

/* the cut: a glowing line that follows the chisel */
function drawCut(c,x,tt){
  const a=clamp((tt-2.2)/0.2)*(tt>4.1?clamp((4.3-tt)/0.2):1);
  if(a<=0)return;
  c.save();
  c.globalAlpha=a;c.fillStyle=WHITE;
  c.shadowColor='rgba(255,255,255,0.6)';c.shadowBlur=20;
  c.fillRect(x-1.5,650,3,480);
  c.restore();
}

/* tool 1 — steel tape: slides in, measures the word, slides away */
function drawTape(c,tt){
  let x0;
  if(tt<0.35)return;
  if(tt<0.9)x0=lerp(-RL,RX_REST,easeOutCubic(clamp((tt-0.35)/0.55)));
  else if(tt<1.45)x0=RX_REST;
  else if(tt<1.95)x0=lerp(RX_REST,1200,easeInOutCubic(clamp((tt-1.45)/0.5)));
  else return;

  const ba=clamp((tt-0.9)/0.2)*(1-clamp((tt-1.4)/0.1));
  if(ba>0){
    const xl=PL.wordX, xr=PL.wordX+PL.w, yy=RY-44;
    c.save();
    c.globalAlpha=ba;c.strokeStyle=WHITE;c.fillStyle=WHITE;c.lineWidth=2;
    c.setLineDash([6,6]);
    c.beginPath();
    c.moveTo(xl,PL.wordY+12);c.lineTo(xl,yy-10);
    c.moveTo(xr,PL.wordY+12);c.lineTo(xr,yy-10);
    c.stroke();
    c.setLineDash([]);
    c.beginPath();
    c.moveTo(xl,yy);c.lineTo(xr,yy);
    c.moveTo(xl,yy-10);c.lineTo(xl,yy+10);
    c.moveTo(xr,yy-10);c.lineTo(xr,yy+10);
    c.stroke();
    c.font=`500 22px ${MONO}`;c.textAlign='center';c.textBaseline='alphabetic';
    c.fillText(`${Math.round(PL.w)} PX`,W/2,yy-18);
    c.restore();
  }

  c.save();
  c.fillStyle=WHITE;c.fillRect(x0,RY,RL,RH);
  c.fillStyle=BG;
  for(let i=0;i<=50;i++){
    const x=x0+i*20;
    if(x<-2||x>W+2)continue;
    c.fillRect(x-1,RY,2,i%5===0?30:16);
  }
  c.font=`500 18px ${MONO}`;c.textAlign='center';c.textBaseline='top';
  for(let k=1;k<=10;k++){
    const x=x0+k*100;
    if(x<0||x>W)continue;
    c.fillText(String(k),x,RY+34);
  }
  c.restore();
}

/* tool 2 — spirit level: slides in, bubble settles at true level, slides out */
function drawLevel(c,tt){
  if(tt<1.45||tt>2.95)return;
  const LW=640,LH=70;
  const off=lerp(-900,0,easeOutCubic(clamp((tt-1.45)/0.6)))+lerp(0,1200,easeInCubic(clamp((tt-2.6)/0.35)));
  const x0=W/2-LW/2+off, y0=RY;
  c.save();
  c.fillStyle=HANDLE;c.strokeStyle=INK;c.lineWidth=2;
  c.fillRect(x0,y0,LW,LH);c.strokeRect(x0,y0,LW,LH);
  const vx=x0+LW/2-110, vy=y0+8, vw=220, vh=30;
  c.fillStyle=BG;c.fillRect(vx,vy,vw,vh);c.strokeRect(vx,vy,vw,vh);
  c.fillStyle=INK;c.fillRect(vx+vw/2-1,vy,2,vh);
  const bub=lerp(70,0,easeOutCubic(clamp((tt-1.6)/0.6)));
  c.fillStyle=WHITE;c.beginPath();c.arc(vx+vw/2+bub,vy+vh/2,11,0,TAU);c.fill();
  c.fillStyle=BG;
  for(let i=0;i<=16;i++){
    const x=x0+20+i*(LW-40)/16;
    const major=i%4===0;
    c.fillRect(x-1,y0+LH-(major?20:10),2,major?20:10);
  }
  c.restore();
}

/* tool 3 — plumb bob: hangs from a pivot, swings, settles on the word's left edge */
function drawPlumb(c,tt){
  const t0=1.95,t1=2.75;
  if(tt<t0||tt>t1)return;
  const k=tt-t0;
  const ang=0.22*Math.sin(TAU*1.1*k)*Math.exp(-k*2.2);
  const px=110,py=600,L=430;
  const bx=px+Math.sin(ang)*L, by=py+Math.cos(ang)*L;
  c.save();
  c.globalAlpha=clamp((t1-tt)/0.15);
  c.setLineDash([4,8]);c.strokeStyle='rgba(240,238,233,0.35)';c.lineWidth=2;
  c.beginPath();c.moveTo(px,py);c.lineTo(px,1100);c.stroke();
  c.setLineDash([]);
  c.strokeStyle=INK;c.lineWidth=2;
  c.beginPath();c.moveTo(px,py);c.lineTo(bx,by-40);c.stroke();
  c.fillStyle=INK;c.beginPath();c.arc(px,py,8,0,TAU);c.fill();
  c.fillStyle=WHITE;c.beginPath();
  c.moveTo(bx,by);c.lineTo(bx-18,by-48);c.lineTo(bx+18,by-48);c.closePath();c.fill();
  c.restore();
}

/* tool 4 — chisel with hammer: drops in, the hammer taps it in time with the cut */
function drawChisel(c,sx,tt){
  if(tt<1.95||tt>4.5)return;
  const s=easeOutCubic(clamp((tt-1.95)/0.35));
  if(s<=0)return;
  c.save();
  c.translate(sx,KNIFE_TIP);
  c.rotate(0.06);
  c.scale(s,s);

  /* hammer: winds up, then strikes the chisel head every 0.25 s */
  if(tt>=2.3){
    const ph=((tt-2.3)%0.25)/0.25;
    const ang=-0.75*(1-easeInCubic(ph));
    c.save();
    c.translate(0,-225);c.rotate(ang);
    c.fillStyle=HANDLE;c.fillRect(-6,-11-120,12,120);     // shaft
    c.fillStyle=STEEL;c.fillRect(-44,-11,88,22);          // head
    c.strokeStyle=INK;c.lineWidth=2;c.strokeRect(-44,-11,88,22);
    c.restore();
  }

  /* chisel: flat edge at the tip, collar, wooden handle */
  c.shadowColor='rgba(0,0,0,0.55)';c.shadowBlur=24;c.shadowOffsetY=6;
  c.beginPath();c.moveTo(-18,0);c.lineTo(18,0);c.lineTo(20,-70);c.lineTo(-20,-70);c.closePath();
  c.fillStyle=WHITE;c.fill();
  c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;
  c.strokeStyle=BG;c.lineWidth=3;c.stroke();
  c.fillStyle=STEEL;c.fillRect(-26,-84,52,14);
  c.fillStyle=WOOD;c.fillRect(-19,-214,38,130);
  c.strokeStyle=INK;c.lineWidth=2;c.strokeRect(-19,-214,38,130);
  c.restore();
}

/* tool 5 — set square: checks the corner of the finished word */
function drawSquare(c,tt){
  const a=clamp((tt-4.4)/0.4);
  if(a<=0)return;
  const ox=440,oy=1460,leg=170;
  c.save();
  c.globalAlpha=a;c.strokeStyle=INK;c.lineJoin='round';
  c.beginPath();c.moveTo(ox,oy-leg);c.lineTo(ox,oy);c.lineTo(ox+leg,oy);c.closePath();
  c.fillStyle=BG;c.fill();
  c.lineWidth=5;c.stroke();
  c.lineWidth=2;c.beginPath();
  for(let i=1;i<=7;i++){
    const d=i*22, n=i%2?12:20;
    c.moveTo(ox,oy-d);c.lineTo(ox+n,oy-d);
    c.moveTo(ox+d,oy);c.lineTo(ox+d,oy-n);
  }
  c.stroke();
  c.restore();
}

/* four-point sparkle burst around the finished word */
function star(c,x,y,R){
  if(R<=0.5)return;
  c.save();
  c.fillStyle=WHITE;c.shadowColor='rgba(255,255,255,0.7)';c.shadowBlur=18;
  c.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4-Math.PI/2, r=i%2===0?R:R*0.2;
    const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
  }
  c.closePath();c.fill();
  c.restore();
}
const SPARKS=[[160,700],[930,690],[70,1010],[1010,1000],[540,640],[860,1300]];
function drawSparkles(c,tt){
  SPARKS.forEach(([x,y],i)=>{
    const p=(tt-(4.35+i*0.1))/0.7;
    if(p<0||p>1)return;
    star(c,x,y,40*Math.sin(Math.PI*p));
  });
}

function drawLabels(c,tt){
  const a1=0.6*clamp((tt-0.5)/0.3)*(1-clamp((tt-2.1)/0.3));
  const a2=0.6*clamp((tt-4.3)/0.4);
  label(c,'BEFORE · REGULAR SANS',W/2,1220,'center',a1);
  label(c,'AFTER · KINETIC FLOWFIELD',W/2,1220,'center',a2);
}

function drawFooter(c,tt){
  const a=clamp((tt-0.3)/0.4)*0.6;
  c.save();
  c.font=`500 24px ${MONO}`;
  if('letterSpacing' in c)c.letterSpacing='5px';
  c.textAlign='center';c.textBaseline='middle';
  c.fillStyle=`rgba(240,238,233,${a})`;
  c.fillText('TYPOGRAPHY MAKEOVER',W/2,1500);
  c.fillStyle=`rgba(240,238,233,${a*0.8})`;
  c.fillText('CALLISTRA.DESIGN',W/2,1538);
  c.restore();
}

function drawVignette(c){
  const g=c.createRadialGradient(W/2,H/2,380,W/2,H/2,1150);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.6)');
  c.save();c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
}

/* =====================================================================
   FRAME — a pure function of t
   ===================================================================== */
function renderFrame(t){
  const f=frameIndex(t), tt=f/FPS;
  sc.setTransform(1,0,0,1,0,0);sc.globalAlpha=1;sc.filter='none';
  sc.shadowColor='transparent';sc.shadowBlur=0;sc.shadowOffsetY=0;
  sc.fillStyle=BG;sc.fillRect(0,0,W,H);

  drawCaption(sc,tt);

  const sx=sweepX(tt);

  /* BEFORE: plain type, right of the cut */
  sc.save();
  sc.beginPath();sc.rect(sx,0,W-sx,H);sc.clip();
  drawPlain(sc,PL,easeOutExpo(clamp(tt/0.4)));
  sc.restore();

  /* AFTER: kinetic flowfield, left of the cut */
  if(sx>SWEEP_A){
    sc.save();
    sc.beginPath();sc.rect(0,0,sx,H);sc.clip();
    drawFlow(sc,FL,tt);
    sc.restore();
  }

  drawCut(sc,sx,tt);
  drawTape(sc,tt);
  drawPlumb(sc,tt);
  drawLevel(sc,tt);
  drawChisel(sc,sx,tt);
  drawSquare(sc,tt);
  drawLabels(sc,tt);
  drawSparkles(sc,tt);
  drawFooter(sc,tt);
  drawVignette(sc);

  const fade=clamp((tt-(DURATION-0.4))/0.4);
  if(fade>0){sc.save();sc.globalAlpha=fade;sc.fillStyle='#000';sc.fillRect(0,0,W,H);sc.restore();}
}
window.renderFrame=renderFrame;

/* =====================================================================
   SOUND — synthesised offline, on the same timeline as the visuals.
   Tape: whoosh, measuring ticks, whoosh out.
   Plumb: a soft ping. Level: a bubble click.
   Chisel: a swish across the word, a hammer tap on each strike, a cut click.
   Square: two small clicks. Close: a soft chime.
   ===================================================================== */
async function buildAudio(){
  const SR=44100,DUR=REEL.duration;
  const oc=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const rand=mulberry32(7);
  const nb=oc.createBuffer(1,SR*2,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rand()*2-1;}
  const master=oc.createGain();
  master.gain.setValueAtTime(.7,0);master.gain.setValueAtTime(.7,DUR-.4);master.gain.linearRampToValueAtTime(0,DUR-.01);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=8;comp.attack.value=.002;comp.release.value=.12;
  master.connect(comp);comp.connect(oc.destination);
  const rl=Math.floor(SR*1.2),ir=oc.createBuffer(2,rl,SR);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rand()*2-1)*Math.pow(1-i/rl,3);}
  const conv=oc.createConvolver();conv.buffer=ir;const rv=oc.createGain();rv.gain.value=.4;conv.connect(rv);rv.connect(master);
  const out=(g,rev=0)=>{g.connect(master);if(rev>0){const s=oc.createGain();s.gain.value=rev;g.connect(s);s.connect(conv);}};
  const env=(p,t,peak,a,d)=>{p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(peak,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);};
  const osc=(type,f,t,dur)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;};
  const burst=(t,f,peak,rev=0)=>{
    const n=oc.createBufferSource();n.buffer=nb;
    const bp=oc.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
    const g=oc.createGain();env(g.gain,t,peak,.001,.03);
    n.connect(bp);bp.connect(g);out(g,rev);n.start(t,0,.08);
  };
  const tick=(t,f,peak)=>{const o=osc('sine',f,t,.09),g=oc.createGain();env(g.gain,t,peak,.002,.05);o.connect(g);out(g,.06);};
  const whoosh=(s,dur,f0,f1,peak)=>{
    const n=oc.createBufferSource();n.buffer=nb;n.loop=true;n.start(s);n.stop(s+dur);
    const bp=oc.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.4;
    bp.frequency.setValueAtTime(f0,s);bp.frequency.exponentialRampToValueAtTime(f1,s+dur);
    const g=oc.createGain();
    g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(peak,s+dur*.45);g.gain.linearRampToValueAtTime(0,s+dur);
    n.connect(bp);bp.connect(g);out(g,.12);
  };

  /* steel tape */
  whoosh(0.35,0.55,500,2200,.08);
  [0.62,0.72,0.82,0.92].forEach(t=>tick(t,1800,.07));
  whoosh(1.45,0.5,2200,600,.07);

  /* spirit level and plumb bob */
  tick(2.15,1400,.06);
  tick(2.0,300,.06);

  /* chisel: drop, swish across the word */
  burst(1.98,2400,.2,.1);tick(1.98,740,.1);
  whoosh(2.3,2.0,400,3200,.07);

  /* hammer taps, in time with the strikes (2.55 s + 0.25 s steps) */
  for(let k=0;k<8;k++){
    const t=2.55+0.25*k;
    burst(t,900,.18,.05);tick(t,300,.08);
  }
  burst(4.3,1500,.16,.15);tick(4.3,520,.09);

  /* set square: two small clicks */
  tick(4.45,1100,.07);tick(4.6,1100,.07);

  /* closing chime on the finished word */
  [[1318.5,4.75],[1760,4.87],[2093,4.99]].forEach(([f,d])=>{
    [[1,.12],[2,.03]].forEach(([m,a])=>{
      const o=osc('sine',f*m,d,1.0),g=oc.createGain();
      env(g.gain,d,a,.004,.6);o.connect(g);out(g,.5);
    });
  });
  return oc.startRendering();
}
let audioP=null;const getAudio=()=>audioP||(audioP=buildAudio());
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate;
  const data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=peak>.78?.78/peak:1;
  const ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';
  for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER (normal browser only) + BOOT
   ===================================================================== */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent='f'+frameIndex(t)+' · '+t.toFixed(2)+'s';};
  function loop(){
    if(!playing)return;
    cur=base+(performance.now()-started)/1000;
    if(cur>=REEL.duration){show(REEL.duration);pause();btn.textContent='REPLAY';cur=0;return;}
    show(cur);requestAnimationFrame(loop);
  }
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){
    btn.textContent='PREPARING SOUND…';
    if(!buf)buf=await getAudio();
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);
    base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();
  }
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}

async function boot(){
  try{
    const wait=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
    await wait(Promise.all([
      document.fonts.load('900 100px "Barlow Condensed"'),
      document.fonts.load('500 28px "JetBrains Mono"'),
      document.fonts.load('700 28px "JetBrains Mono"')
    ]),15000);
    await document.fonts.ready;
    if(!ALLOW_FALLBACK&&!document.fonts.check('900 100px "Barlow Condensed"'))throw new Error('Barlow Condensed failed to load');
    buildLayouts();
    renderFrame(0);
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.message||e);console.error(e);}
}
boot();
})();
