<!-- ============ NEWSPAPER CUTOUT API (inlined, untouched) ============ -->
<script>
/* =====================================================================
   NEWSPAPER CUTOUT API  v1.0
   Code-only version of "Newspaper Cutout Studio" (same engine, no UI).
   Single self-contained file. No dependencies. Browser only (uses <canvas>).

   ---------------------------------------------------------------------
   QUICK START  (paste this file inside a <script> tag in your HTML)
   ---------------------------------------------------------------------
     <canvas id="poster" width="1200" height="1600"></canvas>
     <script>
       // ...this whole file here...
       (async () => {
         await NewspaperCutout.ready();            // loads the Google Fonts once
         const ctx = document.getElementById('poster').getContext('2d');

         // draw a cutout title straight onto your own poster canvas:
         NewspaperCutout.drawTo(ctx, { text: 'BREAKING', preset: 'Punk Cover', seed: 42 },
                                { x: 600, y: 300, width: 900, anchor: 'center', rotate: -0.08 });
       })();
     <\/script>

   ---------------------------------------------------------------------
   FUNCTIONS
   ---------------------------------------------------------------------
   NewspaperCutout.ready()                 -> Promise. Loads fonts. Await it ONCE before rendering.
   NewspaperCutout.render(opts)            -> HTMLCanvasElement (transparent PNG-like, auto-cropped). Sync.
   NewspaperCutout.renderAsync(opts)       -> Promise<canvas> (awaits ready() for you).
   NewspaperCutout.toDataURL(opts)         -> Promise<string>  e.g. img.src = await ...toDataURL(opts)
   NewspaperCutout.toBlob(opts)            -> Promise<Blob>    (PNG)
   NewspaperCutout.toImage(opts)           -> Promise<HTMLImageElement>
   NewspaperCutout.mount(element, opts)    -> Promise<canvas>  appends the result into a DOM element
   NewspaperCutout.drawTo(ctx, opts, place)-> draws onto YOUR canvas context (best for posters).
          place = { x, y, width, height, anchor: 'topleft'|'center', rotate: radians, alpha: 0..1 }
          give width OR height (the other keeps aspect ratio). Returns {width,height} actually drawn.
   NewspaperCutout.loadCustomFont(urlOrArrayBuffer, name?) -> Promise. Then use font:'custom' (see overrides)
                                           and it joins the Mixed Fonts pool.
   NewspaperCutout.randomSeed()            -> number
   NewspaperCutout.config({ injectFonts:false }) -> call BEFORE ready() if your page already loads
                                           the fonts itself (see FONT LIST at bottom).
   Lists: NewspaperCutout.presets, .palettes, .styles, .fonts, .stocks, .types, .formats

   ---------------------------------------------------------------------
   OPTIONS  (every option is optional)
   ---------------------------------------------------------------------
   text         'Cutout'   Text to render. Use \n for new lines.
   type         'letters'  'letters' (ransom letters) | 'words' (word scraps) |
                           'strip' (headline strip, one strip per line) | 'collage' (torn headline collage)
   preset       null       'Punk Cover' | 'Xerox Zine' | 'Crime Headline' | 'Riso Poster' |
                           'Receipt' | 'Classified' | 'Pop Comic'   (your own options override the preset)
   seed         7          Number. Same seed + same options = identical result every time. 'random' ok.
   shape        55         0-100  Shape randomness (how torn/uneven the scraps are)
   halftone     45         0-100  Halftone print texture
   mismatch     40         0-100  Baseline mismatch (jumping / rotated letters)
   style        'clean'    'clean' | 'classified' | 'xerox' | 'riso' | 'letterpress' | 'redacted' | 'thermal' | 'comic'
   palette      'mix'      'mix' | 'vivid' | 'news' | 'punk' | 'dada' | 'soft' | 'neon' | 'single'
                           (giving paper or ink without a palette switches to 'single' automatically)
   paper        '#ece5d3'  Paper colour   (used with palette 'single')
   ink          '#17150f'  Ink colour     (used with palette 'single')
   randomCase   true       Random upper/lower case per letter
   mixedFonts   true       Random font per letter. false = Barlow Condensed (or your custom font)
   tape         false      Tape pieces on scraps
   staple       false      Staples on scraps
   size         140        30-250. Upper limit of letter size (it still auto-fits the canvas)
   shadow       55         0-100  Paper drop shadow
   stock        'mag'      'news' (thin newsprint) | 'mag' | 'card' (thick cardboard) | 'gloss'
   tearH        50         0-100  Tear on top/bottom edges
   tearV        50         0-100  Tear on side edges
   fibers       0          0-100  Edge fibres
   age          0          0-100  Paper age & stains
   folds        0          0-100  Fold lines
   bleed        0          0-100  Ink bleed
   dropout      0          0-100  Ink dropout (worn print)
   smear        0          0-100  Ink smear

   OUTPUT SIZE
   scale        2          Pixel multiplier (1,2,4,8...). Capped at 12.
   width        null       Exact output width in px  (overrides scale; keeps aspect ratio)
   height       null       Exact output height in px (overrides scale; keeps aspect ratio)
   crop         true       Auto-crop transparent edges (like the app's PNG export)
   padding      0          Transparent px added around the cropped result

   PER-LETTER CONTROL  (type 'letters' only)
   overrides    {}         Keyed by the character position in `text` (0 = first char, spaces and \n count).
        { 0: { font:'anton', case:'upper', ink:'#fff', paper:'#e11', rotate:-8, scale:130,
               dx:10, dy:-6, z:1, seed:3, shape:80, halftone:20, mismatch:0 },
          3: { font:'abril' } }
        font  = one of NewspaperCutout.fonts (e.g. 'anton','bebas','abril','alfa','playfair','custom'...)
        case  = 'upper' | 'lower'          rotate = degrees        scale = percent (30-300)
        dx/dy = nudge in px at base size   z = layer (+ front / - back)

   POSTER MODE  (optional; usually you will compose the poster yourself with drawTo)
   format       'free'     'free' (cutout only) | 'poster' (4:5) | 'square' | 'story' (9:16) | 'banner' (16:9)
   backdrop     'news'     'news' | 'cream' | 'kraft' | 'black' | 'pink' | 'cobalt'
   scraps       50         0-100 loose decorative scraps
   wall         false      Draw the poster framed on a wall
   (in poster mode the canvas is NOT cropped and scale is capped at 4)

   ---------------------------------------------------------------------
   EXAMPLES
   ---------------------------------------------------------------------
   // 1) <img> from code
   const img = await NewspaperCutout.toImage({ text:'SALE', preset:'Riso Poster', seed:11, width:800 });
   document.body.appendChild(img);

   // 2) Different title lines in one poster
   await NewspaperCutout.ready();
   NewspaperCutout.drawTo(ctx, { text:'MIDNIGHT', type:'letters', seed:5, palette:'punk' },
                          { x:600, y:260, width:1000, anchor:'center' });
   NewspaperCutout.drawTo(ctx, { text:'live at the old mill', type:'strip', style:'letterpress', seed:9 },
                          { x:600, y:520, width:700, anchor:'center', rotate:0.05 });

   // 3) Per-letter edit
   NewspaperCutout.mount(document.getElementById('title'), {
     text:'HELLO', overrides:{ 0:{ ink:'#ffffff', paper:'#e11d1d', rotate:-6 }, 4:{ font:'abril' } }
   });

   // 4) Single colour, thick cardboard, taped
   NewspaperCutout.toDataURL({ text:'Cardboard', palette:'single', paper:'#c9a46b', ink:'#2b1d0d',
                               stock:'card', tape:true, scale:3 }).then(url => el.src = url);

   NOTES
   - Needs internet the first time (fonts come from Google Fonts). Await ready() first;
     if you render before fonts load, letters would use fallback fonts.
   - Rendering is deterministic: keep your seed to keep your design stable.
   - Each render is CPU-heavy (a few ms to a few hundred ms). Render once, then reuse the
     canvas / dataURL instead of re-rendering every frame.

   FONT LIST (if you set config({injectFonts:false}) load these yourself):
   Barlow Condensed 900, JetBrains Mono 700, Abril Fatface, Alfa Slab One, Anton, Bebas Neue,
   Chivo 900, Courier Prime 700, DM Serif Display, Libre Baskerville 700, Old Standard TT 700 (+italic),
   Oswald 700, Playfair Display 900 (+italic), Special Elite.
   ===================================================================== */
(function (root) {
'use strict';

/* ============================================================
   FONTS
   ============================================================ */
const FONT_POOL = [
    { key: 'barlow',    name: 'Barlow Condensed',  css: '"Barlow Condensed", sans-serif',   w: 900, s: 'normal' },
    { key: 'playfair',  name: 'Playfair Display',  css: '"Playfair Display", serif',        w: 900, s: 'normal' },
    { key: 'playfairi', name: 'Playfair Italic',   css: '"Playfair Display", serif',        w: 900, s: 'italic' },
    { key: 'abril',     name: 'Abril Fatface',     css: '"Abril Fatface", serif',           w: 400, s: 'normal' },
    { key: 'alfa',      name: 'Alfa Slab One',     css: '"Alfa Slab One", serif',           w: 400, s: 'normal' },
    { key: 'anton',     name: 'Anton',             css: '"Anton", sans-serif',              w: 400, s: 'normal' },
    { key: 'bebas',     name: 'Bebas Neue',        css: '"Bebas Neue", sans-serif',         w: 400, s: 'normal' },
    { key: 'oswald',    name: 'Oswald',            css: '"Oswald", sans-serif',             w: 700, s: 'normal' },
    { key: 'chivo',     name: 'Chivo Black',       css: '"Chivo", sans-serif',              w: 900, s: 'normal' },
    { key: 'baskerv',   name: 'Libre Baskerville', css: '"Libre Baskerville", serif',       w: 700, s: 'normal' },
    { key: 'oldstd',    name: 'Old Standard TT',   css: '"Old Standard TT", serif',         w: 700, s: 'normal' },
    { key: 'oldstdi',   name: 'Old Standard Italic', css: '"Old Standard TT", serif',       w: 700, s: 'italic' },
    { key: 'dmserif',   name: 'DM Serif Display',  css: '"DM Serif Display", serif',        w: 400, s: 'normal' },
    { key: 'elite',     name: 'Special Elite',     css: '"Special Elite", monospace',       w: 400, s: 'normal' },
    { key: 'courier',   name: 'Courier Prime',     css: '"Courier Prime", monospace',       w: 700, s: 'normal' },
    { key: 'jetbrains', name: 'JetBrains Mono',    css: '"JetBrains Mono", monospace',      w: 700, s: 'normal' }
];
const MAIN_FONT = FONT_POOL[0];
let customFont = null;
const FONT_URLS = [
    'https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap',
    'https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Anton&family=Bebas+Neue&family=Chivo:wght@900&family=Courier+Prime:wght@700&family=DM+Serif+Display&family=Libre+Baskerville:wght@700&family=Old+Standard+TT:ital,wght@0,700;1,700&family=Oswald:wght@700&family=Playfair+Display:ital,wght@0,900;1,900&family=Special+Elite&display=swap'
];
const CFG = { injectFonts: true };
let fontsPromise = null, fontsReady = false, warned = false;

function fontStr(f, px) { return `${f.s} ${f.w} ${px}px ${f.css}`; }
function fontByKey(k) {
    if (k === 'custom' && customFont) return customFont;
    return FONT_POOL.find(f => f.key === k) || MAIN_FONT;
}
function injectFonts() {
    if (!CFG.injectFonts || typeof document === 'undefined') return [];
    return FONT_URLS.map(href => new Promise(res => {
        const l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = href;
        l.onload = l.onerror = () => res();
        document.head.appendChild(l);
    }));
}
function ready() {
    if (fontsPromise) return fontsPromise;
    fontsPromise = Promise.all(injectFonts())
        .then(() => Promise.all(FONT_POOL.map(f => document.fonts.load(fontStr(f, 40), 'Aa').catch(() => {}))))
        .then(() => document.fonts.ready)
        .then(() => { normCache = {}; tileCache.clear(); fontsReady = true; });
    return fontsPromise;
}

const mctx = document.createElement('canvas').getContext('2d');
let normCache = {};
function getNorm(f) {
    if (normCache[f.key] != null) return normCache[f.key];
    mctx.font = fontStr(f, 100);
    const asc = mctx.measureText('H').actualBoundingBoxAscent;
    const n = asc > 1 ? Math.max(0.55, Math.min(1.7, 72 / asc)) : 1;
    normCache[f.key] = n;
    return n;
}

/* ============================================================
   PALETTES  [paper, ink]
   ============================================================ */
const CREAM = [['#ece5d3', '#17150f'], ['#ece5d3', '#17150f'], ['#f4f0e4', '#1b1a17'], ['#ddd2b6', '#1c1a14'], ['#e9e1cc', '#17150f'], ['#c9c5bb', '#111111']];
const INKED = [['#efe8d6', '#c4311d'], ['#ece6d4', '#1f5fae'], ['#eee8d7', '#2a8a35'], ['#eee8d7', '#e8720f'], ['#ede7d8', '#6b2f8f']];
const COLOURED = [['#2d78c4', '#f4efe2'], ['#ef7d1d', '#fbf4e4'], ['#2f9a3e', '#f3efdf'], ['#c93a22', '#f4eadb'], ['#f0d23c', '#1a1710'], ['#17171a', '#efe7d6'], ['#e86fa0', '#fff3e6'], ['#1f9aa8', '#f6f1e2']];
const PUNK = [['#f4f0e4', '#111111'], ['#111111', '#f4f0e4'], ['#ff2e88', '#111111'], ['#f4f0e4', '#ff2e88'], ['#e8e0cf', '#111111'], ['#ffe600', '#111111']];
const DADA = [['#d9c7a0', '#2b2116'], ['#e6d8b8', '#3a2a17'], ['#c9b48a', '#1f160c'], ['#efe3c6', '#5a3a1c'], ['#b99f73', '#1a120a']];
const SOFT = [['#f6d6d9', '#4a2f3a'], ['#d7e6d3', '#2f4a3a'], ['#d6e2f2', '#2f3d5a'], ['#f7e8c4', '#5a4a2f'], ['#e4d7f0', '#42305a'], ['#fbe3d0', '#6a3a2a']];
const NEON = [['#c6ff3d', '#17121c'], ['#ff3dcb', '#fff4fb'], ['#2de2ff', '#0b1a2b'], ['#7a3dff', '#f3ecff'], ['#17121c', '#c6ff3d'], ['#ff7a1a', '#1a0f05']];
const PALETTES = {
    mix: [...CREAM, ...INKED, ...COLOURED],
    vivid: [...COLOURED, ...INKED],
    news: [...CREAM, ['#17171a', '#efe7d6']],
    punk: PUNK, dada: DADA, soft: SOFT, neon: NEON
};

/* ============================================================
   RANDOM + COLOR HELPERS
   ============================================================ */
function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
function hashInts(...v) {
    let h = 2166136261;
    for (const x of v) { h ^= (x | 0) + 0x9e3779b9 + (h << 6) + (h >>> 2); h = Math.imul(h, 16777619); }
    return h >>> 0;
}
function hash01(a, b) { return hashInts(a, b) / 4294967296; }
function vn1(seed, x) {
    const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f);
    return hash01(seed, i) * (1 - s) + hash01(seed, i + 1) * s;
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) { const c = hexToRgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(hex, amt) { const c = hexToRgb(hex); return rgbToHex(c[0] * (1 + amt), c[1] * (1 + amt), c[2] * (1 + amt)); }
const clamp01 = (v) => Math.max(0, Math.min(1, v));

/* ============================================================
   CONSTANTS
   ============================================================ */
const FORMATS = { free: [800, 400], poster: [800, 1000], square: [900, 900], story: [720, 1280], banner: [1280, 720] };
const STOCK = { news: { edge: 0.9, core: 0, grain: 1.25, sh: 0.65, gloss: 0 }, mag: { edge: 1.5, core: 0, grain: 1, sh: 1, gloss: 0 }, card: { edge: 2.2, core: 3, grain: 0.8, sh: 1.7, gloss: 0 }, gloss: { edge: 1.2, core: 0, grain: 0.3, sh: 1, gloss: 1 } };
const STYLES = ['clean', 'classified', 'xerox', 'riso', 'letterpress', 'redacted', 'thermal', 'comic'];
const TYPES = ['letters', 'words', 'strip', 'collage'];
const PRESETS = {
    'Punk Cover': { shape: 80, halftone: 60, mismatch: 70, palette: 'punk', style: 'clean', tape: 1, staple: 1 },
    'Xerox Zine': { shape: 60, halftone: 80, mismatch: 50, palette: 'news', style: 'xerox', tape: 1, staple: 0 },
    'Crime Headline': { shape: 45, halftone: 35, mismatch: 25, palette: 'dada', style: 'letterpress', tape: 0, staple: 0 },
    'Riso Poster': { shape: 30, halftone: 55, mismatch: 35, palette: 'vivid', style: 'riso', tape: 0, staple: 0 },
    'Receipt': { shape: 10, halftone: 20, mismatch: 10, palette: 'news', style: 'thermal', tape: 0, staple: 0 },
    'Classified': { shape: 40, halftone: 30, mismatch: 30, palette: 'news', style: 'redacted', tape: 0, staple: 1 },
    'Pop Comic': { shape: 35, halftone: 85, mismatch: 45, palette: 'neon', style: 'comic', tape: 0, staple: 0 }
};
const DEFAULTS = {
    text: 'Cutout', type: 'letters', seed: 7, shape: 55, halftone: 45, mismatch: 40,
    style: 'clean', palette: 'mix', paper: '#ece5d3', ink: '#17150f',
    randomCase: true, mixedFonts: true, tape: false, staple: false,
    size: 140, shadow: 55, stock: 'mag',
    age: 0, folds: 0, bleed: 0, dropout: 0, smear: 0, tearH: 50, tearV: 50, fibers: 0,
    scale: 2, width: null, height: null, crop: true, padding: 0,
    format: 'free', backdrop: 'news', scraps: 50, wall: false, overrides: null
};

/* ============================================================
   RUNTIME CONTEXT  (set at the start of every render; rendering is synchronous)
   ============================================================ */
let O = null;      // normalized options
let S = null;      // style state (numbers 0-100 etc.)
let OV = {};       // per-letter overrides keyed by uid (= char index + 1)
let CW = 800, CH = 400;

function num(v, d, lo, hi) { v = Number(v); if (!isFinite(v)) v = d; return Math.max(lo, Math.min(hi, v)); }

function normalize(user) {
    user = user || {};
    const preset = user.preset ? PRESETS[user.preset] : null;
    if (user.preset && !preset) console.warn('NewspaperCutout: unknown preset "' + user.preset + '"');
    const merged = Object.assign({}, DEFAULTS, preset || {}, user);
    if (preset) { merged.tape = !!merged.tape; merged.staple = !!merged.staple; }
    if ((user.paper || user.ink) && user.palette == null && !(preset && preset.palette)) merged.palette = 'single';
    const o = {};
    o.text = String(merged.text == null ? '' : merged.text);
    o.type = TYPES.includes(merged.type) ? merged.type : 'letters';
    o.seed = merged.seed === 'random' ? 1 + Math.floor(Math.random() * 1e6) : (parseInt(merged.seed) || 1);
    o.shape = num(merged.shape, 55, 0, 100); o.halftone = num(merged.halftone, 45, 0, 100); o.mismatch = num(merged.mismatch, 40, 0, 100);
    o.style = STYLES.includes(merged.style) ? merged.style : 'clean';
    o.palette = (merged.palette === 'single' || PALETTES[merged.palette]) ? merged.palette : 'mix';
    o.paper = /^#[0-9a-f]{6}$/i.test(merged.paper) ? merged.paper : DEFAULTS.paper;
    o.ink = /^#[0-9a-f]{6}$/i.test(merged.ink) ? merged.ink : DEFAULTS.ink;
    o.randomCase = !!merged.randomCase; o.mixedFonts = !!merged.mixedFonts;
    o.tape = !!merged.tape; o.staple = !!merged.staple;
    o.size = num(merged.size, 140, 30, 250); o.shadow = num(merged.shadow, 55, 0, 100);
    o.stock = STOCK[merged.stock] ? merged.stock : 'mag';
    ['age', 'folds', 'bleed', 'dropout', 'smear', 'tearH', 'tearV', 'fibers'].forEach(k => o[k] = num(merged[k], DEFAULTS[k], 0, 100));
    o.scale = num(merged.scale, 2, 0.1, 12);
    o.width = merged.width ? num(merged.width, 0, 1, 30000) : null;
    o.height = merged.height ? num(merged.height, 0, 1, 30000) : null;
    o.crop = merged.crop !== false; o.padding = num(merged.padding, 0, 0, 2000);
    o.format = FORMATS[merged.format] ? merged.format : 'free';
    o.backdrop = ['news', 'cream', 'kraft', 'black', 'pink', 'cobalt'].includes(merged.backdrop) ? merged.backdrop : 'news';
    o.scraps = num(merged.scraps, 50, 0, 100); o.wall = !!merged.wall;
    o.overrides = merged.overrides || {};

}

function setContext(o) {
    O = o;
    S = { seed: o.seed, shape: o.shape, halftone: o.halftone, mismatch: o.mismatch, paper: o.paper, ink: o.ink, style: o.style,
          age: o.age, folds: o.folds, bleed: o.bleed, dropout: o.dropout, smear: o.smear, tearH: o.tearH, tearV: o.tearV, fibers: o.fibers, stock: o.stock };
    const d = FORMATS[o.format]; CW = d[0]; CH = d[1];
    OV = {};
    const src = o.overrides;
    Object.keys(src).forEach(k => {
        const a = src[k] || {}, r = {};
        if (a.font != null) r.font = a.font;
        if (a.case != null) r.caseMode = a.case;
        if (a.paper) r.paper = a.paper;
        if (a.ink) r.ink = a.ink;
        if (a.rotate != null) r.mrot = +a.rotate;
        if (a.scale != null) r.mscl = +a.scale;
        if (a.dx != null) r.dx = +a.dx;
        if (a.dy != null) r.dy = +a.dy;
        if (a.z != null) r.z = +a.z * 100;
        if (a.seed != null) r.seed = +a.seed;
        ['shape', 'halftone', 'mismatch'].forEach(p => { if (a[p] != null) r[p] = +a[p]; });
        OV[(parseInt(k) || 0) + 1] = r;
    });
}

/* ============================================================
   GRAIN TEXTURES
   ============================================================ */
let grainCache = null;
function getGrain() {
    if (grainCache) return grainCache;
    const SZ = 512;
    const rng = mulberry32(90210);
    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = SZ; return c; };

    const paper = mk(); const pg = paper.getContext('2d');
    const low = document.createElement('canvas'); low.width = low.height = 40;
    const lg = low.getContext('2d'); const ld = lg.createImageData(40, 40);
    for (let i = 0; i < 1600; i++) { ld.data[i * 4] = 150; ld.data[i * 4 + 1] = 110; ld.data[i * 4 + 2] = 50; ld.data[i * 4 + 3] = rng() * 34; }
    lg.putImageData(ld, 0, 0);
    pg.imageSmoothingEnabled = true; pg.imageSmoothingQuality = 'high';

  yellow: '#e9ff1f', orange: '#ff5b1f', red: '#ff2a14', violet: '#a76bff', mint: '#3dffc2',
  cream: '#efe6d0', cyan: '#35e8ff', grey: '#9a98a0', white: '#ffffff'
};
const HEAVY = '"Archivo Black","Anton","Arial Black",Impact,sans-serif';
const SERIF = '"Instrument Serif","Crimson Text","Cardo","Gelasio",Georgia,"Times New Roman",serif';
const MONO  = '"JetBrains Mono","DejaVu Sans Mono","Courier New",monospace';

const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut3 = p => 1 - Math.pow(1 - p, 3);
const eOut5 = p => 1 - Math.pow(1 - p, 5);
const eIn3 = p => p * p * p;
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eBack = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const eElastic = p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI / 3)) + 1;
const eBounce = p => { const n = 7.5625, d = 2.75; if (p < 1 / d) return n * p * p; if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75; if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375; return n * (p -= 2.625 / d) * p + .984375; };
const hit = (t, b, k = 12) => t >= b ? Math.exp(-(t - b) * k) : 0;
const win = (t, a, b) => (t >= a && t < b) ? 1 : 0;

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b = 0, c = 0) { let h = 2166136261; for (const v of [a, b, c]) { h ^= (v | 0); h = Math.imul(h, 16777619); h ^= h >>> 13; } return ((h >>> 0) % 100003) / 100003; }
function vn(seed, x) { const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f); return lerp(hash(seed, i), hash(seed, i + 1), s) * 2 - 1; }

const poly = (pts, ctx = g) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
const mix = (c1, c2, p) => { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16); const r = lerp(a >> 16, b >> 16, p) | 0, gg = lerp(a >> 8 & 255, b >> 8 & 255, p) | 0, bb = lerp(a & 255, b & 255, p) | 0; return `rgb(${r},${gg},${bb})`; };

/* frame state (set per render) */
let FR = 0;           // integer frame
let F2 = 0;           // stop-motion "on twos" frame
let F3 = 0;           // "on threes"

/* ------------------------------------------------------------------ textures (built once) */
const TEX = {};
const CUT = {};

function packRGBA(hex, a = 255) { const n = parseInt(hex.slice(1), 16); return ((a << 24) | ((n & 255) << 16) | ((n >> 8 & 255) << 8) | (n >> 16 & 255)) >>> 0; }

function speckle(base, dot, density, minR, maxR, seed, size = 256) {
  const c = mk(size, size), x = c.getContext('2d'), r = rng(seed);
  x.fillStyle = base; x.fillRect(0, 0, size, size);
  x.fillStyle = dot;
  const n = size * size * density;
  for (let i = 0; i < n; i++) { const rr = minR + r() * (maxR - minR); x.fillRect(r() * size, r() * size, rr, rr); }
  return c;
}

function ditherDisc(R, colA, dirAng, seed, yellow) {
  const S = R * 2, c = mk(S, S), x = c.getContext('2d');
  const id = x.createImageData(S, S), d = new Uint32Array(id.data.buffer), rnd = rng(seed), A = packRGBA(colA);
  const dx = Math.cos(dirAng), dy = Math.sin(dirAng);
  for (let y = 0; y < S; y++) for (let xx = 0; xx < S; xx++) {
    const ox = xx - R, oy = y - R, r = Math.hypot(ox, oy); if (r > R) continue;
    const proj = (ox * dx + oy * dy) / R;                        // -1..1
    const v = cl(0.5 - proj * 0.62 + (rnd() - .5) * .06, 0, 1);
    if (rnd() < Math.pow(v, 1.15)) d[y * S + xx] = A;
  }
  x.putImageData(id, 0, 0);
  if (yellow) {
    x.save(); x.beginPath(); x.arc(R, R, R, 0, 7); x.clip();
    x.fillStyle = yellow; const cell = 14, r2 = rng(seed + 9);
    for (let j = 0; j < S / cell; j++) for (let i = 0; i < S / cell; i++) {
      const px = i * cell + cell / 2 - R, py = j * cell + cell / 2 - R; const proj = (px * dx + py * dy) / R;
      const pp = cl((-proj - .05) * 0.9, 0, 1) ** 1.3 * .75;
      if (r2() < pp) x.fillRect(i * cell + 3, j * cell + 3, cell - 6, cell - 6);
    }
    x.restore();
  }
  return c;
}

function halftone(w, h, cell, ang, fn, color, maxK = .62) {
  const c = mk(w, h), x = c.getContext('2d'); x.fillStyle = color;
  const ca = Math.cos(ang), sa = Math.sin(ang), n = Math.ceil(Math.hypot(w, h) / cell);
  for (let j = -n; j < n; j++) for (let i = -n; i < n; i++) {
    const gx = i * cell, gy = j * cell, px = w / 2 + gx * ca - gy * sa, py = h / 2 + gx * sa + gy * ca;
    if (px < -cell || py < -cell || px > w + cell || py > h + cell) continue;
    const v = fn(px / w, py / h); if (v <= .03) continue;
    x.beginPath(); x.arc(px, py, cell * maxK * Math.sqrt(v), 0, 6.283); x.fill();
  }
  return c;
}

function ditherGrad(w, h, c1, c2, seed, vertical) {
  const c = mk(w, h), x = c.getContext('2d'), id = x.createImageData(w, h), d = new Uint32Array(id.data.buffer), r = rng(seed);
  const A = packRGBA(c1), Bc = packRGBA(c2);
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    const p = vertical ? y / h : xx / w; const q = p + (r() - .5) * .35;
    d[y * w + xx] = q > .5 ? Bc : A;
  }
  x.putImageData(id, 0, 0); return c;
}

function buildTextures() {
  // grain tile (film grain overlay)
  { const S = 384, c = mk(S, S), x = c.getContext('2d'), id = x.createImageData(S, S), d = new Uint32Array(id.data.buffer), r = rng(4242);
    for (let i = 0; i < d.length; i++) { const v = r(); if (v < .07) d[i] = packRGBA('#ffffff', 40 + r() * 90); else if (v < .15) d[i] = packRGBA('#000000', 40 + r() * 100); }
    x.putImageData(id, 0, 0); TEX.grain = g.createPattern(c, 'repeat'); }
  // paper fibre grain
  TEX.paper = g.createPattern(speckle('rgba(0,0,0,0)', 'rgba(60,40,20,.22)', .05, 1, 2.4, 31, 200), 'repeat');
  TEX.speckGrey = g.createPattern(speckle('#8f8b8a', '#1a1818', .12, 1, 3.2, 5), 'repeat');
  TEX.speckInk = g.createPattern(speckle('#15121c', '#efe6d0', .05, 1, 2.6, 6), 'repeat');
  TEX.speckCream = g.createPattern(speckle('#efe3cf', '#2a2622', .05, 1, 2.6, 7), 'repeat');
  TEX.speckBlue = g.createPattern(speckle('#2b3bff', '#0a0910', .06, 1, 2.6, 8), 'repeat');

  // dithered discs
  TEX.discRed = ditherDisc(420, '#ff2a14', -.55, 11, '#ffc21a');
  TEX.discPink = ditherDisc(300, '#ff3d8f', 2.4, 12, null);
  TEX.discViolet = ditherDisc(260, '#a76bff', -2.2, 13, null);

  // halftone fields
  TEX.htPink = halftone(620, 620, 13, .35, (u, v) => { const d = Math.hypot(u - .5, v - .5) * 2; return cl(1 - d * 1.05, 0, 1) ** .8 + (.0); }, C.pink);
  TEX.htCream = halftone(900, 260, 11, -.3, (u, v) => cl(1 - u * 1.05, 0, 1), C.cream);
  TEX.htInk = halftone(1100, 700, 14, .5, (u, v) => cl(v * 1.2 - .1, 0, 1), '#12101a', .66);
  TEX.htYellow = halftone(520, 520, 12, -.5, (u, v) => cl(1.1 - Math.hypot(u - .3, v - .7) * 1.6, 0, 1), C.yellow);

  // dither gradient ribbons for pixel stairs
  TEX.stairViolet = ditherGrad(760, 260, '#a76bff', '#ff4fb2', 21, false);
  TEX.stairCyan = ditherGrad(760, 260, '#35e8ff', '#5b4bff', 22, false);
  TEX.stairOrange = ditherGrad(760, 260, '#ff5b1f', '#ff2e7a', 23, false);

  // barcode
  { const r = rng(99); TEX.bars = []; let x = 0; while (x < 260) { const w = 2 + Math.floor(r() * 7), gap = 2 + Math.floor(r() * 5); TEX.bars.push([x, w]); x += w + gap; } TEX.barsW = x; }

  // vignette
  { const c = mk(W, H), x = c.getContext('2d'), gr = x.createRadialGradient(W / 2, H / 2, 560, W / 2, H / 2, 1250);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); TEX.vig = c; }
  // scanlines
  { const c = mk(4, 4), x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,.12)'; x.fillRect(0, 0, 4, 1); TEX.scan = g.createPattern(c, 'repeat'); }

  // scribbles (pre-generated paths) -------------------------------------
  const scrib = (seed, x0, y0, w, h, n, wob) => {
    const r = rng(seed), pts = []; let up = false;
    for (let i = 0; i <= n; i++) { const u = i / n; pts.push([x0 + u * w + (r() - .5) * wob, y0 + (up ? 0 : h) + (r() - .5) * wob * .6]); up = !up; }
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return { pts, len };
  };
  TEX.scribA = scrib(1, 40, 80, 420, 210, 14, 40);        // crayon over cobalt (top-left)
  TEX.scribB = scrib(2, 640, 1010, 380, 230, 12, 50);     // chalk mid-right
  TEX.scribC = scrib(3, 100, 1590, 880, 26, 18, 30);      // strike through polite.
  
}

/* ------------------------------------------------------------------ audio */
function buildAudio() {
  return async function renderAudio() {
    const SR = 44100, N = Math.ceil(DUR * SR);
    const oc = new OfflineAudioContext(2, N, SR);
    const master = oc.createGain(); master.gain.value = .85;
    const comp = oc.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 7; comp.attack.value = .002; comp.release.value = .1;
    master.connect(comp); comp.connect(oc.destination);
    // dub-delay send
    const dl = oc.createDelay(.5); dl.delayTime.value = .12; const fbk = oc.createGain(); fbk.gain.value = .33; const dlf = oc.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 2600;
    dl.connect(dlf); dlf.connect(fbk); fbk.connect(dl); const dlOut = oc.createGain(); dlOut.gain.value = .35; dlf.connect(dlOut); dlOut.connect(master);
    const nb = oc.createBuffer(1, SR * 2, SR), nd = nb.getChannelData(0), rr = rng(555); for (let i = 0; i < nd.length; i++) nd[i] = rr() * 2 - 1;
    const curve = k => { const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; c[i] = Math.tanh(x * k); } return c; };

    const pan = (node, p) => { const pn = oc.createStereoPanner(); pn.pan.value = p; node.connect(pn); return pn; };
    const send = (node, a) => { const s = oc.createGain(); s.gain.value = a; node.connect(s); s.connect(dl); };

    function osc(type, f0, f1, t0, dur, gain, o = {}) {
      const s = oc.createOscillator(); s.type = type; s.frequency.setValueAtTime(f0, t0); s.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
      if (o.detune) s.detune.value = o.detune;
      const gn = oc.createGain(); gn.gain.setValueAtTime(.0001, t0); gn.gain.exponentialRampToValueAtTime(gain, t0 + (o.att || .004)); gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      let node = s; s.connect(gn); node = gn;
      if (o.lp) { const f = oc.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(o.lp[0], t0); f.frequency.exponentialRampToValueAtTime(o.lp[1], t0 + dur); node.connect(f); node = f; }
      if (o.dist) { const w = oc.createWaveShaper(); w.curve = curve(o.dist); node.connect(w); node = w; }
      const p = pan(node, o.pan || 0); p.connect(master); if (o.send) send(p, o.send);
      s.start(t0); s.stop(t0 + dur + .03);
    }
    function noise(t0, dur, ftype, f0, f1, q, gain, o = {}) {
      const s = oc.createBufferSource(); s.buffer = nb; s.loop = true; s.playbackRate.value = o.rate || 1;
      const f = oc.createBiquadFilter(); f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      const gn = oc.createGain(); const att = o.att || .003;
      gn.gain.setValueAtTime(.0001, t0); gn.gain.exponentialRampToValueAtTime(gain, t0 + att);
      if (o.swell) { gn.gain.setValueAtTime(gain * .05, t0); gn.gain.exponentialRampToValueAtTime(gain, t0 + dur * .97); gn.gain.linearRampToValueAtTime(.0001, t0 + dur); }
      else gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      s.connect(f); f.connect(gn); const p = pan(gn, o.pan || 0); p.connect(master); if (o.send) send(p, o.send);
      s.start(t0, (o.off || 0)); s.stop(t0 + dur + .03);
    }
    const kick = (t0, f0, f1, dur, gain) => { osc('sine', f0, f1, t0, dur, gain, { att: .002 }); osc('triangle', f0 * 2.2, f1 * 2, t0, dur * .25, gain * .35); noise(t0, .02, 'highpass', 2500, 2500, .7, gain * .4); };
    const tick = (t0, gain = .25, f = 6500, pn = 0) => noise(t0, .014, 'highpass', f, f, .8, gain, { pan: pn });
    const snare = (t0, gain = .5) => { noise(t0, .13, 'bandpass', 1900, 900, .9, gain); osc('triangle', 280, 160, t0, .09, gain * .5); };

    // ---- 0.00  "Anything" : slam ------------------------------------
    kick(B.any, 130, 34, .65, 1.0);
    noise(B.any, .42, 'bandpass', 4200, 300, .8, .55, { send: .3 });
    [110, 165.4, 220.9].forEach((f, i) => osc('sawtooth', f, f * .86, B.any, .34, .17, { detune: (i - 1) * 14, lp: [5200, 260], dist: 3, send: .25, pan: (i - 1) * .3 }));
    // voice-synced letter ticks (8 letters across 0.41s)
    for (let i = 0; i < 8; i++) tick(B.any + .045 + i * .045, .2, 4500 + i * 350, (i % 2 ? .4 : -.4));
    osc('square', 1400, 300, .31, .06, .08, { lp: [6000, 800] });

    // ---- 0.41 - 0.69 : tension riser + accelerating ticks -------------
    noise(.41, .29, 'highpass', 400, 9000, .8, .32, { swell: 1, pan: -.2 });
    osc('sine', 260, 2600, .41, .29, .12, { att: .15 });
    osc('sawtooth', 90, 180, .41, .29, .05, { att: .2, lp: [400, 2400], dist: 2 });
    let tt = .45, gap = .045; while (tt < .69) { tick(tt, .22 + (tt - .45) * .5, 3500 + (tt - .45) * 8000, (Math.floor(tt * 100) % 2 ? .5 : -.5)); tt += gap; gap *= .86; }
    osc('square', 3200, 120, .57, .07, .09, { lp: [9000, 500] });            // glitch zap (matches slice-tear)
    noise(.60, .09, 'bandpass', 1000, 6000, 3, .25);                           // invert strobe

    // ---- 0.69 "that" : tiny sticker slap --------------------------------
    snare(B.that, .45); osc('square', 880, 1320, B.that, .06, .12, { lp: [7000, 2000], pan: -.5 });

    // ---- 0.77 "shouldn't" : kick + dropping letters (9 letters) ---------
    kick(B.sh, 105, 38, .4, .9); snare(B.sh, .35);
    for (let i = 0; i < 9; i++) { const t0 = B.sh + .035 + i * .022; osc('triangle', 240 + i * 55, 90 + i * 20, t0, .09, .26, { pan: (i % 2 ? .35 : -.35), send: .15 }); }
    noise(B.sh + .02, .22, 'bandpass', 800, 3800, 1.6, .16);                  // pixel-stair builds

    // ---- 1.01 "look" : lock-on -----------------------------------------
    osc('sine', 3000, 180, B.look, .16, .22, { lp: [9000, 600], send: .2 });
    kick(B.look + .005, 78, 40, .3, .6);
    osc('sine', 1900, 1900, 1.12, .035, .22, { att: .002, pan: .3 }); osc('sine', 2500, 2500, 1.15, .035, .2, { att: .002, pan: -.3 });
    noise(1.04, .12, 'bandpass', 3000, 7000, 2, .1);

    // ---- 1.22 "polite." : the break --------------------------------------
    kick(B.pol, 92, 28, .8, 1.15);
    noise(B.pol, .55, 'lowpass', 9000, 200, .7, .75, { send: .35 });
    [233.1, 246.9, 311.1, 98].forEach((f, i) => osc('sawtooth', f, f * .8, B.pol, .42, .22, { detune: (i % 2 ? 22 : -18), lp: [7000, 400], dist: 6, send: .3, pan: (i - 1.5) * .35 }));
    osc('square', 466, 233, B.pol, .3, .08, { dist: 8, lp: [4000, 400] });
    for (let i = 0; i < 14; i++) { const r = hash(i, 7); osc('sine', 5200 + r * 7000, 3000 + r * 2000, B.pol + .01 + i * .012, .05, .09, { pan: r * 2 - 1, att: .001 }); }   // glass shards
    // cursor drag whoosh + stretch
    noise(1.30, .18, 'bandpass', 500, 3200, 2, .22, { pan: .2 });
    osc('sine', 140, 420, 1.30, .18, .12, { att: .05 });
    // crayon strike
    for (let i = 0; i < 6; i++) noise(1.38 + i * .028, .03, 'bandpass', 3800, 3000, 5, .16, { pan: (i % 2 ? .5 : -.5), rate: 1.3 });
    // final ring-out
    osc('sine', 58, 52, 1.34, .3, .35, { att: .06 });
    tick(1.51, .2); tick(1.54, .14, 7800);

    const buf = await oc.startRendering();
    // fade the last 25 ms to avoid a click
    const L = buf.getChannelData(0), R = buf.getChannelData(1), fadeN = Math.floor(SR * .025);
    for (let i = 0; i < fadeN; i++) { const k = i / fadeN, idx = L.length - 1 - i; L[idx] *= k; R[idx] *= k; }
    let peak = 0; for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    const norm = peak > 0 ? .89 / peak : 1;
    const nS = L.length, ab = new ArrayBuffer(44 + nS * 4), dv = new DataView(ab);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); dv.setUint32(4, 36 + nS * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
    dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, nS * 4, true);
    for (let i = 0; i < nS; i++) { dv.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * norm)) * 32767, true); dv.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * norm)) * 32767, true); }
    const u8 = new Uint8Array(ab); let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(bin);
  };
}

/* ==================================================================
   SCENE
   ================================================================== */
let TT = 0;                       // current local time (s)
const TAU = Math.PI * 2;

/* ---------- camera: slow push-in + punch/shake/roll on every beat ---------- */
const BEATS = [[B.any, 1], [B.that, .35], [B.sh, .8], [B.look, .7], [B.pol, 1.8]];
function camera(t) {
  let sx = 0, sy = 0, rot = 0, punch = 0;
  BEATS.forEach(([b, s], i) => {
    const h = hit(t, b, 11);
    sx += (hash(FR, i, 1) - .5) * 2 * 34 * s * h;
    sy += (hash(FR, i, 2) - .5) * 2 * 46 * s * h;
    rot += (hash(i, 3, 7) - .5) * .06 * s * h;
    punch += .055 * s * h;
  });
  return { sx, sy, rot, z: 1.02 + .035 * (t / DUR) + punch };
}

/* ---------- shape helpers ---------- */
function blobPath(cx, cy, r, seed, t, amp = .12, sp = 1.4, N = 72) {
  g.beginPath();

  // colour dots (pop, staggered)
  const dots = [C.pink, C.cobalt, C.mint, C.ink, C.grey];
  dots.forEach((c, i) => { const p = popP(t, .58 + i * .03, .18); if (p > 0) { g.beginPath(); g.arc(630 + i * 34, 1128, 11 * p, 0, TAU); g.fillStyle = c; g.fill(); g.lineWidth = 2; g.strokeStyle = C.cream; g.stroke(); } });
  // crosshair marks
  [[300, 585, .2], [960, 880, .66], [150, 1560, 1.24]].forEach(([x, y, a]) => { const p = pr(t, a, a + .12); if (p <= 0) return; g.save(); g.translate(x, y); g.rotate(p * 1.57); g.strokeStyle = C.cream; g.lineWidth = 2.5; const L = 30 * p; g.beginPath(); g.moveTo(-L, 0); g.lineTo(L, 0); g.moveTo(0, -L); g.lineTo(0, L); g.stroke(); g.restore(); });
  // scribbles drawn on
  scribbleDraw(TEX.scribA, eInOut(pr(t, .30, .58)), C.cream, 7);
  scribbleDraw(TEX.scribB, eInOut(pr(t, .92, 1.15)), C.yellow, 7);
}

/* ---------- cutouts from the API ---------- */
const CUTS = [
  // key, x, y, width, rot, appear, style
  ['rude',  770, 196, 440, .10, .14, 'slap'],
  ['loud',  310, 1078, 560, -.05, .52, 'slide'],
  ['no',    905, 690, 250, .22, .86, 'spin'],
  ['sorry', 700, 1758, 620, -.04, .34, 'drop'],
  ['mess',  845, 1390, 350, -.12, 1.26, 'slap'],
];
function layerCutouts(t) {
  CUTS.forEach(([key, x, y, w, rot, a, style], i) => {
    const c = CUT[key]; if (!c || t < a) return;
    const h = w * c.height / c.width;
    let sx = 1, ox = 0, oy = 0, r = rot, al = 1;
    if (style === 'slap') { const p = pr(t, a, a + .13); sx = lerp(2.8, 1, eOut5(p)); al = cl(p * 6); r += (1 - p) * .35; }
    if (style === 'slide') { const p = eExpo(pr(t, a, a + .2)); ox = (1 - p) * -1300; }
    if (style === 'spin') { const p = pr(t, a, a + .3); sx = eBack(p); r += (1 - eOut3(p)) * TAU * 1.5; }
    if (style === 'drop') { const p = pr(t, a, a + .34); oy = -(1 - eBounce(p)) * 1100; }
    const wig = t > a + .3 ? (hash(F3, i, 5) - .5) * .035 : 0, wx = t > a + .3 ? (hash(F3, i, 6) - .5) * 6 : 0, wy = t > a + .3 ? (hash(F3, i, 8) - .5) * 5 : 0;
    g.save(); g.translate(x + ox + wx, y + oy + wy); g.rotate(r + wig); g.scale(sx, sx); g.globalAlpha = al; g.drawImage(c, -w / 2, -h / 2, w, h); g.restore();
  });
}

/* ---------- TITLE (plain fonts) ---------- */
function drawAnything(t) {
  const p = pr(t, 0, .2); if (t < 0.001) return;
  const s = lerp(2.5, 1, eOut5(p)), n = lerp(0, 24, eOut3(pr(t, 0, .3)));
  const size = fitSize(HEAVY, 'anything', 920);
  T(g, {
    text: 'anything', family: HEAVY, size, x: 540, y: 480, rot: lerp(-.2, -.06, eOut3(p)), sx: s, sy: s, alpha: cl(p * 5),
    fill: C.cream, stroke: C.ink, sw: 11, ext: { n, dx: 2.3, dy: 3.5, c: '#6a0f8a', c2: '#ff3d8f' },
    char: i => { const q = pr(t, .06 + i * .042, .06 + i * .042 + .1), b = q > 0 && q < 1 ? Math.sin(q * Math.PI) : 0; return { sc: 1 + .2 * b, dy: -16 * b, rot: (i % 2 ? 1 : -1) * .06 * b }; }
  });
}
function drawThat(t) {
  const p = pr(t, B.that, B.that + .16); if (p <= 0) return;
  const s = eElastic(p);
  g.save(); g.translate(190, 715); g.rotate(-.16 + (t > B.that + .1 ? (hash(F3, 3, 3) - .5) * .05 : 0)); g.scale(s, s);
  burst(0, 0, 175, 98, 13, F2 * .15); g.fillStyle = C.pink; g.fill(); g.lineWidth = 8; g.strokeStyle = C.ink; g.stroke();
  const size = fitSize(SERIF, 'that', 190, 'italic');
  T(g, { text: 'that', family: SERIF, style: 'italic', size, x: 0, y: 0, fill: C.cream, stroke: C.ink, sw: 9, ext: { n: 6, dx: 2, dy: 3, c: C.ink }, base: .3 });
  g.restore();
}
function drawShouldnt(t) {
  if (t < B.sh) return;
  const size = fitSize(HEAVY, 'shouldn’t', 930);
  T(g, {
    text: 'shouldn’t', family: HEAVY, size, x: 540, y: 935, rot: .045, fill: C.yellow, stroke: C.ink, sw: 12, ext: { n: 15, dx: -1.6, dy: 2.7, c: '#1b1fd0', c2: C.cobalt },
    char: (i) => {
      const q = pr(t, B.sh + i * .02, B.sh + i * .02 + .15); if (q <= 0) return { a: 0 };
      const land = t > B.sh + i * .02 + .15; const wob = land ? (hash(F3, i, 4) - .5) * 5 : 0;
      return { dy: -(1 - eBounce(q)) * 950 + wob, rot: (1 - q) * (hash(i, 2) - .5) * .9, sc: 1 + (1 - q) * .3 };
    }
  });
}
function reticle(cx, cy, w, h, p, col) {
  if (p <= 0) return;
  const ex = (1 - eOut3(p)) * 180, L = 54;
  g.save(); g.translate(cx, cy); g.rotate((1 - p) * .4); g.strokeStyle = col; g.lineWidth = 7; g.lineCap = 'square';
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => { const x = sx * (w / 2 + ex), y = sy * (h / 2 + ex); g.beginPath(); g.moveTo(x - sx * L, y); g.lineTo(x, y); g.lineTo(x, y - sy * L); g.stroke(); });
  g.lineWidth = 3; g.beginPath(); g.moveTo(-w / 2 - ex - 40, 0); g.lineTo(-w / 2 - ex + 4, 0); g.moveTo(w / 2 + ex - 4, 0); g.lineTo(w / 2 + ex + 40, 0); g.moveTo(0, -h / 2 - ex - 40); g.lineTo(0, -h / 2 - ex + 4); g.moveTo(0, h / 2 + ex - 4); g.lineTo(0, h / 2 + ex + 40); g.stroke();
  g.restore();
}
function drawLook(t) {
  const p = pr(t, B.look, B.look + .22); if (p <= 0) return;
  const size = fitSize(HEAVY, 'look', 560);
  const hold = t > B.look + .3 ? (hash(F3, 11, 1) - .5) * 5 : 0;
  T(g, {
    text: 'look', family: HEAVY, size, x: 350 + hold, y: 1262, rot: -.035, sx: lerp(.15, 1, eBack(p)), sy: lerp(1.6, 1, eOut3(p)), track: lerp(160, 0, eOut5(p)), alpha: cl(p * 6),
    fill: C.ink, stroke: '#efe6d0', sw: 0, ext: { n: 9, dx: 2.4, dy: 2.6, c: C.hot, c2: C.pink }
  });
  reticle(350, 1245, 560, 240, pr(t, B.look + .0, B.look + .18), C.hot);
  // 'locked' tick
  if (t > B.look + .13) { const b = hit(t, B.look + .13, 22); g.save(); g.globalAlpha = b; g.strokeStyle = C.hot; g.lineWidth = 5; g.strokeRect(350 - 310, 1245 - 140, 620, 280); g.restore(); }
}

function cursorArrow(x, y, s = 1.3) {
  g.save(); g.translate(x, y); g.scale(s, s); g.beginPath();
  [[0, 0], [0, 34], [9, 26], [15, 40], [22, 37], [16, 24], [28, 24]].forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath();
  g.fillStyle = C.white; g.fill(); g.lineWidth = 3.4; g.lineJoin = 'round'; g.strokeStyle = C.ink; g.stroke(); g.restore();
}

function sliceBlit(src, x, y, w, h, amp, seed, ox = 0, oy = 0) {
  let yy = 0, k = 0;
  while (yy < h) {
    const sh = Math.min(h - yy, 12 + Math.floor(hash(seed, k) * 44));
    const live = hash(seed, k, 9) > .4 ? 1 : .12;
    const dx = (hash(seed + F2, k, 3) - .5) * 2 * amp * live;
    g.drawImage(src, 0, yy, w, sh, x + dx + ox, y + yy + oy, w, sh); yy += sh; k++;
  }
}
function drawPolite(t) {
  const p = pr(t, B.pol, B.pol + .16); if (p <= 0) return;
  const drag = t > 1.30 ? eElastic(pr(t, 1.30, 1.62)) : 0, stretch = 1 + .13 * drag;
  const size = fitSize(SERIF, 'polite.', 770, 'italic');
  const cx = 540, cy = 1560, s0 = lerp(3.2, 1, eOut5(p));
  tx.clearRect(0, 0, W, 700);
  T(tx, { text: 'polite.', family: SERIF, style: 'italic', size, x: 540, y: 350, fill: C.cream, stroke: C.ink, sw: 15, ext: { n: 20, dx: 3, dy: 3.6, c: C.royal, c2: C.cobalt }, base: .3 });
  ts.clearRect(0, 0, W, 700); ts.globalCompositeOperation = 'source-over'; ts.drawImage(txc, 0, 0); ts.globalCompositeOperation = 'source-in';
  const amp = t < B.pol + .06 ? 0 : 5 + 70 * hit(t, B.pol + .06, 8);
  const rgb = t < B.pol + .06 ? 0 : 6 + 34 * hit(t, B.pol + .06, 7);
  g.save(); g.translate(cx, cy); g.rotate(lerp(.12, -.025, eOut3(p))); g.scale(s0 * stretch, s0); g.globalAlpha = cl(p * 6); g.translate(-540, -350);
  ts.fillStyle = C.cyan; ts.fillRect(0, 0, W, 700); sliceBlit(txs, 0, 0, W, 700, amp, 71, -rgb, 0);
  ts.globalCompositeOperation = 'source-over'; ts.clearRect(0, 0, W, 700); ts.drawImage(txc, 0, 0); ts.globalCompositeOperation = 'source-in'; ts.fillStyle = C.yellow; ts.fillRect(0, 0, W, 700); sliceBlit(txs, 0, 0, W, 700, amp, 72, rgb, rgb * .3);
  sliceBlit(txc, 0, 0, W, 700, amp, 73);
  g.restore();
  // selection box + handles + cursor (the designer is stretching it)
  const bp = pr(t, 1.28, 1.34);
  if (bp > 0) {
    const bw = 770 * stretch + 90, bh = 340, x0 = cx - bw / 2, y0 = cy - bh / 2 + 54;
    g.save(); g.strokeStyle = C.white; g.lineWidth = 3; g.setLineDash([12, 7]); g.lineDashOffset = -F2 * 3; g.strokeRect(x0, y0, bw, bh); g.setLineDash([]);
    g.strokeStyle = C.ink; g.lineWidth = 1.5; g.strokeRect(x0 - 2, y0 - 2, bw + 4, bh + 4);
    const hs = [[0, 0], [.5, 0], [1, 0], [1, .5], [1, 1], [.5, 1], [0, 1], [0, .5]];
    hs.forEach(([u, v], i) => { const q = popP(t, 1.28 + i * .008, .12); if (q <= 0) return; const sz = 26 * q; g.fillStyle = C.white; g.strokeStyle = C.ink; g.lineWidth = 4; g.fillRect(x0 + u * bw - sz / 2, y0 + v * bh - sz / 2, sz, sz); g.strokeRect(x0 + u * bw - sz / 2, y0 + v * bh - sz / 2, sz, sz); });
    // cursor
    const hx = x0 + bw, hy = y0 + bh / 2, cp = eOut3(pr(t, B.pol + .02, 1.3));
    cursorArrow(lerp(1010, hx + 4, cp), lerp(1300, hy + 6, cp));
    g.restore();
  }
  // crayon strike-through
  const sp = eInOut(pr(t, 1.40, 1.54)); if (sp > 0) { g.save(); scribbleDraw(TEX.scribC, sp, C.red, 9, 3); g.restore(); }
}

/* ---------- HUD micro-typography, barcode, marquees ---------- */
function layerHud(t) {
  const pa = pr(t, .04, .34);
  mono(scr('SYSTEM / POLITENESS_OVERFLOW', pa, 1), 58, 96, 19, C.cream, 'left');
  const hl = (txt, x, y, p) => { if (p <= 0) return; g.font = `800 17px ${MONO}`; const w = g.measureText(txt).width + 14; g.fillStyle = C.cream; g.fillRect(x - 6, y - 17, w * p, 24); g.save(); g.beginPath(); g.rect(x - 6, y - 17, w * p, 24); g.clip(); g.fillStyle = C.ink; g.textAlign = 'left'; g.fillText(txt, x, y); g.restore(); };
  hl('MANNERS ARE A RUMOUR.', 58, 136, pr(t, .12, .3)); hl('VOLUME IS A SPECTRUM.', 58, 168, pr(t, .18, .36)); hl('APOLOGIES NOT INCLUDED.', 58, 200, pr(t, .24, .42));
  // index counter (follows the word timings)
  const idx = 39 + (t >= B.that ? 1 : 0) + (t >= B.sh ? 1 : 0) + (t >= B.look ? 1 : 0) + (t >= B.pol ? 1 : 0);
  g.save(); g.translate(W - 58, 62); g.fillStyle = C.ink; g.strokeStyle = C.cream; g.lineWidth = 2; g.fillRect(-196, 0, 196, 38); g.strokeRect(-196, 0, 196, 38);
  g.restore(); mono(`[ WORD ${String(idx).padStart(3, '0')}/043 ]`, W - 66, 88, 17, C.cream, 'right', 1, false);
  mono(`T+${(T0 + t).toFixed(2)}s`, W - 58, 130, 19, C.yellow, 'right');
  // vertical rails
  g.save(); g.translate(46, 1010); g.rotate(-Math.PI / 2); mono('DO NOT SMOOTH — DO NOT SMOOTH — DO NOT SMOOTH', 0, 0, 16, C.cream, 'center', .85); g.restore();
  g.save(); g.translate(W - 46, 1010); g.rotate(Math.PI / 2); mono('DESIGNED TO OFFEND ✦ N°039—043 ✦ NOT FOR POLITE COMPANY', 0, 0, 16, C.cream, 'center', .85); g.restore();

  // barcode (wipes in)
  const bp = pr(t, 1.0, 1.22);
  if (bp > 0) {
    g.save(); g.translate(64, 1722); g.fillStyle = C.cream; g.fillRect(-8, -8, 290, 92); g.beginPath(); g.rect(-8, -8, 290 * bp, 92); g.clip();
    g.fillStyle = C.ink; TEX.bars.forEach(([x, w]) => g.fillRect(x, 0, w, 62)); g.restore();
    mono(scr('0 18330 19970 7', bp, 5), 72, 1802, 15, C.cream, 'left', 1, true);
  }

  // marquees
  const mq = (txt, y, speed, bg, fg, rot, size, p) => {
    if (p <= 0) return; g.save(); g.translate(W / 2, y); g.rotate(rot); g.scale(1, p);
    g.fillStyle = bg; g.fillRect(-900, -34, 1800, 68); g.font = `${size}px ${HEAVY}`; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillStyle = fg;
    const unit = g.measureText(txt).width; const off = -((t * speed) % unit);
    for (let x = -900 + off; x < 900; x += unit) g.fillText(txt, x, 3);
    g.restore();
  };
  mq('NOT SORRY ✦ TOO MUCH ✦ NEVER SMOOTH ✦ ', 1856, -820, C.yellow, C.ink, 0, 36, eOut3(pr(t, .2, .34)));
  mq('NO PERMISSION ✦ NO MANNERS ✦ NO MERCY ✦ ', 282, 760, C.ink, C.pink, -.03, 32, eOut3(pr(t, .3, .44)));
}

/* ---------- shockwaves + rays on the beats ---------- */
function layerImpacts(t) {
  [[B.any, 540, 480, .9], [B.sh, 540, 930, .6], [B.look, 350, 1245, .5], [B.pol, 540, 1570, 1.2]].forEach(([b, x, y, s]) => {
    const d = t - b; if (d < 0 || d > .3) return;
    const a = 1 - d / .3; g.save(); g.globalAlpha = a; g.strokeStyle = C.cream; g.lineWidth = 12 * a * s + 2; g.beginPath(); g.arc(x, y, d * 3200, 0, TAU); g.stroke(); g.restore();
  });
  const d = t - B.pol; if (d > 0 && d < .26) {
    const a = 1 - d / .26; g.save(); g.translate(540, 1570); g.strokeStyle = C.cream; g.lineWidth = 5; g.globalAlpha = a;
    for (let i = 0; i < 30; i++) { const ang = i / 30 * TAU + hash(i, 4) * .1, r0 = 330 + d * 1300, r1 = r0 + 160 + hash(i, 6) * 260; g.beginPath(); g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0); g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1); g.stroke(); }
    g.restore();
  }
}

/* ==================================================================
   FRAME
   ================================================================== */
const FLASH = { 0: ['#ffffff', .9], 1: ['#ff3d8f', .35], 23: ['#e9ff1f', .5], 30: ['#ffffff', .22], 37: ['#ffffff', 1], 38: ['#ff3d8f', .5] };
const INVERT = new Set([18, 20, 44]);

function glitchAmount(t) {
  return Math.max(hit(t, 0, 16) * .8, win(t, .50, .57) * .7, win(t, .60, .69) * 1, hit(t, B.sh, 14) * .55, hit(t, B.look, 16) * .45, hit(t, B.pol, 7) * 1.2, win(t, 1.5, 1.54) * .5);
}

function frame(t) {
  TT = t; FR = Math.round(t * FPS); F2 = Math.floor(FR / 2); F3 = Math.floor(FR / 3);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowColor = 'transparent'; g.setLineDash([]); g.lineCap = 'butt';
  g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
  const cam = camera(t);
  g.save(); g.translate(W / 2 + cam.sx, H / 2 + cam.sy); g.rotate(cam.rot); g.scale(cam.z, cam.z); g.translate(-W / 2, -H / 2);
  layerBase(t); layerCobalt(t); layerDiscs(t); layerLattice(t); layerStairsA(t); layerWire(t); layerStrips(t); layerIso(t); layerRails(t); layerChrome(t); layerPink(t);
  layerShapes(t); layerCutouts(t);
  drawAnything(t); drawThat(t); drawShouldnt(t); drawLook(t); drawPolite(t);
  layerImpacts(t); layerHud(t);
  g.restore();

  // ---- overlays (no camera)
  g.globalAlpha = 1; g.drawImage(TEX.vig, 0, 0);
  g.save(); g.globalAlpha = .9; g.fillStyle = TEX.scan; g.translate(0, (FR % 4)); g.fillRect(0, -4, W, H + 4); g.restore();
  if (INVERT.has(FR)) { g.globalCompositeOperation = 'difference'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'source-over'; }
  const f = FLASH[FR]; if (f) { g.globalAlpha = f[1]; g.fillStyle = f[0]; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  g.save(); g.globalAlpha = .42; g.translate(-Math.floor(hash(F2, 1) * 384), -Math.floor(hash(F2, 2) * 384)); g.fillStyle = TEX.grain; g.fillRect(0, 0, W + 384, H + 384); g.restore();

  post(t);
}

function post(t) {
  const gl = glitchAmount(t);
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1; out.globalCompositeOperation = 'source-over';
  if (gl < .06) { out.drawImage(sc, 0, 0); return; }
  // 1) horizontal slice tear
  sl.setTransform(1, 0, 0, 1, 0, 0); sl.globalCompositeOperation = 'source-over'; sl.drawImage(sc, 0, 0);
  const bands = 7 + Math.floor(gl * 7);
  for (let k = 0; k < bands; k++) {
    const y = Math.floor(hash(FR, k, 21) * H), h = 16 + Math.floor(hash(FR, k, 22) * 150 * gl), dx = (hash(FR, k, 23) - .5) * 2 * 150 * gl;
    sl.drawImage(sc, 0, y, W, h, dx, y, W, h);
  }
  // 2) chromatic split
  if (gl > .22) {
    const d = 4 + 22 * gl;
    fa.globalCompositeOperation = 'source-over'; fa.drawImage(slc, 0, 0); fa.globalCompositeOperation = 'multiply'; fa.fillStyle = '#ff0000'; fa.fillRect(0, 0, W, H);
    fb.globalCompositeOperation = 'source-over'; fb.drawImage(slc, 0, 0); fb.globalCompositeOperation = 'multiply'; fb.fillStyle = '#00ffff'; fb.fillRect(0, 0, W, H);
    out.fillStyle = '#000'; out.fillRect(0, 0, W, H); out.globalCompositeOperation = 'lighter';
    out.drawImage(fxA, -d, 0); out.drawImage(fxB, d, 0); out.globalCompositeOperation = 'source-over';
  } else out.drawImage(slc, 0, 0);
}

/* ==================================================================
   BOOT
   ================================================================== */
window.renderFrame = t => { frame(t); };
window.renderAudio = buildAudio();

const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
(async () => {
  try {
    const NC = window.NewspaperCutout;
    const myFonts = Promise.all([
      document.fonts.load(`100px "Archivo Black"`, 'anything').catch(() => {}),
      document.fonts.load(`italic 100px "Instrument Serif"`, 'polite.').catch(() => {}),
      document.fonts.load(`800 20px "JetBrains Mono"`, 'ABC').catch(() => {}),
    ]);
    await withTimeout(Promise.all([NC.ready(), myFonts]), 25000);
    buildTextures();
    await buildCutouts();
    frame(0);
    window.__reelReady = true;
    if (!RENDER) startPreview();
  } catch (e) { window.__reelError = String((e && e.stack) || e); console.error(window.__reelError); }
})();

function startPreview() {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); cv.style.transform = `scale(${k})`; cv.style.left = ((innerWidth - W * k) / 2) + 'px'; cv.style.top = ((innerHeight - H * k) / 2) + 'px'; };
  addEventListener('resize', fit); fit();
  document.getElementById('hint').style.display = 'block';
  let start = performance.now(), actx = null, src = null, bufP = null;
  const playSound = async () => {
    try {
      actx = actx || new AudioContext();
      if (!bufP) bufP = window.renderAudio().then(b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return actx.decodeAudioData(u.buffer); });
      const buf = await bufP; if (src) try { src.stop(); } catch (e) {} src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); src.start();
    } catch (e) { console.warn(e); }
  };
  addEventListener('click', () => { start = performance.now(); playSound(); });
  addEventListener('keydown', e => { if (e.code === 'Space') { start = performance.now(); playSound(); } });
  const loop = now => { const t = ((now - start) / 1000) % (DUR + .35); frame(Math.min(t, DUR - 1 / FPS)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}


})();
