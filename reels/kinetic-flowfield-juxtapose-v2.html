<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juxtapose — Kinetic Flowfield — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0d0d0d;transform-origin:0 0;isolation:isolate}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px}
/* preview player (normal browser only; never part of the video) */
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px 'JetBrains Mono',monospace;z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px 'JetBrains Mono',monospace;letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport"><canvas id="stage" width="1080" height="1920"></canvas></div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="6" step="0.0333333" value="0"><span id="pTime">f0</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   ENGINE  (same contract as the other reels)
   ===================================================================== */
const FPS=30, DURATION=6, FRAMES=DURATION*FPS;           // exactly 6 seconds
const REEL={width:1080,height:1920,fps:FPS,duration:DURATION,poster:5.4};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const ALLOW_FALLBACK=/[?&]allowfallback=1/.test(location.search);   // local testing only
const $=id=>document.getElementById(id);
const W=1080,H=1920,TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeInOutCubic=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOutExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

/* =====================================================================
   DESIGN  (from the Kinetic Flowfield tool: dark theme tokens, fonts, dot colour)
   ===================================================================== */
const BG='#0d0d0d', INK='#f0eee9', WHITE='#ffffff';
const DISPLAY='"Barlow Condensed","Arial Narrow",Impact,sans-serif';
const MONO='"JetBrains Mono",ui-monospace,monospace';

const WORDS=['FLOW','SPARK','WAVE'];                     // three words, one after another
const SEG_LEN=2;                                         // seconds per word
const CAPTION=['YOUR TEXT COULD','LOOK SO MUCH BETTER.'];
const WORD_CY=880;                                       // word centre (vertical)
const WORD_MAX_W=860;                                    // on-screen width of each word
const CAP_TOP=330, LINE_TOP=540, LINE_BOT=1560;          // caption block, divider extent
const HY=1380;                                           // handle resting height
const LABEL_Y=1230;
const HOME_X=W-60;                                       // divider starts at the right: all plain

/* the tool's defaults, at its own 800×400 preview scale */
const FX={turbulence:26,strength:26,fontSize:140};

/* =====================================================================
   PERLIN — copied verbatim from the Kinetic Flowfield tool
   ===================================================================== */
const Perlin={
  p:new Uint8Array(512),
  init:function(){
    const permutation=[151,160,137,91,90,15,
    131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
    190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,
    88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,
    77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,
    102,143,54,65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,
    135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,
    5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,
    223,183,170,213,119,248,152, 2,44,145,31,179,228,165,55,110,178,224,183,225,
    40,242,172,239,249,14,236,97,21,50,45,127,4,150,254,138,209,204,184,218,61,
    84,121,98,223,34,39,176,155,51,193,113,70,213,9,144,3,180,243,108,181,241,
    251,114,238,205,107,177,157,167,115,195,192,67,69,215,128,1,214,141,93,246,
    24,185,199,147,22,66,129,222,61,191,101,43,210,106,41,253,153,112,149,154,
    156,127,152,78,162,171,81,21,120,207,11,104,221,58,18,24,206,24,242,123];
    for(let i=0;i<256;i++){this.p[256+i]=this.p[i]=permutation[i%permutation.length];}
  },
  fade:function(t){return t*t*t*(t*(t*6-15)+10);},
  lerp:function(t,a,b){return a+t*(b-a);},
  grad:function(hash,x,y){
    const h=hash&7;
    const u=h<4?x:y;
    const v=h<4?y:x;
    return((h&1)===0?u:-u)+((h&2)===0?v:-v);
  },
  noise:function(x,y){
    const X=Math.floor(x)&255;
    const Y=Math.floor(y)&255;
    x-=Math.floor(x);
    y-=Math.floor(y);
    const u=this.fade(x);
    const v=this.fade(y);
    const A=this.p[X]+Y, B=this.p[X+1]+Y;
    return this.lerp(v,this.lerp(u,this.grad(this.p[A],x,y),
                                     this.grad(this.p[B],x-1,y)),
                        this.lerp(u,this.grad(this.p[A+1],x,y-1),
                                     this.grad(this.p[B+1],x-1,y-1)));
  }
};
Perlin.init();

/* =====================================================================
   LAYOUT — computed once per word after fonts are ready
   ===================================================================== */
const LAY=[];                                            // one entry per word
let CAP={size:100,lh:98};

function buildLayouts(){
  const probe=mkCanvas(8,8).getContext('2d');

  /* caption: the widest line fills 940 px, capped at 112 px */
  probe.font=`900 100px ${DISPLAY}`;
  let widest=1;CAPTION.forEach(s=>{widest=Math.max(widest,probe.measureText(s).width);});
  CAP.size=Math.min(112,Math.floor(100*940/widest));
  CAP.lh=Math.round(CAP.size*0.98);

  WORDS.forEach(word=>LAY.push(buildWordLayout(word,probe)));
}

function buildWordLayout(word,probe){
  const L={word};

  /* the word: sized so it spans WORD_MAX_W */
  probe.font=`900 100px ${DISPLAY}`;
  const size=Math.round(100*WORD_MAX_W/probe.measureText(word).width);
  probe.font=`900 ${size}px ${DISPLAY}`;
  const mm=probe.measureText(word);
  L.wordSize=size;
  L.wordX=W/2-mm.width/2;
  L.asc=mm.actualBoundingBoxAscent;
  L.wordY=WORD_CY+L.asc/2;                               // optical centre on cap height

  /* flowfield parameters, scaled from the tool's 140 px reference to this size */
  const k=size/FX.fontSize;
  L.strength=FX.strength*k;                              // max displacement in px
  L.step=Math.max(2,Math.round(2*k));                    // sample grid (tool: round(2·scale))
  L.dotR=Math.max(0.75,k);                               // dot radius (tool: max(0.75, scale))
  L.noiseScale=(0.002*(FX.turbulence/20))/k;

  /* sample points: grid positions (same grid as the tool) that fall inside the word */
  const cv=mkCanvas(W,H),c=cv.getContext('2d',{willReadFrequently:true});
  c.font=`900 ${size}px ${DISPLAY}`;
  c.fillStyle='#fff';c.textBaseline='alphabetic';
  c.fillText(word,L.wordX,L.wordY);
  const d=c.getImageData(0,0,W,H).data;
  const pts=[];
  for(let y=0;y<H;y+=L.step){
    for(let x=0;x<W;x+=L.step){
      if(d[(y*W+x)*4+3]>0)pts.push(x,y);
    }
  }
  L.pts=Float32Array.from(pts);
  return L;
}

/* =====================================================================
   TIMELINE — each word gets a 2 s slot. Local time u runs 0 → 2 inside a slot.
   ===================================================================== */
const PRESS_U=0.5;                                       // cursor grabs the divider
const DRAG_START=0.6, DRAG_END=1.7;                      // the automatic drag
const CURSOR_IN=0.05, CURSOR_OUT=1.7;
const P_ENTER=[1240,1830], C_ENTER=[1190,1420];          // cursor entry curve (tip at handle)
const C_EXIT=[760,1520];
/* [start, end, fromX, toX] inside a slot — eased drags, with short holds */
const SEG=[
  [DRAG_START,1.25,HOME_X,230],
  [1.25,1.35,230,230],
  [1.35,DRAG_END,230,540],
];

function splitAtU(u){
  if(u<=DRAG_START)return HOME_X;
  for(const [a,b,from,to] of SEG){
    if(u<=b){
      const p=easeInOutCubic(clamp((u-a)/(b-a)));
      return lerp(from,to,p);
    }
  }
  return 540;
}
function wobbleU(u){
  const p=clamp((u-DRAG_START)/(DRAG_END-DRAG_START));
  return 34*Math.sin(Math.PI*p);                         // the hand travels in a gentle arc
}
function handlePosU(u){
  const y=HY+((u>=DRAG_START&&u<=DRAG_END)?wobbleU(u):0);
  return {x:splitAtU(u),y};
}
function bez(p0,p1,p2,p){
  const q=1-p;
  return {x:q*q*p0[0]+2*q*p*p1[0]+p*p*p2[0], y:q*q*p0[1]+2*q*p*p1[1]+p*p*p2[1]};
}
function cursorStateU(u){
  if(u<CURSOR_IN||u>=CURSOR_OUT+0.3)return null;
  let pos, alpha=1;
  if(u<PRESS_U){
    pos=bez(P_ENTER,C_ENTER,[HOME_X,HY],easeOutCubic(clamp((u-CURSOR_IN)/(PRESS_U-CURSOR_IN))));
  }else if(u<=CURSOR_OUT){
    pos=handlePosU(u);                                   // tip sits on the handle
  }else{
    pos=bez([540,HY],C_EXIT,P_ENTER,easeInOutCubic(clamp((u-CURSOR_OUT)/0.3)));
    alpha=1-clamp((u-CURSOR_OUT-0.1)/0.2);
  }
  return {x:pos.x,y:pos.y,alpha};
}

/* =====================================================================
   DRAWING
   ===================================================================== */
const stage=$('stage'),sc=stage.getContext('2d');
function frameIndex(t){return clamp(Math.floor(t*FPS+.001),0,FRAMES-1);}

/* caption: always visible at the top; each line rises out of a mask */
function drawCaption(c,tt){
  c.save();
  c.font=`900 ${CAP.size}px ${DISPLAY}`;
  c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';
  CAPTION.forEach((s,i)=>{
    const p=easeOutExpo(clamp((tt-0.1-i*0.1)/0.8));
    const yc=CAP_TOP+i*CAP.lh;
    c.save();
    c.beginPath();c.rect(0,yc-CAP.lh/2,W,CAP.lh);c.clip();
    c.fillText(s,W/2,yc+(1-p)*CAP.lh*0.9);
    c.restore();
  });
  c.restore();
}

/* plain white word: rises out of a mask */
function drawPlain(c,L,p){
  c.save();
  c.font=`900 ${L.wordSize}px ${DISPLAY}`;
  c.fillStyle=WHITE;c.textBaseline='alphabetic';
  const top=L.wordY-L.asc, bottom=L.wordY+L.asc*0.1;
  const h=(bottom-top)*p;
  c.beginPath();c.rect(0,bottom-h,W,H);c.clip();
  c.fillText(L.word,L.wordX,L.wordY+(1-p)*90);
  c.restore();
}

/* the real flowfield, sampled from the word and displaced along the noise field */
function drawFlow(c,L,split,tt){
  const pts=L.pts, ns=L.noiseScale, R=L.dotR;
  const off=tt*0.12;                                     // slow drift: the field keeps moving
  const strength=L.strength*(0.85+0.15*Math.sin(TAU*tt/5));
  const stepDist=strength/8;
  const minX=split-strength-6;
  c.fillStyle=WHITE;
  c.beginPath();
  for(let i=0;i<pts.length;i+=2){
    const x=pts[i],y=pts[i+1];
    if(x<minX)continue;
    let px=x,py=y;
    for(let s=0;s<8;s++){
      const a=Perlin.noise(px*ns+off,py*ns-off*0.6)*Math.PI*4;
      px+=Math.cos(a)*stepDist;
      py+=Math.sin(a)*stepDist;
    }
    c.moveTo(px+R,py);
    c.arc(px,py,R,0,TAU);
  }
  c.fill();
}

function label(c,txt,x,y,align,alpha){
  c.save();
  c.font=`500 28px ${MONO}`;
  if('letterSpacing' in c)c.letterSpacing='6px';
  c.textAlign=align;c.textBaseline='middle';
  c.fillStyle=`rgba(240,238,233,${alpha})`;
  c.fillText(txt,x,y);
  c.restore();
}

function drawDivider(c,x){
  c.save();
  c.fillStyle=WHITE;
  c.shadowColor='rgba(255,255,255,0.45)';c.shadowBlur=18;
  c.fillRect(x-1.5,LINE_TOP,3,LINE_BOT-LINE_TOP);
  c.restore();
}

function drawHandle(c,x,y,scale){
  c.save();
  c.translate(x,y);c.scale(scale,scale);
  c.shadowColor='rgba(0,0,0,0.55)';c.shadowBlur=26;c.shadowOffsetY=6;
  c.fillStyle=WHITE;
  c.beginPath();c.arc(0,0,40,0,TAU);c.fill();
  c.shadowColor='transparent';
  c.strokeStyle=BG;c.lineWidth=4;c.lineCap='round';c.lineJoin='round';
  c.beginPath();
  c.moveTo(-7,-11);c.lineTo(-16,0);c.lineTo(-7,11);
  c.moveTo(7,-11);c.lineTo(16,0);c.lineTo(7,11);
  c.stroke();
  c.restore();
}

function drawRipple(c,u,u0,x,y){
  const d=(u-u0)/0.4;
  if(d<0||d>1)return;
  c.save();
  c.globalAlpha=0.5*(1-d);
  c.strokeStyle=WHITE;c.lineWidth=3;
  c.beginPath();c.arc(x,y,40+70*easeOutCubic(d),0,TAU);c.stroke();
  c.restore();
}

function drawCursor(c,x,y,alpha){
  c.save();
  c.globalAlpha=alpha;
  c.translate(x,y);c.scale(1.7,1.7);
  c.beginPath();
  c.moveTo(0,0);c.lineTo(0,17);c.lineTo(4.5,13);c.lineTo(8,20.5);
  c.lineTo(11,19);c.lineTo(7.5,12);c.lineTo(13,12);c.closePath();
  c.fillStyle=WHITE;c.strokeStyle='#000';c.lineWidth=0.9;c.lineJoin='round';
  c.fill();c.stroke();
  c.restore();
}

function drawFooter(c,tt){
  const a=clamp((tt-0.3)/0.4)*0.6;
  c.save();
  c.font=`500 24px ${MONO}`;
  if('letterSpacing' in c)c.letterSpacing='5px';
  c.textAlign='center';c.textBaseline='middle';
  c.fillStyle=`rgba(240,238,233,${a})`;
  c.fillText('KINETIC FLOWFIELD TEXT EFFECT MAKER',W/2,1500);
  c.fillStyle=`rgba(240,238,233,${a*0.8})`;
  c.fillText('CALLISTRA.DESIGN',W/2,1538);
  c.restore();
}

/* =====================================================================
   FRAME — a pure function of t
   No grain: per-frame random noise is what made the encoded video huge.
   ===================================================================== */
function renderFrame(t){
  const f=frameIndex(t), tt=f/FPS;
  const slot=clamp(Math.floor(tt/SEG_LEN+1e-9),0,WORDS.length-1);
  const u=tt-slot*SEG_LEN;                               // local time inside this word's slot
  const L=LAY[slot];

  sc.setTransform(1,0,0,1,0,0);sc.globalAlpha=1;sc.filter='none';
  sc.shadowColor='transparent';sc.shadowBlur=0;sc.shadowOffsetY=0;
  sc.fillStyle=BG;sc.fillRect(0,0,W,H);

  const split=splitAtU(u);

  /* caption: always on */
  drawCaption(sc,tt);

  /* plain side (left of the divider) */
  sc.save();
  sc.beginPath();sc.rect(0,0,split,H);sc.clip();
  drawPlain(sc,L,easeOutExpo(clamp(u/0.35)));
  label(sc,'PLAIN',90,LABEL_Y,'left',0.55);
  sc.restore();

  /* transformed side (right of the divider) */
  if(split<W){
    sc.save();
    sc.beginPath();sc.rect(split,0,W-split,H);sc.clip();
    drawFlow(sc,L,split,u);
    label(sc,'KINETIC FLOWFIELD',990,LABEL_Y,'right',0.55);
    sc.restore();
  }

  drawFooter(sc,tt);

  /* the divider, its handle, and the hand that drags it */
  const h=handlePosU(u);
  drawDivider(sc,split);
  const pressed=u>=PRESS_U&&u<=DRAG_END+0.2;
  drawRipple(sc,u,PRESS_U,HOME_X,HY);
  drawRipple(sc,u,DRAG_END,540,HY);
  drawHandle(sc,h.x,h.y,pressed?0.86:1);

  const cur=cursorStateU(u);
  if(cur)drawCursor(sc,cur.x,cur.y,cur.alpha);

  drawVignette(sc);

  /* fade to black over the last 0.4 s */
  const fade=clamp((tt-(DURATION-0.4))/0.4);
  if(fade>0){sc.save();sc.globalAlpha=fade;sc.fillStyle='#000';sc.fillRect(0,0,W,H);sc.restore();}
}
function drawVignette(c){
  const g=c.createRadialGradient(W/2,H/2,380,W/2,H/2,1150);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.6)');
  c.save();c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
}
window.renderFrame=renderFrame;

/* =====================================================================
   SOUND — synthesised offline, on the same timeline as the visuals.
   Per word: a whoosh on entry, a click on grab, a tick per drag step,
   a release click, a soft ping. A chime closes the last word.
   ===================================================================== */
async function buildAudio(){
  const SR=44100,DUR=REEL.duration;
  const oc=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const rand=mulberry32(11);
  const nb=oc.createBuffer(1,SR*2,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rand()*2-1;}
  const master=oc.createGain();
  master.gain.setValueAtTime(.7,0);master.gain.setValueAtTime(.7,DUR-.4);master.gain.linearRampToValueAtTime(0,DUR-.01);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=8;comp.attack.value=.002;comp.release.value=.12;
  master.connect(comp);comp.connect(oc.destination);
  const rl=Math.floor(SR*1.2),ir=oc.createBuffer(2,rl,SR);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rand()*2-1)*Math.pow(1-i/rl,3);}
  const conv=oc.createConvolver();conv.buffer=ir;const rv=oc.createGain();rv.gain.value=.4;conv.connect(rv);rv.connect(master);
  const out=(g,rev=0)=>{g.connect(master);if(rev>0){const s=oc.createGain();s.gain.value=rev;g.connect(s);s.connect(conv);}};
  const env=(p,t,peak,a,d)=>{p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(peak,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);};
  const osc=(type,f,t,dur)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;};
  const burst=(t,f,peak,rev=0)=>{
    const n=oc.createBufferSource();n.buffer=nb;
    const bp=oc.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
    const g=oc.createGain();env(g.gain,t,peak,.001,.03);
    n.connect(bp);bp.connect(g);out(g,rev);n.start(t,0,.08);
  };
  const tick=(t,f,peak)=>{const o=osc('sine',f,t,.09),g=oc.createGain();env(g.gain,t,peak,.002,.05);o.connect(g);out(g,.06);};

  WORDS.forEach((_,i)=>{
    const s=i*SEG_LEN;

    /* entry whoosh: an airy sweep as each word arrives */
    {const n=oc.createBufferSource();n.buffer=nb;n.loop=true;n.start(s);n.stop(s+.8);
     const bp=oc.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.5;
     bp.frequency.setValueAtTime(300,s);bp.frequency.exponentialRampToValueAtTime(2600,s+.7);
     const g=oc.createGain();g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.06,s+.5);g.gain.linearRampToValueAtTime(0,s+.8);
     n.connect(bp);bp.connect(g);out(g,.15);}

    /* the grab */
    burst(s+PRESS_U,2400,.22,.1);
    tick(s+PRESS_U,740,.1);

    /* a tick per drag step, soft, one every 0.12 s */
    for(let t=s+DRAG_START+.1;t<s+DRAG_END-.05;t+=.12){tick(t,1500,.045);}

    /* release + soft ping */
    burst(s+DRAG_END,1800,.16,.1);
    tick(s+DRAG_END,520,.1);
  });

  /* closing chime on the last word's settle (E5 · B5 · E6 with overtones) */
  const T=(WORDS.length-1)*SEG_LEN+DRAG_END+.15;
  [[659.25,0],[987.77,.08],[1318.5,.16]].forEach(([f,d])=>{
    [[1,.14],[2,.04],[3,.015]].forEach(([m,a])=>{
      const o=osc('sine',f*m,T+d,.9),g=oc.createGain();
      env(g.gain,T+d,a,.004,.55);o.connect(g);out(g,.5);
    });
  });
  return oc.startRendering();
}
let audioP=null;const getAudio=()=>audioP||(audioP=buildAudio());
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate;
  const data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=peak>.78?.78/peak:1;                         // peak below −2 dBFS
  const ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';
  for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER (normal browser only) + BOOT
   ===================================================================== */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent='f'+frameIndex(t)+' · '+t.toFixed(2)+'s';};
  function loop(){
    if(!playing)return;
    cur=base+(performance.now()-started)/1000;
    if(cur>=REEL.duration){show(REEL.duration);pause();btn.textContent='REPLAY';cur=0;return;}
    show(cur);requestAnimationFrame(loop);
  }
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){
    btn.textContent='PREPARING SOUND…';
    if(!buf)buf=await getAudio();
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);
    base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();
  }
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}

async function boot(){
  try{
    const wait=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
    await wait(Promise.all([
      document.fonts.load('900 100px "Barlow Condensed"'),
      document.fonts.load('500 28px "JetBrains Mono"'),
      document.fonts.load('700 28px "JetBrains Mono"')
    ]),15000);
    await document.fonts.ready;
    if(!ALLOW_FALLBACK&&!document.fonts.check('900 100px "Barlow Condensed"'))throw new Error('Barlow Condensed failed to load');
    buildLayouts();
    renderFrame(0);
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.message||e);console.error(e);}
}
boot();
})();
