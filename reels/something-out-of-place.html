/* =====================================================================
   NEWSPAPER CUTOUT API  v1.0
   Code-only version of "Newspaper Cutout Studio" (same engine, no UI).
   Single self-contained file. No dependencies. Browser only (uses <canvas>).

   ---------------------------------------------------------------------
   QUICK START  (paste this file inside a <script> tag in your HTML)
   ---------------------------------------------------------------------
     <canvas id="poster" width="1200" height="1600"></canvas>
     <script>
       // ...this whole file here...
       (async () => {
         await NewspaperCutout.ready();            // loads the Google Fonts once
         const ctx = document.getElementById('poster').getContext('2d');

         // draw a cutout title straight onto your own poster canvas:
         NewspaperCutout.drawTo(ctx, { text: 'BREAKING', preset: 'Punk Cover', seed: 42 },
                                { x: 600, y: 300, width: 900, anchor: 'center', rotate: -0.08 });
       })();
     <\/script>

   ---------------------------------------------------------------------
   FUNCTIONS
   ---------------------------------------------------------------------
   NewspaperCutout.ready()                 -> Promise. Loads fonts. Await it ONCE before rendering.
   NewspaperCutout.render(opts)            -> HTMLCanvasElement (transparent PNG-like, auto-cropped). Sync.
   NewspaperCutout.renderAsync(opts)       -> Promise<canvas> (awaits ready() for you).
   NewspaperCutout.toDataURL(opts)         -> Promise<string>  e.g. img.src = await ...toDataURL(opts)
   NewspaperCutout.toBlob(opts)            -> Promise<Blob>    (PNG)
   NewspaperCutout.toImage(opts)           -> Promise<HTMLImageElement>
   NewspaperCutout.mount(element, opts)    -> Promise<canvas>  appends the result into a DOM element
   NewspaperCutout.drawTo(ctx, opts, place)-> draws onto YOUR canvas context (best for posters).
          place = { x, y, width, height, anchor: 'topleft'|'center', rotate: radians, alpha: 0..1 }
          give width OR height (the other keeps aspect ratio). Returns {width,height} actually drawn.
   NewspaperCutout.loadCustomFont(urlOrArrayBuffer, name?) -> Promise. Then use font:'custom' (see overrides)
                                           and it joins the Mixed Fonts pool.
   NewspaperCutout.randomSeed()            -> number
   NewspaperCutout.config({ injectFonts:false }) -> call BEFORE ready() if your page already loads
                                           the fonts itself (see FONT LIST at bottom).
   Lists: NewspaperCutout.presets, .palettes, .styles, .fonts, .stocks, .types, .formats

   ---------------------------------------------------------------------
   OPTIONS  (every option is optional)
   ---------------------------------------------------------------------
   text         'Cutout'   Text to render. Use \n for new lines.
   type         'letters'  'letters' (ransom letters) | 'words' (word scraps) |
                           'strip' (headline strip, one strip per line) | 'collage' (torn headline collage)
   preset       null       'Punk Cover' | 'Xerox Zine' | 'Crime Headline' | 'Riso Poster' |
                           'Receipt' | 'Classified' | 'Pop Comic'   (your own options override the preset)
   seed         7          Number. Same seed + same options = identical result every time. 'random' ok.
   shape        55         0-100  Shape randomness (how torn/uneven the scraps are)
   halftone     45         0-100  Halftone print texture
   mismatch     40         0-100  Baseline mismatch (jumping / rotated letters)
   style        'clean'    'clean' | 'classified' | 'xerox' | 'riso' | 'letterpress' | 'redacted' | 'thermal' | 'comic'
   palette      'mix'      'mix' | 'vivid' | 'news' | 'punk' | 'dada' | 'soft' | 'neon' | 'single'
                           (giving paper or ink without a palette switches to 'single' automatically)
   paper        '#ece5d3'  Paper colour   (used with palette 'single')
   ink          '#17150f'  Ink colour     (used with palette 'single')
   randomCase   true       Random upper/lower case per letter
   mixedFonts   true       Random font per letter. false = Barlow Condensed (or your custom font)
   tape         false      Tape pieces on scraps
   staple       false      Staples on scraps
   size         140        30-250. Upper limit of letter size (it still auto-fits the canvas)
   shadow       55         0-100  Paper drop shadow
   stock        'mag'      'news' (thin newsprint) | 'mag' | 'card' (thick cardboard) | 'gloss'
   tearH        50         0-100  Tear on top/bottom edges
   tearV        50         0-100  Tear on side edges
   fibers       0          0-100  Edge fibres
   age          0          0-100  Paper age & stains
   folds        0          0-100  Fold lines
   bleed        0          0-100  Ink bleed
   dropout      0          0-100  Ink dropout (worn print)
   smear        0          0-100  Ink smear

   OUTPUT SIZE
   scale        2          Pixel multiplier (1,2,4,8...). Capped at 12.
   width        null       Exact output width in px  (overrides scale; keeps aspect ratio)
   height       null       Exact output height in px (overrides scale; keeps aspect ratio)
   crop         true       Auto-crop transparent edges (like the app's PNG export)
   padding      0          Transparent px added around the cropped result

   PER-LETTER CONTROL  (type 'letters' only)
   overrides    {}         Keyed by the character position in `text` (0 = first char, spaces and \n count).
        { 0: { font:'anton', case:'upper', ink:'#fff', paper:'#e11', rotate:-8, scale:130,
               dx:10, dy:-6, z:1, seed:3, shape:80, halftone:20, mismatch:0 },
          3: { font:'abril' } }
        font  = one of NewspaperCutout.fonts (e.g. 'anton','bebas','abril','alfa','playfair','custom'...)
        case  = 'upper' | 'lower'          rotate = degrees        scale = percent (30-300)
        dx/dy = nudge in px at base size   z = layer (+ front / - back)

   POSTER MODE  (optional; usually you will compose the poster yourself with drawTo)
   format       'free'     'free' (cutout only) | 'poster' (4:5) | 'square' | 'story' (9:16) | 'banner' (16:9)
   backdrop     'news'     'news' | 'cream' | 'kraft' | 'black' | 'pink' | 'cobalt'
   scraps       50         0-100 loose decorative scraps
   wall         false      Draw the poster framed on a wall
   (in poster mode the canvas is NOT cropped and scale is capped at 4)

   ---------------------------------------------------------------------
   EXAMPLES
   ---------------------------------------------------------------------
   // 1) <img> from code
   const img = await NewspaperCutout.toImage({ text:'SALE', preset:'Riso Poster', seed:11, width:800 });
   document.body.appendChild(img);

   // 2) Different title lines in one poster
   await NewspaperCutout.ready();
   NewspaperCutout.drawTo(ctx, { text:'MIDNIGHT', type:'letters', seed:5, palette:'punk' },
                          { x:600, y:260, width:1000, anchor:'center' });
   NewspaperCutout.drawTo(ctx, { text:'live at the old mill', type:'strip', style:'letterpress', seed:9 },
                          { x:600, y:520, width:700, anchor:'center', rotate:0.05 });

   // 3) Per-letter edit
   NewspaperCutout.mount(document.getElementById('title'), {
     text:'HELLO', overrides:{ 0:{ ink:'#ffffff', paper:'#e11d1d', rotate:-6 }, 4:{ font:'abril' } }
   });

   // 4) Single colour, thick cardboard, taped
   NewspaperCutout.toDataURL({ text:'Cardboard', palette:'single', paper:'#c9a46b', ink:'#2b1d0d',
                               stock:'card', tape:true, scale:3 }).then(url => el.src = url);

   NOTES
   - Needs internet the first time (fonts come from Google Fonts). Await ready() first;
     if you render before fonts load, letters would use fallback fonts.
   - Rendering is deterministic: keep your seed to keep your design stable.
   - Each render is CPU-heavy (a few ms to a few hundred ms). Render once, then reuse the
     canvas / dataURL instead of re-rendering every frame.

   FONT LIST (if you set config({injectFonts:false}) load these yourself):
   Barlow Condensed 900, JetBrains Mono 700, Abril Fatface, Alfa Slab One, Anton, Bebas Neue,
   Chivo 900, Courier Prime 700, DM Serif Display, Libre Baskerville 700, Old Standard TT 700 (+italic),
   Oswald 700, Playfair Display 900 (+italic), Special Elite.
   ===================================================================== */

const DADA = [['#d9c7a0', '#2b2116'], ['#e6d8b8', '#3a2a17'], ['#c9b48a', '#1f160c'], ['#efe3c6', '#5a3a1c'], ['#b99f73', '#1a120a']];

const PALETTES = {
    mix: [...CREAM, ...INKED, ...COLOURED],
    vivid: [...COLOURED, ...INKED],
    news: [...CREAM, ['#17171a', '#efe7d6']],

/* ============================================================
   RANDOM + COLOR HELPERS
   ============================================================ */

    'Receipt': { shape: 10, halftone: 20, mismatch: 10, palette: 'news', style: 'thermal', tape: 0, staple: 0 },
    'Classified': { shape: 40, halftone: 30, mismatch: 30, palette: 'news', style: 'redacted', tape: 0, staple: 1 },

    text: 'Cutout', type: 'letters', seed: 7, shape: 55, halftone: 45, mismatch: 40,
    style: 'clean', palette: 'mix', paper: '#ece5d3', ink: '#17150f',
    randomCase: true, mixedFonts: true, tape: false, staple: false,
    size: 140, shadow: 55, stock: 'mag',

   ============================================================ */
