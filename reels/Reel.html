<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinetic Flowfield Text Effect Maker — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--ink:#121212;--muted:#736e65;--line:rgba(18,18,18,.15);--chk1:#efece6;--chk2:#ffffff;--serif:'Barlow Condensed',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;isolation:isolate}
#viewport>*{position:absolute;left:0;top:0}
#ui{width:1080px;height:1920px;background:var(--bg);display:none;z-index:1;overflow:hidden;font-family:var(--mono);color:var(--ink)}
#stage,#grain{width:1080px;height:1920px}
#stage{z-index:2}
#grain{z-index:3;mix-blend-mode:overlay;opacity:.10;pointer-events:none}
#vig{z-index:4;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(120% 85% at 50% 46%,rgba(0,0,0,0) 58%,rgba(0,0,0,.16) 100%)}

/* ---- UI scene: mirrors the app's own markup + styling, scaled for a phone ---- */
#uiCam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:510px 330px}
#uiInner{position:absolute;left:110px;top:0;width:800px;padding-top:340px}
.canvas-container{position:relative;width:800px;height:400px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:24px 24px;border-radius:3px;overflow:hidden}
.canvas-container canvas{width:100%;height:100%;display:block}
.text-input{margin-top:24px;height:100px;border-bottom:2px solid var(--ink);font-family:var(--serif);font-weight:900;font-size:104px;line-height:1.1;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center}
.text-input .sel{background:rgba(36,110,255,.30)}
#uiCaret{display:inline-block;width:4px;height:68px;background:var(--ink);margin-left:3px}
.row{margin-top:24px}
.row-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab{display:flex;align-items:center;gap:12px}
.lab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.85;flex-shrink:0}
.val{color:var(--ink);font-size:24px;letter-spacing:0;border-bottom:2px dashed var(--muted);min-width:56px;text-align:right}
.track{position:relative;height:3px;background:var(--line);margin:26px 0 8px}
.thumb{position:absolute;top:50%;left:0;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.adv{margin-top:30px;border-top:2px solid var(--line);padding-top:20px}
.sum{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.adv-body{overflow:hidden;height:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 34px;padding-top:24px;padding-bottom:4px}
.color-sel{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);padding:10px 0 8px;margin-top:12px}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#000}
.dd{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:14px 0 10px;border-bottom:2px solid var(--line);font-family:var(--mono);font-size:22px;color:var(--ink)}
.btn{margin-top:30px;height:88px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--mono);font-weight:500;font-size:23px;letter-spacing:.12em;border-radius:2px}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
#cursor{position:absolute;left:0;top:0;width:60px;height:60px;z-index:50;pointer-events:none;transform-origin:10px 5px;opacity:0;filter:drop-shadow(0 5px 6px rgba(0,0,0,.28))}
.ripple{position:absolute;width:96px;height:96px;border:4px solid var(--ink);border-radius:50%;opacity:0;z-index:49;pointer-events:none}
#capMask{position:absolute;left:0;top:0;width:1080px;height:336px;background:var(--bg);z-index:5}
#cap{position:absolute;left:110px;top:236px;width:800px;height:92px;overflow:hidden}
.capl{position:absolute;left:0;top:0;height:92px;display:flex;align-items:center;gap:22px;font-family:var(--serif);font-style:normal;font-weight:900;font-size:76px;line-height:92px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.capl b{font-family:var(--mono);font-style:normal;font-weight:500;font-size:26px;color:var(--muted);letter-spacing:.1em}
#toast{position:absolute;left:130px;top:760px;width:780px;height:220px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:34px;padding:26px;border-radius:4px;opacity:0;z-index:20;box-shadow:0 30px 80px rgba(0,0,0,.32)}
#toastCv{width:320px;height:160px;flex-shrink:0;border-radius:2px;background-color:#fff;background-image:conic-gradient(var(--chk1) .25turn,var(--chk2) .25turn .5turn,var(--chk1) .5turn .75turn,var(--chk2) .75turn);background-size:22px 22px}
#toast .tt{display:flex;flex-direction:column;gap:12px;font-family:var(--mono)}
#toast .tt b{font-size:21px;white-space:nowrap;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#toast .tt span{font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#a29d93}

/* ---- preview player (normal browser only; never part of the video) ---- */
#player{position:fixed;left:0;right:0;bottom:0;height:64px;background:#111;color:#eee;display:flex;align-items:center;gap:12px;padding:0 14px;font:500 13px var(--mono);z-index:99}
#player button{background:#eee;color:#111;border:0;border-radius:4px;padding:10px 14px;font:700 13px var(--mono);letter-spacing:.06em}
#player input{flex:1}
</style>
</head>
<body>
<div id="viewport">
  <div id="ui">
    <div id="uiCam">
      <div id="uiInner">
        <div class="canvas-container"><canvas id="uiCanvas" width="1200" height="600"></canvas></div>
        <div class="text-input" id="uiTextBox"><span id="uiTxt"></span><i id="uiCaret"></i></div>

        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>Turbulence</span>
            <span class="val" id="vTurb">26%</span>
          </div>
          <div class="track" id="trkTurb"><i class="thumb" id="thTurb"></i></div>
        </div>

        <div class="row">
          <div class="row-h">
            <span class="lab"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Current Strength</span>
            <span class="val" id="vStr">26px</span>
          </div>
          <div class="track" id="trkStr"><i class="thumb" id="thStr"></i></div>
        </div>

        <div class="adv">
          <div class="sum" id="advSum"><span>Color and Size</span><span id="advSign">＋</span></div>
          <div class="adv-body" id="advBody"><div class="grid">
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Size</span><span class="val" id="vSize">140px</span></div>
              <div class="track" id="trkSize"><i class="thumb" id="thSize"></i></div>
            </div>
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>Color</span></div>
              <div class="color-sel"><i class="swatch" id="swatch"></i><span class="val" id="vColor" style="border:0;font-size:22px">#000000</span></div>
            </div>
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Custom Font</span></div>
              <div class="dd"><span>Upload Font</span></div>
            </div>
            <div>
              <div class="row-h"><span class="lab"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Export Size</span></div>
              <div class="dd" id="ddExp"><span id="vExp">4x</span><span style="color:var(--muted)">▾</span></div>
            </div>
          </div></div>
        </div>

        <div class="btn" id="btn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span id="btnLabel">DOWNLOAD PNG</span></div>

        <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.2 20.4 L11.3 13.7 L17.5 13.4 Z" fill="#fff" stroke="#121212" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="capMask"><div id="cap">
      <div class="capl"><b>01</b><span>Type anything</span></div>
      <div class="capl"><b>02</b><span>Tune the turbulence</span></div>
      <div class="capl"><b>03</b><span>Push the current</span></div>
      <div class="capl"><b>04</b><span>Find your flow</span></div>
      <div class="capl"><b>05</b><span>Choose color &amp; size</span></div>
      <div class="capl"><b>06</b><span>Download your PNG</span></div>
    </div></div>
    <div id="toast"><canvas id="toastCv" width="320" height="160"></canvas><div class="tt"><b>kinetic-flowfield-8x.png</b><span>Transparent PNG · Ready</span></div></div>
  </div>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<div id="player" hidden><button id="pBtn">PLAY</button><input id="pRange" type="range" min="0" max="24" step="0.01" value="0"><span id="pTime">0.0s</span></div>

<script>
(function(){
'use strict';

/* =====================================================================
   ENGINE  (reusable)
   ===================================================================== */
const REEL={width:1080,height:1920,fps:30,duration:24,poster:.9};
window.REEL=REEL;
const RENDER=/[?&]render=1/.test(location.search);
const $=id=>document.getElementById(id);
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const EASE={
  lin:p=>p,i2:p=>p*p,i3:p=>p*p*p,o2:p=>1-(1-p)*(1-p),o3:p=>1-Math.pow(1-p,3),
  io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oexp:p=>p>=1?1:1-Math.pow(2,-10*p),
  oback:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
};
const prog=(t,s,d,e='lin')=>EASE[e](clamp((t-s)/d));
function kf(t,pts){
  if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){
    if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*EASE[b[2]||'io3']((t-a[0])/(b[0]-a[0]));}
  }
  return pts[pts.length-1][1];
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const hex2=n=>Math.round(n).toString(16).padStart(2,'0');
function mixHex(a,b,p){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return'#'+pa.map((v,i)=>hex2(lerp(v,pb[i],p))).join('');}

const BRAND={bg:'#f7f5f0',ink:'#121212',muted:'#736e65',darkBg:'#0d0d0d',darkInk:'#f0eee9',accent:'#C23A1E',red:'#D8352A'};
const SERIF='"Barlow Condensed",sans-serif';
const MONO='"JetBrains Mono",ui-monospace,monospace';

function mono(c,txt,x,y,o={}){
  const{size=28,ls=0,align='left',color=BRAND.ink,alpha=1,weight=500}=o;
  if(alpha<=0)return;
  c.save();c.font=`${weight} ${size}px ${MONO}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';
  c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;
  let xx=x;
  if(align==='center'){c.textAlign='center';xx=x+ls/2;}else if(align==='right'){c.textAlign='right';xx=x+ls;}else c.textAlign='left';
  c.fillText(txt,xx,y);c.restore();
}
function monoW(c,txt,size,ls,weight=500){c.save();c.font=`${weight} ${size}px ${MONO}`;if('letterSpacing' in c)c.letterSpacing=ls+'px';const w=c.measureText(txt).width;c.restore();return w;}
/* centered condensed block, auto-fitted to 860px */
function block(c,lines,x,y,size,color,alpha=1){
  c.save();c.font=`900 ${size}px ${SERIF}`;let mw=1;lines.forEach(l=>{mw=Math.max(mw,c.measureText(l).width);});
  const s=Math.min(size,size*860/mw);c.font=`900 ${s}px ${SERIF}`;
  c.textAlign='center';c.textBaseline='middle';c.fillStyle=color;c.globalAlpha=alpha;
  lines.forEach((l,i)=>c.fillText(l,x,y+(i-(lines.length-1)/2)*s*.9));c.restore();
}

/* ---- the app's own flowfield algorithm: same Perlin noise, same mask sampling, same 8-step particle trace ---- */
const Perlin = {
            p: new Uint8Array(512),
            init: function() {
                const permutation = [151,160,137,91,90,15,
                131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
                190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,
                88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,
                77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,
                102,143,54,65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,
                135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,
                5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,
                223,183,170,213,119,248,152, 2,44,145,31,179,228,165,55,110,178,224,183,225,
                40,242,172,239,249,14,236,97,21,50,45,127,4,150,254,138,209,204,184,218,61,
                84,121,98,223,34,39,176,155,51,193,113,70,213,9,144,3,180,243,108,181,241,
                251,114,238,205,107,177,157,167,115,195,192,67,69,215,128,1,214,141,93,246,
                24,185,199,147,22,66,129,222,61,191,101,43,210,106,41,253,153,112,149,154,
                156,127,152,78,162,171,81,21,120,207,11,104,221,58,18,24,206,24,242,123];
                for (let i=0; i<256; i++) {
                    this.p[256+i] = this.p[i] = permutation[i % permutation.length];
                }
            },
            fade: function(t) { return t * t * t * (t * (t * 6 - 15) + 10); },
            lerp: function(t, a, b) { return a + t * (b - a); },
            grad: function(hash, x, y) {
                const h = hash & 7;
                const u = h < 4 ? x : y;
                const v = h < 4 ? y : x;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            },
            noise: function(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = this.fade(x);
                const v = this.fade(y);
                const A = this.p[X] + Y, B = this.p[X + 1] + Y;
                return this.lerp(v, this.lerp(u, this.grad(this.p[A], x, y),
                                                 this.grad(this.p[B], x - 1, y)),
                                    this.lerp(u, this.grad(this.p[A + 1], x, y - 1),
                                                 this.grad(this.p[B + 1], x - 1, y - 1)));
            }
        };
        Perlin.init();
/* phase only slides the noise window, so cached variants make the particles drift (the app itself uses phase 0) */
function flowCanvas(o){
  const{text,color,turb=26,strength=26,fontSize=140,scale=1,phase=0,bw=800,bh=400}=o;
  if(!text)return null;
  const tw=Math.round(bw*scale),th=Math.round(bh*scale);
  const mask=mkCanvas(tw,th),oc=mask.getContext('2d',{willReadFrequently:true});
  const lines=text.split('\n'),sStr=strength*scale,padding=sStr+40*scale,ref=100*scale;
  oc.font=`900 ${ref}px ${SERIF}`;
  let mw=1;lines.forEach(l=>{mw=Math.max(mw,oc.measureText(l).width);});
  const maxFs=Math.min(Math.max(10*scale,tw-padding)*ref/mw,Math.max(10*scale,th-padding)*ref/(lines.length*ref*1.1));
  const fs=Math.max(10*scale,Math.min(fontSize*scale,maxFs));
  oc.font=`900 ${fs}px ${SERIF}`;oc.textAlign='center';oc.textBaseline='middle';oc.fillStyle=color;
  const lh=fs*1.1,sy=th/2-lines.length*lh/2+lh/2;
  lines.forEach((l,i)=>oc.fillText(l,tw/2,sy+i*lh));
  const buf=new Uint32Array(oc.getImageData(0,0,tw,th).data.buffer);
  const out=mkCanvas(tw,th),c=out.getContext('2d');
  const step=Math.max(2,Math.round(2*scale)),ns=(0.002*(Math.max(1,turb)/20))/scale,dr=Math.max(.75,1*scale),sd=sStr/8,ph=phase;
  c.fillStyle=color;c.beginPath();
  for(let y=0;y<th;y+=step){const ro=y*tw;for(let x=0;x<tw;x+=step){
    if(buf[ro+x]===0)continue;
    let px=x,py=y;
    for(let k=0;k<8;k++){const a=Perlin.noise(px*ns+ph,py*ns+ph*.7)*Math.PI*4;px+=Math.cos(a)*sd;py+=Math.sin(a)*sd;}
    c.moveTo(px+dr,py);c.arc(px,py,dr,0,Math.PI*2);
  }}
  c.fill();
  return out;
}

function stampAnim(u,dur=.12){
  if(u<0)return null;
  const p=clamp(u/dur);let s,blur;
  if(u<dur){s=1.32-.32*EASE.i2(p);blur=14*(1-p);}
  else{const q=u-dur;s=1-.035*Math.exp(-q*16)*Math.cos(q*55);blur=0;}
  return{s,blur,a:clamp(u/.04)};
}
function wipe(c,t,tIn,color){
  const cover=tIn+WIPE_DUR+(WIPE_BARS-1)*WIPE_STAG,bh=H/WIPE_BARS;
  c.fillStyle=color;
  for(let i=0;i<WIPE_BARS;i++){
    const pin=EASE.io3(clamp((t-(tIn+i*WIPE_STAG))/WIPE_DUR));
    const pout=EASE.io3(clamp((t-(cover+i*WIPE_STAG))/WIPE_DUR));
    const x0=pout*W,x1=pin*W;if(x1>x0+.5)c.fillRect(x0,i*bh,x1-x0,bh+1);
  }
}

/* =====================================================================
   TIMELINE (seconds) — visuals and sound read the same numbers
   ===================================================================== */
const BRK=1.0,FLOW_LIFE=1.05;                          // hook: particles break loose at BRK
const MW=['FLOW','DRIFT','SWIRL','WAVE','STREAM','CURRENT'];
const MPAL=[[BRAND.bg,BRAND.accent],[BRAND.darkBg,BRAND.darkInk],['#E9B63B','#121212'],['#2447C9','#f7f5f0'],['#F4B6C2','#B0123F'],['#1F5B45','#F2E7C9']];
const MONT0=2.6,M_DUR=[.5,.46,.42,.4,.4,.4],M_T0=[];{let a=MONT0;M_DUR.forEach(d=>{M_T0.push(a);a+=d;});}
const B0=M_T0[5]+M_DUR[5];                              // bridge starts
const WIPE_DUR=.3,WIPE_STAG=.045,WIPE_BARS=4,W1_IN=6.5;
const W1_COVER=W1_IN+WIPE_DUR+(WIPE_BARS-1)*WIPE_STAG;
const C0=W1_COVER,R=x=>C0+x;
const UI_LEN=12.4;
const W2_IN=C0+UI_LEN,W2_COVER=W2_IN+WIPE_DUR+(WIPE_BARS-1)*WIPE_STAG;
const D0=W2_COVER,Dr=x=>D0+x;
const K=a=>a.map(p=>[R(p[0]),p[1],p[2]]);

/* slider journeys: they always START and END on the app's defaults (26% / 26px / 140px).
   Names STITCH / LOOPV / FUZZ / SIZE are kept because the soundtrack reads them for its slider ticks:
   STITCH = Turbulence drag, LOOPV = Current Strength drag, FUZZ = second Turbulence drag, SIZE = Size drag */
const DEF={turb:26,str:26,size:140};
const STITCH=K([[1.9,26],[2.3,3],[2.4,3],[2.85,14],[2.95,14],[3.3,26]]);
const LOOPV=K([[3.8,26],[4.2,0],[4.3,0],[4.75,12],[4.85,12],[5.15,26]]);

const CH_T=[...TYPED].map((_,i)=>R(1.15)+i*.11+.012*Math.sin(i*91.7+3.3));

const DRAGS=[[1.9,3.35,'stitch'],[3.8,5.2,'loop'],[5.65,7.1,'fuzz'],[8.3,9.5,'size']];

function mkAsset(text,color,o={}){
  const scale=o.scale||1.5,n=o.n||3,bw=o.bw||800,bh=o.bh||400,vars=[];
  for(let v=0;v<n;v++)vars.push(flowCanvas({text,color,turb:o.turb===undefined?DEF.turb:o.turb,strength:o.str===undefined?DEF.str:o.str,fontSize:340,scale,phase:v*.12,bw,bh}));
  return{vars,bw,bh,grid:2};
}
const pingpong=(f,n)=>{if(n<2)return 0;const p=2*n-2,k=f%p;return k<n?k:p-k;};
function buildAssets(){
  HP=buildHookParticles();
  MW.forEach((w,i)=>mA.push(mkAsset(w,MPAL[i][1],{str:16})));
  bridgeA=mkAsset('YOURS',BRAND.ink,{n:4,str:12});
  outA=mkAsset('KINETIC\nFLOWFIELD',BRAND.darkInk,{scale:2,bw:800,bh:600,n:5,str:14});
  const rnd=mulberry32(5);grainTile=mkCanvas(512,512);
  const g=grainTile.getContext('2d'),id=g.createImageData(512,512);
  for(let i=0;i<512*512;i++){const v=rnd()*255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
  g.putImageData(id,0,0);
}
/* knit a cached word onto the stage. top = fraction (from the top) where visible rows begin (rows snap like stitches) */
function drawYarn(c,a,cx,cy,dw,t,o={}){
  const top=o.top||0,alpha=o.alpha===undefined?1:o.alpha;
  const dh=dw*a.bh/a.bw,x0=cx-dw/2,y0=cy-dh/2,v=pingpong(Math.floor(t*10),a.vars.length);
  if(top>=1)return;
  c.save();c.globalAlpha=alpha;
  if(top>0){const rows=Math.ceil(a.bh/a.grid),tq=Math.round(top*rows)/rows;c.beginPath();c.rect(x0-4,y0+dh*tq,dw+8,dh*(1-tq)+4);c.clip();}
  c.drawImage(a.vars[v],x0,y0,dw,dh);c.restore();
}
function loupe(c,a,cx,cy,dw,t,lx,ly,r,Z){
  if(r<3)return;
  c.save();c.shadowColor='rgba(0,0,0,.30)';c.shadowBlur=44;c.shadowOffsetY=20;
  c.beginPath();c.arc(lx,ly,r,0,Math.PI*2);c.fillStyle=BRAND.bg;c.fill();c.restore();
  c.save();c.beginPath();c.arc(lx,ly,r,0,Math.PI*2);c.clip();
  c.translate(lx,ly);c.scale(Z,Z);c.translate(-lx,-ly);
  drawYarn(c,a,cx,cy,dw,t);c.restore();
  c.save();c.strokeStyle=BRAND.ink;c.lineWidth=9;c.beginPath();c.arc(lx,ly,r,0,Math.PI*2);c.stroke();
  c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=7;c.lineCap='round';c.beginPath();c.arc(lx,ly,r-26,Math.PI*1.08,Math.PI*1.42);c.stroke();c.restore();
}
function flash(c,a,col){if(a>.005){c.save();c.globalAlpha=a;c.fillStyle=col;c.fillRect(0,0,W,H);c.restore();}}

/* ---------- 0 – 2.6 s : the hook ---------- */
/* FLOW is built from ~20k individual particles. Every particle owns a precomputed path through the
   flowfield, so each frame is a pure function of t (safe for the frame-by-frame renderer). */
const HK={cx:540,cy:1090,dw:1000,PL:40};
const HK_TONE=['#D8352A','#A3201A','#F0705A'];        // base, shadow, lit
const HK_ZA=[.7,.92,1],HK_ZR=[.72,1,1.38],HK_ZP=[.6,1,1.5];
const HK_WAVE0=.22,HK_WAVE_D=.72;                      // activation sweep + macro lens ride together
function buildHookParticles(){
  const bw=800,bh=400,sc=3,tw=bw*sc,th=bh*sc,ref=100*sc,pad=40*sc;
  const mk=mkCanvas(tw,th),oc=mk.getContext('2d',{willReadFrequently:true});
  oc.font=`900 ${ref}px ${SERIF}`;
  const mw=Math.max(1,oc.measureText('FLOW').width);
  const fs=Math.min(340*sc,(tw-pad)*ref/mw,(th-pad)/1.1);
  oc.font=`900 ${fs}px ${SERIF}`;oc.textAlign='center';oc.textBaseline='middle';oc.fillStyle='#000';
  oc.fillText('FLOW',tw/2,th/2);
  const dat=oc.getImageData(0,0,tw,th).data,rnd=mulberry32(11),step=6,k=HK.dw/tw,PL=HK.PL;
  const pts=[];
  for(let y=3;y<th;y+=step)for(let x=3;x<tw;x+=step){
    const jx=x+(rnd()-.5)*step*.95,jy=y+(rnd()-.5)*step*.95;
    const ix=Math.min(tw-1,Math.max(0,Math.round(jx))),iy=Math.min(th-1,Math.max(0,Math.round(jy)));
    if(dat[(iy*tw+ix)*4+3]<110)continue;
    const keep=.80+.24*Perlin.noise(jx*.0045+2.2,jy*.0045+5.1);       // natural density variation
    if(rnd()>keep)continue;
    pts.push([HK.cx+(jx-tw/2)*k,HK.cy+(jy-th/2)*k]);
  }
  const n=pts.length;let xmin=1e9,xmax=-1e9;
  pts.forEach(p=>{xmin=Math.min(xmin,p[0]);xmax=Math.max(xmax,p[0]);});
  const P={n,PL,xmin,xmax,hx:new Float32Array(n),hy:new Float32Array(n),xn:new Float32Array(n),dl:new Float32Array(n),
    z:new Uint8Array(n),tn:new Uint8Array(n),ph:new Float32Array(n),jf:new Float32Array(n),path:new Float32Array(n*PL*2),r:1.1};
  {const NB=128,sy=new Float32Array(NB),cn=new Float32Array(NB);
   pts.forEach(p=>{const bi=Math.min(NB-1,Math.floor((p[0]-xmin)/(xmax-xmin)*NB));sy[bi]+=p[1];cn[bi]++;});
   const my=[];for(let b=0;b<NB;b++)my.push(cn[b]>3?sy[b]/cn[b]:null);
   for(let b=0;b<NB;b++)if(my[b]===null){let d=1;while(d<NB){const a=my[b-d],c2=my[b+d];if(a!=null&&a!==undefined){my[b]=a;break;}if(c2!=null&&c2!==undefined){my[b]=c2;break;}d++;}}
   P.lyT=my.map((v,b)=>{let a=0,m=0;for(let k=-3;k<=3;k++){const q=my[Math.min(NB-1,Math.max(0,b+k))];if(q!=null){a+=q;m++;}}return m?a/m:HK.cy;});}
  const ns=.0034;
  for(let i=0;i<n;i++){
    const hx=pts[i][0],hy=pts[i][1],xn=(hx-xmin)/(xmax-xmin);
    P.hx[i]=hx;P.hy[i]=hy;P.xn[i]=xn;
    P.dl[i]=BRK+.42*xn+rnd()*.14;                       // the current catches the word left → right
    const zr=rnd();P.z[i]=zr<.25?0:zr<.8?1:2;
    const tr=rnd();P.tn[i]=tr<.70?0:tr<.88?1:2;
    P.ph[i]=rnd()*6.283;P.jf[i]=5+rnd()*7;
    const zs=HK_ZP[P.z[i]]*(.9+rnd()*.25),side=rnd()-.5;
    let px=hx,py=hy,b=i*PL*2;P.path[b]=px;P.path[b+1]=py;
    for(let j=1;j<PL;j++){
      const a=Perlin.noise(px*ns+3.1,py*ns+7.7)*Math.PI*3.2;
      let dx=Math.cos(a)*.95+1,dy=Math.sin(a)*.95-.3;const dd=Math.hypot(dx,dy)||1;dx/=dd;dy/=dd;
      const L=(5.5+j*2.3)*zs;
      px+=dx*L-dy*side*j*.09;py+=dy*L+dx*side*j*.09;
      b+=2;P.path[b]=px;P.path[b+1]=py;
    }
  }
  return P;
}
const hkLensX=t=>lerp(HP.xmin-30,HP.xmax+30,EASE.io3(clamp((t-HK_WAVE0)/HK_WAVE_D)));
const hkLensY=x=>{const T=HP.lyT,u=clamp((x-HP.xmin)/(HP.xmax-HP.xmin))*(T.length-1),k=Math.min(T.length-2,Math.floor(u));return lerp(T[k],T[k+1],u-k);};
let _hx=0,_hy=0;
function hkAt(i,s){                                   // position along particle i's path, s in 0..1
  const P=HP,PL=P.PL,e=.25*s+.75*s*s,u=e*(PL-1);let j=Math.floor(u);if(j>PL-2)j=PL-2;
  const f=u-j,b=(i*PL+j)*2;
  _hx=P.path[b]+(P.path[b+2]-P.path[b])*f;_hy=P.path[b+1]+(P.path[b+3]-P.path[b+1])*f;
}
function drawHookP(c,t,fadeA){
  const P=HP,n=P.n,push=.045*EASE.o2(clamp(t/2.6)),jam=lerp(.25,1.25,EASE.o2(clamp(t/.95)));
  const waving=t>HK_WAVE0&&t<HK_WAVE0+HK_WAVE_D+.12;
  const wp=waving?(hkLensX(t)-P.xmin)/(P.xmax-P.xmin):-9;
  const B=[];for(let b=0;b<9;b++)B.push(new Path2D());
  const cx=HK.cx,cy=HK.cy;
  for(let i=0;i<n;i++){
    const z=P.z[i],zf=1+push*HK_ZP[z]*.9;
    let s=(t-P.dl[i])/FLOW_LIFE,x,y,x2,y2,tone=P.tn[i];
    if(s<=0){
      x=P.hx[i]+Math.sin(t*P.jf[i]+P.ph[i])*jam;y=P.hy[i]+Math.cos(t*P.jf[i]*.83+P.ph[i]*1.3)*jam;x2=x;y2=y;
      if(waving&&Math.abs(P.xn[i]-wp)<.06)tone=2;
    }else{
      if(s>1)s=1;
      hkAt(i,s);x=_hx;y=_hy;
      const jk=1-Math.min(1,s*8);if(jk>0){x+=Math.sin(t*P.jf[i]+P.ph[i])*jam*jk;y+=Math.cos(t*P.jf[i]*.83+P.ph[i]*1.3)*jam*jk;}
      hkAt(i,Math.max(0,s-.032));x2=_hx;y2=_hy;
      if(s<.1)tone=2;
    }
    const p=B[z*3+tone];
    p.moveTo(cx+(x2-cx)*zf,cy+(y2-cy)*zf);p.lineTo(cx+(x-cx)*zf+.01,cy+(y-cy)*zf);
  }
  c.save();c.lineCap='round';
  for(let b=0;b<9;b++){const z=(b/3)|0;c.globalAlpha=HK_ZA[z]*fadeA;c.strokeStyle=HK_TONE[b%3];c.lineWidth=2*P.r*HK_ZR[z];c.stroke(B[b]);}
  c.restore();
}
/* macro lens: individual shaded particles at ~5x */
function hookLens(c,t,lx,ly,r,Z){
  if(r<3)return;
  const P=HP,n=P.n,push=.045*EASE.o2(clamp(t/2.6)),jam=lerp(.25,1.25,EASE.o2(clamp(t/.95)));
  const wp=(lx-P.xmin)/(P.xmax-P.xmin),q=r/Z+4;
  c.save();c.shadowColor='rgba(0,0,0,.28)';c.shadowBlur=40;c.shadowOffsetY=18;
  c.beginPath();c.arc(lx,ly,r,0,Math.PI*2);c.fillStyle=BRAND.bg;c.fill();c.restore();
  c.save();c.beginPath();c.arc(lx,ly,r,0,Math.PI*2);c.clip();
  c.translate(lx,ly);c.scale(Z,Z);c.translate(-lx,-ly);
  const cx=HK.cx,cy=HK.cy;
  for(let i=0;i<n;i++){
    const z=P.z[i],zf=1+push*HK_ZP[z]*.9;
    const x=cx+(P.hx[i]+Math.sin(t*P.jf[i]+P.ph[i])*jam-cx)*zf,y=cy+(P.hy[i]+Math.cos(t*P.jf[i]*.83+P.ph[i]*1.3)*jam-cy)*zf;
    if(x<lx-q||x>lx+q||y<ly-q||y>ly+q)continue;
    const lit=Math.abs(P.xn[i]-wp)<.05,rr=P.r*HK_ZR[z]*1.05;
    c.globalAlpha=.55+.45*(z/2);
    c.fillStyle=lit?HK_TONE[2]:HK_TONE[P.tn[i]];
    c.beginPath();c.arc(x,y,rr,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(255,255,255,.42)';c.beginPath();c.arc(x-rr*.28,y-rr*.3,rr*.38,0,Math.PI*2);c.fill();
  }
  c.restore();
  c.save();c.strokeStyle=BRAND.ink;c.lineWidth=8;c.beginPath();c.arc(lx,ly,r,0,Math.PI*2);c.stroke();
  c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=6;c.lineCap='round';c.beginPath();c.arc(lx,ly,r-22,Math.PI*1.08,Math.PI*1.42);c.stroke();c.restore();
}
/* justified headline lockup: every line fitted to the same width */
function hookHeadline(c){
  const lines=['ONE WORD.','SIX DIFFERENT','PARTICLE FLOWS.'],cols=[BRAND.ink,BRAND.ink,BRAND.red],maxS=[260,200,160];
  c.save();c.textAlign='center';c.textBaseline='alphabetic';
  let y=300;
  lines.forEach((l,i)=>{
    c.font=`900 100px ${SERIF}`;const w=Math.max(1,c.measureText(l).width),s=Math.min(maxS[i],860*100/w);
    c.font=`900 ${s}px ${SERIF}`;c.fillStyle=cols[i];
    y+=s*.70;c.fillText(l,540,y);y+=s*.12+8;
  });
  c.restore();
}
function drawHook(c,t){
  c.fillStyle=BRAND.bg;c.fillRect(0,0,W,H);
  drawHookP(c,t,1-prog(t,2.36,.22));
  hookHeadline(c);
  const lr=118*EASE.oback(clamp((t-.12)/.14))*(1-prog(t,.9,.1,'i2'));
  if(t>.12&&lr>3)hookLens(c,t,hkLensX(t),hkLensY(hkLensX(t))+10*Math.sin(t*7),lr,4);
}

/* ---------- 2.6 – 5.18 s : cut montage ---------- */
function drawMontage(c,t){
  let i=0;for(let k=0;k<MW.length;k++)if(t>=M_T0[k])i=k;
  const bg=MPAL[i][0],ink=MPAL[i][1],u=t-M_T0[i];
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  const p=EASE.o3(clamp(u/.2)),z=1.07-.07*EASE.o3(clamp(u/.35)),q=u-.2;
  const amp=q>=0?(6+i*1.2)*Math.exp(-q*24):0;
  c.save();c.translate(Math.sin(t*210)*amp,Math.cos(t*173)*amp*.8);
  c.translate(520,900);c.scale(z,z);c.translate(-520,-900);
  drawYarn(c,mA[i],520,900,1000,t,{top:1-p});
  c.restore();
  mono(c,'ALL OF THIS IS JUST TYPE',80,300,{size:26,ls:4,color:ink,alpha:.75});
  mono(c,String(i+1).padStart(2,'0')+' / 06',940,300,{size:26,ls:4,align:'right',color:ink,alpha:.75});
  const pg=clamp((t-MONT0)/(B0-MONT0));
  c.save();c.strokeStyle=ink;c.globalAlpha=.25;c.lineWidth=3;c.beginPath();c.moveTo(80,345);c.lineTo(940,345);c.stroke();
  c.globalAlpha=.9;c.beginPath();c.moveTo(80,345);c.lineTo(80+860*pg,345);c.stroke();c.restore();
  mono(c,'KINETIC FLOWFIELD TEXT EFFECT',520,1200,{size:24,ls:6,align:'center',color:ink,alpha:.65});
  flash(c,.16*Math.exp(-u*30),i%2?'#fff':'#000');
}

/* ---------- 5.18 – 6.5 s : bridge ---------- */
function drawBridge(c,t){
  c.fillStyle=BRAND.bg;c.fillRect(0,0,W,H);
  const u=t-B0;
  mono(c,'CALLISTRA.DESIGN',80,300,{size:26,ls:3,alpha:.55*prog(t,B0+.05,.3)});
  const p1=prog(t,B0+.04,.5,'oexp');
  c.save();c.beginPath();c.rect(0,320,W,230);c.clip();
  block(c,['NOW MAKE'],540,440+(1-p1)*230,230,BRAND.ink);c.restore();
  const bp=EASE.o3(clamp((u-.25)/.3)),q=u-.55;
  const amp=q>=0?10*Math.exp(-q*22):0;
  c.save();c.translate(Math.sin(t*210)*amp,Math.cos(t*173)*amp*.8);
  drawYarn(c,bridgeA,520,830,1000,t,{top:1-bp});c.restore();
  const ps=prog(t,B0+.7,.5,'oexp'),ys=1150;
  mono(c,'HERE’S HOW',540,ys,{size:36,ls:lerp(20,8,ps),align:'center',alpha:ps});
  const lp=prog(t,B0+.85,.4,'oexp');
  c.save();c.strokeStyle=BRAND.ink;c.globalAlpha=.5;c.lineWidth=2;c.beginPath();c.moveTo(540-300*lp,ys+46);c.lineTo(540+300*lp,ys+46);c.stroke();c.restore();
  flash(c,q>=0?.10*Math.exp(-q*30):0,'#000');
}

/* ---------- outro ---------- */
function drawOutro(c,t){
  c.fillStyle=BRAND.darkBg;c.fillRect(0,0,W,H);
  const bp=EASE.o3(clamp((t-Dr(.2))/.55)),q=t-Dr(.75);
  const amp=q>=0?12*Math.exp(-q*22):0;
  c.save();c.translate(Math.sin(t*210)*amp,Math.cos(t*173)*amp*.8);
  drawYarn(c,outA,520,700,940,t,{top:1-bp});c.restore();
  const p1=prog(t,Dr(1.0),.55,'oexp');
  c.save();c.beginPath();c.rect(0,1050,W,120);c.clip();
  block(c,['TRY IT ON YOUR NAME.'],540,1110+(1-p1)*120,96,BRAND.darkInk);c.restore();
  const ps=prog(t,Dr(1.2),.6,'oexp');
  mono(c,'TEXT EFFECT MAKER',540,1200,{size:30,ls:lerp(18,8,ps),align:'center',color:BRAND.darkInk,alpha:ps*.85});
  mono(c,'CALLISTRA.DESIGN',540,1285,{size:44,ls:4,align:'center',color:BRAND.darkInk,alpha:prog(t,Dr(1.5),.4,'o3'),weight:700});
  const up=prog(t,Dr(1.6),.45,'oexp');
  c.save();c.strokeStyle=BRAND.accent;c.lineWidth=5;c.beginPath();c.moveTo(540-290*up,1330);c.lineTo(540+290*up,1330);c.stroke();c.restore();
  mono(c,'LINK IN BIO',540,1390,{size:26,ls:6,align:'center',color:'#8c877e',alpha:prog(t,Dr(2.0),.4,'o3')});
  flash(c,q>=0?.10*Math.exp(-q*30):0,'#fff');
}

/* ---------- UI scene ---------- */
const uiCam=$('uiCam'),uiCanvas=$('uiCanvas'),uc=uiCanvas.getContext('2d');
const toastCv=$('toastCv'),tcx=toastCv.getContext('2d');
let uiKey='',rippleEls=[];
function off(el,root){let x=0,y=0,e=el;while(e&&e!==root){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}return{x,y,w:el.offsetWidth,h:el.offsetHeight};}
function measure(){
  const inner=$('uiInner');
  $('advBody').style.height='0px';
  M.trk={turb:off($('trkTurb'),inner),str:off($('trkStr'),inner)};
  M.input=off($('uiTextBox'),inner);M.sum=off($('advSum'),inner);
  $('advBody').style.height='auto';
  M.bodyH=$('advBody').offsetHeight;
  M.trk.size=off($('trkSize'),inner);M.swatch=off($('swatch'),inner);M.dd=off($('ddExp'),inner);
  M.btnOpen=off($('btn'),inner);
  $('advBody').style.height='0px';
  RIPPLES.forEach(()=>{const e=document.createElement('i');e.className='ripple';inner.appendChild(e);rippleEls.push(e);});
}
const center=o=>[o.x+o.w/2,o.y+o.h/2];
function thumbPos(row,v,min,max){const tr=M.trk[row],r=12;return[tr.x+r+(tr.w-2*r)*((v-min)/(max-min)),tr.y+tr.h/2];}
function arc(a,b,p){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),k=Math.sin(Math.PI*p)*d*.12;
  return[lerp(a[0],b[0],p)-dy/(d||1)*k,lerp(a[1],b[1],p)+dx/(d||1)*k];
}
let SEG=null;
function buildSeg(){
  SEG=[
    {t0:R(.35),t1:R(.85),to:()=>[M.input.x+300,M.input.y+M.input.h*.5]},
    {t0:R(1.45),t1:R(1.85),to:()=>thumbPos('turb',DEF.turb,1,26)},
    {t0:R(1.9),t1:R(3.35),fn:t=>thumbPos('turb',kf(t,STITCH),1,26)},
    {t0:R(3.4),t1:R(3.75),to:()=>thumbPos('str',DEF.str,0,26)},
    {t0:R(3.8),t1:R(5.2),fn:t=>thumbPos('str',kf(t,LOOPV),0,26)},
    {t0:R(5.25),t1:R(5.6),to:()=>thumbPos('turb',DEF.turb,1,26)},
    {t0:R(5.65),t1:R(7.1),fn:t=>thumbPos('turb',kf(t,FUZZ),1,26)},
    {t0:R(7.15),t1:R(7.5),to:()=>[M.sum.x+M.sum.w-30,M.sum.y+M.sum.h/2]},
    {t0:R(7.9),t1:R(8.25),to:()=>thumbPos('size',DEF.size,30,250)},
    {t0:R(8.3),t1:R(9.5),fn:t=>thumbPos('size',kf(t,SIZE),30,250)},
    {t0:R(9.55),t1:R(9.8),to:()=>center(M.swatch)},
    {t0:R(9.95),t1:R(10.25),to:()=>center(M.dd)},
    {t0:R(10.5),t1:R(10.9),to:()=>center(M.btnOpen)},
    {t0:R(11.8),t1:R(12.3),to:()=>[M.btnOpen.x+M.btnOpen.w-60,M.btnOpen.y+M.btnOpen.h+120]}
  ];
}
function cursorAt(t){
  let pos=[880,1500];
  for(const s of SEG){
    if(t<s.t0)return pos;
    if(s.fn){if(t<=s.t1)return s.fn(t);pos=s.fn(s.t1);continue;}
    const to=s.to();
    if(t<=s.t1)return arc(pos,to,EASE.io3((t-s.t0)/(s.t1-s.t0)));
    pos=to;
  }
  return pos;
}
function pressedAt(t){return PRESS.some(p=>t>=p[0]&&t<=p[1]);}
function dragRow(t){for(const d of DRAGS)if(t>=R(d[0])&&t<=R(d[1]))return d[2];return'';}
function captionUpdate(t){
  document.querySelectorAll('.capl').forEach((el,i)=>{
    const pin=prog(t,CAP_T[i],.4,'oexp');
    const pout=i<CAP_T.length-1?prog(t,CAP_T[i+1],.3,'i3'):0;

}
function updateUI(t){
  const intro=prog(t,C0,.8,'o3');

  const zoom=kf(t,[[R(7.5),1],[R(8.2),fitS,'io3']]);
  uiCam.style.transform=`scale(${zoom*(1+.08*(1-intro))})`;
  const tNow=Math.min(kf(t,STITCH),kf(t,FUZZ)),sNow=kf(t,LOOPV),zNow=kf(t,SIZE);
  const vt=Math.round(tNow),vs=Math.round(sNow),vz=Math.round(zNow);
  const colP=prog(t,R(9.85),.5,'io3'),col=mixHex('#000000',BRAND.red,colP);
  const open=prog(t,R(7.55),.35,'io3');
  let n=0;CH_T.forEach(ct=>{if(t>=ct)n++;});
  const sel=t>=R(.8)&&t<CH_T[0];
  const text=t<CH_T[0]?'STILL':TYPED.slice(0,n);
  const key=`${text}|${vt}|${vs}|${vz}|${col}`;
  if(key!==uiKey){
    uiKey=key;uc.clearRect(0,0,1200,600);
    const cv=flowCanvas({text,color:col,turb:vt,strength:vs,fontSize:vz,scale:1.5});
    if(cv)uc.drawImage(cv,0,0);

  const txt=$('uiTxt');txt.textContent=text;txt.className=sel?'sel':'';
  const typing=t>=R(.8)&&t<R(1.9);
  const solid=t<CH_T[CH_T.length-1]+.5;
  $('uiCaret').style.display=typing&&!sel&&(solid||Math.floor((t-R(.8))*2.2)%2===0)?'inline-block':'none';
  $('vTurb').textContent=vt+'%';$('vStr').textContent=vs+'px';$('vSize').textContent=vz+'px';
  const pos=(id,v,mn,mx)=>{$(id).style.left=`calc(12px + (100% - 24px) * ${(v-mn)/(mx-mn)})`;};
  pos('thTurb',tNow,1,26);pos('thStr',sNow,0,26);pos('thSize',zNow,30,250);
  const dr=dragRow(t);
  [['thTurb',['stitch','fuzz']],['thStr',['loop']],['thSize',['size']]].forEach(([id,ks])=>{$(id).style.transform=`translate(-50%,-50%) scale(${ks.includes(dr)?1.7:1})`;});
  $('advBody').style.height=(M.bodyH*open)+'px';
  $('advSign').textContent=open>.5?'－':'＋';
  $('swatch').style.background=col;$('vColor').textContent=col.toUpperCase();
  $('vExp').textContent=t>=R(10.45)?'8x':'4x';
  const ff=t>=R(10.35)&&t<R(10.75);$('ddExp').style.background=ff?'rgba(18,18,18,.07)':'transparent';
  const rendering=t>=R(11.0)&&t<R(11.45);
  $('btnLabel').textContent=rendering?'RENDERING...':'DOWNLOAD PNG';
  $('btn').style.background=rendering?BRAND.muted:BRAND.ink;
  $('btn').style.transform=(t>=R(11.0)&&t<R(11.12))?'scale(.985)':'scale(1)';
  const tp=prog(t,R(11.45),.5,'oback');
  const toast=$('toast');toast.style.opacity=clamp(tp*3);toast.style.transform=`translateY(${(1-tp)*170}px)`;
  if(tp>0){tcx.clearRect(0,0,320,160);tcx.drawImage(uiCanvas,0,0,320,160);}
  const cp=cursorAt(t),cur=$('cursor');
  cur.style.opacity=prog(t,R(.35),.2);
  cur.style.transform=`translate(${cp[0]-10}px,${cp[1]-5}px) scale(${pressedAt(t)?.88:1})`;
  RIPPLES.forEach((rt,i)=>{
    const p=(t-rt)/.45,el=rippleEls[i];
    if(p>=0&&p<=1){const c0=cursorAt(rt);el.style.left=c0[0]+'px';el.style.top=c0[1]+'px';el.style.opacity=.55*(1-p);el.style.transform=`translate(-50%,-50%) scale(${.3+.9*EASE.o3(p)})`;}
    else el.style.opacity=0;
  });
  captionUpdate(t);
}

function renderFrame(t){
  t=clamp(t,0,REEL.duration);
  sc.setTransform(1,0,0,1,0,0);sc.clearRect(0,0,W,H);
  const showUI=t>=W1_COVER&&t<W2_COVER;
  ui.style.display=showUI?'block':'none';
  if(t<W1_COVER){
    if(t<MONT0)drawHook(sc,t);else if(t<B0)drawMontage(sc,t);else drawBridge(sc,t);
  }else if(showUI)updateUI(t);
  else drawOutro(sc,t);
  wipe(sc,t,W1_IN,BRAND.ink);
  wipe(sc,t,W2_IN,BRAND.accent);
  const fo=prog(t,REEL.duration-.45,.45);
  if(fo>0){sc.fillStyle='#000';sc.globalAlpha=fo;sc.fillRect(0,0,W,H);sc.globalAlpha=1;}
  const f=Math.floor(t*REEL.fps+.001),ox=(f*97)%512,oy=(f*57)%512;
  gc.clearRect(0,0,W,H);
  for(let x=-ox;x<W;x+=512)for(let y=-oy;y<H;y+=512)gc.drawImage(grainTile,x,y);
}
window.renderFrame=renderFrame;

/* =====================================================================
   SOUND — synthesised with the Web Audio API, rendered offline
   ===================================================================== */
async function buildAudio(){
  const SR=44100,DUR=REEL.duration;
  const oc=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const rand=mulberry32(7);
  const nb=oc.createBuffer(1,SR*3,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rand()*2-1;}
  const master=oc.createGain();master.gain.setValueAtTime(.72,0);master.gain.setValueAtTime(.72,DUR-.5);master.gain.linearRampToValueAtTime(0,DUR-.03);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=12;comp.ratio.value=10;comp.attack.value=.002;comp.release.value=.12;
  master.connect(comp);comp.connect(oc.destination);
  const rl=Math.floor(SR*1.8),ir=oc.createBuffer(2,rl,SR);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rand()*2-1)*Math.pow(1-i/rl,3.2);}
  const conv=oc.createConvolver();conv.buffer=ir;
  const revIn=oc.createGain(),revLp=oc.createBiquadFilter(),revOut=oc.createGain();
  revLp.type='lowpass';revLp.frequency.value=5000;revOut.gain.value=.5;
  revIn.connect(conv);conv.connect(revLp);revLp.connect(revOut);revOut.connect(master);

  const out=(g,o={})=>{let n=g;
    if(o.pan){const p=oc.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p;}
    n.connect(master);
    if(o.rev>0){const s=oc.createGain();s.gain.value=o.rev;n.connect(s);s.connect(revIn);}
  };
  const env=(p,t,peak,a,d)=>{p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(peak,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);};
  const nsrc=(t,dur,seed)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,(Math.abs(seed)*.37)%2,undefined);s.stop(t+dur);return s;};
  const flt=(type,f,q=1)=>{const b=oc.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const osc=(type,f,t,dur)=>{const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;};

  const thud=(t,g=.6)=>{
    const o=osc('sine',170,t,.45);o.frequency.exponentialRampToValueAtTime(44,t+.2);
    const og=oc.createGain();env(og.gain,t,g,.003,.32);o.connect(og);out(og,{rev:.18});
    const n=nsrc(t,.14,t*13.7),bp=flt('bandpass',950,.9),ng=oc.createGain();env(ng.gain,t,g*.7,.001,.075);n.connect(bp);bp.connect(ng);out(ng,{rev:.12});
    const c=nsrc(t,.04,t*3.1),hp=flt('highpass',3500),cg=oc.createGain();env(cg.gain,t,g*.45,.0005,.012);c.connect(hp);hp.connect(cg);out(cg);
  };
  const tick=(t,f=1200,g=.2,pan=0)=>{
    const o=osc('triangle',f,t,.08),gn=oc.createGain();env(gn.gain,t,g,.001,.05);o.connect(gn);out(gn,{pan,rev:.08});
  };
  const key=(t,i)=>{
    const n=nsrc(t,.03,t*5.3),hp=flt('highpass',1800),g1=oc.createGain();env(g1.gain,t,.22,.0008,.012);n.connect(hp);hp.connect(g1);out(g1,{pan:i%2?.1:-.1});
    const o=osc('sine',190+(i%3)*14,t,.06),g2=oc.createGain();env(g2.gain,t,.12,.001,.03);o.connect(g2);out(g2);
  };
  const clk=(t,g,f)=>{const n=nsrc(t,.03,t*9.1),bp=flt('bandpass',f,1.2),gn=oc.createGain();env(gn.gain,t,g,.0006,.007);n.connect(bp);bp.connect(gn);out(gn);};
  const click=(t,g=.3)=>{clk(t,g,2800);clk(t+.075,g*.6,2000);};
  const whoosh=(t,dur,o={})=>{
    const{g=.3,up=true,f0=250,f1=5200}=o;
    const n=nsrc(t,dur,t*7.3),bp=flt('bandpass',1,1.1);
    bp.frequency.setValueAtTime(up?f0:f1,t);bp.frequency.exponentialRampToValueAtTime(up?f1:f0,t+dur);
    const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+dur*(up?.7:.3));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(bp);bp.connect(gn);
    const p=oc.createStereoPanner();p.pan.setValueAtTime(up?-.7:.7,t);p.pan.linearRampToValueAtTime(up?.7:-.7,t+dur);gn.connect(p);out(p,{rev:.15});
  };
  const glide=(t,dur,f0,f1,g,type='sine')=>{
    const o=osc(type,f0,t,dur+.05);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const gn=oc.createGain();env(gn.gain,t,g,.01,dur);o.connect(gn);out(gn,{rev:.2});
  };
  const chime=(t)=>{[[659.25,0],[987.77,.09]].forEach(([f,d])=>{
    [[1,.2],[2,.05],[3,.02]].forEach(([m,a])=>{const o=osc('sine',f*m,t+d,1.6),gn=oc.createGain();env(gn.gain,t+d,a,.004,1.3);o.connect(gn);out(gn,{rev:.55});});
  });};
  const riser=(t0,t1,g)=>{
    const n=nsrc(t0,t1-t0,3.3),bp=flt('bandpass',1,3);
    bp.frequency.setValueAtTime(300,t0);bp.frequency.exponentialRampToValueAtTime(4200,t1);
    const gn=oc.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t1-.05);gn.gain.linearRampToValueAtTime(0,t1);
    n.connect(bp);bp.connect(gn);out(gn,{rev:.1});
  };
  const boom=(t,g)=>{
    const o=osc('sine',100,t,1.2);o.frequency.exponentialRampToValueAtTime(28,t+.9);
    const og=oc.createGain();env(og.gain,t,g,.004,1.0);o.connect(og);out(og,{rev:.35});
    const n=nsrc(t,.5,t*2.2),lp=flt('lowpass',800),ng=oc.createGain();env(ng.gain,t,g*.6,.002,.35);n.connect(lp);lp.connect(ng);out(ng,{rev:.3});
  };
  /* yarn zip: a fast run of tiny ticks, rising (knit) or falling (unravel) */
  const zip=(t,dur,g,rising=true)=>{
    const n=Math.floor(dur*70);
    for(let k=0;k<n;k++){const f=rising?1100+k*(1100/n):2200-k*(1100/n);tick(t+k/70,f,g,k%2?.3:-.3);}
  };
  const sliderTicks=(fn,t0,t1,step,fb,g)=>{
    let last=Math.round(fn(t0)/step);
    for(let t=t0;t<=t1;t+=1/240){const q=Math.round(fn(t)/step);if(q!==last){last=q;tick(t,fb+fn(t)*5,g,0);}}
  };

  /* hook: soft deep impact → particle activation → release into the current */
  thud(.02,.6);boom(.02,.22);
  for(let k=0;k<17;k++){const p=k/16,tt=HK_WAVE0+p*HK_WAVE_D,pn=lerp(-.7,.7,p);
    tick(tt,3200+p*3600,.03,pn);if(k%2)tick(tt+.02,5200+p*2400,.018,pn);}
  glide(HK_WAVE0,HK_WAVE_D,1800,5200,.016);
  thud(BRK,.7);boom(BRK,.3);                                  // low accent as the word breaks apart
  whoosh(BRK-.02,.95,{g:.14,up:true,f0:260,f1:3600});
  whoosh(BRK+.35,1.2,{g:.10,up:true,f0:500,f1:5200});
  zip(BRK+.05,1.3,.025,false);
  {const gr=mulberry32(21);                                   // granular clicks scattered across the stream
   for(let k=0;k<110;k++){const tt=BRK+.1+gr()*1.35;
     if(k%3)clk(tt,.02+gr()*.04,2000+gr()*4500);else tick(tt,1500+gr()*3000,.02+gr()*.03,(gr()-.5)*1.4);}}
  riser(2.1,2.58,.07);
  /* montage: every cut is knitted on a beat */
  M_T0.forEach((t0,i)=>{
    tick(t0,620*Math.pow(2,i*.12),.22,i%2?.25:-.25);
    zip(t0,.2,.05,true);
    thud(t0+.2,.45+.04*i);
  });
  /* bridge */
  whoosh(B0,.35,{g:.2,f0:400,f1:4200});
  zip(B0+.25,.3,.05,true);thud(B0+.55,.65);boom(B0+.55,.3);
  for(let i=0;i<5;i++)tick(B0+.7+i*.05,900+i*140,.06,0);
  /* bar wipe in/out */
  whoosh(W1_IN-.03,.5,{g:.3});thud(W1_COVER,.35);whoosh(W1_COVER+.02,.45,{g:.2,up:false});
  /* UI walkthrough */
  click(R(.8));
  CH_T.forEach((ct,i)=>key(ct,i));
  click(R(1.9),.3);sliderTicks(t=>kf(t,STITCH),R(1.95),R(3.3),1,900,.05);click(R(3.35),.22);
  click(R(3.8),.3);sliderTicks(t=>kf(t,LOOPV),R(3.85),R(5.15),1,900,.05);click(R(5.2),.22);
  click(R(5.65),.3);sliderTicks(t=>kf(t,FUZZ),R(5.7),R(7.05),4,900,.05);click(R(7.1),.22);
  click(R(7.55));whoosh(R(7.55),.3,{g:.08,f0:800,f1:2400});
  click(R(8.3),.3);sliderTicks(t=>kf(t,SIZE),R(8.35),R(9.45),5,700,.05);click(R(9.5),.22);
  click(R(9.85));glide(R(9.85),.5,330,990,.07);
  click(R(10.35));tick(R(10.45),1500,.1);
  click(R(11.0));
  for(let k=0;k<9;k++)tick(R(11.05)+k*.05,1600+k*60,.07,0);
  whoosh(R(11.4),.3,{g:.1,f0:600,f1:3000});chime(R(11.45));
  /* wipe to outro */
  whoosh(W2_IN-.03,.5,{g:.3});thud(W2_COVER,.4);whoosh(W2_COVER+.02,.45,{g:.2,up:false});
  /* outro */
  whoosh(Dr(.15),.4,{g:.14});zip(Dr(.2),.55,.045,true);
  thud(Dr(.75),.8);boom(Dr(.75),.4);
  for(let i=0;i<4;i++)tick(Dr(1.2)+i*.05,1000+i*180,.05,0);
  glide(Dr(1.6),.4,600,2600,.05,'triangle');
  chime(Dr(2.0));
  return oc.startRendering();
}
let audioP=null;
const getAudio=()=>audioP||(audioP=buildAudio());
function toWavB64(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate;
  const data=[];let peak=0;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);data.push(d);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}}
  const gain=peak>.89?.89/peak:1;
  const ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,Math.round(clamp(data[c][i]*gain,-1,1)*32767),true);o+=2;}
  const bytes=new Uint8Array(ab);let s='';
  for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.renderAudio=async()=>toWavB64(await getAudio());

/* =====================================================================
   PREVIEW PLAYER (normal browser only) + BOOT
   ===================================================================== */
function initPreview(){
  const vp=$('viewport'),pl=$('player'),btn=$('pBtn'),rg=$('pRange'),tm=$('pTime');
  pl.hidden=false;rg.max=REEL.duration;
  const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-64)/H);vp.style.transform=`scale(${s})`;vp.style.left=((innerWidth-W*s)/2)+'px';};
  addEventListener('resize',fit);fit();
  let playing=false,base=0,started=0,cur=0,actx=null,srcN=null,buf=null;
  const stopAudio=()=>{if(srcN){try{srcN.stop();}catch(e){}srcN=null;}};
  const show=t=>{renderFrame(t);rg.value=t;tm.textContent=t.toFixed(1)+'s';};
  function loop(){
    if(!playing)return;
    cur=base+(performance.now()-started)/1000;
    if(cur>=REEL.duration){cur=REEL.duration;show(cur);pause();btn.textContent='REPLAY';cur=0;return;}
    show(cur);requestAnimationFrame(loop);
  }
  function pause(){playing=false;stopAudio();if(btn.textContent==='PAUSE')btn.textContent='PLAY';}
  async function play(){
    btn.textContent='PREPARING SOUND…';
    if(!buf)buf=await getAudio();
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')await actx.resume();
    stopAudio();srcN=actx.createBufferSource();srcN.buffer=buf;srcN.connect(actx.destination);srcN.start(0,cur);
    base=cur;started=performance.now();playing=true;btn.textContent='PAUSE';loop();
  }
  btn.onclick=()=>{playing?pause():play();};
  rg.oninput=()=>{const was=playing;pause();cur=parseFloat(rg.value);show(cur);if(was)play();};
  show(0);
}

async function boot(){
  try{
    const lat="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.?'’&, ";
    await Promise.all([
      document.fonts.load('900 100px "Barlow Condensed"',lat),
      document.fonts.load('500 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,/·▾＋－’'),
      document.fonts.load('700 30px "JetBrains Mono"','ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-')
    ]).catch(()=>{});
    await document.fonts.ready;
    buildAssets();
    ui.style.display='block';measure();ui.style.display='none';buildSeg();
    if(!RENDER)initPreview();
    window.__reelReady=true;
  }catch(e){window.__reelError=String(e&&e.stack||e);console.error(e);}
}
window.addEventListener('load',boot);
})();
