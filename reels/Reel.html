<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callistra — Stamp Wear Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0d0d0d;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:ui-monospace,Menlo,Consolas,monospace;}
  #stage{display:block;width:auto;height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;background:#e8dfcc;cursor:pointer}
  #hud{position:fixed;left:0;right:0;bottom:6px;text-align:center;color:#8c877e;font-size:11px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;text-shadow:0 0 4px #000}
  html.render,html.render body{background:#000;display:block;min-height:0;overflow:hidden}
  html.render #stage{width:1080px;height:1920px;aspect-ratio:auto;cursor:default}
  html.render #hud{display:none}
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="hud">click = sound on/off &nbsp;·&nbsp; space = pause &nbsp;·&nbsp; loops every 3s</div>
<script>
if (/[?&]render\b/.test(location.search)) document.documentElement.classList.add('render');
</script>
<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════
   CALLISTRA · STAMP WEAR · 3-second looping reel
   Contract (render.py): window.REEL · window.__reelReady ·
   window.renderFrame(t) · window.renderAudio()
   The ink erosion below is the Stamp Wear Text Effect Maker's own
   algorithm (same hash, same noise octaves, same edge map, same
   thresholds) — evaluated once, then driven over time.
   ════════════════════════════════════════════════════════════════ */

const W = 1080, H = 1920, FPS = 30, DUR = 3;
window.REEL = { width: W, height: H, fps: FPS, duration: DUR, poster: 1.3 };

/* ── things you may want to change ─────────────────────────────── */
const CFG = {
  TEXT: 'STAMP\nWEAR',          // use \n for a second line
  EROSION: 45,                  // % — same sliders as the app
  EDGE_WEAR: 60,                // %
  FONT_SIZE: 140,               // px (app default)
  SCALE: 4,                     // 4x = the app's default export size
  DESIGN_W: 800, DESIGN_H: 400, // the app's canvas
  INK: [17, 14, 13],            // near-black ink
  FONT: '"Barlow Condensed","Oswald","Arial Narrow","DejaVu Sans Condensed",sans-serif',
  SHOW_W: 900,                  // width of the word on screen (px) at zoom 1
};

/* ── tiny helpers ──────────────────────────────────────────────── */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const sm5 = x => { const t = clamp(x); return t * t * t * (t * (t * 6 - 15) + 10); };
const easeOutCubic = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInPow = (x, p) => Math.pow(clamp(x), p);
const inOutSine = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

/* ════════════════ the app's own noise ════════════════ */
function hash2D(x, y) { let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453123; return n - Math.floor(n); }
function multiOctaveNoise(x, y) {
  const coarse = hash2D(Math.floor(x / 8.0), Math.floor(y / 8.0));
  const medium = hash2D(Math.floor(x / 3.0), Math.floor(y / 3.0));
  const fine = hash2D(x, y);
  return (coarse * 0.5) + (medium * 0.3) + (fine * 0.2);
}
// smooth value-noise (only used for the *timing* of the reveal and ink density, never for the erosion itself)
function vnoise(x, y, cell, seed) {
  const fx = x / cell, fy = y / cell, x0 = Math.floor(fx), y0 = Math.floor(fy);
  let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const h = (a, b) => hash2D(a + seed * 17.31, b + seed * 5.77);
  const v0 = lerp(h(x0, y0), h(x0 + 1, y0), tx), v1 = lerp(h(x0, y0 + 1), h(x0 + 1, y0 + 1), tx);
  return lerp(v0, v1, ty);
}

/* ════════════════ state built once ════════════════ */
const S = {};   // everything precomputed lives here

/* Stamp Wear analysis: identical layout + edge-proximity map to the app.
   Instead of baking one result we keep per-pixel noise & edge factor, so the
   exact same threshold test can be evaluated at any wear level over time. */
function analyzeStamp() {
  const sc = CFG.SCALE, tw = CFG.DESIGN_W * sc, th = CFG.DESIGN_H * sc;
  const off = mkCanvas(tw, th);
  const octx = off.getContext('2d', { willReadFrequently: true });
  const lines = CFG.TEXT.split('\n');
  const padding = 40 * sc, refSize = 100 * sc;
  octx.font = `900 ${refSize}px ${CFG.FONT}`;
  let maxRefWidth = 1;
  lines.forEach(l => { const w = octx.measureText(l).width; if (w > maxRefWidth) maxRefWidth = w; });
  const refTotalHeight = lines.length * (refSize * 1.1);
  const availWidth = Math.max(10 * sc, tw - padding), availHeight = Math.max(10 * sc, th - padding);
  const calc = Math.min((availWidth * refSize) / maxRefWidth, (availHeight * refSize) / refTotalHeight);
  const fsz = Math.max(10 * sc, Math.min(CFG.FONT_SIZE * sc, calc));
  octx.font = `900 ${fsz}px ${CFG.FONT}`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000000';
  const lineHeight = fsz * 1.1, totalHeight = lines.length * lineHeight;
  const startY = (th / 2) - (totalHeight / 2) + (lineHeight / 2);
  lines.forEach((line, i) => octx.fillText(line, tw / 2, startY + i * lineHeight));

  const src = new Uint32Array(octx.getImageData(0, 0, tw, th).data.buffer);
  let minX = tw, minY = th, maxX = 0, maxY = 0;
  for (let y = 0; y < th; y++) { const r = y * tw; for (let x = 0; x < tw; x++) if (src[r + x] !== 0) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; } }
  const bw = maxX - minX + 1, bh = maxY - minY + 1;

  // edge proximity map (distance to nearest empty pixel within radius) — same maths as the app
  const R = Math.max(1, Math.round(3 * sc)), side = 2 * R + 1;
  const tab = new Float32Array(side * side);
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) tab[(dy + R) * side + dx + R] = Math.hypot(dx, dy);
  const srcA = new Uint8Array(bw * bh), noise = new Float32Array(bw * bh), edge = new Float32Array(bw * bh);
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const idx = y * tw + x, v = src[idx];
      if (v === 0) continue;
      let minD = R + 1;
      for (let dy = -R; dy <= R; dy++) {
        const ny = y + dy;
        if (ny < 0 || ny >= th) { minD = Math.min(minD, Math.abs(dy)); continue; }
        const nRow = ny * tw, trow = (dy + R) * side + R;
        for (let dx = -R; dx <= R; dx++) {
          const nx = x + dx;
          if (nx < 0 || nx >= tw || src[nRow + nx] === 0) { const d = tab[trow + dx]; if (d < minD) minD = d; }
        }
      }
      const o = (y - minY) * bw + (x - minX);
      edge[o] = Math.min(1.0, minD / R);
      srcA[o] = (v >>> 24) & 255;
      noise[o] = multiOctaveNoise(x / sc, y / sc);
    }
  }
  Object.assign(S, { bw, bh, srcA, noise, edge });
}

/* reveal timing field + ink density (how evenly ink took) */
function buildFields() {
  const { bw, bh } = S, n = bw * bh;
  const tau = new Float32Array(n), dens = new Float32Array(n);
  const tauAt = (x, y) => {
    const xn = x / bw, yn = y / bh;
    const jit = 0.65 * vnoise(x, y, 170, 3) + 0.35 * vnoise(x, y, 46, 9);
    return clamp(0.74 * (0.9 * xn + 0.1 * yn) + 0.2 * jit + 0.06 * hash2D(x * 0.37, y * 0.91), 0, 1);
  };
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const i = y * bw + x; if (!S.srcA[i]) continue;
    tau[i] = tauAt(x, y);
    const blot = 0.6 * vnoise(x, y, 210, 21) + 0.4 * vnoise(x, y, 60, 5);
    dens[i] = (0.88 + 0.12 * blot) * (0.94 + 0.06 * hash2D(x * 1.7, y * 2.3));
  }
  S.tau = tau; S.dens = dens; S.tauAt = tauAt;
  // working buffers for the live print
  S.printCanvas = mkCanvas(bw, bh);
  S.printCtx = S.printCanvas.getContext('2d');
  S.printImg = S.printCtx.createImageData(bw, bh);
  S.printU32 = new Uint32Array(S.printImg.data.buffer);
  S.printKey = -1;
  S.ink = (CFG.INK[2] << 16) | (CFG.INK[1] << 8) | CFG.INK[0];
}

/* Evaluate the app's threshold test at reveal progress p (0..1). */
function updatePrint(p) {
  const key = Math.round(clamp(p) * 400);
  if (key === S.printKey) return;
  S.printKey = key;
  const pp = key / 400, n = S.bw * S.bh;
  const ER = CFG.EROSION / 100, EW = CFG.EDGE_WEAR / 100;
  const { srcA, noise, edge, tau, dens, printU32: out, ink } = S;
  for (let i = 0; i < n; i++) {
    const a = srcA[i];
    if (a === 0) { out[i] = 0; continue; }
    let q = (pp * 1.35 - tau[i]) / 0.32; q = q < 0 ? 0 : q > 1 ? 1 : q;
    const innerT = 1.0 - (ER * q * 0.7), edgeT = 1.0 - (EW * q * 0.95);
    const e = edge[i], eff = e * innerT + (1.0 - e) * edgeT;
    out[i] = noise[i] < eff ? (((a * dens[i]) | 0) << 24 | ink) >>> 0 : 0;
  }
  S.printCtx.putImageData(S.printImg, 0, 0);
}

/* ════════════════ blur helper + die / shadow pyramids ════════════════ */
const HAS_FILTER = (() => { try { const c = mkCanvas(2, 2).getContext('2d'); return 'filter' in c; } catch (e) { return false; } })();
function blurInto(dst, src, r, ox, oy) {
  const c = dst.getContext('2d');
  if (r > 0 && HAS_FILTER) { c.filter = `blur(${r}px)`; c.drawImage(src, ox, oy); c.filter = 'none'; }
  else if (r > 0) { // fallback: down/up-sample blur
    const f = Math.max(1, r * 0.7), t = mkCanvas(src.width / f, src.height / f);
    t.getContext('2d').drawImage(src, 0, 0, t.width, t.height);
    c.imageSmoothingQuality = 'high'; c.drawImage(t, ox, oy, src.width, src.height);
  } else c.drawImage(src, ox, oy);
}

function buildDie() {
  const { bw, bh } = S;
  const k = CFG.SHOW_W / bw, ww = bw * k, wh = bh * k;
  const DS = 1.25, dw = Math.round(ww * DS), dh = Math.round(wh * DS), pad = 130;
  Object.assign(S, { k, ww, wh, DS, dw, dh, pad });
  // pristine silhouette (the "die"): same glyphs, no wear
  const sil = mkCanvas(bw, bh), sctx = sil.getContext('2d');
  const img = sctx.createImageData(bw, bh), u32 = new Uint32Array(img.data.buffer);
  for (let i = 0; i < bw * bh; i++) u32[i] = S.srcA[i] ? ((S.srcA[i] << 24) | 0x0d0e11) >>> 0 : 0;   // R=0x11 G=0x0e B=0x0d
  sctx.putImageData(img, 0, 0);
  const base = mkCanvas(dw, dh), bctx = base.getContext('2d');
  bctx.imageSmoothingQuality = 'high'; bctx.drawImage(sil, 0, 0, dw, dh);
  bctx.globalCompositeOperation = 'source-atop';
  const g = bctx.createLinearGradient(0, 0, dw * 0.25, dh); g.addColorStop(0, 'rgba(70,62,58,.55)'); g.addColorStop(0.45, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)');
  bctx.fillStyle = g; bctx.fillRect(0, 0, dw, dh);
  bctx.globalCompositeOperation = 'source-over';
  const shBase = mkCanvas(dw, dh), shc = shBase.getContext('2d');
  shc.drawImage(base, 0, 0); shc.globalCompositeOperation = 'source-in'; shc.fillStyle = '#1a120a'; shc.fillRect(0, 0, dw, dh);

  const mk = (b, r) => { const c = mkCanvas(dw + 2 * pad, dh + 2 * pad); blurInto(c, b, r, pad, pad); return c; };
  S.dieR = [0, 2, 5, 10, 20, 38];  S.dieL = S.dieR.map(r => mk(base, r));
  S.shR = [2, 8, 20, 34, 48];       S.shL = S.shR.map(r => mk(shBase, r));
  S.dieTmp = mkCanvas(dw + 2 * pad, dh + 2 * pad); S.shTmp = mkCanvas(dw + 2 * pad, dh + 2 * pad);
  S.maskC = mkCanvas(72, Math.max(16, Math.round(72 * (dh + 2 * pad) / (dw + 2 * pad))));
  S.sheenC = mkCanvas(ww, wh);
}

/* draw pyramid at blur radius r into tmp using additive crossfade */
function pyramid(tmp, levels, radii, r, alpha) {
  const c = tmp.getContext('2d');
  c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, tmp.width, tmp.height);
  r = clamp(r, radii[0], radii[radii.length - 1]);
  let i = 0; while (i < radii.length - 2 && r > radii[i + 1]) i++;
  const f = clamp((r - radii[i]) / (radii[i + 1] - radii[i]));
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = alpha * (1 - f); c.drawImage(levels[i], 0, 0);
  if (f > 0.001) { c.globalAlpha = alpha * f; c.drawImage(levels[i + 1], 0, 0); }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

/* ════════════════ paper (tiles seamlessly along x) ════════════════ */
const PD = 1728, PH = 2560;       // PD = pan distance of the closing whip
function buildPaper() {
  const D = PD, Hp = PH, rnd = mulberry32(77);
  const lat = cell => { const nx = D / cell, ny = Math.ceil(Hp / cell) + 2, a = new Float32Array(nx * ny); for (let i = 0; i < a.length; i++) a[i] = rnd(); return { a, nx, ny, cell }; };
  const samp = (L, x, y) => {
    const fx = x / L.cell, fy = y / L.cell, x0 = Math.floor(fx), y0 = Math.floor(fy);
    let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const i0 = x0 % L.nx, i1 = (x0 + 1) % L.nx, r0 = y0 * L.nx, r1 = r0 + L.nx, a = L.a;
    const v0 = a[r0 + i0] + (a[r0 + i1] - a[r0 + i0]) * tx, v1 = a[r1 + i0] + (a[r1 + i1] - a[r1 + i0]) * tx;
    return v0 + (v1 - v0) * ty;
  };
  const L1 = lat(192), L2 = lat(54), L3 = lat(18), L4 = lat(6), L5 = lat(288);
  const lum = new Float32Array(D * Hp), th = new Float32Array(D * Hp);
  const SP = D / 3, TAN = 0.34;
  for (let y = 0; y < Hp; y++) {
    for (let x = 0; x < D; x++) {
      const i = y * D + x;
      const m1 = samp(L1, x, y), m2 = samp(L2, x, y), m3 = samp(L3, x, y), m4 = samp(L4, x, y), m5 = samp(L5, x, y);
      th[i] = 0.5 * m3 + 0.5 * m4;
      // soft slanted window-blind light (periodic in x: D = 3 stripes)
      let u = (x + (y - Hp / 2) * TAN) / SP + 0.16 * (m5 - 0.5) + 0.05 * (m1 - 0.5);
      u -= Math.floor(u);
      const band = sstep(0.0, 0.16, u) * (1 - sstep(0.46, 0.64, u));   // 1 = in shade
      lum[i] = (m1 - 0.5) * 0.05 + (m2 - 0.5) * 0.035 - band * 0.058 * (0.8 + 0.4 * m2);
    }
  }
  const tile = mkCanvas(D, Hp), tc = tile.getContext('2d');
  const img = tc.createImageData(D, Hp), px = img.data;
  const BR = 241, BG = 233, BB = 217;
  for (let y = 0; y < Hp; y++) {
    const y1 = Math.min(Hp - 1, y + 1);
    for (let x = 0; x < D; x++) {
      const i = y * D + x, x1 = (x + 1) % D;
      const rel = (th[i] - th[y1 * D + x1]) * 0.20;
      let h = (Math.imul(i, 2654435761) >>> 0); h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13;
      const g = ((h & 255) / 255 - 0.5) * 0.05;
      const l = lum[i] + rel + g, s = l < 0 ? -l : 0;
      const o = i * 4;
      px[o] = clamp(BR * (1 + l) - 3 * s * 20, 0, 255);
      px[o + 1] = clamp(BG * (1 + l * 0.98), 0, 255);
      px[o + 2] = clamp(BB * (1 + l * 0.90) + s * 14, 0, 255);
      px[o + 3] = 255;
    }
  }
  tc.putImageData(img, 0, 0);
  // fibres + inclusions
  const r2 = mulberry32(4242);
  const stroke = (x, y, ang, len, curve, col, lw) => {
    for (const off of [0, -D, D]) {
      tc.beginPath(); tc.moveTo(x + off, y);
      tc.quadraticCurveTo(x + off + Math.cos(ang + curve) * len * 0.5, y + Math.sin(ang + curve) * len * 0.5, x + off + Math.cos(ang) * len, y + Math.sin(ang) * len);
      tc.strokeStyle = col; tc.lineWidth = lw; tc.stroke();
    }
  };
  tc.lineCap = 'round';
  for (let i = 0; i < 4200; i++) {
    const dark = r2() < 0.55, a = (dark ? 0.05 + r2() * 0.09 : 0.10 + r2() * 0.16).toFixed(3);
    stroke(r2() * D, r2() * Hp, r2() * 6.283, 8 + r2() * 38, (r2() - 0.5) * 1.3, dark ? `rgba(120,98,66,${a})` : `rgba(255,252,244,${a})`, 0.5 + r2() * 0.9);
  }
  for (let i = 0; i < 360; i++) {
    const x = r2() * D, y = r2() * Hp, r = 0.5 + r2() * 1.0;
    tc.fillStyle = `rgba(92,74,50,${(0.10 + r2() * 0.22).toFixed(3)})`;
    tc.beginPath(); tc.arc(x, y, r, 0, 6.283); tc.fill();
  }
  S.paper = tile;
}

/* ════════════════ timeline ════════════════
   0.000  die hovers over fresh paper, camera already pushing in (loop seam)
   0.233  CONTACT  — camera punch, ink spatter
   0.400  peel: die lifts left→right, the app's erosion sweeps in behind it
   1.000  finished worn print, wet sheen + light sweep
   1.0–2.45  macro glide across the lettering, rack focus
   2.45–2.97 whip-pan to fresh paper, die descends into frame → loops   */
const TC = 7 / FPS;           // contact frame
const T_PEEL0 = 0.40, T_PEEL1 = 1.00;
const T_WHIP0 = 2.45, T_WHIP1 = 2.97;

/* ── camera ── */
const KEYS = [
  // t,    x,    y,   z,    roll°
  [0.00,  -70,  30, 0.92, -1.3],
  [0.233, -34,   6, 1.07,  0.0],
  [0.55,   -8,  -4, 1.10,  0.5],
  [1.00,   40,  -6, 1.15,  0.9],
  [1.55,  125, -44, 1.40,  0.8],
  [2.05,  208, -62, 1.55,  0.3],
  [2.45,  262, -34, 1.42, -0.3],
];
function hermiteKey(prop, t) {
  const n = KEYS.length;
  if (t <= KEYS[0][0]) return KEYS[0][prop];
  if (t >= KEYS[n - 1][0]) return KEYS[n - 1][prop];
  let i = 0; while (i < n - 2 && t > KEYS[i + 1][0]) i++;
  const t0 = KEYS[i][0], t1 = KEYS[i + 1][0], p0 = KEYS[i][prop], p1 = KEYS[i + 1][prop], h = t1 - t0;
  const slope = j => {
    if (j === 0) return 0;                                   // leave the loop seam from rest
    if (j === n - 1) return (KEYS[j][prop] - KEYS[j - 1][prop]) / (KEYS[j][0] - KEYS[j - 1][0]);
    return (KEYS[j + 1][prop] - KEYS[j - 1][prop]) / (KEYS[j + 1][0] - KEYS[j - 1][0]);
  };
  const m0 = slope(i) * h, m1 = slope(i + 1) * h, u = (t - t0) / h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m1;
}
const START = { x: KEYS[0][1], y: KEYS[0][2], z: KEYS[0][3], r: KEYS[0][4] };
function camera(t) {
  if (t < T_WHIP0) return { x: hermiteKey(1, t), y: hermiteKey(2, t), z: hermiteKey(3, t), roll: hermiteKey(4, t) * Math.PI / 180 };
  const last = KEYS[KEYS.length - 1];
  const u = clamp((t - T_WHIP0) / (T_WHIP1 - T_WHIP0));
  const x = lerp(last[1], PD + START.x, sm5(u));
  const y = lerp(last[2], START.y, sm5(u));
  const z = u < 0.5 ? lerp(last[3], 0.80, sm5(u / 0.5)) : lerp(0.80, START.z, sm5((u - 0.5) / 0.5));
  const rr = u < 0.5 ? lerp(last[4], 2.6, sm5(u / 0.5)) : lerp(2.6, START.r, sm5((u - 0.5) / 0.5));
  return { x, y, z, roll: rr * Math.PI / 180 };
}
/* impact: a damped physical jolt, not handheld shake */
function kick(t) {
  const dt = t - TC;
  if (dt < 0) return { sx: 0, sy: 0, z: 1, roll: 0 };
  const on = sstep(0, 0.035, dt), e = Math.exp(-dt / 0.075);
  return {
    sy: 30 * on * e * Math.cos((dt - 0.02) * 2 * Math.PI / 0.19),
    sx: 6 * on * e * Math.sin(dt * 2 * Math.PI / 0.13),
    z: 1 + 0.05 * on * Math.exp(-dt / 0.085),
    roll: 0.012 * on * e * Math.sin(dt * 2 * Math.PI / 0.21),
  };
}

/* ── the die (inked block) ── */
function dieAt(t) {
  let H = 1, alpha = 1, x = 0, p = 0, spread = 0;
  if (t < TC) {
    H = t < 0.07 ? 1 + 0.14 * easeOutCubic(t / 0.07) : lerp(1.14, 0, easeInPow((t - 0.07) / (TC - 0.07), 2.3));
  } else if (t < T_PEEL0) {
    H = 0;
  } else if (t < T_PEEL1) {
    const pl = (t - T_PEEL0) / (T_PEEL1 - T_PEEL0);
    p = inOutSine(pl); H = 1.9 * Math.pow(pl, 1.55);
  } else if (t < 2.7) {
    alpha = 0; p = 1;
  } else {                                   // next loop's die glides in over the fresh sheet
    x = PD; alpha = sstep(2.72, 2.84, t); H = 1 + 0.4 * (1 - easeOutCubic((t - 2.72) / 0.22));
  }
  if (t >= TC && t < TC + 0.2) spread = 0.024 * Math.sin(Math.PI * clamp((t - TC) / 0.2)) * Math.exp(-(t - TC) / 0.14);
  return { H, alpha, x, p, spread };
}
const printP = t => t < T_PEEL0 ? 0 : t >= T_PEEL1 ? 1 : inOutSine((t - T_PEEL0) / (T_PEEL1 - T_PEEL0));

/* ink spatter thrown on impact (permanent flecks on the paper) */
function buildSpatter() {
  const r = mulberry32(909), arr = [];
  for (let i = 0; i < 74; i++) {
    const a = r() * 6.283, rad = 0.56 + Math.pow(r(), 0.7) * 0.5;
    const fx = Math.cos(a) * S.ww * rad * (0.62 + 0.1 * r()), fy = Math.sin(a) * S.wh * rad * (0.74 + 0.1 * r());
    const big = r() < 0.12;
    arr.push({ fx, fy, sx: fx * (0.50 + r() * 0.15), sy: fy * (0.50 + r() * 0.15), r: big ? 3.5 + r() * 4 : 1.1 + r() * 2.1, a: 0.55 + r() * 0.4, d: r() * 0.03 });
  }
  S.spatter = arr;
}
/* floating dust / out-of-focus lint, parallax in screen space */
function buildMotes() {
  const r = mulberry32(31), arr = [];
  for (let i = 0; i < 22; i++) arr.push({ x: r() * (W + 500), y: r() * (H + 500), depth: 0.35 + r() * 1.5, rad: 8 + Math.pow(r(), 2) * 58, a: 0.025 + r() * 0.07, ph: r() * 6.283, light: r() < 0.3 });
  S.motes = arr;
}
function buildGrain() {
  const c = mkCanvas(256, 256), x = c.getContext('2d'), im = x.createImageData(256, 256), r = mulberry32(5);
  for (let i = 0; i < 65536; i++) { const v = 128 + (r() + r() + r() - 1.5) * 70; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  x.putImageData(im, 0, 0); S.grain = c;
}

/* ════════════════ draw one (sub)sample of the world ════════════════ */
function drawScene(c, ts) {
  const cam = camera(ts), kk = kick(ts), die = dieAt(ts), z = cam.z * kk.z;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#ebe2cf'; c.fillRect(0, 0, W, H);
  c.save();
  c.translate(W / 2 + kk.sx, H / 2 + kk.sy); c.rotate(cam.roll + kk.roll); c.scale(z, z); c.translate(-cam.x, -cam.y);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';

  // paper
  const j0 = Math.floor((cam.x - 1300 / z) / PD), j1 = Math.floor((cam.x + 1300 / z) / PD);
  for (let j = j0; j <= j1; j++) c.drawImage(S.paper, 0, 0, PD, PH, j * PD - 0.5, -PH / 2, PD + 1, PH);

  const { ww, wh, DS, dw, dh, pad } = S;
  const hasPrint = ts >= TC;
  // impact "dent" — the paper darkens just around the block for a beat
  if (hasPrint) {
    const dt = ts - TC, dent = Math.exp(-dt / 0.16) * 0.34 * (1 - sstep(0.3, 0.7, dt));
    if (dent > 0.01 && die.alpha > 0) {
      pyramid(S.shTmp, S.shL, S.shR, 48, 1);
      c.save(); c.globalAlpha = dent; c.globalCompositeOperation = 'multiply';
      c.translate(0, 0); c.scale(1.03 / DS, 1.03 / DS); c.drawImage(S.shTmp, -(dw / 2 + pad), -(dh / 2 + pad)); c.restore();
    }
  }
  // the die's shadow on the paper
  if (die.alpha > 0.005 && die.H > 0.001) {
    const Hh = die.H, blur = 3 + Hh * 20, al = die.alpha * clamp(0.5 - 0.1 * Hh, 0.2, 0.5) * (1 - 0.6 * sstep(0.45, 1.0, die.p) * (ts < 2 ? 1 : 0));
    pyramid(S.shTmp, S.shL, S.shR, blur, 1);
    c.save(); c.globalAlpha = al; c.globalCompositeOperation = 'multiply';
    c.translate(die.x + Hh * 30, Hh * 50); c.scale((1 + 0.05 * Hh) / DS, (1 + 0.05 * Hh) / DS);
    c.drawImage(S.shTmp, -(dw / 2 + pad), -(dh / 2 + pad)); c.restore();
  }
  // the print
  if (hasPrint) {
    c.drawImage(S.printCanvas, -ww / 2, -wh / 2, ww, wh);
    if (S.sheenAmt > 0.01) { c.save(); c.globalCompositeOperation = 'screen'; c.globalAlpha = S.sheenAmt; c.drawImage(S.sheenC, -ww / 2, -wh / 2); c.restore(); }
    // ink spatter
    const dt = ts - TC;
    c.fillStyle = `rgb(${CFG.INK[0]},${CFG.INK[1]},${CFG.INK[2]})`;
    for (const s of S.spatter) {
      const u = easeOutCubic((dt - s.d) / 0.13); if (dt - s.d < 0) continue;
      c.globalAlpha = s.a; c.beginPath(); c.arc(lerp(s.sx, s.fx, u), lerp(s.sy, s.fy, u), s.r * (0.7 + 0.3 * u), 0, 6.283); c.fill();
    }
    c.globalAlpha = 1;
  }
  // the die itself
  if (die.alpha > 0.005) {
    const Hh = die.H, br = clamp(Hh * 12, 0, 38) * (ts < TC && Hh > 1 ? 0.55 : 1) + (ts < TC ? 1.2 : 0);
    pyramid(S.dieTmp, S.dieL, S.dieR, br, 1);
    if (ts >= T_PEEL0 && ts < T_PEEL1) {           // irregular left→right fade-out as it peels away
      const m = S.maskC, mc = m.getContext('2d'), id = mc.createImageData(m.width, m.height), pdat = id.data;
      const PW = dw + 2 * pad, PHh = dh + 2 * pad;
      for (let my = 0; my < m.height; my++) for (let mx = 0; mx < m.width; mx++) {
        const px = (mx + 0.5) / m.width * PW - pad, py = (my + 0.5) / m.height * PHh - pad;
        const bx = clamp(px / dw, 0, 1) * (S.bw - 1), by = clamp(py / dh, 0, 1) * (S.bh - 1);
        const q = clamp((die.p * 1.35 - S.tauAt(bx, by)) / 0.5);
        pdat[(my * m.width + mx) * 4 + 3] = Math.round(255 * (1 - sstep(0.0, 0.9, q)));
      }
      mc.putImageData(id, 0, 0);
      const d = S.dieTmp.getContext('2d'); d.globalCompositeOperation = 'destination-in'; d.imageSmoothingEnabled = true; d.drawImage(m, 0, 0, PW, PHh); d.globalCompositeOperation = 'source-over';
    }
    const sc = (1 + 0.11 * Hh) * (1 + die.spread);
    c.save();
    c.globalAlpha = die.alpha * (ts >= T_PEEL0 ? 1 - 0.55 * sstep(0.7, 1, die.p) : 1);
    c.translate(die.x - (cam.x - die.x) * 0.045 * Hh, -Hh * 34 - cam.y * 0.0);
    c.rotate(-0.018 * Hh * (ts >= T_PEEL0 ? 1 : 0.3)); c.scale(sc / DS, sc / DS);
    c.drawImage(S.dieTmp, -(dw / 2 + pad), -(dh / 2 + pad)); c.restore();
  }
  c.restore();

  // foreground dust & lint (parallax) — screen space
  c.setTransform(1, 0, 0, 1, 0, 0);
  for (const m of S.motes) {
    const par = m.depth * 0.9;
    let x = (m.x - cam.x * par * z - ts * 9 * m.depth) % (W + 500); if (x < 0) x += W + 500; x -= 250;
    let y = (m.y - cam.y * par * z + Math.sin(ts * 1.3 + m.ph) * 14) % (H + 500); if (y < 0) y += H + 500; y -= 250;
    const g = c.createRadialGradient(x, y, 0, x, y, m.rad);
    const col = m.light ? '255,248,232' : '112,88,56';
    g.addColorStop(0, `rgba(${col},${m.a})`); g.addColorStop(0.7, `rgba(${col},${m.a * 0.8})`); g.addColorStop(1, `rgba(${col},0)`);
    c.globalCompositeOperation = m.light ? 'screen' : 'multiply'; c.fillStyle = g;
    c.fillRect(x - m.rad, y - m.rad, m.rad * 2, m.rad * 2);
  }
  c.globalCompositeOperation = 'source-over';
}

/* how many temporal samples this frame needs (physically-based motion blur) */
function motionSamples(t) {
  const e = 0.5 / FPS, a = camera(t - e), b = camera(t + e), da = dieAt(t - e), db = dieAt(t + e);
  const z = (a.z + b.z) / 2;
  const sp = Math.hypot((b.x - a.x) * z, (b.y - a.y) * z) + Math.abs(b.z - a.z) * 700 + Math.abs(b.roll - a.roll) * 900 + Math.abs(db.H - da.H) * 40 * z + Math.abs(db.x - da.x) * z;
  const k1 = kick(t - e), k2 = kick(t + e);
  const ks = Math.hypot(k2.sx - k1.sx, k2.sy - k1.sy) + Math.abs(k2.z - k1.z) * 700;
  return clamp(Math.ceil((sp + ks) / 16), 1, 10);
}

/* ════════════════ wet sheen on the fresh ink ════════════════ */
function updateSheen(t) {
  const amt = sstep(0.62, 0.95, t) * (1 - sstep(1.55, 2.15, t)) * 0.55;
  S.sheenAmt = amt;
  if (amt <= 0.01) return;
  const c = S.sheenC.getContext('2d'), { ww, wh } = S;
  c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, ww, wh);
  c.drawImage(S.printCanvas, 0, 0, ww, wh);
  c.globalCompositeOperation = 'source-in';
  const pos = lerp(-0.35, 1.35, sm5((t - 0.8) / 1.15)) * ww;
  const g = c.createLinearGradient(pos - 230, 0, pos + 230, wh * 0.7);
  g.addColorStop(0, 'rgba(255,236,205,0)'); g.addColorStop(0.5, 'rgba(255,246,228,1)'); g.addColorStop(1, 'rgba(255,236,205,0)');
  c.fillStyle = g; c.fillRect(0, 0, ww, wh);
  c.globalCompositeOperation = 'source-over';
}

/* ════════════════ post: rack-focus, light sweep, grade ════════════════ */
function postFX(o, t) {
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalAlpha = 1; o.globalCompositeOperation = 'source-over';
  o.drawImage(S.acc, 0, 0);

  const hold = sstep(0.75, 1.25, t) * (1 - sstep(2.25, 2.5, t));
  const xAmt = hold * 0.9, yAmt = 0.28 + 0.4 * hold;
  if (yAmt > 0.02) {
    const sc = S.smallC.getContext('2d'); sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, S.smallC.width, S.smallC.height);
    if (HAS_FILTER) sc.filter = 'blur(2.4px)';
    sc.drawImage(S.acc, 0, 0, S.smallC.width, S.smallC.height); sc.filter = 'none';
    const lc = S.layerC.getContext('2d');
    const pass = (grad, alpha) => {
      lc.globalCompositeOperation = 'source-over'; lc.clearRect(0, 0, W, H);
      lc.imageSmoothingEnabled = true; lc.imageSmoothingQuality = 'high'; lc.drawImage(S.smallC, 0, 0, W, H);
      lc.globalCompositeOperation = 'destination-in'; lc.fillStyle = grad(lc, alpha); lc.fillRect(0, 0, W, H);
      o.drawImage(S.layerC, 0, 0);
    };
    pass((c, a) => { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(0,0,0,${0.85 * a})`); g.addColorStop(0.3, 'rgba(0,0,0,0)'); g.addColorStop(0.7, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${0.85 * a})`); return g; }, yAmt);
    if (xAmt > 0.02) {
      const xf = lerp(0.24, 0.76, sm5((t - 1.0) / 1.4)) * W;
      pass((c, a) => { const g = c.createLinearGradient(0, 0, W, 0), cl = v => clamp(v / W);
        g.addColorStop(0, `rgba(0,0,0,${0.9 * a})`);
        g.addColorStop(cl(xf - 560), `rgba(0,0,0,${0.7 * a})`); g.addColorStop(cl(xf - 170), 'rgba(0,0,0,0)');
        g.addColorStop(cl(xf + 170), 'rgba(0,0,0,0)'); g.addColorStop(cl(xf + 560), `rgba(0,0,0,${0.7 * a})`);
        g.addColorStop(1, `rgba(0,0,0,${0.9 * a})`); return g; }, xAmt);
    }
  }
  // sweeping window-light
  const ls = sm5((t - 0.85) / 1.75), lw = sstep(0.8, 1.1, t) * (1 - sstep(2.3, 2.6, t));
  if (lw > 0.01) {
    const xs = lerp(-520, W + 520, ls), g = o.createLinearGradient(xs - 440, 0, xs + 440, H * 0.38);
    g.addColorStop(0, 'rgba(255,236,200,0)'); g.addColorStop(0.5, 'rgba(255,238,205,0.55)'); g.addColorStop(1, 'rgba(255,236,200,0)');
    o.globalCompositeOperation = 'soft-light'; o.globalAlpha = lw; o.fillStyle = g; o.fillRect(0, 0, W, H);
    o.globalCompositeOperation = 'screen'; o.globalAlpha = lw * 0.10; o.fillRect(0, 0, W, H);
  }
  // vignette + warm grade
  o.globalAlpha = 1; o.globalCompositeOperation = 'multiply';
  const v = o.createRadialGradient(W / 2, H / 2, H * 0.26, W / 2, H / 2, H * 0.78);
  v.addColorStop(0, 'rgba(255,255,255,1)'); v.addColorStop(1, 'rgba(70,52,34,1)');
  o.globalAlpha = 0.30; o.fillStyle = v; o.fillRect(0, 0, W, H);
  o.globalAlpha = 0.10; o.globalCompositeOperation = 'soft-light'; o.fillStyle = '#ffc888'; o.fillRect(0, 0, W, H);
  // fine film grain (re-seeded each frame, deterministic)
  const fi = Math.round(t * FPS), r = mulberry32(fi * 97 + 3);
  o.globalCompositeOperation = 'overlay'; o.globalAlpha = 0.11;
  o.save(); o.translate(Math.floor(r() * 256), Math.floor(r() * 256)); o.fillStyle = o.createPattern(S.grain, 'repeat'); o.fillRect(-256, -256, W + 512, H + 512); o.restore();
  o.globalAlpha = 1; o.globalCompositeOperation = 'source-over';
}

function renderFrame(t) {
  t = ((t % DUR) + DUR) % DUR;
  updatePrint(printP(t)); updateSheen(t);
  const n = motionSamples(t), shutter = 0.85 / FPS, a = S.acc.getContext('2d');
  a.setTransform(1, 0, 0, 1, 0, 0); a.globalCompositeOperation = 'source-over'; a.clearRect(0, 0, W, H);
  for (let i = 0; i < n; i++) {
    let ts = n > 1 ? t + ((i + 0.5) / n - 0.5) * shutter : t;
    ts = ((ts % DUR) + DUR) % DUR;
    drawScene(S.sceneC.getContext('2d'), ts);
    a.globalAlpha = 1 / (i + 1); a.drawImage(S.sceneC, 0, 0);
  }
  a.globalAlpha = 1;
  postFX(S.out, t);
}

/* ════════════════ sound — no music, only physical sounds ════════════════ */
function synthAudio() {
  const SR = 44100, N = Math.round(SR * DUR), L = new Float32Array(N), R = new Float32Array(N);
  const rnd = mulberry32(2024), wn = () => rnd() * 2 - 1;
  function bq(type, f, Q) {
    const w = 2 * Math.PI * f / SR, c = Math.cos(w), s = Math.sin(w), al = s / (2 * Q);
    let b0, b1, b2; const a0 = 1 + al, a1 = -2 * c, a2 = 1 - al;
    if (type === 'lp') { b0 = (1 - c) / 2; b1 = 1 - c; b2 = b0; }
    else if (type === 'hp') { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = b0; }
    else { b0 = al; b1 = 0; b2 = -al; }
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    return { p(x) { const y = (b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0; x2 = x1; x1 = x; y2 = y1; y1 = y; return y; } };
  }
  const norm = o => { let m = 1e-9; for (let i = 0; i < o.length; i++) m = Math.max(m, Math.abs(o[i])); for (let i = 0; i < o.length; i++) o[i] /= m; return o; };
  function place(arr, start, g, pan = 0) {
    const i0 = Math.round(start * SR), gl = g * Math.cos((pan + 1) * Math.PI / 4), gr = g * Math.sin((pan + 1) * Math.PI / 4);
    for (let i = 0; i < arr.length; i++) { const k = i0 + i; if (k < 0 || k >= N) continue; L[k] += arr[i] * gl; R[k] += arr[i] * gr; }
  }
  const TWO = 2 * Math.PI;

  const thump = (() => {
    const n = Math.round(0.5 * SR), o = new Float32Array(n), lpS = bq('lp', 2400, 0.7), lpP = bq('lp', 380, 0.7), hpC = bq('hp', 2800, 0.7);
    let ph = 0, ph2 = 0;
    for (let i = 0; i < n; i++) {
      const t = i / SR; ph += TWO * (44 + 95 * Math.exp(-t / 0.026)) / SR; ph2 += TWO * (130 + 120 * Math.exp(-t / 0.010)) / SR;
      o[i] = Math.sin(ph) * Math.exp(-t / 0.075) + Math.sin(ph2) * Math.exp(-t / 0.016) * 0.45
        + lpS.p(wn()) * Math.exp(-t / 0.011) * 1.7 + lpP.p(wn()) * Math.exp(-t / 0.10) * 3.2 + hpC.p(wn()) * Math.exp(-t / 0.0022) * 1.2;
    }
    return norm(o);
  })();
  const clack = (() => {
    const n = Math.round(0.07 * SR), o = new Float32Array(n), a = bq('bp', 1300, 1.6), b = bq('bp', 3400, 2.2); let ph = 0;
    for (let i = 0; i < n; i++) { const t = i / SR; ph += TWO * 240 / SR; o[i] = a.p(wn()) * Math.exp(-t / 0.007) + b.p(wn()) * Math.exp(-t / 0.0035) * 0.9 + Math.sin(ph) * Math.exp(-t / 0.012) * 0.25; }
    return norm(o);
  })();
  const tick = (() => {
    const n = Math.round(0.035 * SR), o = new Float32Array(n), h = bq('hp', 2600, 0.7), b = bq('bp', 900, 3);
    for (let i = 0; i < n; i++) { const t = i / SR; o[i] = h.p(wn()) * Math.exp(-t / 0.0018) + b.p(wn()) * Math.exp(-t / 0.005) * 0.9; }
    return norm(o);
  })();
  const grains = [1800, 2400, 3100, 3900, 4800, 6200, 7600].map((fc, k) => {
    const n = Math.round((0.010 + 0.002 * k % 4) * SR), o = new Float32Array(n), b = bq('bp', fc, 2.6);
    for (let i = 0; i < n; i++) o[i] = b.p(wn()) * Math.exp(-i / (SR * (0.0014 + 0.0004 * (k % 3))));
    return norm(o);
  });
  const pop = (() => {
    const n = Math.round(0.05 * SR), o = new Float32Array(n), l = bq('lp', 1500, 0.7); let ph = 0;
    for (let i = 0; i < n; i++) { const t = i / SR; ph += TWO * (200 - 80 * t / 0.05) / SR; o[i] = l.p(wn()) * Math.exp(-t / 0.007) * 2.2 + Math.sin(ph) * Math.exp(-t / 0.011) * 0.5; }
    return norm(o);
  })();
  const thud = (() => {
    const n = Math.round(0.1 * SR), o = new Float32Array(n), l = bq('lp', 260, 0.8);
    for (let i = 0; i < n; i++) o[i] = l.p(wn()) * Math.exp(-i / SR / 0.03) * 4;
    return norm(o);
  })();
  const scratch = (() => {
    const n = Math.round(0.09 * SR), o = new Float32Array(n);
    for (let i = 0; i < n; i++) { const u = i / n, b = bq('bp', 2200 + 2200 * u, 2.2); o[i] = 0; }
    const b = bq('bp', 3000, 1.3);
    for (let i = 0; i < n; i++) { const u = i / n; o[i] = b.p(wn()) * Math.sin(Math.PI * u) * (0.6 + 0.4 * Math.sin(i * 0.9)); }
    return norm(o);
  })();

  // —— mechanical anticipation ticks across the loop seam, then contact
  place(tick, 2.905, 0.50, -0.15); place(tick, 2.952, 0.42, 0.1); place(tick, 0.072, 0.34, -0.05);
  place(thump, TC, 1.0, 0); place(clack, TC + 0.003, 0.60, 0);

  // —— rubber/paper pressure while the block is held down
  { const a = Math.round(TC * SR), b = Math.round(0.40 * SR), l = bq('lp', 650, 0.8);
    for (let i = a; i < b; i++) { const u = (i - a) / (b - a), e = Math.sin(Math.PI * u) * 0.10; const s = l.p(wn()) * 2.2 * e; L[i] += s; R[i] += s; } }

  // —— ink transfer: crackly peel that travels left → right with the reveal
  { const i0 = Math.round(T_PEEL0 * SR), i1 = Math.round((T_PEEL1 + 0.02) * SR), bed = bq('bp', 2700, 0.9);
    for (let i = i0; i < i1; i++) {
      const pl = (i - i0) / (i1 - i0), bell = Math.pow(Math.sin(Math.PI * clamp(pl)), 1.2), pan = lerp(-0.7, 0.7, pl);
      const s = bed.p(wn()) * bell * 0.30; L[i] += s * Math.cos((pan + 1) * Math.PI / 4); R[i] += s * Math.sin((pan + 1) * Math.PI / 4);
